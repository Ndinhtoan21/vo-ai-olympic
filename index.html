{id:'cos-near',t:'nhung-tu',name:'Cosine tìm từ gần nhất',f(r,L){ const base=[ri(r,5,9),ri(r,3,7),ri(r,0,2),ri(r,0,3)].map(v=>v/10); let C, cs;

{id:'knn3d',t:'knn',name:'k-NN với 3 đặc trưng',f(r,L){ const cls=L.vi?['Đỏ','Xanh dương','Xanh lá']:['Red','Blue','Green']; const ctr=[[1,2,1],[8,7,7],[6,2,5]]; const S=[]; ctr.forEach((c,k)=>{ const m=k===2?2:3; for(let i=0;i<m;i++) S.push({p:c.map(v=>Math.max(0,v+ri(r,-1,1))),k}); });
  const tk=pick(r,[0,1,2]); const Q=ctr[tk].map(v=>v+ri(r,-1,1)); const dist=S.map(s=>({s,d:Math.hypot(...s.p.map((v,i)=>v-Q[i]))})).sort((a,b)=>a.d-b.d); const top=dist.slice(0,3); const cnt=[0,0,0]; top.forEach(x=>cnt[x.s.k]++);
  const mx=Math.max(...cnt), win=cnt.indexOf(mx), tie=cnt.filter(c=>c===mx).length>1; const ok=tie?(L.vi?'Hòa, không quyết định được':'A tie, cannot decide'):cls[win];
  const ops=strOpts(ok,cls.concat([L.vi?'Hòa, không quyết định được':'A tie, cannot decide']));
  const tbl=S.map((s,i)=>`S${i+1} (${s.p.join(', ')}) ${cls[s.k]}`).join('; ');
  return {q:L.vi?`Tập huấn luyện: ${tbl}. Dùng k-NN với khoảng cách Euclid và k = 3, điểm Q = (${Q.join(', ')}) được dự đoán thuộc lớp nào?`:`Training set: ${tbl}. Using k-NN with Euclidean distance and k = 3, which class is predicted for Q = (${Q.join(', ')})?`,
    o:ops,e:(L.vi?'3 điểm gần nhất: ':'The 3 nearest points: ')+top.map(x=>`S${S.indexOf(x.s)+1} (${L.n(x.d,2)}, ${cls[x.s.k]})`).join(', ')+'.'}; }},
{id:'svm-pred',t:'svm',name:'Dự đoán của SVM tuyến tính',f(r,L){ let w,b,x,z; do{ w=[ri(r,-3,3),ri(r,-3,3)]; b=ri(r,-3,3); x=[ri(r,-2,5),ri(r,-2,5)]; z=w[0]*x[0]+w[1]*x[1]+b; }while(z===0||(w[0]===0&&w[1]===0));
  const ok=z>0?'+1':'−1', ops=[ok,z>0?'−1':'+1','0',L.vi?'Cần biết thêm nhãn thật của điểm':'Need the point’s true label first'];
  return {q:L.vi?`SVM tuyến tính đã huấn luyện có w = [${w.map(v=>L.n(v,0)).join(', ')}], b = ${L.n(b,0)}. Điểm (${x.map(v=>L.n(v,0)).join(', ')}) được dự đoán là?`:`A trained linear SVM has w = [${w.map(v=>L.n(v,0)).join(', ')}], b = ${L.n(b,0)}. The point (${x.map(v=>L.n(v,0)).join(', ')}) is predicted as?`,
    o:ops,e:`w·x + b = ${sgL(L,w[0])}·${sgL(L,x[0])} + ${sgL(L,w[1])}·${sgL(L,x[1])} + ${sgL(L,b)} = ${L.n(z,0)} ${z>0?'> 0 → +1':'< 0 → −1'}.`}; }},
{id:'block',t:'chuyen-giao',name:'Tham số và FLOPs của lớp tích chập',f(r,L){ const k=pick(r,[1,3]), ci=pick(r,[64,128,256,512]), co=ci, H=pick(r,[7,14,28]), n=pick(r,[1,2]);
  const P=k*k*ci*co*n, F=2*P*H*H; const fm=v=>v>=1e9?L.n(v/1e9,2)+' GFLOPs':L.n(v/1e6,1)+' MFLOPs', pm=v=>L.n(v/1e6,2)+'M';
  const ok=`${pm(P)}; ${fm(F)}`; const ops=strOpts(ok,[`${pm(P)}; ${fm(F/2)}`,`${pm(P/n)}; ${fm(F/n)}`,`${pm(P*H*H)}; ${fm(F)}`,`${pm(P)}; ${fm(F/(H*H))}`]);
  return {q:L.vi?`Một khối gồm ${n} lớp Conv ${k}×${k}, mỗi lớp ${ci} kênh vào, ${co} kênh ra, stride 1, padding giữ nguyên kích thước, bỏ qua bias. Đầu vào có shape (1, ${ci}, ${H}, ${H}). Tổng số tham số và tổng FLOPs (FLOPs ≈ 2 × số phép nhân-cộng) là?`:`A block has ${n} Conv ${k}×${k} layer(s), each with ${ci} input and ${co} output channels, stride 1, same padding, no bias. The input shape is (1, ${ci}, ${H}, ${H}). Total parameters and FLOPs (FLOPs ≈ 2 × multiply-adds)?`,
    o:ops,e:(L.vi?`Mỗi lớp: ${k}×${k}×${ci}×${co} = ${k*k*ci*co} tham số; nhân-cộng = tham số × ${H}×${H}. Tổng ${n} lớp: ${pm(P)} tham số; FLOPs = 2 × ${P} × ${H*H} ≈ ${fm(F)}.`:`Each layer: ${k}×${k}×${ci}×${co} = ${k*k*ci*co} parameters; MACs = parameters × ${H}×${H}. For ${n} layer(s): ${pm(P)} parameters; FLOPs = 2 × ${P} × ${H*H} ≈ ${fm(F)}.`)}; }},
{id:'steps',t:'huan-luyen',name:'Số bước mỗi epoch',f(r,L){ const N=pick(r,[1000,1200,2000,2500,5000,6000]), B=pick(r,[16,32,50,64,100,128]), E=pick(r,[1,5,10]); const st=Math.ceil(N/B), ok=st*E;
  const ops=opts4(ok,[Math.floor(N/B)*E,N*E,B*E,st],0,{min:1,step:E});
  return {q:L.vi?`Tập huấn luyện có ${N} mẫu, batch size ${B}, huấn luyện ${E} epoch. Có tất cả bao nhiêu lần cập nhật trọng số (batch cuối có thể thiếu vẫn tính một lần)?`:`A training set has ${N} samples, batch size ${B}, trained for ${E} epoch(s). How many weight updates in total (a smaller last batch still counts once)?`,
    o:ops.map(v=>L.n(v,0)),e:`⌈${N}/${B}⌉ = ${st} ${L.vi?'bước mỗi epoch':'steps per epoch'}; × ${E} = ${ok}.`}; }},
{id:'dice',t:'phan-doan',name:'Hệ số Dice',f(r,L){ const A=pick(r,[80,100,120,150]), B=pick(r,[60,80,100,120]), I=Math.min(A,B)-pick(r,[10,20,30,40]); const ok=2*I/(A+B), iou=I/(A+B-I);
  const ops=opts4(ok,[iou,I/A,I/(A+B),I/B],2,{min:0,max:1});
  return {q:L.vi?`Mặt nạ thật có ${A} điểm ảnh, mặt nạ dự đoán có ${B} điểm ảnh, phần trùng nhau ${I} điểm ảnh. Hệ số Dice bằng?`:`The true mask has ${A} pixels, the predicted mask ${B} pixels, overlapping in ${I} pixels. The Dice coefficient is?`,
    o:ops.map(v=>L.n(v,2)),e:`Dice = 2 × ${I}/(${A} + ${B}) ≈ ${L.n(ok,2)}. `+(L.vi?`(IoU = ${I}/${A+B-I} ≈ ${L.n(iou,2)}.)`:`(IoU = ${I}/${A+B-I} ≈ ${L.n(iou,2)}.)`)}; }},
);

function sortGame(root,cards,bins){
  const S=shell(root); let ans={}; const list=h('div',{class:'sortg'}); S.stage.append(list); const sc=chip('Số câu đúng',{big:true}); S.reads.append(sc);
  function draw(){ list.innerHTML=''; let ok=0, done=0;
    cards.forEach((cd,i)=>{ const a=ans[i]; if(a!=null){ done++; if(a===cd.a) ok++; }
      const bs=h('div',{class:'sg-bins',role:'group'}); bins.forEach(([k,l])=>{ const b=h('button',{type:'button',class:'btn'+(a===k?' sel':''),id:nid('sg'),'aria-pressed':String(a===k)},l); b.addEventListener('click',()=>{ ans[i]=k; draw(); }); bs.append(b); });
      const row=h('div',{class:'sg-card'+(a==null?'':a===cd.a?' good':' bad')},h('p',{},h('b',{},`${i+1}. `),cd.q),bs);
      if(a!=null) row.append(h('p',{class:'sg-why'},(a===cd.a?'Đúng. ':`Chưa đúng, đáp án là "${bins.find(b=>b[0]===cd.a)[1]}". `)+cd.w)); list.append(row); });
    sc.set(`${ok}/${cards.length}`); sc.tone(done===cards.length?(ok===cards.length?'good':'warn'):null);
    S.note.textContent=done<cards.length?`Còn ${cards.length-done} tình huống chưa chọn.`:ok===cards.length?'Tuyệt vời! Em đã xếp đúng tất cả.':'Xem lại các thẻ màu đỏ và đọc giải thích nhé.'; }
  S.controls.append(btn('Làm lại từ đầu',()=>{ans={};draw();}));
  draw();
}
function demoPrep(root){
  const S=shell(root); const r=mulberry32(77);
  const mk=n=>Array.from({length:n},()=>{ const x=Math.round(145+r()*40), y=Math.round((2+r()*8)*10)/10; return {x,y,c:y>=7?1:0}; });
  const tr=mk(40), te=mk(300);
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length, sdv=a=>{ const m=mean(a); return Math.sqrt(mean(a.map(v=>(v-m)**2)))||1; };
  const mx=mean(tr.map(p=>p.x)), sx=sdv(tr.map(p=>p.x)), my=mean(tr.map(p=>p.y)), sy=sdv(tr.map(p=>p.y));
  let scaled=false, q={x:150,y:8.2};
  const F=(p,sc)=>sc?[(p.x-mx)/sx,(p.y-my)/sy]:[p.x,p.y];
  const near=(p,sc)=>{ const a=F(p,sc); return tr.map((t,i)=>{ const b=F(t,sc); return {i,d:(a[0]-b[0])**2+(a[1]-b[1])**2}; }).sort((u,v)=>u.d-v.d).slice(0,5); };
  const pred=(p,sc)=>near(p,sc).reduce((s,e)=>s+tr[e.i].c,0)>=3?1:0;
  const acc=sc=>te.filter(p=>pred(p,sc)===p.c).length/te.length;
  const accRaw=acc(false), accSc=acc(true);
  const o=makeCanvas(S.stage,{ratio:0.55,maxH:420,label:'Học sinh theo chiều cao và điểm toán, cùng 5 hàng xóm gần nhất'}); o.cv.style.cursor='crosshair';
  const M=()=>scaled?worldEq(o,-2.3,2.3,-2.1,2.1,26):worldEq(o,140,190,0,10,26);
  const P=p=>{ const m=M(), f=F(p,scaled); return [m.X(f[0]),m.Y(f[1])]; };
  o.draw=()=>{ if(!o.w) return; const T=theme(), c=o.ctx, m=M(); paper(c,o.w,o.h,T);
    const x0=scaled?-2.3:140, x1=scaled?2.3:190, y0=scaled?-2.1:0, y1=scaled?2.1:10;
    c.strokeStyle=T.muted; c.lineWidth=1.2; seg2(c,m.X(x0),m.Y(y0),m.X(x1),m.Y(y0)); seg2(c,m.X(x0),m.Y(y0),m.X(x0),m.Y(y1));
    c.fillStyle=T.muted; c.font=font(11,'bold'); c.textAlign='right'; c.textBaseline='bottom'; c.fillText(scaled?'z chiều cao →':'Chiều cao (cm) →',m.X(x1)-2,m.Y(y0)-4);
    c.textAlign='left'; c.textBaseline='top'; c.fillText(scaled?'↑ z điểm toán':'↑ Điểm toán (0–10)',m.X(x0)+4,m.Y(y1)+2);
    const nb=near(q,scaled), [qx,qy]=P(q);
    nb.forEach(e=>{ const [x,y]=P(tr[e.i]); c.strokeStyle=alpha(T.c[tr[e.i].c],0.8); c.lineWidth=2; seg2(c,qx,qy,x,y); });
    tr.forEach(p=>{ const [x,y]=P(p); mark(c,x,y,p.c,T,5.5); });
    dot(c,qx,qy,12,T.surface,T.c[pred(q,scaled)],3.5); c.fillStyle=T.ink; c.font=font(13,'disp'); c.textAlign='center'; c.textBaseline='middle'; c.fillText('?',qx,qy+1);
  };
  const rP=chip('Dự đoán cho dấu ?',{big:true}), rA=chip('Đúng trên 300 bạn kiểm tra (chưa chuẩn hóa)'), rB=chip('Đúng trên 300 bạn kiểm tra (đã chuẩn hóa)');
  S.reads.append(rP,rA,rB); rA.set(pct(accRaw,0)); rB.set(pct(accSc,0)); rA.tone(accRaw<accSc?'bad':null); rB.tone('good');
  function upd(){ const k=pred(q,scaled); rP.set(k?'Vào đội tuyển ■':'Chưa vào ●');
    S.note.textContent=scaled?'Đã chuẩn hóa: hai trục cùng thang đo, nên hàng xóm gần nhất là những bạn có điểm toán giống nhau. Điểm toán mới là thứ quyết định vào đội tuyển.':'Chưa chuẩn hóa: chiều cao chênh vài chục cm, điểm toán chỉ chênh vài điểm, nên "gần nhất" gần như chỉ xét chiều cao. Các hàng xóm có thể có điểm toán rất khác.';
    o.draw(); }
  S.controls.append(toggle('Chuẩn hóa z-score',false,v=>{scaled=v;upd();}),h('span',{class:'ctl'},'Nhóm: điểm toán ≥ 7 thì vào đội tuyển (■), dưới 7 là chưa vào (●).'));
  o.cv.addEventListener('pointerdown',e=>{ const p=ptr(e,o.cv), m=M(); let x=m.ix(p.x), y=m.iy(p.y); if(scaled){ x=x*sx+mx; y=y*sy+my; } q={x:clamp(x,140,190),y:clamp(y,0,10)}; upd(); });
  upd();
  const sub=h('div',{class:'subdemo'}); root.append(sub); sub.append(h('h3',{class:'sub-h'},'Mỗi cột cần xử lý thế nào?'));
  const box=h('div'); sub.append(box);
  sortGame(box,[
    {q:'Cột "tuổi" có 5% ô bị bỏ trống.',a:'fill',w:'Điền bằng trung vị hoặc trung bình, tính trên tập train.'},
    {q:'Cột "tỉnh thành" gồm Hà Nội, Huế, Cần Thơ, dùng cho hồi quy logistic.',a:'onehot',w:'Cột chữ không có thứ tự: one-hot thành 3 cột 0/1.'},
    {q:'Cột "thu nhập" tính bằng đồng (hàng triệu) và cột "số con" từ 0 đến 5, dùng với k-NN.',a:'scale',w:'Thang đo chênh nhau quá lớn: chuẩn hóa z-score hoặc min-max.'},
    {q:'Cột "mã học sinh" (mỗi em một số khác nhau).',a:'drop',w:'Mã số không mang quy luật gì, chỉ giúp mô hình học thuộc.'},
    {q:'Cột "đã được hoàn tiền" khi dự đoán "giao dịch có gian lận không".',a:'drop',w:'Thông tin này chỉ có SAU khi biết gian lận: rò rỉ dữ liệu.'},
    {q:'Cột "điểm thi thử" để trống với các bạn vắng buổi thi thử.',a:'fill',w:'Điền ô thiếu (có thể thêm một cột 0/1 "có vắng thi" làm đặc trưng mới).'},
    {q:'Cột "màu áo đồng phục" gồm đỏ, xanh, vàng.',a:'onehot',w:'Không đánh số 1, 2, 3 vì màu không có thứ tự.'},
    {q:'Cột "chiều cao (cm)" và "cân nặng (kg)" dùng với SVM.',a:'scale',w:'SVM dựa vào khoảng cách nên các cột cần cùng thang đo.'}
  ],[['fill','Điền ô thiếu'],['onehot','One-hot'],['scale','Chuẩn hóa'],['drop','Bỏ cột']]);
}

function demoSVM(root){
  const S=shell(root); const r=mulberry32(19);
  const gen=()=>{ const a=[]; while(a.length<14){ const x=3+randn(r)*0.95, y=6.4+randn(r)*0.95; if(x-y<-1.2&&x>0.4&&y<9.6) a.push({x,y,c:0}); } while(a.length<28){ const x=6.8+randn(r)*0.95, y=3.4+randn(r)*0.95; if(x-y>1.2&&x<9.6&&y>0.4) a.push({x,y,c:1}); } return a; };
  const base=gen(); let pts=base.slice(), outlier=false, th=300, b=0.6;
  const W=t=>[Math.cos(t*Math.PI/180),Math.sin(t*Math.PI/180)];
  const marg=(t,bb)=>{ const w=W(t); return pts.map(p=>(p.c?1:-1)*(w[0]*p.x+w[1]*p.y-bb)); };
  function best(list){ let bt=0,bb=0,bm=-Infinity; for(let t=0;t<360;t+=0.5){ const w=W(t); let lo=Infinity, hi=-Infinity; list.forEach(p=>{ const v=w[0]*p.x+w[1]*p.y; if(p.c) lo=Math.min(lo,v); else hi=Math.max(hi,v); }); const g=(lo-hi)/2; if(g>bm){ bm=g; bt=t; bb=(lo+hi)/2; } } return {t:bt,b:bb,m:bm}; }
  let opt=best(pts);
  const o=makeCanvas(S.stage,{ratio:0.62,maxH:460,label:'Hai nhóm điểm, đường chia và lề của SVM'});
  const M=()=>worldEq(o,0,10,0,10,16);
  o.draw=()=>{ if(!o.w) return; const T=theme(), c=o.ctx, m=M(), w=W(th), ms=marg(th,b), ok=ms.every(v=>v>0), mm=ok?Math.min(...ms):0; paper(c,o.w,o.h,T);
    const line=(off,col,lw,dash)=>{ const p0=[w[0]*off,w[1]*off], d=[-w[1],w[0]]; c.save(); if(dash) c.setLineDash(dash); c.strokeStyle=col; c.lineWidth=lw; seg2(c,m.X(p0[0]-30*d[0]),m.Y(p0[1]-30*d[1]),m.X(p0[0]+30*d[0]),m.Y(p0[1]+30*d[1])); c.restore(); };
    if(ok){ const p0=[w[0]*b,w[1]*b], d=[-w[1],w[0]]; c.save(); c.beginPath(); [[-1,-30],[-1,30],[1,30],[1,-30]].forEach(([s,k],i)=>{ const x=p0[0]+s*mm*w[0]+k*d[0], y=p0[1]+s*mm*w[1]+k*d[1]; i?c.lineTo(m.X(x),m.Y(y)):c.moveTo(m.X(x),m.Y(y)); }); c.closePath(); c.fillStyle=alpha(T.amber,0.14); c.fill(); c.restore();
      line(b-mm,T.amber,1.6,[6,5]); line(b+mm,T.amber,1.6,[6,5]); }
    line(b,T.red,3);
    pts.forEach((p,i)=>{ const X=m.X(p.x), Y=m.Y(p.y); mark(c,X,Y,p.c,T,6.5); if(ms[i]<=0){ c.save(); c.setLineDash([3,3]); dot(c,X,Y,13,null,T.red,2.2); c.restore(); } else if(ok&&ms[i]<=mm+1e-6) dot(c,X,Y,12,null,T.ink,2.2); });
  };
  const rM=chip('Lề hiện tại (tới điểm gần nhất)',{big:true}), rE=chip('Số điểm sai phía'), rB=chip('Lề rộng nhất có thể');
  S.reads.append(rM,rE,rB);
  function upd(msg){ const ms=marg(th,b), bad=ms.filter(v=>v<=0).length, mm=bad?NaN:Math.min(...ms);
    rM.set(bad?'— (còn điểm sai phía)':nf(mm,2)); rM.tone(!bad&&mm>=opt.m*0.97?'good':bad?'bad':null); rE.set(String(bad)); rE.tone(bad?'bad':'good');
    rB.set(opt.m>0?nf(opt.m,2):(outlier?nf(best(base).m,2)+' (nếu bỏ qua điểm lạc)':'—'));
    S.note.textContent=msg||(bad?'Còn điểm nằm sai phía đường đỏ (vòng đỏ nét đứt). Xoay hoặc dịch đường.':mm>=opt.m*0.97?'Gần như lề rộng nhất rồi! Các điểm khoanh đen là vector hỗ trợ.':'Đúng phía hết rồi. Vùng vàng là lề: thử làm nó rộng hơn.'); o.draw(); }
  const sT=slider('Góc',{min:0,max:359,step:1,value:th,fmt:v=>v+'°'},v=>{th=v;upd();}), sB=slider('Dịch',{min:-10,max:10,step:0.05,value:b,fmt:v=>nf(v,2)},v=>{b=v;upd();});
  S.controls.append(sT,sB,btn('Tìm lề rộng nhất',()=>{ let res=opt, msg;
      if(opt.m<=0){ res=best(base); msg='Có điểm lạc nên không đường thẳng nào chia đúng hết. Lề mềm (C nhỏ): chấp nhận 1 điểm sai để có lề rộng cho số đông.'; }
      else msg='Đây là đường có lề rộng nhất. Chỉ các điểm khoanh đen (vector hỗ trợ) quyết định nó.';
      th=Math.round(res.t); b=Math.round(res.b*20)/20; const w=W(th); let lo=Infinity,hi=-Infinity; (opt.m>0?pts:base).forEach(p=>{ const v=w[0]*p.x+w[1]*p.y; if(p.c) lo=Math.min(lo,v); else hi=Math.max(hi,v); }); if(lo>hi) b=(lo+hi)/2;
      sT.setV(th); sB.setV(b); upd(msg); },'btn primary'),
    toggle('Thêm điểm lạc',false,v=>{ outlier=v; pts=v?base.concat([{x:6.6,y:3.9,c:0}]):base.slice(); opt=best(pts); upd(v?'Một điểm ● lọt vào giữa nhóm ■: dữ liệu không còn tách được bằng đường thẳng.':null); }));
  upd();
}

function demoPCA(root){

  };
  const tree=h('div',{class:'mtree'}); S.stage.append(tree);
  const rW=chip('Gini sau chia',{big:true}), rG=chip('Gini giảm (gain)'), rE=chip('Entropy sau chia (để so sánh)');

  function node(name,a){ const n=a[0]+a[1]; return h('div',{class:'mt-node'},h('em',{},name),h('div',{},`● ${a[0]} · ■ ${a[1]}`),h('small',{},`Gini = 1 − (${a[0]}/${n})² − (${a[1]}/${n})² = ${nf(gini(a[0],a[1]),3)}`)); }

    data.tr.forEach(pt=>{ const t=2*pt.x-1, pw=[1]; for(let j=1;j<p;j++) pw.push(pw[j-1]*t); for(let i=0;i<p;i++){ b[i]+=pw[i]*pt.y; for(let j=0;j<p;j++) A[i][j]+=pw[i]*pw[j]; } });
    for(let i=1;i<p;i++) A[i][i]+=lam*n+1e-12; return cache[key]=solve(A,b); }

    const X=d=>pad.l+d/9*(o2.w-pad.l-pad.r), Y=v=>o2.h-pad.b-Math.min(v,YM)/YM*(o2.h-pad.t-pad.b);

    toggle('Hiện quy luật thật',true,v=>{showTrue=v;o.draw();}), btn('Dữ liệu mới',()=>{seed++;gen();upd();}));

function drawDist(c,R,p,T,ex={}){

  area(fN,0,p.t,alpha(T.muted,0.16)); area(fN,p.t,1,alpha(T.red,0.38)); area(fP,0,p.t,alpha(T.amber,0.42)); area(fP,p.t,1,alpha(T.green,0.38));

  c.fillStyle=T.muted; c.font=font(10,'mono'); c.textAlign='center'; c.textBaseline='top'; [0,0.25,0.5,0.75,1].forEach(v=>c.fillText(nf(v,2),X(v),Y(0)+4));
  const lb=ex.labels||['Thật Âm','Thật Dương'];

  if(p.P>0) label(c,lb[1],X(p.mp),Math.max(R.y+12,Y(fP(p.mp))-12),T,{align:'center',color:T.ink,font:font(11,'bold'),maxW:R.x+R.w});

}

function demoFair(root){
  const S=shell(root); const o=makeCanvas(S.stage,{ratio:0.62,maxH:460,minH:300,label:'Phân bố điểm của hai nhóm và ngưỡng duyệt'});

  const st=(g,t)=>{ const P=G[g].N*G[g].base, Nn=G[g].N-P, TP=P*(1-Phi((t-MP)/SD)), FP=Nn*(1-Phi((t-MN)/SD)); return {rate:(TP+FP)/G[g].N,tpr:TP/P,fpr:FP/Nn,prec:TP+FP>0?TP/(TP+FP):NaN,acc:(TP+(Nn-FP))/G[g].N,P,Nn}; };
  o.draw=()=>{ if(!o.w) return; const T=theme(), c=o.ctx; paper(c,o.w,o.h,T); const hh=(o.h-10)/2, ym=350*npdf(0,0,SD)*1.08;
    [['A',tA,0],['B',tB,hh+10]].forEach(([g,t,y])=>{ const s=st(g,t); c.fillStyle=alpha(T.surface,0.6); drawDist(c,{x:0,y,w:o.w,h:hh},{P:s.P,Nn:s.Nn,mp:MP,mn:MN,sd:SD,t,ymax:ym},T,{labels:['Chưa đủ chuẩn','Đủ chuẩn'],title:`Nhóm ${g}: ${pct(G[g].base,0)} đủ chuẩn`}); });
    c.strokeStyle=T.line; c.lineWidth=1; seg2(c,0,hh+5,o.w,hh+5); };
  const tw=h('div',{class:'scroll-x'}); S.reads.append(tw); const r45=chip('Tỉ lệ 4/5 (duyệt thấp / cao)',{big:true}); S.reads.append(r45);
  const TOL=0.03;
  function upd(msg){ const a=st('A',tA), b=st('B',tB); const row=(name,k,crit)=>{ const d=Math.abs(a[k]-b[k]), ok=d<TOL; return h('tr',{},h('td',{},name),h('td',{},pct(a[k])),h('td',{},pct(b[k])),h('td',{},nf(100*d,1)+' điểm'),h('td',{},h('span',{class:'pill '+(ok?'ok':'no')},ok?'Đạt':'Trượt'),' ',h('small',{},crit))); };
    tw.innerHTML=''; tw.append(h('table',{class:'ftable'},h('thead',{},h('tr',{},h('th',{},'Đại lượng'),h('th',{},'Nhóm A'),h('th',{},'Nhóm B'),h('th',{},'Chênh lệch'),h('th',{},'Tiêu chí'))),
      h('tbody',{},row('Tỉ lệ được duyệt','rate','Demographic parity'),row('TPR (đủ chuẩn được duyệt)','tpr','Equal opportunity'),row('FPR (chưa đủ chuẩn được duyệt)','fpr','cùng TPR → Equalized odds'),row('Precision (duyệt thì đủ chuẩn)','prec','Predictive parity'),h('tr',{},h('td',{},'Accuracy'),h('td',{},pct(a.acc)),h('td',{},pct(b.acc)),h('td',{},''),h('td',{},'')))));
    const ratio=Math.min(a.rate,b.rate)/Math.max(a.rate,b.rate); r45.set(nf(ratio,2)); r45.tone(ratio<0.8?'bad':'good');
    S.note.textContent=msg||'Chỉnh ngưỡng từng nhóm. Thử xem có cách nào làm cả 4 dòng cùng Đạt không.'; o.draw(); }
  const sA=slider('Ngưỡng nhóm A',{min:0.1,max:0.9,step:0.01,value:tA,fmt:v=>nf(v,2)},v=>{tA=v;upd();}), sB=slider('Ngưỡng nhóm B',{min:0.1,max:0.9,step:0.01,value:tB,fmt:v=>nf(v,2)},v=>{tB=v;upd();});
  const find=(fn,target,dec)=>{ let lo=0.05,hi=0.95; for(let i=0;i<60;i++){ const m=(lo+hi)/2, v=fn(m); if((v>target)===dec) lo=m; else hi=m; } return (lo+hi)/2; };
  S.controls.append(sA,sB,
    btn('Ngưỡng chung 0,5',()=>{ tA=tB=0.5; sA.setV(tA); sB.setV(tB); upd('Cùng ngưỡng: TPR và FPR bằng nhau (vì mô hình như nhau), nhưng tỉ lệ duyệt và precision khác nhau do tỉ lệ đủ chuẩn khác nhau.'); }),
    btn('Cân bằng tỉ lệ duyệt',()=>{ const tg=st('A',tA).rate; tB=clamp(Math.round(find(t=>st('B',t).rate,tg,true)*100)/100,0.1,0.9); sB.setV(tB); upd('Tỉ lệ duyệt đã bằng nhau, nhưng giờ TPR và precision lệch nhau.'); }),

function lineChart(o,T,series,opt){ const c=o.ctx; c.fillStyle=T.surface; c.fillRect(0,0,o.w,o.h); const pad={l:46,r:14,t:22,b:28};
  const X=v=>pad.l+(v-opt.x0)/(opt.x1-opt.x0)*(o.w-pad.l-pad.r), Y=v=>o.h-pad.b-(v-opt.y0)/(opt.y1-opt.y0)*(o.h-pad.t-pad.b);
  c.lineWidth=1; c.font=font(10,'mono'); c.fillStyle=T.muted; c.textAlign='right'; c.textBaseline='middle';
  opt.yt.forEach(v=>{ c.strokeStyle=T.grid; seg2(c,pad.l,Y(v),o.w-pad.r,Y(v)); c.fillText(opt.yf?opt.yf(v):String(v),pad.l-6,Y(v)); });
  c.textAlign='center'; c.textBaseline='top'; opt.xt.forEach(v=>c.fillText(String(v),X(v),o.h-pad.b+6));
  c.strokeStyle=T.gridS; seg2(c,pad.l,o.h-pad.b,o.w-pad.r,o.h-pad.b); seg2(c,pad.l,pad.t,pad.l,o.h-pad.b);
  series.forEach(s=>{ c.strokeStyle=s.col; c.lineWidth=s.lw||2.5; if(s.dash) c.setLineDash(s.dash); c.beginPath(); let st=false; s.pts.forEach(([x,y])=>{ if(!isFinite(y)) return; const yy=Y(clamp(y,opt.y0,opt.y1)); st?c.lineTo(X(x),yy):(c.moveTo(X(x),yy),st=true); }); c.stroke(); c.setLineDash([]); });
  if(opt.title){ c.fillStyle=T.muted; c.font=font(11,'bold'); c.textAlign='left'; c.textBaseline='top'; c.fillText(opt.title,pad.l,3); }
  return {X,Y}; }

function demoForest(root){
  const S=shell(root); const o=makeCanvas(S.stage,{ratio:0.5,maxH:380,label:'Xác suất cả rừng đoán đúng theo số cây'});
  let p=0.6, n=5, same=false;
  const comb=(n,k)=>{ let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return r; };
  const pm=(n,p)=>{ if(same) return p; let s=0; for(let k=Math.floor(n/2)+1;k<=n;k++) s+=comb(n,k)*Math.pow(p,k)*Math.pow(1-p,n-k); return s; };
  o.draw=()=>{ if(!o.w) return; const T=theme(); const pts=[]; for(let k=1;k<=51;k+=2) pts.push([k,pm(k,p)]);
    const g=lineChart(o,T,[{pts:[[1,p],[51,p]],col:T.muted,lw:1.5,dash:[5,4]},{pts,col:T.accent}],{x0:1,x1:51,y0:0.4,y1:1,yt:[0.4,0.6,0.8,1],yf:v=>pct(v,0),xt:[1,11,21,31,41,51],title:'Rừng đúng bao nhiêu % (trục ngang: số cây)'});
    dot(o.ctx,g.X(n),g.Y(pm(n,p)),6,T.accent,T.surface,2); label(o.ctx,`${n} cây: ${pct(pm(n,p),1)}`,g.X(n)+10,g.Y(pm(n,p))-14,T,{maxW:o.w}); };
  const r1=chip('Một cây đúng'), r2=chip('Cả rừng đúng',{big:true}); S.reads.append(r2,r1);
  function upd(){ r1.set(pct(p,0)); const v=pm(n,p); r2.set(pct(v,1)); r2.tone(v>=0.8?'good':v>p+0.02?'warn':'bad');
    S.note.textContent=same?'Các cây giống hệt nhau thì sai cùng lúc: bỏ phiếu không giúp gì. Vì vậy bagging cho mỗi cây một bộ dữ liệu khác.':p<=0.5?'Mỗi cây không hơn đoán bừa (≤ 50%): gộp nhiều cây còn tệ hơn. Cây phải tốt hơn đoán bừa một chút.':`Mỗi cây chỉ đúng ${pct(p,0)}, nhưng ${n} cây độc lập bỏ phiếu thì đúng ${pct(v,1)}.`; o.draw(); }
  S.controls.append(slider('Độ chính xác mỗi cây',{min:0.45,max:0.85,step:0.01,value:p,fmt:v=>pct(v,0)},v=>{p=v;upd();}),slider('Số cây',{min:1,max:51,step:2,value:n},v=>{n=v;upd();}),toggle('Các cây giống hệt nhau',false,v=>{same=v;upd();}));
  upd();
}

function demoTrain(root){
  const S=shell(root); const o=makeCanvas(S.stage,{ratio:0.5,maxH:380,label:'Đường loss theo số bước cập nhật'});
  const r0=mulberry32(4); const D=Array.from({length:200},()=>{ const x=r0()*2-1; return {x,y:3*x+1+(r0()-0.5)*0.8}; });
  let B=8, lr=0.1, opt='sgd', hist=[], div=false;
  const full=(w,b)=>D.reduce((s,d)=>s+(w*d.x+b-d.y)**2,0)/D.length;
  function run(){ const r=mulberry32(11); let w=0,b=0, m=[0,0], v=[0,0]; hist=[full(w,b)]; div=false;
    for(let t=1;t<=150;t++){ let gw=0,gb=0; const bs=B===0?D.length:B; for(let k=0;k<bs;k++){ const d=B===0?D[k]:D[Math.floor(r()*D.length)]; const e=w*d.x+b-d.y; gw+=2*e*d.x; gb+=2*e; } gw/=bs; gb/=bs;
      if(opt==='adam'){ const g=[gw,gb]; for(let i=0;i<2;i++){ m[i]=0.9*m[i]+0.1*g[i]; v[i]=0.999*v[i]+0.001*g[i]*g[i]; } const mh=m.map(x=>x/(1-Math.pow(0.9,t))), vh=v.map(x=>x/(1-Math.pow(0.999,t))); w-=lr*mh[0]/(Math.sqrt(vh[0])+1e-8); b-=lr*mh[1]/(Math.sqrt(vh[1])+1e-8); }
      else { w-=lr*gw; b-=lr*gb; }
      const L=full(w,b); hist.push(L); if(!isFinite(L)||L>1e6){ div=true; break; } } }
  o.draw=()=>{ if(!o.w) return; const T=theme(); const pts=hist.map((L,i)=>[i,Math.log10(Math.max(L,1e-3))]);
    lineChart(o,T,[{pts:[[0,Math.log10(0.053)],[150,Math.log10(0.053)]],col:T.green,lw:1.5,dash:[5,4]},{pts,col:div?T.red:T.accent}],{x0:0,x1:150,y0:-1.5,y1:2,yt:[-1,0,1,2],yf:v=>v===-1?'0.1':v===0?'1':v===1?'10':'100',xt:[0,50,100,150],title:'Loss (thang log) theo số bước; vạch xanh lá: mức tốt nhất có thể'}); };
  const rL=chip('Loss sau 150 bước',{big:true}), rS=chip('Số bước mỗi epoch (200 mẫu)'); S.reads.append(rL,rS);
  function upd(){ run(); const L=hist[hist.length-1]; rL.set(div?'phân kỳ':nf(L,3)); rL.tone(div?'bad':L<0.08?'good':L<0.5?'warn':'bad'); rS.set(B===0?'1':String(Math.ceil(200/B)));
    S.note.textContent=div?'Learning rate quá lớn: loss bùng lên rồi phân kỳ. Giảm learning rate, hoặc thử Adam.':B===1&&opt==='sgd'?'Batch 1 (SGD): mỗi bước dựa trên một mẫu nên gradient rất nhiễu, đường loss lắc mạnh.':lr<0.02&&opt==='sgd'?'Learning rate quá nhỏ: loss giảm rất chậm.':opt==='adam'?'Adam tự điều chỉnh độ dài bước cho từng tham số.':'Mini-batch: đường loss giảm khá đều.'; o.draw(); }
  S.controls.append(h('span',{class:'ctl'},'Batch'),seg([[1,'1 (SGD)'],[8,'8'],[64,'64'],[0,'Cả tập']],B,v=>{B=v;upd();},'Kích thước batch'),
    slider('Learning rate η',{min:-2,max:0.3,step:0.05,value:Math.log10(lr),fmt:v=>nf(Math.pow(10,v),3)},v=>{lr=Math.pow(10,v);upd();}),
    seg([['sgd','SGD'],['adam','Adam']],opt,v=>{opt=v;upd();},'Bộ tối ưu'));
  upd();
}

  const probs=()=>{ const z=P[k][1].map(x=>x[1]/T), mx=Math.max(...z), e=z.map(v=>Math.exp(v-mx)), s=e.reduce((a,b)=>a+b,0); return e.map(v=>v/s); };
  function draw(){ const Th=theme(); $('.pr',S.stage).textContent=P[k][0]+' …'; bars.innerHTML=''; const p=probs(); P[k][1].forEach((x,i)=>bars.append(h('div',{class:'tbar'},h('span',{},x[0]),h('div',{class:'track'},h('i',{style:`width:${Math.max(2,p[i]*100)}%;background:${Th.accent}`})),h('b',{},pct(p[i],0)))));
    cotBox.innerHTML=''; cotBox.append(h('p',{style:'margin:0 0 6px'},h('b',{},'Hỏi: '),'Lớp có 35 bạn, 3/5 là nữ. Mỗi bạn nữ trồng 2 cây, mỗi bạn nam trồng 3 cây. Cả lớp trồng bao nhiêu cây?'),
      cot?h('p',{style:'margin:0'},h('b',{},'Trả lời (suy luận từng bước): '),'Số nữ = 35 × 3/5 = 21. Số nam = 35 − 21 = 14. Số cây = 21 × 2 + 14 × 3 = 42 + 42 = ',h('b',{},'84'),'. ✓'):h('p',{style:'margin:0'},h('b',{},'Trả lời ngay: '),'100 cây. ✗ (đoán vội, sai)'));
    S.note.textContent=T<0.5?'Nhiệt độ thấp: gần như luôn chọn từ có xác suất cao nhất, câu trả lời ổn định nhưng đơn điệu.':T>1.4?'Nhiệt độ cao: xác suất dàn đều, câu trả lời đa dạng hơn nhưng dễ lạc đề.':'LLM tính xác suất cho từ tiếp theo, rồi chọn một từ và lặp lại.'; }
  const sample=()=>{ const p=probs(), r=Math.random; const out=[]; for(let i=0;i<10;i++){ let u=r(), j=0; while(j<p.length-1&&u>p[j]){ u-=p[j]; j++; } out.push(P[k][1][j][0]); } samp.textContent='10 lần sinh: '+out.join(', '); };
  S.controls.append(seg([['a','Thủ đô…'],['b','Con mèo…'],['c','Hôm nay trời…']],k,v=>{k=v;samp.textContent='';draw();},'Lời nhắc'),slider('Nhiệt độ (temperature)',{min:0.2,max:2,step:0.1,value:T,fmt:v=>v.toFixed(1)},v=>{T=v;draw();}),btn('Sinh 10 lần',sample),toggle('Bật Chain-of-Thought',false,v=>{cot=v;draw();}));
  draw();
}

{t:"pytorch",q:"Giả sử bạn đang xây dựng một mô hình phân loại cảm xúc văn bản (positive/negative) bằng cách sử dụng biểu diễn Bag-of-Words (BoW) và PyTorch (phiên bản ≥ 1.6). Dưới đây là đoạn mã tiền xử lý đã được thực hiện:",x:"<pre class=\"qcode\">from sklearn.feature_extraction.text import CountVectorizer\nfrom sklearn.model_selection import train_test_split\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\n\ntexts = [\"I love this movie\", \"I hate this product\",\n         \"Amazing quality\", \"Terrible service\"]\nlabels = [1, 0, 1, 0]\n\nvectorizer = CountVectorizer()\nX = vectorizer.fit_transform(texts).toarray()\ny = torch.tensor(labels)\n\nX_train, X_test, y_train, y_test = train_test_split(X, y,\n    test_size=0.25)\n\nX_train = torch.tensor(X_train, dtype=torch.float32)</pre><p>Phương án nào sau đây là phần mã đúng để huấn luyện mô hình phân loại nhị phân đơn giản với biểu diễn BoW, một tầng tuyến tính và hàm loss phù hợp?</p>",oc:true,o:["model = nn.Linear(X_train.shape[1], 1)\nloss_fn = nn.BCEWithLogitsLoss()\noptimizer = optim.Adam(model.parameters(), lr=0.01)\n\nfor epoch in range(100):\n    outputs = model(X_train).squeeze()\n    loss = loss_fn(outputs, y_train.float())\n    loss.backward()\n    optimizer.step()\n    optimizer.zero_grad()","model = nn.Sequential(\n    nn.Linear(X_train.shape[1], 10),\n    nn.ReLU(),\n    nn.Linear(10, 2)\n)\nloss_fn = nn.NLLLoss()\noptimizer = optim.Adam(model.parameters(), lr=0.01)\n\nfor epoch in range(100):\n    outputs = model(X_train)\n    loss = loss_fn(outputs, y_train)\n    loss.backward()\n    optimizer.step()\n    optimizer.zero_grad()","model = nn.Linear(X_train.shape[1], 2)\nloss_fn = nn.CrossEntropyLoss()\noptimizer = optim.Adam(model.parameters(), lr=0.01)\n\nfor epoch in range(100):\n    outputs = model(X_train)\n    loss = loss_fn(outputs, y_train)\n    loss.backward()\n    optimizer.step()\n    optimizer.zero_grad()","model = nn.Linear(X_train.shape[1], 1)\nloss_fn = nn.MSELoss()\noptimizer = optim.Adam(model.parameters(), lr=0.01)\n\nfor epoch in range(100):\n    outputs = model(X_train)\n    loss = loss_fn(outputs, y_train)\n    loss.backward()\n    optimizer.step()\n    optimizer.zero_grad()"],a:[0],e:"Phân loại nhị phân chuẩn: một tầng Linear ra 1 số (logit) + BCEWithLogitsLoss, nhãn đổi sang float, squeeze() cho khớp shape. B có hai tầng và dùng NLLLoss trên đầu ra chưa qua log_softmax; D dùng MSE cho phân loại và sai kiểu dữ liệu nhãn. Lưu ý: C (2 đầu ra + CrossEntropyLoss) cũng chạy đúng, nhưng A là cách chuẩn cho bài toán nhị phân với một đầu ra; đây là câu có thể tranh luận."},
{t:"svm",q:"Điều nào sau đây là ĐÚNG khi so sánh SVM (support vector machine) với k-NN?",o:["Cả hai phương pháp chỉ được sử dụng cho các bài toán phân loại (không phải hồi quy)","Huấn luyện SVM có thể tốn kém về mặt tính toán, đặc biệt đối với các bộ dữ liệu lớn, trong khi huấn luyện k-NN không liên quan đến quy trình huấn luyện rõ ràng","SVM luôn tốt hơn k-NN trên mọi tập dữ liệu","Dự đoán của cả hai phương pháp đều chậm vì cả hai đều cần xử lý tất cả các mẫu dữ liệu huấn luyện để dự đoán mẫu dữ liệu mới"],a:[1],e:"k-NN chỉ lưu dữ liệu (học lười), không có bước huấn luyện; SVM phải giải bài toán tối ưu, chậm khi dữ liệu lớn. Cả hai đều làm được hồi quy (SVR, k-NN hồi quy); SVM dự đoán nhanh vì chỉ cần các vector hỗ trợ."},

{t:"chuyen-giao",q:"Khi sử dụng torchvision.models.resnet18(pretrained=True) trong PyTorch, mục đích chính là gì?",o:["Huấn luyện mô hình từ đầu","Tăng kích thước lô (batch size)","Thử nghiệm mô hình mới","Sử dụng trọng số huấn luyện trước (pre-trained weights) trên ImageNet để trích xuất đặc trưng"],a:[3],e:"pretrained=True tải trọng số đã học trên ImageNet, là bước đầu của học chuyển giao."},
{t:"phat-hien",q:"Khi các mô hình phát hiện vật thể hoạt động, chúng thường đề xuất nhiều hộp bao (bounding box) cho cùng một đối tượng trong ảnh. Nhiều hộp bao này có thể chồng lấn lên nhau, dẫn đến thông tin dư thừa vì mục tiêu của chúng ta là chỉ xác định một hộp bao duy nhất và chính xác nhất cho mỗi đối tượng. Thuật toán Non-Maximum Suppression (NMS) được thiết kế để giải quyết vấn đề này. Nó giúp lọc và loại bỏ các hộp bao dư thừa, chỉ giữ lại những hộp bao đại diện tốt nhất cho mỗi đối tượng.",x:"<p>Thuật toán NMS gồm các bước như sau:</p><ul>\n<li><b>Sắp xếp:</b> Sắp xếp tất cả các hộp bao trong tập P theo thứ tự giảm dần của điểm tin cậy (confidence score).</li>\n<li><b>Chọn hộp tốt nhất:</b> Chọn hộp bao H có điểm tin cậy cao nhất từ tập P. Hộp bao này được xem là đại diện tốt nhất hiện tại.</li>\n<li><b>Giữ lại và loại bỏ:</b> Chuyển hộp bao H vào danh sách kết quả cuối cùng (gọi là K) và loại bỏ nó khỏi tập P.</li>\n<li><b>So sánh và loại bỏ chồng lấn:</b><ul><li>Tính toán chỉ số Intersection over Union (IoU) giữa hộp H (vừa chọn) và tất cả các hộp bao còn lại trong tập P. Chỉ số IoU được tính theo công thức sau: <span class=\"fx\">IoU = Diện tích vùng giao của 2 hộp / Diện tích vùng hợp của hai hộp</span></li><li>Đối với mỗi hộp bao còn lại trong P, nếu giá trị IoU của nó với hộp H lớn hơn một ngưỡng xác định trước (IoU_threshold), thì loại bỏ hộp bao đó khỏi P. Lý do là vì nó chồng lấn quá nhiều với hộp H (vốn có điểm tin cậy cao hơn) và được coi là dư thừa cho cùng một đối tượng.</li></ul></li>\n<li><b>Lặp lại:</b> Quay lại Bước 2 và lặp lại quy trình (chọn hộp có điểm tin cậy cao nhất tiếp theo từ P, thêm vào K, loại bỏ các hộp chồng lấn khỏi P) cho đến khi tập P không còn hộp bao nào.</li>\n<li><b>Kết quả:</b> Danh sách K sẽ chứa các hộp bao cuối cùng được giữ lại, mỗi hộp đại diện cho một đối tượng riêng biệt đã được phát hiện.</li></ul>\n<p>Áp dụng thuật toán NMS với ngưỡng IoU-threshold = 0.40 và giả sử tất cả các hộp cùng một lớp và thông tin các hộp đã sắp thứ tự theo độ tin cậy (confidence score) như sau:</p><div class=\"scroll-x\"><table class=\"mini qtbl\"><tr><th>ID</th><th>Toạ độ (x₁, y₁, x₂, y₂) (pixel)</th><th>Độ tin cậy</th></tr><tr><td>B₁</td><td>(0, 0, 100, 100)</td><td>0.95</td></tr><tr><td>B₂</td><td>(10, 10, 90, 90)</td><td>0.90</td></tr><tr><td>B₃</td><td>(105, 105, 200, 200)</td><td>0.85</td></tr></table></div><p>Những hộp nào sẽ được giữ lại?</p>",o:["B₁ và B₂","Chỉ B₁","B₁ và B₃","B₂ và B₃"],a:[2],e:"Giữ B₁. IoU(B₁, B₂): giao 80 × 80 = 6400, hợp 10000 + 6400 − 6400 = 10000 → 0.64 > 0.40, loại B₂. IoU(B₁, B₃) = 0 (không chạm nhau) → giữ B₃. Kết quả: B₁ và B₃."},
