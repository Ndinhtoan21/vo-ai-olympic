<div class="ex">1000 mẫu, batch 100 → 1000/100 = <b>10 bước</b> mỗi epoch. Huấn luyện 20 epoch → 200 lần cập nhật trọng số. Với SGD (batch 1) thì mỗi epoch là 1000 bước.</div>
<h4>2. Chọn kích thước batch</h4>
<p>Gradient tính trên ít mẫu là một <b>ước lượng nhiễu</b> của gradient thật. Batch càng nhỏ, nhiễu càng lớn: đường loss lắc mạnh, nhưng mỗi bước rẻ. Batch lớn cho gradient ổn định nhưng mỗi bước tốn bộ nhớ; nếu GPU báo hết bộ nhớ (Out-of-Memory) thì việc đầu tiên là <b>giảm batch</b> hoặc dùng tích lũy gradient.</p>
<h4>3. Momentum và Adam</h4>
<p><b>Momentum</b>: thay vì chỉ đi theo gradient hiện tại, ta giữ một "vận tốc" <span class="fx">v ← β·v + g</span> rồi <span class="fx">w ← w − η·v</span>. Giống viên bi lăn xuống dốc, đi đều qua những chỗ gồ ghề.</p>
<p><b>Adam</b> giữ hai trung bình trượt cho mỗi tham số: trung bình gradient (như momentum) và trung bình bình phương gradient. Bước đi ≈ η × (trung bình gradient) / √(trung bình bình phương). Tham số nào gradient lớn thì bước nhỏ lại, gradient nhỏ thì bước to ra: <b>mỗi tham số có learning rate riêng</b>. Khi loss với Adam chững lại, thường thử <b>giảm learning rate</b>.</p>
<h4>4. Batch Normalization</h4>
<p>Với mỗi batch, BatchNorm lấy đầu ra của một lớp, trừ trung bình và chia độ lệch chuẩn của batch đó: <span class="fx">x̂ = (x − μ_B)/√(σ²_B + ε)</span>, rồi nhân và cộng hai tham số học được: <span class="fx">y = γ·x̂ + β</span>. Thứ tự hay dùng: <b>Conv/Linear → BatchNorm → ReLU</b>. Khi dự đoán, BatchNorm dùng trung bình đã tích lũy lúc huấn luyện.</p>
<h4>5. Khởi tạo trọng số</h4>
<ul><li>Tất cả bằng 0: mọi nơ-ron trong một lớp nhận gradient giống nhau, mãi giống nhau → mạng như chỉ có 1 nơ-ron.</li><li>Quá lớn: tín hiệu và gradient phình to qua các lớp (<b>nổ</b>). Quá nhỏ: teo dần (<b>biến mất</b>).</li><li>Cách chuẩn: ngẫu nhiên với độ lớn theo số đầu vào (Xavier/Glorot cho tanh, He cho ReLU).</li></ul>
<h4>6. Lịch learning rate</h4>
<p>Thường bắt đầu với η vừa phải rồi <b>giảm dần</b> (learning rate scheduler) khi loss chững lại, để bước cuối đủ nhỏ mà "đỗ" vào đáy.</p>`},

{id:'pytorch',part:'D',title:'Đọc code PyTorch',
 one:'PyTorch là thư viện dựng và huấn luyện mạng nơ-ron. Đề hay đưa một đoạn code rồi hỏi dòng nào đúng.',
 why:'Đề 2025 có khoảng 10 câu đọc code: chọn hàm loss đúng, đưa mô hình lên GPU, thêm Dropout, lấy vector đặc trưng từ ResNet.',
 pre:'Bài Huấn luyện mạng; đọc được Python cơ bản.',
 idea:`<p>Dữ liệu trong PyTorch là <b>tensor</b>: mảng nhiều chiều, có <b>shape</b> (kích thước), ví dụ ảnh màu là (batch, 3, cao, rộng). Mô hình được ghép từ các lớp: <code>nn.Linear(10, 2)</code> nhận 10 số, trả 2 số.</p><p>Chọn hàm loss theo bài toán: <b>hồi quy</b> dùng <code>nn.MSELoss</code>; <b>2 lớp với 1 đầu ra</b> dùng <code>nn.BCEWithLogitsLoss</code>; <b>nhiều lớp</b> dùng <code>nn.CrossEntropyLoss</code>, nhận <b>logits</b> (điểm thô, chưa qua softmax) và nhãn là số thứ tự lớp. Vòng huấn luyện luôn có 5 bước:</p><pre>for epoch in range(100):
    outputs = model(X_train)              # 1. tính đầu ra (forward)
    loss = loss_fn(outputs, y_train)      # 2. tính loss
    optimizer.zero_grad()                 # 3. xóa gradient cũ
    loss.backward()                       # 4. lan truyền ngược
    optimizer.step()                      # 5. cập nhật trọng số</pre>`,
 life:'Như làm theo công thức nấu ăn: mỗi dòng code là một bước, thiếu bước hoặc sai thứ tự là hỏng món.',
 tryit:'Xếp mỗi dòng code vào đúng việc mà nó làm. Đọc giải thích khi chọn sai.',
 rem:['Tensor có shape; ảnh trong PyTorch: (batch, kênh, cao, rộng)','nn.Linear(10, 2) có 10×2 + 2 = 22 tham số','Hồi quy: nn.MSELoss. Hai lớp, 1 đầu ra: nn.BCEWithLogitsLoss (nhãn kiểu float)','Nhiều lớp: nn.CrossEntropyLoss nhận LOGITS và nhãn là số lớp (0, 1, 2…)','Vòng huấn luyện: forward → loss → zero_grad() → backward() → step()','Đưa lên GPU: model.to(\'cuda\') (dữ liệu cũng phải .to(\'cuda\'))','Dropout: nn.Dropout(p=0.5)','Dự đoán: model.eval() và with torch.no_grad()','Đóng băng tham số: p.requires_grad_(False)','torch.manual_seed(0) để chạy lại ra cùng kết quả'],
 traps:['Không đưa xác suất đã qua softmax vào nn.CrossEntropyLoss: hàm này tự làm softmax bên trong.','Không có lệnh model.gpu() hay nn.dropout() (chữ thường); đúng là model.to(\'cuda\') và nn.Dropout(p=0.5).'],
 demo:demoTorch,
 deep:`<h4>1. Một bài phân loại cảm xúc hoàn chỉnh</h4>
<p>Văn bản đã được biến thành vector đếm từ (Bag-of-Words) X, nhãn 1 = tích cực, 0 = tiêu cực.</p>
<pre>model = nn.Linear(X_train.shape[1], 1)          # 1 đầu ra cho bài 2 lớp
loss_fn = nn.BCEWithLogitsLoss()                 # sigmoid + log loss gộp sẵn
optimizer = optim.Adam(model.parameters(), lr=0.01)
for epoch in range(100):
    outputs = model(X_train).squeeze()           # shape (N, 1) → (N,)
    loss = loss_fn(outputs, y_train.float())     # nhãn phải là float
    loss.backward()
    optimizer.step()
    optimizer.zero_grad()</pre>
<p>Vì sao đúng: 1 đầu ra + BCEWithLogitsLoss là cặp chuẩn cho 2 lớp. Nếu dùng 2 đầu ra thì phải đi với CrossEntropyLoss và nhãn số nguyên. Dùng MSELoss cho phân loại là sai bài toán. NLLLoss lại cần đầu vào là log-xác suất (sau log_softmax).</p>
<h4>2. Theo dõi shape</h4>
<div class="ex">x có shape (32, 784) (32 ảnh, mỗi ảnh 784 số) → nn.Linear(784, 128) → (32, 128) → ReLU → nn.Linear(128, 10) → (32, 10): mỗi ảnh có 10 điểm cho 10 chữ số. Số tham số: 784×128 + 128 + 128×10 + 10 = <b>101 770</b>.</div>
<h4>3. Lấy đặc trưng từ ResNet đã huấn luyện</h4>
<pre>model = models.resnet50(weights='DEFAULT')   # trọng số học trên ImageNet
for p in model.parameters():
    p.requires_grad_(False)                   # đóng băng
model.fc = torch.nn.Identity()               # bỏ lớp phân loại cuối
features = model(x)                          # vector 2048 số cho mỗi ảnh</pre>
<h4>4. TensorFlow/Keras cũng hay xuất hiện</h4>
<p><code>Conv2D(filters=32, kernel_size=(5,5), strides=(2,2), padding='same')</code> với đầu vào (1, 32, 32, 3) cho đầu ra <b>(1, 16, 16, 32)</b>: <code>padding='same'</code> giữ kích thước khi stride 1, với stride s thì kích thước ra = ⌈n/s⌉. Keras để kênh ở cuối (NHWC), PyTorch để kênh ở thứ hai (NCHW).</p>
<h4>5. Lỗi hay gặp</h4>
<ul><li>Mô hình ở GPU, dữ liệu ở CPU → lỗi "expected all tensors on the same device".</li><li>Quên <code>zero_grad()</code> → gradient cộng dồn qua các bước.</li><li>Quên <code>model.eval()</code> khi dự đoán → Dropout và BatchNorm vẫn chạy chế độ huấn luyện.</li></ul>`},

{id:'go-loi',part:'D',title:'Gỡ lỗi khi huấn luyện: triệu chứng và cách chữa',
 one:'Nhìn đường loss và độ chính xác là đoán được mô hình đang "mắc bệnh" gì và nên chữa thế nào.',
 why:'Gần 20 câu đề 2025 có dạng "nếu thấy hiện tượng X thì nên làm gì ĐẦU TIÊN". Các câu này có quy luật rõ ràng.',
 pre:'Bài Overfitting; bài Huấn luyện mạng.',
 idea:`<p>Mỗi hiện tượng khi huấn luyện có một nguyên nhân hay gặp và một cách chữa nên thử trước:</p><div class="ex"><table class="mini"><tr><th>Triệu chứng</th><th>Nguyên nhân</th><th>Thử đầu tiên</th></tr>
<tr><td>Loss train giảm, loss validation tăng</td><td>Overfitting</td><td>Dropout, weight decay, tăng cường dữ liệu, dừng sớm</td></tr>
<tr><td>Cả train và validation đều kém</td><td>Underfitting</td><td>Mô hình lớn hơn, học lâu hơn, bớt regularization</td></tr>
<tr><td>Loss dao động mạnh, không hội tụ</td><td>Learning rate quá cao</td><td>Giảm learning rate</td></tr>
<tr><td>Loss không giảm ngay từ đầu (η đã nhỏ)</td><td>Lỗi dữ liệu hoặc code</td><td>Kiểm tra quy trình dữ liệu, nhãn, bộ tối ưu</td></tr>
<tr><td>Loss chững lại (plateau)</td><td>Bước đi chưa phù hợp</td><td>Giảm learning rate, hoặc thử SGD</td></tr>
<tr><td>Thêm dropout, validation tụt mạnh</td><td>Dropout quá mạnh</td><td>Giảm xác suất dropout</td></tr>
<tr><td>GPU hết bộ nhớ</td><td>Batch quá lớn</td><td>Giảm batch size, tích lũy gradient</td></tr>
<tr><td>Lớp hiếm gần như không được đoán</td><td>Dữ liệu mất cân bằng</td><td>Hàm loss có trọng số, đo bằng macro-F1</td></tr>
<tr><td>Dự đoán quá chậm</td><td>Mô hình quá nặng</td><td>Mô hình nhỏ hơn (MobileNet), ONNX/TensorRT</td></tr></table></div>`,
 life:'Bác sĩ khám bệnh: nhìn triệu chứng để đoán bệnh, rồi kê thuốc đúng bệnh. Không ai vừa ho đã cho mổ.',
 tryit:'Đọc từng tình huống và chọn cách chữa nên thử ĐẦU TIÊN.',
 rem:['Train tốt, validation kém (khoảng cách lớn) → overfitting','Cả hai đều kém → underfitting','Loss dao động, không hội tụ → learning rate quá cao','Dừng sớm (early stopping) theo dõi loss hoặc accuracy trên tập VALIDATION','Chống overfitting: dropout, weight decay, tăng cường dữ liệu, thêm dữ liệu, mô hình đơn giản hơn','Thêm nhiễu Gaussian vào đầu vào: mô hình bền hơn với nhiễu','Lớp hiếm bị bỏ qua: loss có trọng số hoặc lấy mẫu lại; đo bằng macro-F1, recall','Ảnh hỏng không mở được: bắt lỗi khi đọc và bỏ qua ảnh đó','Triển khai thực tế: chuyển mô hình sang ONNX/TensorRT'],
 traps:['"Đầu tiên" nghĩa là cách đơn giản, rẻ, đúng nguyên nhân. Hiếm khi là "đổi mô hình khác" hay "đặt lại toàn bộ".','Tăng số epoch không chữa được overfitting, chỉ làm nặng thêm.'],
 demo:demoDebug,
 deep:`<h4>1. Đọc đường cong học (learning curves)</h4>
<ul><li>Loss train và loss validation cùng giảm và sát nhau: đang học tốt.</li><li>Loss train tiếp tục giảm nhưng loss validation bắt đầu <b>tăng</b>: từ điểm đó là overfitting. Dừng sớm ở chỗ loss validation thấp nhất.</li><li>Cả hai đều cao và phẳng: underfitting, mô hình quá yếu hoặc học chưa đủ.</li></ul>
<h4>2. Ví dụ với số liệu</h4>
<div class="ex">• Train 99%, validation 70% → <b>overfitting</b>.<br>• Train 60%, validation 58% → <b>underfitting</b>.<br>• Train tăng đều, validation dao động mạnh và không lên → overfitting, hoặc tập validation quá nhỏ hoặc chưa xáo trộn kỹ.</div>
<h4>3. Đọc hai ma trận nhầm lẫn</h4>
<p>Ma trận trên tập train gần như chỉ có số ở đường chéo (đúng gần hết), còn ma trận trên tập test có nhiều số ngoài đường chéo → mô hình <b>quá khớp</b> với tập train.</p>
<h4>4. Dữ liệu mất cân bằng</h4>
<div class="ex">3 lớp có 900, 90 và 10 mẫu. Trọng số lớp hay dùng: w = N/(K·Nₖ). Lớp hiếm: 1000/(3×10) ≈ 33,3; lớp đông: 1000/(3×900) ≈ 0,37. Mỗi lỗi ở lớp hiếm bị phạt nặng gấp khoảng 90 lần.</div>
<h4>5. Các mẹo hay được hỏi</h4>
<ul><li><b>Tăng cường dữ liệu</b> (lật, xoay, cắt ảnh): mục đích chính là giúp mô hình <b>tổng quát hóa tốt hơn</b>.</li><li><b>Thêm nhiễu Gaussian</b> vào đầu vào: tăng độ ổn định và khả năng chống nhiễu.</li><li><b>Xáo trộn dữ liệu</b> sau mỗi epoch: tránh học theo thứ tự mẫu.</li><li>Nhiễu và ngoại lệ trong dữ liệu: dùng <b>regularization</b> để mô hình không cố khớp chúng.</li></ul>`},
{id:'chuyen-giao',part:'E',title:'Học chuyển giao: ResNet, MobileNet, ViT',
 one:'Dùng lại một mô hình đã học trên hàng triệu ảnh, chỉ dạy thêm phần cuối cho việc của mình.',
 why:'Đề 2025 có khoảng 10 câu về mô hình huấn luyện sẵn: trích đặc trưng từ ResNet, đóng băng lớp, fine-tune, chọn MobileNet cho nhanh, lớp cuối của ViT.',
 pre:'Bài CNN: tích chập trên ảnh.',
 idea:`<p>Huấn luyện một CNN tốt từ đầu cần hàng triệu ảnh và rất nhiều GPU. Thay vào đó ta lấy một mô hình đã <b>huấn luyện sẵn</b> (pre-trained) trên ImageNet (1,2 triệu ảnh, 1000 lớp). Các lớp đầu của nó đã biết nhận cạnh, màu, hoa văn: những thứ dùng được cho mọi loại ảnh.</p><p>Hai cách dùng: <b>trích đặc trưng</b> (đóng băng toàn bộ thân mô hình, lấy đầu ra ở lớp <b>gần cuối</b> làm vector đặc trưng, chỉ huấn luyện một lớp phân loại mới) và <b>fine-tune</b> (mở băng thêm vài khối cuối, huấn luyện tiếp với learning rate nhỏ). Dữ liệu càng ít thì càng nên đóng băng nhiều.</p><p>Các kiến trúc hay gặp: <b>ResNet</b> có <b>kết nối tắt</b> cộng đầu vào vào đầu ra mỗi khối, nhờ đó huấn luyện được mạng rất sâu; <b>MobileNet</b> nhẹ, nhanh, hợp điện thoại; <b>ViT</b> (Vision Transformer) cắt ảnh thành các mảnh nhỏ rồi dùng Transformer, lớp cuối là <b>lớp kết nối đầy đủ + softmax</b>.</p>`,
 life:'Một đầu bếp giỏi món Âu chuyển sang nấu món Việt: không cần học lại cách cầm dao, thái rau, chỉ học thêm công thức mới.',
 tryit:'Đọc từng tình huống và chọn chiến lược phù hợp nhất.',
 rem:['Pre-trained: trọng số đã học trên tập lớn (ImageNet). PyTorch: weights=\'DEFAULT\' hoặc pretrained=True','Trích đặc trưng: đóng băng thân, lấy đầu ra lớp gần cuối (avgpool), huấn luyện lớp phân loại mới','ResNet-50: thay model.fc = nn.Identity() thì đầu ra là vector 2048 số','Đóng băng: p.requires_grad_(False). Dữ liệu ít → đóng băng nhiều, chỉ học lớp cuối','Fine-tune: mở thêm vài khối cuối, learning rate nhỏ','ResNet: kết nối tắt cộng x vào đầu ra khối (Add) → chống biến mất gradient','MobileNet: mô hình nhỏ, suy luận nhanh. Cần nhanh hơn → đổi sang mô hình nhỏ hơn','ViT: chia ảnh thành patch → Transformer → lớp kết nối đầy đủ + softmax','Lợi ích: hội tụ nhanh, cần ít dữ liệu, giảm overfit, dùng lại đặc trưng cấp thấp'],
 traps:['Fine-tune KHÔNG xóa được hoàn toàn khác biệt giữa ảnh tự nhiên và ảnh chuyên ngành (ảnh vệ tinh, ảnh y tế).','Vector đặc trưng lấy ở lớp gần cuối, không phải ở đầu ra 1000 lớp của ImageNet.'],
 demo:demoTransfer,
 deep:`<h4>1. Ba chiến lược theo lượng dữ liệu</h4>
<div class="ex"><table class="mini"><tr><th>Tình huống</th><th>Nên làm</th></tr><tr><td>Rất ít ảnh, giống ảnh thường</td><td>Đóng băng hết, chỉ huấn luyện lớp phân loại mới</td></tr><tr><td>Ảnh vừa phải hoặc khác ảnh thường (vệ tinh, X-quang)</td><td>Đóng băng các lớp đầu, fine-tune các khối cuối</td></tr><tr><td>Rất nhiều ảnh</td><td>Fine-tune toàn bộ, hoặc huấn luyện từ đầu</td></tr></table></div>
<h4>2. Khối ResNet và kết nối tắt</h4>
<p>Một khối ResNet tính <span class="fx">y = F(x) + x</span>: phần F gồm Conv → BatchNorm → ReLU (lặp vài lần), cuối cùng <b>cộng</b> đầu vào gốc x vào (lệnh <code>Add()([X_shortcut, X])</code>) rồi qua ReLU. Gradient có thể đi thẳng qua đường "+ x" nên không bị nhân nhỏ dần qua hàng trăm lớp.</p>
<h4>3. Đếm tham số và FLOPs của một khối</h4>
<div class="ex">Khối gồm hai lớp Conv 3×3, mỗi lớp 512 kênh vào, 512 kênh ra, bỏ qua bias.<br>Tham số mỗi lớp: 3 × 3 × 512 × 512 = 2 359 296. Hai lớp: ≈ <b>4,72 triệu</b>.<br>Đầu vào 7×7: mỗi tham số được dùng ở 7 × 7 = 49 vị trí → MACs mỗi lớp = 2 359 296 × 49 ≈ 115,6 triệu; hai lớp ≈ 231 triệu.<br>FLOPs ≈ 2 × MACs ≈ <b>0,46 GFLOPs</b>.</div>
<p>Công thức chung: tham số conv = K × K × C_vào × C_ra (+ C_ra nếu có bias); MACs = tham số × H_ra × W_ra.</p>
<h4>4. MobileNet vì sao nhẹ?</h4>
<p>MobileNet thay mỗi phép tích chập thường bằng hai bước rẻ hơn (tích chập theo từng kênh rồi tích chập 1×1), giảm số phép tính khoảng 8–9 lần. Khi cần suy luận nhanh trên điện thoại hoặc khi mô hình lớn quá chậm, chuyển sang MobileNet; khi triển khai thực tế thì xuất mô hình sang ONNX hoặc TensorRT.</p>
<h4>5. ViT</h4>
<p>Ảnh 224×224 được cắt thành các mảnh 16×16 (196 mảnh). Mỗi mảnh biến thành một vector, cộng thêm mã vị trí, đưa qua các khối Transformer. Thêm một vector đặc biệt [CLS]; đầu ra của nó đi qua <b>lớp kết nối đầy đủ và softmax</b> để ra xác suất các lớp.</p>`},

{id:'phat-hien',part:'E',title:'Phát hiện vật thể: hộp bao, IoU, NMS',
 one:'Không chỉ nói ảnh có gì, mà còn khoanh một hộp quanh từng vật.',
 why:'Đề 2025 có câu tính NMS bằng IoU và câu về hộp neo (anchor box) của SSD.',
 pre:'Bài CNN; tính diện tích hình chữ nhật.',
 idea:`<p>Mô hình phát hiện vật thể trả về nhiều <b>hộp bao</b> (bounding box), mỗi hộp gồm tọa độ góc <span class="fx">(x₁, y₁, x₂, y₂)</span>, tên lớp và <b>điểm tin cậy</b>. Để đo hai hộp chồng nhau bao nhiêu, dùng <b>IoU</b> (Intersection over Union):</p><p><span class="fx">IoU = diện tích phần giao / diện tích phần hợp</span>, với hợp = A + B − giao. IoU = 1 là trùng khít, 0 là không chạm nhau.</p><p>Mô hình thường đề xuất nhiều hộp cho cùng một vật. <b>NMS</b> (Non-Maximum Suppression) lọc bớt: sắp các hộp theo điểm tin cậy giảm dần, giữ hộp cao nhất, xóa mọi hộp có IoU với nó <b>lớn hơn ngưỡng</b>, rồi lặp lại với các hộp còn lại. <b>YOLO</b> và <b>SSD</b> là các mô hình một lượt, chạy nhanh; chúng dùng <b>hộp neo</b> (anchor box): các hộp mẫu với tỉ lệ và kích thước định nghĩa trước.</p>`,
 life:'Camera đếm người qua cổng trường: mỗi người phải có đúng một khung, không được đếm một bạn hai lần.',
 tryit:'Kéo hai hộp để đổi IoU. Sau đó kéo ngưỡng NMS: ngưỡng thấp thì giữ lại mấy hộp, ngưỡng cao thì sao?',
 rem:['Hộp bao: (x₁, y₁) góc trên trái, (x₂, y₂) góc dưới phải','Chiều rộng giao = max(0, min(x₂) − max(x₁)); chiều cao tương tự','IoU = giao / (A + B − giao); nằm trong [0, 1]','NMS: sắp theo độ tin cậy → giữ hộp cao nhất → xóa hộp có IoU > ngưỡng → lặp lại','Ngưỡng NMS thấp → xóa nhiều hộp hơn','Hộp không chồng nhau (IoU = 0) thì luôn được giữ, vì là vật khác','Anchor box: hộp mẫu có sẵn tỉ lệ, kích thước (SSD, YOLO)','Phân loại: ảnh có gì. Phát hiện: có gì và ở đâu (hộp). Phân đoạn: từng điểm ảnh'],
 traps:['Phần hợp là A + B − giao, không phải A + B.','Hộp nằm trọn trong hộp khác vẫn có IoU nhỏ hơn 1 (trừ khi trùng khít).'],
 demo:demoIoU,
 deep:`<h4>1. Tính IoU từng bước</h4>
<div class="ex">B₁ = (0, 0, 100, 100), B₂ = (10, 10, 90, 90).<br>Giao: x từ max(0, 10) = 10 đến min(100, 90) = 90 → rộng 80; y tương tự → cao 80. Giao = 6400.<br>A = 100 × 100 = 10 000; B = 80 × 80 = 6400; hợp = 10 000 + 6400 − 6400 = 10 000.<br>IoU = 6400 / 10 000 = <b>0,64</b>.</div>
<div class="ex">B₁ = (0, 0, 100, 100), B₃ = (105, 105, 200, 200): x từ 105 đến 100 → rộng âm → giao = 0 → <b>IoU = 0</b>.</div>
<h4>2. Chạy NMS tay</h4>
<div class="ex">Ngưỡng 0,40; các hộp đã sắp theo độ tin cậy: B₁ (0,95), B₂ (0,90), B₃ (0,85).<br>• Giữ B₁. IoU(B₁, B₂) = 0,64 &gt; 0,40 → xóa B₂. IoU(B₁, B₃) = 0 → còn B₃.<br>• Giữ B₃. Hết hộp.<br>Kết quả: <b>B₁ và B₃</b>.</div>
<h4>3. Một ví dụ chồng một phần</h4>
<div class="ex">A = (0, 0, 4, 4), B = (2, 2, 6, 6). Giao: rộng 4 − 2 = 2, cao 2 → 4. Hợp = 16 + 16 − 4 = 28. IoU = 4/28 ≈ <b>0,14</b>.</div>
<h4>4. Đánh giá mô hình phát hiện</h4>
<p>Một hộp dự đoán được tính là <b>đúng</b> nếu đúng lớp và IoU với hộp thật ≥ một ngưỡng (thường 0,5). Từ đó tính precision, recall như bài Đánh giá; chỉ số tổng hợp hay dùng là <b>mAP</b> (mean Average Precision).</p>
<h4>5. Một lượt hay hai lượt</h4>
<p><b>YOLO, SSD</b>: một mạng nhìn ảnh một lần, dự đoán hộp và lớp cùng lúc → nhanh, hợp video. <b>Faster R-CNN</b>: đề xuất vùng trước, phân loại sau → thường chính xác hơn nhưng chậm hơn.</p>`},

{id:'phan-doan',part:'E',title:'Phân đoạn ảnh: U-Net, Dice và Focal loss',
 one:'Tô màu từng điểm ảnh: điểm nào thuộc vật, điểm nào là nền.',
 why:'Đề 2025 hỏi U-Net ghép đặc trưng theo chiều nào, và hàm loss nào hợp khi vật cần tìm rất nhỏ so với nền.',
 pre:'Bài CNN; bài Đánh giá (dữ liệu mất cân bằng).',
 idea:`<p>Ba mức hiểu ảnh: <b>phân loại</b> (ảnh có gì), <b>phát hiện</b> (có gì, ở đâu, bằng hộp), <b>phân đoạn</b> (từng điểm ảnh thuộc lớp nào). Đầu ra của phân đoạn là một "mặt nạ" (mask) cùng kích thước ảnh.</p><p><b>U-Net</b> có hình chữ U: nửa trái là <b>bộ mã hóa</b> (encoder) thu nhỏ ảnh để hiểu "cái gì"; nửa phải là <b>bộ giải mã</b> (decoder) phóng to lại để biết "ở đâu". Các <b>kết nối tắt</b> lấy đặc trưng chi tiết từ encoder <b>nối (concatenate) theo chiều kênh</b> vào decoder, giúp giữ đường viền sắc nét.</p><p>Khi vật chỉ chiếm 2% ảnh, mô hình "đoán toàn nền" vẫn đúng 98% điểm ảnh. Vì vậy thay cross-entropy thường bằng <b>Dice loss</b> hoặc <b>Focal loss</b>, tập trung vào vùng vật nhỏ.</p>`,
 life:'Tô màu tranh: phải tô đúng từng ô trong đường viền, không chỉ khoanh một cái khung quanh con vật.',
 tryit:'Kéo kích thước vùng dự đoán. Vì sao "đoán toàn nền" có độ chính xác theo điểm ảnh rất cao mà Dice bằng 0?',
 rem:['Phân đoạn: dự đoán lớp cho TỪNG điểm ảnh','U-Net: encoder thu nhỏ, decoder phóng to (upsampling)','Kết nối tắt U-Net: NỐI (concatenate) theo chiều KÊNH. ResNet: CỘNG','PyTorch (N, C, H, W): torch.cat([a, b], dim=1). Keras (N, H, W, C): Concatenate(axis=-1)','Dice = 2|A ∩ B| / (|A| + |B|); IoU = |A ∩ B| / |A ∪ B|','Vật nhỏ, nền lớn (mất cân bằng) → Dice loss hoặc Focal loss','Độ chính xác theo điểm ảnh đánh lừa khi vật rất nhỏ'],
 traps:['Kết nối tắt U-Net không phải phép cộng và không nối theo chiều batch.','Accuracy 98% trên phân đoạn chưa chắc tốt: có thể mô hình đoán toàn nền.'],
 demo:demoSeg,
 deep:`<h4>1. Tính Dice và IoU</h4>
<div class="ex">Vùng thật A có 100 điểm ảnh, vùng dự đoán B có 80 điểm, trùng nhau 60 điểm.<br>Dice = 2 × 60 / (100 + 80) = 120/180 ≈ <b>0,67</b>.<br>IoU = 60 / (100 + 80 − 60) = 60/120 = <b>0,5</b>.<br>Liên hệ: Dice = 2·IoU/(1 + IoU) = 1/1,5 ≈ 0,67.</div>
<h4>2. Vì sao cần Dice hoặc Focal loss?</h4>
<div class="ex">Ảnh 100 × 100 = 10 000 điểm; khối u chỉ có 200 điểm. Mô hình đoán toàn bộ là nền: đúng 9800/10 000 = <b>98%</b> điểm ảnh, nhưng Dice = 0 vì không tìm được điểm nào của khối u.</div>
<p><b>Dice loss</b> = 1 − Dice, chỉ quan tâm vùng vật nên không bị nền áp đảo. <b>Focal loss</b> giảm trọng số các điểm ảnh dễ (nền rõ ràng), dồn sức học các điểm khó.</p>
<h4>3. Theo dõi kích thước trong U-Net</h4>
<div class="ex">Encoder: 128×128×64 → (pool) 64×64×128 → 32×32×256.<br>Decoder: phóng 32×32×256 lên 64×64×128, rồi nối với đặc trưng encoder 64×64×128 theo chiều kênh → <b>64×64×256</b>, sau đó tích chập để giảm kênh.</div>
<h4>4. Nối và cộng khác nhau thế nào?</h4>
<p><b>Nối</b> (concatenate) đặt hai khối đặc trưng cạnh nhau theo chiều kênh: 128 + 128 = 256 kênh, giữ nguyên cả hai nguồn thông tin. <b>Cộng</b> (ResNet) đòi hai khối cùng kích thước và trộn chúng thành một. Nối theo chiều batch là sai, vì sẽ biến thành hai ảnh khác nhau.</p>`},
{id:'van-ban',part:'F',title:'Xử lý văn bản: từ câu chữ đến con số',
 one:'Máy chỉ tính được với số. Muốn máy hiểu văn bản, trước hết phải làm sạch câu chữ rồi biến chúng thành vector.',
 why:'Đề 2025 hỏi thứ tự các bước xử lý văn bản, mục đích bỏ từ dừng, Bag-of-Words và TF-IDF. Vòng 2 năm 2025 cũng có bài phân loại văn bản.',
 pre:'Bài Dữ liệu, đặc trưng và nhãn; bài Vector.',
 idea:`<p>Các bước xử lý văn bản cơ bản, theo thứ tự hay dùng:</p><ol><li><b>Chuẩn hóa</b> (normalization): chữ thường, bỏ dấu câu, sửa khoảng trắng.</li><li><b>Tách từ</b> (tokenization): cắt câu thành các token. Tiếng Việt cần tách từ ghép: "học sinh" là một từ.</li><li><b>Gán nhãn từ loại</b> (POS tagging): danh từ, động từ… cần từ còn nguyên dạng.</li><li><b>Rút gọn từ</b> (stemming, lemmatization): "playing", "played" → "play".</li></ol><p>Thường bỏ thêm <b>từ dừng</b> (stopwords) như "là", "và", "the", "of": từ xuất hiện khắp nơi mà ít mang nội dung. Sau đó biến văn bản thành vector: <b>Bag-of-Words</b> đếm số lần mỗi từ xuất hiện; <b>TF-IDF</b> tăng trọng số từ hiếm, giảm trọng số từ xuất hiện ở mọi văn bản.</p>`,
 life:'Trước khi chấm bài văn, cô giáo đọc lướt bỏ qua các từ nối, chú ý các từ khóa quan trọng: đó là ý tưởng của bỏ từ dừng và TF-IDF.',
 tryit:'Gõ một câu tiếng Anh hoặc tiếng Việt và xem từng bước biến đổi. So sánh vector Bag-of-Words và TF-IDF của ba câu.',
 rem:['Thứ tự cơ bản: chuẩn hóa → tách từ → gán nhãn từ loại → rút gọn từ','Bỏ từ dừng: giảm độ phức tạp, tập trung vào từ mang nội dung','Stemming: cắt đuôi từ thô (studies → studi). Lemmatization: về dạng gốc đúng (studies → study)','Bag-of-Words: vector đếm số lần mỗi từ; mất thứ tự từ','TF-IDF: tf × idf, với idf = log(N / số văn bản chứa từ đó)','Từ xuất hiện ở mọi văn bản có idf = log(1) = 0','n-gram: nhóm n từ liền nhau ("không thích" là 2-gram) giữ lại một chút thứ tự','BoW và TF-IDF không hiểu ngữ cảnh; muốn hiểu ngữ cảnh dùng mô hình attention như BERT'],
 traps:['Bỏ từ dừng không nhằm tạo câu hoàn chỉnh hơn; mục đích là tập trung vào từ quan trọng.','Với phân tích cảm xúc, từ "không" có thể rất quan trọng: đừng bỏ nó như một từ dừng.'],
 demo:demoText,
 deep:`<h4>1. Một câu đi qua từng bước</h4>
<div class="ex">Gốc: "The cats are playing in the garden!"<br>Chuẩn hóa: "the cats are playing in the garden"<br>Tách từ: [the, cats, are, playing, in, the, garden]<br>Gán từ loại: the/DT cats/NNS are/VBP playing/VBG in/IN the/DT garden/NN<br>Bỏ từ dừng: [cats, playing, garden]<br>Rút gọn: [cat, play, garden]</div>
<p>Gán từ loại cần đặt <b>trước</b> rút gọn: "playing" và "play" có thể khác từ loại; cắt đuôi rồi thì mất thông tin đó.</p>
<h4>2. Bag-of-Words</h4>
<div class="ex">Từ điển: [mèo, ăn, cá, chó, xương, ngủ]<br>d₁ "mèo ăn cá" → [1, 1, 1, 0, 0, 0]<br>d₂ "chó ăn xương" → [0, 1, 0, 1, 1, 0]<br>d₃ "mèo ngủ" → [1, 0, 0, 0, 0, 1]</div>
<p>Trong Python: <code>CountVectorizer().fit_transform(texts)</code>. BoW không biết thứ tự: "chó cắn mèo" và "mèo cắn chó" có cùng vector.</p>
<h4>3. TF-IDF tính tay</h4>
<div class="ex">N = 3 văn bản, dùng log cơ số 10.<br>"ăn" có trong 2 văn bản → idf = log(3/2) ≈ 0,18.<br>"cá" chỉ có trong 1 văn bản → idf = log(3/1) ≈ 0,48.<br>Trong d₁, "cá" (0,48) nặng hơn "ăn" (0,18): "cá" mới là từ đặc trưng của d₁.</div>
<h4>4. Hạn chế và bước tiếp theo</h4>
<p>BoW và TF-IDF cho vector rất dài (bằng số từ trong từ điển), gần như toàn số 0, và không biết hai từ có nghĩa gần nhau ("vui", "hạnh phúc"). Bài sau, <b>nhúng từ</b>, giải quyết vấn đề này. Muốn hiểu ngữ cảnh cả câu thì dùng mô hình dựa trên attention như BERT.</p>`},

{id:'nhung-tu',part:'F',title:'Nhúng từ: Word2Vec, GloVe và độ tương đồng cosine',
 one:'Biến mỗi từ thành một vector ngắn sao cho các từ có nghĩa gần nhau thì nằm gần nhau.',
 why:'Đề 2025 hỏi GloVe được tạo thế nào, CBOW học gì, lấy mẫu phủ định để làm gì, cách tải Word2Vec bằng gensim, và có câu tính cosine để tìm từ gần nhất.',
 pre:'Bài Vector (tích vô hướng, cosine); bài Xử lý văn bản.',
 idea:`<p>Vector <b>one-hot</b> có độ dài bằng cả từ điển (50 000 số), chỉ một số 1, và mọi cặp từ đều "xa nhau như nhau". <b>Nhúng từ</b> (word embedding) thay bằng vector ngắn (100–300 số) học từ dữ liệu: từ hay xuất hiện trong cùng ngữ cảnh thì có vector gần nhau.</p><p><b>Word2Vec</b> có hai cách học: <b>CBOW</b> dùng các từ xung quanh để đoán <b>từ ở giữa</b>; <b>Skip-gram</b> dùng từ ở giữa để đoán các từ xung quanh. Để khỏi tính xác suất trên cả từ điển, dùng <b>lấy mẫu phủ định</b> (negative sampling): chỉ so với vài từ <b>chọn ngẫu nhiên</b> từ từ điển, giúp <b>giảm chi phí tính toán</b>. <b>GloVe</b> học từ <b>ma trận đồng xuất hiện toàn cục</b> (đếm cặp từ đi cùng nhau trên cả kho văn bản).</p><p>Độ giống nhau giữa hai từ đo bằng <b>cosine similarity</b>: <span class="fx">cos = A·B / (|A|·|B|)</span>.</p>`,
 life:'Trên bản đồ, các quán cà phê hay nằm gần trường học. Nhúng từ là "bản đồ" của từ ngữ: từ hay đi cùng nhau thì đứng gần nhau.',
 tryit:'Bấm vào hai từ để xem cosine. Từ nào gần "mèo" nhất? Thử phép tính vua − đàn ông + phụ nữ.',
 rem:['One-hot: dài bằng từ điển, mọi cặp từ có tích vô hướng 0','Embedding: vector ngắn, từ gần nghĩa thì gần nhau','CBOW: ngữ cảnh → từ ở giữa. Skip-gram: từ ở giữa → ngữ cảnh','Negative sampling: chọn ngẫu nhiên vài từ trong từ điển (theo một phân phối cố định) làm mẫu âm; mục đích giảm chi phí tính toán','GloVe: học từ ma trận đồng xuất hiện toàn cục','fastText: học cả các mảnh từ, đoán được vector cho từ chưa gặp','gensim: KeyedVectors.load_word2vec_format(path) để tải vector có sẵn','Cosine gần 1: cùng hướng (giống nghĩa); gần 0: không liên quan','Word2Vec, GloVe cho mỗi từ một vector cố định; BERT cho vector thay đổi theo ngữ cảnh'],
 traps:['Mẫu âm không phải các từ giống nghĩa hay các từ đứng gần; chúng được chọn ngẫu nhiên.','CBOW đoán từ giữa từ ngữ cảnh; ngược lại là Skip-gram.'],
 demo:demoEmbed,
 deep:`<h4>1. Cửa sổ ngữ cảnh</h4>
<div class="ex">Câu "con mèo ăn con cá", cửa sổ 1, từ giữa "ăn": ngữ cảnh là "mèo" và "con".<br>CBOW: (mèo, con) → đoán "ăn". Skip-gram: "ăn" → đoán "mèo" và "con".</div>
<h4>2. Vì sao cần lấy mẫu phủ định?</h4>
<p>Muốn tính xác suất từ đúng bằng softmax, phải tính điểm cho <b>cả 50 000 từ</b> ở mỗi bước, rất tốn. Lấy mẫu phủ định đổi thành bài toán nhỏ: phân biệt cặp (từ, ngữ cảnh) thật với khoảng 5 cặp giả, trong đó từ giả được rút ngẫu nhiên (từ phổ biến dễ được rút hơn, theo tần suất mũ 0,75). Mỗi bước chỉ còn 6 phép tính thay vì 50 000.</p>
<h4>3. Tính cosine tìm từ gần nhất</h4>
<div class="ex">w₁ = [0.8, 0.6, 0.0, 0.2], w₂ = [0.9, 0.5, 0.1, 0.3], w₃ = [0.0, 0.1, 0.9, 0.3].<br>w₁·w₂ = 0.72 + 0.30 + 0 + 0.06 = 1.08; |w₁| = √1.04 ≈ 1.020; |w₂| = √1.16 ≈ 1.077 → cos ≈ 1.08/1.099 ≈ <b>0.98</b>.<br>w₁·w₃ = 0 + 0.06 + 0 + 0.06 = 0.12; |w₃| = √0.91 ≈ 0.954 → cos ≈ 0.12/0.973 ≈ <b>0.12</b>.<br>Từ gần w₁ nhất là <b>w₂</b>.</div>
<h4>4. Phép tính với từ</h4>
<p>Vector có cấu trúc: <span class="fx">vua − đàn ông + phụ nữ ≈ hoàng hậu</span>; <span class="fx">Hà Nội − Việt Nam + Nhật Bản ≈ Tokyo</span>. Hướng "đàn ông → phụ nữ" gần như giống hướng "vua → hoàng hậu".</p>
<h4>5. Dùng trong Python</h4>
<pre>from gensim.models import KeyedVectors
wv = KeyedVectors.load_word2vec_format("vectors.bin", binary=True)
wv.most_similar("king", topn=3)
wv.similarity("cat", "dog")</pre>
<h4>6. Giới hạn</h4>
<p>Mỗi từ chỉ có <b>một</b> vector, nên "đường" (đường ăn, đường phố) bị gộp nghĩa. Mô hình như BERT tạo vector <b>theo ngữ cảnh</b> từng câu, giải quyết được điều này.</p>`},

{id:'bert-gpt',part:'F',title:'BERT và GPT: hai kiểu Transformer',
 one:'BERT đọc cả câu hai chiều để hiểu; GPT đọc từ trái sang phải để viết tiếp.',
 why:'Đề 2025 hỏi đầu vào của BERT, cách fine-tune BERT để phân loại, BertTokenizer trả về gì, và nên dùng mô hình nào để sinh câu trả lời.',
 pre:'Bài Transformer: attention và vị trí; bài Nhúng từ.',
 idea:`<p>Transformer có hai nửa. <b>BERT</b> chỉ dùng phần <b>encoder</b>: mỗi từ nhìn được cả bên trái và bên phải, nên giỏi <b>hiểu</b> văn bản (phân loại, tìm câu trả lời trong đoạn văn). BERT được huấn luyện bằng cách che bớt từ rồi đoán từ bị che.</p><p><b>GPT</b> chỉ dùng phần <b>decoder</b> với attention có mặt nạ: mỗi từ chỉ nhìn các từ phía trước, và được huấn luyện để <b>đoán từ tiếp theo</b>, nên giỏi <b>sinh</b> văn bản. Mô hình dịch như T5, MarianMT dùng cả encoder lẫn decoder.</p><p>Đầu vào của BERT do tokenizer tạo ra: <b>input_ids</b> (mã số các token), <b>attention_mask</b> (1 = token thật, 0 = phần đệm) và <b>token_type_ids</b> (câu thứ nhất hay thứ hai). Muốn phân loại văn bản, giữ thân BERT và <b>thêm một lớp phân loại</b> lên vector của token [CLS], rồi fine-tune.</p>`,
 life:'BERT như người đọc hiểu: đọc hết đoạn văn rồi trả lời. GPT như người kể chuyện: nghe câu mở đầu rồi kể tiếp từng chữ.',
 tryit:'Nhập một câu và độ dài tối đa. Xem tokenizer thêm [CLS], [SEP], [PAD] và tạo attention_mask thế nào.',
 rem:['BERT: encoder, nhìn hai chiều, giỏi hiểu (phân loại, hỏi đáp trích đoạn)','GPT: decoder, nhìn một chiều (trái → phải), đoán từ tiếp theo, giỏi sinh văn bản','Đầu vào BERT: input_ids, attention_mask, token_type_ids','Token đặc biệt: [CLS] đầu câu, [SEP] cuối câu, [PAD] để đệm','attention_mask: 1 cho token thật, 0 cho [PAD]','tokenizer.encode_plus() hoặc tokenizer(...) trả về input_ids, attention_mask; hỗ trợ batch, đệm, cắt bớt','Fine-tune BERT phân loại: thay/thêm lớp cuối bằng một lớp phân loại','Cần hiểu ngữ cảnh hơn từ khóa → dùng mô hình dựa trên attention như BERT','Sinh câu trả lời từ một đoạn văn → GPT-3.5/GPT-4 với lời nhắc phù hợp'],
 traps:['BERT không nhận văn bản thô trực tiếp: văn bản phải qua tokenizer thành input_ids và attention_mask.','BERT không chỉ dùng cho tiếng Anh: có bản đa ngôn ngữ và bản tiếng Việt (PhoBERT).'],
 demo:demoBert,
 deep:`<h4>1. Tokenizer làm gì?</h4>
<div class="ex">Câu: "I love this movie", độ dài tối đa 8.<br>Token: [CLS] i love this movie [SEP] [PAD] [PAD]<br>input_ids: [101, 1045, 2293, 2023, 3185, 102, 0, 0]<br>attention_mask: [1, 1, 1, 1, 1, 1, 0, 0]</div>
<p>BERT tách từ thành các mảnh (WordPiece): từ lạ "playing" có thể thành "play" + "##ing", nhờ vậy không có từ nào "không biết".</p>
<pre>from transformers import BertTokenizer, BertForSequenceClassification
tok = BertTokenizer.from_pretrained("bert-base-uncased")
enc = tok(["I love it", "Terrible service"], padding=True, truncation=True, return_tensors="pt")
model = BertForSequenceClassification.from_pretrained("bert-base-uncased", num_labels=2)
out = model(**enc)       # out.logits có shape (2, 2)</pre>
<h4>2. BERT học bằng cách nào?</h4>
<p><b>Che từ</b> (masked language model): che ngẫu nhiên khoảng 15% token, mô hình phải đoán lại, nhìn được cả hai phía. Đây là <b>học tự giám sát</b>: nhãn lấy từ chính văn bản, không cần người gán.</p>
<h4>3. GPT sinh văn bản thế nào?</h4>
<p>Cho đoạn mở đầu, GPT tính xác suất cho token tiếp theo, chọn một token, nối vào, rồi lặp lại. Mặt nạ attention đảm bảo lúc học, từ thứ t chỉ thấy các từ trước nó, không "nhìn trộm" đáp án.</p>
<h4>4. Chọn mô hình theo việc</h4>
<div class="ex"><table class="mini"><tr><th>Việc</th><th>Mô hình hợp</th></tr><tr><td>Phân loại cảm xúc, chủ đề</td><td>BERT (encoder) + lớp phân loại</td></tr><tr><td>Tìm câu trả lời nằm sẵn trong đoạn văn</td><td>BERT hỏi đáp</td></tr><tr><td>Viết câu trả lời, tóm tắt, trò chuyện</td><td>GPT (decoder)</td></tr><tr><td>Dịch máy</td><td>Encoder–decoder (T5, MarianMT)</td></tr></table></div>`},

{id:'llm',part:'F',title:'Mô hình ngôn ngữ lớn và cách dùng',
 one:'ChatGPT và các mô hình ngôn ngữ lớn học đoán từ tiếp theo trên lượng văn bản khổng lồ.',
 why:'Đề 2025 hỏi LLM là gì, kỹ thuật Chain-of-Thought, hạn chế khi fine-tune cả mô hình GPT, và LangChain dùng để làm gì. Vòng 2 cũng cho dùng một LLM chạy offline.',
 pre:'Bài BERT và GPT.',
 idea:`<p><b>Mô hình ngôn ngữ lớn</b> (LLM) là mô hình học sâu (thường là Transformer decoder như GPT) được huấn luyện trên lượng văn bản rất lớn để <b>đoán từ tiếp theo</b>. Sau đó được dạy thêm để làm theo hướng dẫn và trò chuyện hữu ích.</p><p>Cách dùng LLM bằng <b>lời nhắc</b> (prompt): nói rõ nhiệm vụ, cho vài ví dụ mẫu (few-shot). Với bài toán nhiều bước, <b>Chain-of-Thought</b> (chuỗi suy luận) yêu cầu mô hình <b>viết ra từng bước trung gian</b> trước khi trả lời, nên giải đúng hơn. LLM có thể "bịa" thông tin (hallucination); cách giảm là đưa tài liệu liên quan vào lời nhắc (RAG).</p><p><b>Fine-tune toàn bộ</b> một mô hình GPT cần <b>tài nguyên tính toán rất lớn</b>; vì vậy hay dùng <b>LoRA</b> hoặc adapter: chỉ học thêm vài ma trận nhỏ. <b>LangChain</b> là thư viện để <b>kết nối và xây dựng quy trình</b> cho tác nhân LLM (LLM agent): gọi công cụ, tìm tài liệu, nhiều bước nối nhau.</p>`,
 life:'Hỏi một người bạn giỏi toán: nếu bắt trả lời ngay thì dễ nhầm; nếu bảo "giải từng bước ra giấy" thì đúng hơn hẳn. Đó là Chain-of-Thought.',
 tryit:'Kéo nhiệt độ (temperature) để xem xác suất từ tiếp theo thay đổi thế nào. Bật Chain-of-Thought để so sánh hai câu trả lời.',
 rem:['LLM: mô hình học sâu huấn luyện trên lượng lớn văn bản để đoán từ (token) tiếp theo','Token: mảnh văn bản (từ hoặc một phần từ)','Temperature thấp → câu trả lời chắc chắn, lặp lại; cao → đa dạng, sáng tạo hơn','Few-shot: đưa vài ví dụ mẫu trong lời nhắc','Chain-of-Thought: yêu cầu liệt kê từng bước suy luận trung gian','Hallucination: mô hình nói sai một cách tự tin. RAG: tìm tài liệu rồi đưa vào lời nhắc','Fine-tune toàn bộ GPT: tốn tài nguyên rất lớn. LoRA, adapter: chỉ học thêm phần nhỏ','LangChain: xây quy trình, kết nối LLM với công cụ (LLM agent pipeline)'],
 traps:['Chain-of-Thought không phải "trả lời càng ngắn càng tốt"; ngược lại, bắt mô hình viết ra các bước.','Hạn chế lớn nhất khi fine-tune toàn bộ GPT là chi phí tính toán, không phải "không dùng được tiếng Việt".'],
 demo:demoLLM,
 deep:`<h4>1. Ba giai đoạn tạo ra một trợ lý như ChatGPT</h4>
<ol><li><b>Huấn luyện trước</b> (pre-training): đọc hàng nghìn tỉ token, học đoán token tiếp theo. Đây là học tự giám sát.</li><li><b>Tinh chỉnh theo hướng dẫn</b> (instruction tuning): học từ các cặp câu hỏi – câu trả lời mẫu.</li><li><b>Học từ phản hồi của con người</b> (RLHF): người chấm câu trả lời tốt hay dở, mô hình học để được chấm cao.</li></ol>
<h4>2. Ví dụ Chain-of-Thought</h4>
<div class="ex">Câu hỏi: "Lớp có 35 bạn, 3/5 là nữ. Mỗi bạn nữ trồng 2 cây, mỗi bạn nam trồng 3 cây. Cả lớp trồng bao nhiêu cây?"<br>Trả lời ngay: "100" (sai).<br>Có từng bước: số nữ = 35 × 3/5 = 21; số nam = 14; số cây = 21 × 2 + 14 × 3 = 42 + 42 = <b>84</b>.</div>
<p>Lời nhắc chỉ cần thêm: "Hãy suy luận từng bước."</p>
<h4>3. Nhiệt độ</h4>
<p>Mô hình cho mỗi token một điểm, chia điểm cho temperature T rồi đưa qua softmax. T nhỏ (0,2) làm token điểm cao nhất gần như chắc chắn được chọn; T lớn (1,5) làm các xác suất đều nhau hơn.</p>
<h4>4. Fine-tune toàn bộ hay LoRA?</h4>
<div class="ex">Mô hình 7 tỉ tham số: fine-tune toàn bộ phải lưu gradient và trạng thái bộ tối ưu cho cả 7 tỉ số, cần nhiều GPU lớn. LoRA giữ nguyên mô hình, chỉ học thêm hai ma trận nhỏ ở mỗi lớp (thường dưới 1% số tham số).</div>
<h4>5. Tác nhân (agent) và LangChain</h4>
<p>Một tác nhân LLM có thể tự quyết định gọi công cụ: máy tính, tìm kiếm, đọc tài liệu, chạy code, rồi dùng kết quả để trả lời. LangChain cung cấp các khối để ghép những bước đó thành một quy trình (chain).</p>`},

{id:'sinh',part:'G',title:'Mô hình sinh và học tự giám sát',
 one:'Không chỉ phân loại, AI còn có thể tạo ra ảnh, chữ, âm thanh mới.',
 why:'Đề 2025 có khoảng 7 câu về GAN, autoencoder, Stable Diffusion, DALL·E, học tự giám sát và học tương phản.',
 pre:'Bài Mạng nơ-ron; bài CNN.',
 idea:`<p><b>Autoencoder</b> (bộ tự mã hóa) nén ảnh qua một "nút cổ chai" nhỏ rồi dựng lại; nó học giữ lại thông tin quan trọng nhất. <b>GAN</b> gồm hai mạng đấu với nhau: <b>bộ tạo</b> (generator) tạo ảnh giả từ nhiễu, <b>bộ phân biệt</b> (discriminator) đoán ảnh thật hay giả; cả hai cùng giỏi lên.</p><p><b>Mô hình khuếch tán</b> (diffusion) học cách <b>khử nhiễu</b>: thêm nhiễu dần vào ảnh cho đến khi thành nhiễu hoàn toàn, rồi học đi ngược lại. Stable Diffusion và DALL·E <b>sinh ảnh từ mô tả văn bản</b>.</p><p><b>Học tự giám sát</b> tự tạo nhãn từ chính dữ liệu, không cần người gán. Ví dụ <b>học tương phản</b> (contrastive learning): hai phiên bản biến đổi (cắt, xoay, đổi màu) của <b>cùng một ảnh</b> phải có biểu diễn <b>gần nhau</b>, còn ảnh khác nhau thì <b>xa nhau</b>.</p>`,
 life:'GAN như cuộc thi giữa người làm tiền giả và cảnh sát: kẻ làm giả càng tinh vi, cảnh sát càng phải tinh mắt, và ngược lại.',
 tryit:'Ghép mỗi mô tả với đúng loại mô hình.',
 rem:['Autoencoder: encoder → nút cổ chai → decoder, học dựng lại đầu vào','Ảnh dựng lại bị mờ: nút cổ chai quá nhỏ hoặc regularization quá mạnh','GAN = bộ tạo (generator) + bộ phân biệt (discriminator)','GAN tạo ảnh xám, giống hệt nhau: mất cân bằng giữa hai mạng (mode collapse)','Diffusion: thêm nhiễu rồi học khử nhiễu; Stable Diffusion là mô hình khuếch tán','DALL·E: sinh ảnh từ mô tả văn bản','CLIP: học ghép ảnh với câu mô tả (học đa phương thức)','Học tự giám sát: nhãn lấy từ chính dữ liệu (che từ, ghép ảnh biến đổi)','Học tương phản: cùng ảnh gốc → gần nhau; ảnh khác → xa nhau; dùng tăng cường dữ liệu + contrastive loss'],
 traps:['Stable Diffusion là mô hình khuếch tán, không phải GAN.','Học tự giám sát không cần gán nhãn thủ công; nó không giống phân cụm.'],
 demo:demoGen,
 deep:`<h4>1. Autoencoder</h4>
<div class="ex">Ảnh 28×28 = 784 số → encoder → <b>32 số</b> (biểu diễn ẩn) → decoder → 784 số. Hàm loss so ảnh dựng lại với ảnh gốc (ví dụ MSE).</div>
<p>Nếu nút cổ chai quá nhỏ (chỉ 2 số) hoặc phạt quá mạnh, mô hình buộc phải bỏ chi tiết, ảnh ra <b>mờ</b>. Biến thể <b>VAE</b> làm không gian ẩn trơn tru để có thể lấy mẫu ra ảnh mới.</p>
<h4>2. GAN học thế nào?</h4>
<ol><li>Bộ tạo G nhận nhiễu ngẫu nhiên, tạo ảnh giả.</li><li>Bộ phân biệt D nhận lẫn ảnh thật và ảnh giả, học đoán đúng.</li><li>G học để D bị lừa (đoán ảnh giả là thật).</li></ol>
<p>Nếu D quá mạnh, G không nhận được tín hiệu hữu ích; nếu G tìm được một kiểu ảnh lừa được D, nó sinh mãi một kiểu đó (<b>mode collapse</b>), có khi chỉ là ảnh xám. Cách chữa: cân bằng tốc độ học của hai mạng.</p>
<h4>3. Diffusion</h4>
<p>Bước thuận: thêm một chút nhiễu Gaussian, lặp vài trăm lần đến khi ảnh thành nhiễu thuần. Mô hình học bước ngược: nhìn ảnh có nhiễu, đoán phần nhiễu để trừ đi. Khi sinh ảnh, bắt đầu từ nhiễu thuần rồi khử dần. Stable Diffusion làm việc này trong không gian nén và dùng mô tả văn bản để điều khiển.</p>
<h4>4. Học tương phản (contrastive)</h4>
<div class="ex">Một batch có 4 ảnh. Mỗi ảnh tạo 2 bản biến đổi → 8 ảnh. Với mỗi ảnh, bản biến đổi còn lại của nó là "cặp dương" (kéo lại gần), 6 ảnh kia là "cặp âm" (đẩy ra xa).</div>
<p>Sau khi học xong không cần nhãn, biểu diễn này dùng để phân loại chỉ với ít ảnh có nhãn.</p>
<h4>5. Bảng tóm tắt</h4>
<div class="ex"><table class="mini"><tr><th>Mô hình</th><th>Ý chính</th><th>Ví dụ</th></tr><tr><td>Autoencoder</td><td>Nén rồi dựng lại</td><td>Khử nhiễu ảnh</td></tr><tr><td>GAN</td><td>Tạo ra đấu với phân biệt</td><td>Ảnh mặt người giả</td></tr><tr><td>Diffusion</td><td>Học khử nhiễu dần</td><td>Stable Diffusion, DALL·E</td></tr><tr><td>Tự giám sát</td><td>Nhãn từ chính dữ liệu</td><td>BERT, học tương phản</td></tr></table></div>`}

const LX={
'ai-la-gi':{
deep:`<h4>1. Ba vòng tròn lồng nhau</h4>
<p>Hãy hình dung ba vòng tròn: vòng to nhất là <b>AI</b> (mọi cách làm máy "thông minh"), bên trong là <b>học máy</b> (máy tự học từ dữ liệu), trong cùng là <b>học sâu</b> (học máy dùng mạng nơ-ron nhiều lớp). Mọi hệ học sâu đều là học máy, mọi hệ học máy đều là AI, nhưng chiều ngược lại thì không.</p>
<h4>2. Cùng một bài toán, hai cách làm</h4>
<p>Bài toán: lọc thư rác.</p>
<ul><li><b>Viết luật:</b> người lập trình liệt kê "có chữ <i>trúng thưởng</i>, <i>miễn phí</i>, <i>bấm ngay</i> thì là rác". Dễ hiểu, nhưng kẻ gửi rác chỉ cần viết "tr.úng th.ưởng" là lọt. Người lập trình phải sửa luật mãi.</li>
<li><b>Học máy:</b> đưa cho máy 10 000 thư đã được người dán nhãn "rác" hoặc "không rác". Máy tự tìm ra từ nào, kiểu viết nào hay đi cùng thư rác, và gán cho mỗi dấu hiệu một mức quan trọng. Có kiểu rác mới thì chỉ cần thêm ví dụ và cho máy học lại.</li></ul>
<h4>3. "Mô hình" là gì?</h4>
<p>Mô hình là một hàm: nhận <b>đầu vào</b> (một bức thư), trả ra <b>dự đoán</b> (rác hay không). Bên trong có các <b>tham số</b>, giống các núm vặn. Ví dụ mô hình đoán giá nhà: <span class="fx">giá = a × diện tích + b</span>. Hai số a, b là tham số; "học" nghĩa là tìm a, b sao cho đoán khớp dữ liệu nhất.</p>
<h4>4. AI hẹp và AI tổng quát</h4>
<p>Gần như mọi AI hiện nay là <b>AI hẹp</b>: giỏi một việc được huấn luyện (đánh cờ, dịch, nhận diện khuôn mặt) nhưng không tự làm được việc khác. <b>AI tổng quát</b> (AGI), thông minh như người ở mọi lĩnh vực, chưa tồn tại. Năm 1950, Alan Turing đề xuất <b>phép thử Turing</b>: nếu trò chuyện bằng chữ mà người hỏi không phân biệt được máy với người, ta coi máy là "thông minh".</p>
<h4>5. Cách nhận ra học máy trong đề thi</h4>
<ol><li>Hệ thống có <b>học từ dữ liệu</b> (ví dụ có đáp án, hoặc phần thưởng) không?</li>
<li>Thêm dữ liệu thì nó có <b>tốt lên</b> không?</li></ol>
<p>Nếu chỉ là công thức hay luật cố định (máy tính bỏ túi, đèn giao thông hẹn giờ, báo thức) thì <b>không</b> phải học máy, dù chạy tự động. Bộ lọc thư rác, gợi ý video, nhận diện giọng nói thì <b>có</b>.</p>`,
en:{title:'What is AI?',
one:'AI is about making computers do things that used to need human intelligence.',
why:'See the big picture before studying individual algorithms.',pre:'No prior knowledge needed.',
idea:`<p><b>Artificial intelligence (AI)</b> is a broad field: chess engines, translators, self-driving cars, virtual assistants. There are two main ways to build an "intelligent" system.</p><p><b>Way 1: write the rules by hand.</b> A programmer thinks up every rule, for example: if an email contains "you have won", it is spam. Easy to understand, but nobody can write rules for every case.</p><p><b>Way 2: let the machine learn from data.</b> Give it thousands of emails labelled "spam" or "not spam" and it finds the patterns itself. This is <b>machine learning</b>. <b>Deep learning</b> is a branch of machine learning that uses neural networks with many layers; it powers ChatGPT, face recognition and machine translation.</p>`,
life:'Your phone grouping photos by face, YouTube recommending videos, Google Translate and a map app routing around traffic are all AI.',
tryit:'Read each situation and decide: is the machine following hand-written rules, or has it learned from data?',
rem:['AI ⊃ machine learning ⊃ deep learning (the big circle contains the small ones)','Machine learning: the machine finds patterns in data instead of a person writing rules','Deep learning: machine learning with multi-layer neural networks','Model: what the machine learns; it takes an input and produces a prediction','Most AI today is narrow AI: good within what it was trained for, without broad human-like understanding'],
traps:['A program that runs automatically is not necessarily machine learning: a calculator learns nothing.','Deep learning is part of machine learning, not the other way round.'],
deep:`<h4>1. Three nested circles</h4>
<p>Picture three circles: the biggest is <b>AI</b> (every way of making machines "smart"), inside it is <b>machine learning</b> (machines learning from data), and innermost is <b>deep learning</b> (machine learning with multi-layer neural networks). Every deep-learning system is machine learning and every machine-learning system is AI, but not the reverse.</p>
<h4>2. One problem, two approaches</h4>
<p>The problem: filtering spam.</p>
<ul><li><b>Writing rules:</b> a programmer lists "if it contains <i>you won</i>, <i>free</i>, <i>click now</i>, it is spam". Easy to read, but a spammer only has to write "y.ou w.on" to get through, and the rules need endless fixing.</li>
<li><b>Machine learning:</b> give the machine 10,000 emails that people have labelled "spam" or "not spam". It discovers which words and writing styles go with spam and gives each clue a weight. When a new kind of spam appears, just add examples and retrain.</li></ul>
<h4>3. What is a "model"?</h4>
<p>A model is a function: it takes an <b>input</b> (an email) and returns a <b>prediction</b> (spam or not). Inside are <b>parameters</b>, like tuning knobs. A model for house prices might be <span class="fx">price = a × area + b</span>. The numbers a and b are parameters; "learning" means finding a and b that fit the data best.</p>
<h4>4. Narrow AI and general AI</h4>
<p>Almost all AI today is <b>narrow AI</b>: good at the one task it was trained for (chess, translation, face recognition) and unable to do other tasks by itself. <b>Artificial general intelligence</b> (AGI), as capable as humans in every field, does not exist yet. In 1950 Alan Turing proposed the <b>Turing test</b>: if, chatting in text, a questioner cannot tell the machine from a human, the machine counts as "intelligent".</p>
<h4>5. Spotting machine learning in an exam question</h4>
<ol><li>Does the system <b>learn from data</b> (labelled examples or rewards)?</li>
<li>Does it <b>improve</b> when given more data?</li></ol>
<p>If it is only a fixed formula or rule (a calculator, a timed traffic light, an alarm clock), it is <b>not</b> machine learning, even though it runs automatically. A spam filter, video recommendations and speech recognition <b>are</b>.</p>`}},

'du-lieu':{
deep:`<h4>1. Đọc một bảng dữ liệu</h4>
<div class="ex"><table class="mini"><tr><th>Khối lượng (g)</th><th>Dài (cm)</th><th>Độ ngọt</th><th>Loại quả</th></tr><tr><td>150</td><td>7</td><td>6</td><td>Táo</td></tr><tr><td>170</td><td>8</td><td>7</td><td>Cam</td></tr><tr><td>120</td><td>18</td><td>8</td><td>Chuối</td></tr></table></div>
<p>Bảng có 3 <b>mẫu</b> (3 hàng), 3 <b>đặc trưng</b> (3 cột đầu) và 1 cột <b>nhãn</b> (Loại quả). Mẫu thứ nhất viết thành vector đặc trưng <span class="fx">x = (150, 7, 6)</span> với nhãn <span class="fx">y = Táo</span>. Với d đặc trưng, mỗi mẫu là một điểm trong không gian d chiều.</p>
<h4>2. Hai loại đặc trưng</h4>
<ul><li><b>Số</b> (numerical): khối lượng, nhiệt độ. Cộng, trừ, so sánh có ý nghĩa.</li>
<li><b>Phân loại</b> (categorical): màu sắc, tên thành phố. Chỉ là nhóm, không có phép cộng. Trước khi đưa vào mô hình phải đổi thành số (xem bài Tiền xử lý).</li></ul>
<p>Nhãn cũng vậy: nhãn là nhóm (táo/cam) thì bài toán là <b>phân loại</b>; nhãn là số (giá nhà) thì là <b>hồi quy</b>.</p>
<h4>3. Thế nào là đặc trưng tốt?</h4>
<p>Đặc trưng tốt làm các nhóm <b>tách xa nhau</b>. Ở bảng trên, "độ dài" tách chuối ra khỏi táo và cam rất rõ (18 cm so với 7–8 cm), còn "độ ngọt" thì ba loại gần như nhau. Một đặc trưng vô ích (như số thứ tự hàng) chỉ làm mô hình rối thêm.</p>
<h4>4. Dữ liệu tốt cần gì?</h4>
<ol><li><b>Đủ nhiều</b> mẫu.</li><li><b>Nhãn đúng</b>: nhãn sai dạy máy điều sai.</li><li><b>Đại diện</b> cho thực tế: chỉ có ảnh mèo ban ngày thì máy dễ nhận sai mèo ban đêm.</li></ol>
<h4>5. Hai lỗi đề hay hỏi</h4>
<ul><li><b>Dùng nhãn làm đầu vào</b> (hoặc một cột chỉ có sau khi biết đáp án): mô hình đạt điểm rất cao lúc thử nhưng vô dụng thật. Đây là <b>rò rỉ dữ liệu</b>.</li>
<li><b>Khác đơn vị</b>: khối lượng hàng trăm gam, độ dài vài cm. Khi tính khoảng cách, cột khối lượng lấn át, nên cần chuẩn hóa.</li></ul>`,
en:{title:'Data, features and labels',
one:'Machines learn from data. To understand machine learning, first learn to read a data table.',
why:'Every later lesson talks about data, features and labels.',pre:'Able to read a table of numbers.',
idea:`<p>Data is usually a <b>table</b>. Each row is a <b>sample</b>: one fruit, one student, one photo. Each column describes one property, called a <b>feature</b>: weight, length, sweetness.</p><p>The answer column we want the machine to guess is the <b>label</b>: apple, orange or banana. A good feature pushes the groups far apart. Choosing the right features matters as much as choosing the algorithm.</p>`,
life:'A teacher guesses who will do well in an exam from hours of self-study, past test scores and days absent: those are features. The real exam result is the label.',
tryit:'Change the features on the horizontal and vertical axes. Which pair separates apples, oranges and bananas into the three clearest clusters?',
rem:['Sample = one row','Feature = one input column, written x','Label = the answer to predict, written y','Good features separate the groups','Good data: enough of it, correct labels, realistic','A sample with d features is a vector of d numbers'],
traps:['Never use the label column as an input feature: that is looking at the answer.','Features in different units (grams, cm) usually need scaling before computing distances.'],
deep:`<h4>1. Reading a data table</h4>
<div class="ex"><table class="mini"><tr><th>Weight (g)</th><th>Length (cm)</th><th>Sweetness</th><th>Fruit</th></tr><tr><td>150</td><td>7</td><td>6</td><td>Apple</td></tr><tr><td>170</td><td>8</td><td>7</td><td>Orange</td></tr><tr><td>120</td><td>18</td><td>8</td><td>Banana</td></tr></table></div>
<p>The table has 3 <b>samples</b> (rows), 3 <b>features</b> (first three columns) and 1 <b>label</b> column (Fruit). The first sample is the feature vector <span class="fx">x = (150, 7, 6)</span> with label <span class="fx">y = Apple</span>. With d features, each sample is a point in d-dimensional space.</p>
<h4>2. Two kinds of feature</h4>
<ul><li><b>Numerical</b>: weight, temperature. Adding, subtracting and comparing make sense.</li>
<li><b>Categorical</b>: colour, city name. Just groups, no arithmetic. They must be turned into numbers before going into a model (see the Preprocessing lesson).</li></ul>
<p>Labels work the same way: a group label (apple/orange) makes it a <b>classification</b> problem; a number label (house price) makes it <b>regression</b>.</p>
<h4>3. What makes a good feature?</h4>
<p>A good feature pushes the groups <b>far apart</b>. Above, "length" separates bananas from apples and oranges clearly (18 cm vs 7–8 cm), while "sweetness" is almost the same for all three. A useless feature (like the row number) only confuses the model.</p>
<h4>4. What does good data need?</h4>
<ol><li><b>Enough</b> samples.</li><li><b>Correct labels</b>: wrong labels teach the wrong thing.</li><li><b>Representative</b> of reality: with only daytime cat photos, the machine may fail on cats at night.</li></ol>
<h4>5. Two mistakes exams like to ask about</h4>
<ul><li><b>Using the label as an input</b> (or a column only known after the answer): the model scores brilliantly in testing but is useless in practice. This is <b>data leakage</b>.</li>
<li><b>Different units</b>: weight in hundreds of grams, length in a few cm. Weight dominates any distance, so the features need scaling.</li></ul>`}},

'hoc-tu-vi-du':{
deep:`<h4>1. Vòng lặp học</h4>
<ol><li>Mô hình đoán thử cho các ví dụ có nhãn.</li>
<li><b>Hàm mất mát</b> (loss) đo đoán sai bao nhiêu.</li>
<li>Chỉnh tham số một chút theo hướng làm loss giảm (bài Gradient descent).</li>
<li>Lặp lại hàng nghìn lần. Một lượt đi qua toàn bộ dữ liệu huấn luyện gọi là một <b>epoch</b>.</li></ol>
<h4>2. Ví dụ tính tay</h4>
<p>Mô hình đoán điểm thi: <span class="fx">điểm = w × giờ học</span>. Dữ liệu: (2 giờ, 4 điểm), (4 giờ, 8 điểm). Thử w = 1: đoán 2 và 4, sai 2 và 4. Loss (trung bình bình phương sai số) = (2² + 4²)/2 = 10. Thử w = 2: đoán 4 và 8, khớp hoàn toàn, loss = 0. "Học" là tự động tìm ra w = 2 thay vì người phải đoán.</p>
<h4>3. Vì sao phải có tập kiểm tra?</h4>
<p>Một mô hình có thể <b>học thuộc</b>: nhớ đáp án từng ví dụ đã thấy mà không hiểu quy luật. Nó đúng 100% trên dữ liệu học nhưng sai nhiều với dữ liệu mới. Vì vậy ta chia dữ liệu:</p>
<ul><li><b>Tập huấn luyện</b> (train): để học.</li><li><b>Tập kiểm định</b> (validation): để chọn cài đặt (ví dụ số tầng, tốc độ học).</li><li><b>Tập kiểm tra</b> (test): dùng <b>một lần</b> ở cuối, như đề thi thật.</li></ul>
<p>Thường chia khoảng 70–80% train, phần còn lại cho validation và test.</p>
<h4>4. Dữ liệu ảnh hưởng thế nào?</h4>
<ul><li>Thêm ví dụ <b>đúng và đa dạng</b> → mô hình tổng quát tốt hơn.</li>
<li>Ví dụ <b>sai nhãn</b> (nhiễu) → mô hình học lệch.</li>
<li>Dữ liệu mới <b>khác hẳn</b> dữ liệu đã học (ảnh chụp đêm, giọng vùng miền khác) → mô hình dễ sai. Mô hình chỉ giỏi trong "vùng" dữ liệu nó đã gặp.</li></ul>`,
en:{title:'How does a machine learn from examples?',
one:'Give the machine many examples with answers; it finds the pattern and uses it to predict new examples.',
why:'Understand the "learn, then test" loop before meeting specific algorithms.',pre:'The lesson Data, features and labels.',
idea:`<p>There are two stages. <b>Training</b>: the machine looks at labelled examples and adjusts its internal "knobs" to get as many right as possible. <b>Inference</b> (prediction): it applies what it learned to new data.</p><p>To tell whether the machine really learned or just memorised, we keep part of the data it has <b>never seen</b> as a test. More correct and varied examples make better predictions. Mislabelled examples teach it the wrong thing.</p>`,
life:'A toddler learns cats from dogs: parents point at many animals and say their names. Gradually the child recognises animals it has never seen before.',
tryit:'Pick a class and click in the box to teach the machine a few examples. Watch the score on the test set change. Then try adding mislabelled examples.',
rem:['Training: learning from labelled data','Prediction: applying the model to new data','The loss measures how wrong the model is; training makes the loss smaller','Always test on unseen data (the test set)','More correct and varied examples usually make a better model','Wrong labels (noise) make the model worse'],
traps:['100% correct on the training data proves nothing: it may have memorised.','A model is only good on data similar to what it learned from.'],
deep:`<h4>1. The learning loop</h4>
<ol><li>The model makes guesses for the labelled examples.</li>
<li>The <b>loss function</b> measures how wrong the guesses are.</li>
<li>The parameters are nudged in the direction that lowers the loss (see Gradient descent).</li>
<li>Repeat thousands of times. One pass through the whole training set is one <b>epoch</b>.</li></ol>
<h4>2. Worked example</h4>
<p>A model predicts exam scores: <span class="fx">score = w × study hours</span>. Data: (2 hours, 4 points), (4 hours, 8 points). Try w = 1: predictions 2 and 4, errors 2 and 4. Loss (mean squared error) = (2² + 4²)/2 = 10. Try w = 2: predictions 4 and 8, a perfect fit, loss = 0. "Learning" means finding w = 2 automatically instead of a person guessing.</p>
<h4>3. Why we need a test set</h4>
<p>A model can <b>memorise</b>: remember the answer to every example it saw without understanding the pattern. It is 100% right on the training data but often wrong on new data. So we split the data:</p>
<ul><li><b>Training set</b>: for learning.</li><li><b>Validation set</b>: for choosing settings (number of layers, learning rate).</li><li><b>Test set</b>: used <b>once</b> at the end, like the real exam.</li></ul>
<p>A typical split is 70–80% for training and the rest for validation and test.</p>
<h4>4. How the data matters</h4>
<ul><li>More <b>correct and varied</b> examples → the model generalises better.</li>
<li><b>Mislabelled</b> examples (noise) → the model learns a skewed pattern.</li>
<li>New data <b>very different</b> from the training data (night photos, an unfamiliar accent) → mistakes are likely. A model is only good inside the "region" of data it has seen.</li></ul>`}},

'kieu-hoc':{
deep:`<h4>1. Câu hỏi để phân loại nhanh</h4>
<ol><li>Dữ liệu có <b>đáp án (nhãn)</b> cho từng mẫu không? Có → <b>có giám sát</b>.</li>
<li>Không có nhãn, chỉ muốn tìm nhóm hay cấu trúc? → <b>không giám sát</b>.</li>
<li>Máy <b>hành động</b> rồi nhận <b>phần thưởng</b>, không ai cho đáp án đúng? → <b>tăng cường</b>.</li></ol>
<h4>2. Học có giám sát: phân loại và hồi quy</h4>
<ul><li><b>Phân loại</b>: nhãn là một nhóm. Ví dụ: thư rác hay không, ảnh là chữ số nào (0–9). Thuật toán: k-NN, cây quyết định, SVM, hồi quy logistic, mạng nơ-ron.</li>
<li><b>Hồi quy</b>: nhãn là một số. Ví dụ: giá nhà, nhiệt độ ngày mai. Thuật toán: hồi quy tuyến tính, cây hồi quy.</li></ul>
<h4>3. Học không giám sát</h4>
<ul><li><b>Phân cụm</b>: gom các mẫu giống nhau, ví dụ chia khách hàng theo thói quen mua sắm (k-means).</li>
<li><b>Giảm số chiều</b>: nén nhiều cột thành ít cột mà giữ phần lớn thông tin (PCA).</li>
<li><b>Phát hiện bất thường</b>: tìm điểm khác hẳn số đông.</li></ul>
<p>Không có nhãn nên không tính được "accuracy" theo cách thông thường; phải đánh giá bằng tiêu chí khác (ví dụ inertia của k-means).</p>
<h4>4. Học tăng cường</h4>
<p>Có một <b>tác tử</b> (agent) trong một <b>môi trường</b>. Ở mỗi bước: nhìn <b>trạng thái</b> → chọn <b>hành động</b> → nhận <b>phần thưởng</b> và trạng thái mới. Mục tiêu là tổng phần thưởng lâu dài lớn nhất. Ví dụ: AlphaGo, robot tập đi, AI chơi game. Bài <b>bandit</b> là dạng đơn giản nhất: chỉ có một trạng thái, chọn máy nào để được thưởng nhiều.</p>
<h4>5. Bảng so sánh</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Có giám sát</th><th>Không giám sát</th><th>Tăng cường</th></tr><tr><td>Dữ liệu</td><td>Có nhãn</td><td>Không nhãn</td><td>Phần thưởng</td></tr><tr><td>Mục tiêu</td><td>Đoán nhãn</td><td>Tìm cấu trúc</td><td>Hành động tốt</td></tr><tr><td>Ví dụ</td><td>k-NN, SVM</td><td>k-means, PCA</td><td>Bandit, AlphaGo</td></tr></table></div>`,
en:{title:'Three kinds of machine learning',
one:'Learning with answers to copy, without answers, or by trying things and getting rewards.',
why:'When you meet a new algorithm, you will know straight away which family it belongs to.',pre:'The lesson What is AI?',
idea:`<p><b>Supervised learning</b>: the data has labels and the machine learns to go from input to answer. It includes <b>classification</b> (predicting a group: spam or not) and <b>regression</b> (predicting a number: house price).</p><p><b>Unsupervised learning</b>: no labels; the machine finds structure itself, such as groups (clustering) or fewer dimensions.</p><p><b>Reinforcement learning</b>: the machine is an agent acting in an environment, receiving <b>rewards</b> or penalties, and learns to act so as to collect the most reward. Examples: AlphaGo, a robot learning to walk.</p>`,
life:'Supervised: practising past papers with answer keys. Unsupervised: sorting books into similar piles by yourself. Reinforcement: learning to ride a bike; after a fall you try something different.',
tryit:'Put each problem into the right kind of learning. Read the explanation when you get one wrong.',
rem:['Supervised: labelled. Classification (discrete labels), regression (continuous numbers)','Unsupervised: unlabelled. Clustering (k-means), dimensionality reduction (PCA)','Reinforcement: agent, action, reward','The bandit problem is the simplest form of reinforcement learning','k-NN, decision trees, SVM and regression are all supervised'],
traps:['k-means (unsupervised) and k-NN (supervised) have similar names but are completely different.','Logistic regression is a classification algorithm.'],
deep:`<h4>1. Questions for quick sorting</h4>
<ol><li>Does every sample have an <b>answer (label)</b>? Yes → <b>supervised</b>.</li>
<li>No labels, just looking for groups or structure? → <b>unsupervised</b>.</li>
<li>The machine <b>acts</b> and receives <b>rewards</b>, with nobody giving the right answer? → <b>reinforcement</b>.</li></ol>
<h4>2. Supervised learning: classification and regression</h4>
<ul><li><b>Classification</b>: the label is a group. Examples: spam or not, which digit (0–9) an image shows. Algorithms: k-NN, decision trees, SVM, logistic regression, neural networks.</li>
<li><b>Regression</b>: the label is a number. Examples: house price, tomorrow's temperature. Algorithms: linear regression, regression trees.</li></ul>
<h4>3. Unsupervised learning</h4>
<ul><li><b>Clustering</b>: grouping similar samples, e.g. customers by shopping habits (k-means).</li>
<li><b>Dimensionality reduction</b>: compressing many columns into a few while keeping most information (PCA).</li>
<li><b>Anomaly detection</b>: finding points very different from the rest.</li></ul>
<p>With no labels there is no ordinary "accuracy"; other criteria are used (e.g. k-means inertia).</p>
<h4>4. Reinforcement learning</h4>
<p>An <b>agent</b> lives in an <b>environment</b>. At each step it observes a <b>state</b> → chooses an <b>action</b> → receives a <b>reward</b> and a new state. The goal is the largest total reward in the long run. Examples: AlphaGo, walking robots, game-playing AI. The <b>bandit</b> problem is the simplest case: a single state, choose which machine pays the most.</p>
<h4>5. Comparison table</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Supervised</th><th>Unsupervised</th><th>Reinforcement</th></tr><tr><td>Data</td><td>Labelled</td><td>Unlabelled</td><td>Rewards</td></tr><tr><td>Goal</td><td>Predict labels</td><td>Find structure</td><td>Act well</td></tr><tr><td>Examples</td><td>k-NN, SVM</td><td>k-means, PCA</td><td>Bandits, AlphaGo</td></tr></table></div>`}},

'ban-do':{
deep:`<h4>1. Chia thời gian trong phòng thi Vòng 1</h4>
<p>180 phút cho 100 câu, trung bình 1.8 phút một câu. Gợi ý ba lượt:</p>
<ol><li><b>Lượt 1 (khoảng 90 phút):</b> làm hết các câu khái niệm em chắc chắn. Câu tính dài thì đánh dấu, bỏ qua.</li>
<li><b>Lượt 2 (khoảng 60 phút):</b> quay lại các câu tính và câu đọc code.</li>
<li><b>Lượt 3 (30 phút còn lại):</b> soát lại các câu có chữ KHÔNG, SAI, ĐẦU TIÊN; câu nào còn trống thì vẫn chọn một đáp án (sai không bị trừ điểm).</li></ol>
<h4>2. Ba kiểu câu hỏi trong đề 2025</h4>
<ul><li><b>Câu khái niệm (khoảng 73 câu):</b> hỏi ý nghĩa, so sánh, chọn cách làm đúng. Ví dụ: "Thuật toán nào dựa trên bagging?", "Khi mô hình overfit, nên làm gì đầu tiên?". Học phần Tổng quan, Ghi nhớ và Bẫy của mỗi bài.</li>
<li><b>Câu tính (khoảng 15 câu):</b> số liệu nhỏ, tính được bằng tay. Luyện ở mục <b>Bài tính</b>, mỗi lần một bộ số mới.</li>
<li><b>Câu đọc code (khoảng 12 câu):</b> một đoạn PyTorch, scikit-learn hoặc pandas, hỏi kích thước đầu ra, lỗi ở đâu, hoặc dòng code làm gì. Xem bài Python và bài PyTorch.</li></ul>
<h4>3. Các dạng tính đã gặp trong đề 2025</h4>
<div class="scroll-x"><table class="mini"><tr><th>Dạng</th><th>Bài</th></tr>
<tr><td>Đầu ra của một nơ-ron; gradient của hàm hai biến</td><td>Nơ-ron, Gradient</td></tr>
<tr><td>MSE; entropy của một cột nhãn</td><td>Hồi quy, Cây quyết định</td></tr>
<tr><td>k-NN với 3 đặc trưng; dự đoán SVM từ w và b</td><td>k-NN, SVM</td></tr>
<tr><td>Tâm cụm k-means; hệ số silhouette</td><td>k-means</td></tr>
<tr><td>Cross-entropy của một ảnh</td><td>Huấn luyện mạng</td></tr>
<tr><td>Kích thước đầu ra conv (đọc code), pooling, số lần bộ lọc trượt</td><td>CNN</td></tr>
<tr><td>Số tham số khi đóng băng phần thân</td><td>Học chuyển giao</td></tr>
<tr><td>IoU và NMS</td><td>Phát hiện vật thể</td></tr>
<tr><td>Cosine similarity giữa các vector từ</td><td>Nhúng từ</td></tr></table></div>
<h4>4. Kế hoạch 6 ngày (12–17/10)</h4>
<ul><li><b>Thứ Hai 12/10:</b> Phần 0 và Phần A (làm quen, vector, gradient, Python).</li>
<li><b>Thứ Ba 13/10:</b> Phần B (học máy cổ điển).</li>
<li><b>Thứ Tư 14/10:</b> Phần C, rồi bài Nơ-ron và Huấn luyện mạng ở Phần D.</li>
<li><b>Thứ Năm 15/10:</b> PyTorch, Gỡ lỗi (Phần D) và Phần E (thị giác máy tính).</li>
<li><b>Thứ Sáu 16/10:</b> Phần F và G (ngôn ngữ, LLM, mô hình sinh); tối làm 30 câu Bài tính.</li>
<li><b>Thứ Bảy 17/10:</b> sáng làm một đề thi thử 100 câu đúng 180 phút, chiều chữa bài và ôn Sổ câu hay sai. Tối nghỉ sớm.</li></ul>
<p>Mỗi ngày: đọc Tổng quan, làm thí nghiệm, làm Kiểm tra nhanh, rồi luyện 10 câu của các bài vừa học. Chỗ nào chưa hiểu thì mở phần Tìm hiểu sâu.</p>
<h4>5. Đề song ngữ</h4>
<p>Đề có cả tiếng Việt và tiếng Anh. Khi câu tiếng Việt khó hiểu, đọc bản tiếng Anh: thuật ngữ tiếng Anh thường rõ nghĩa hơn (overfitting, recall, stride). Học thuật ngữ bằng Thẻ ghi nhớ trong mục Từ điển.</p>`,
en:{title:'Exam map and how to revise',
one:'Knowing what the exam contains and how the lessons connect makes revision much less vague.',
why:'Know what is tested, which topics come up most, and the best order to revise.',pre:'No prior knowledge needed.',
idea:`<p><b>Round 1 (Sunday 18/10/2026):</b> a 180-minute written paper with 100 multiple-choice questions in Vietnamese and English. The top 100 go on to Round 2.</p>
<p><b>What did the 2025 Round 1 paper look like?</b> Every question had 4 options and <b>exactly one correct answer</b>; wrong answers <b>lose no marks</b>, so never leave a question blank. Decimals use a <b>point</b> (0.25). About <b>15 questions need a calculation</b>, about <b>12 ask you to read Python code</b> (PyTorch, scikit-learn, pandas), and the rest test understanding of concepts.</p>
<p><b>Topics in the 2025 paper (approximate counts):</b></p>
<div class="scroll-x"><table class="mini"><tr><th>Topic group</th><th>Questions</th><th>Where on this site</th></tr>
<tr><td>Neural networks, training, PyTorch</td><td>~23</td><td>Part D</td></tr>
<tr><td>Classic machine learning (k-NN, trees, forests, SVM, k-means, PCA)</td><td>~20</td><td>Part B</td></tr>
<tr><td>Computer vision (CNN, detection, segmentation)</td><td>~19</td><td>Part E</td></tr>
<tr><td>Language, BERT/GPT, LLMs</td><td>~19</td><td>Part F</td></tr>
<tr><td>Evaluating models, overfitting</td><td>~14</td><td>Part C</td></tr>
<tr><td>Generative models, self-supervised learning</td><td>~7</td><td>Part G</td></tr></table></div>
<p>The lessons go <b>from easy to hard</b>: Part 0 (getting started) → A (maths and code tools) → B → C → D → E → F → G. Each part builds on the previous one. <b>Further reading</b> holds syllabus topics that <b>did not appear in the 2025 paper</b> (Bayes, logic, A*, bandits, privacy, fairness, RNN): study them if time allows.</p>
<p><b>Round 2 (10/01/2027, Hanoi):</b> hands-on work on a laptop. We will prepare for it separately after the Round 1 results.</p>`,
life:'Before a long trip, everyone checks the map: the destination, the stages, and which stages are hard so they can prepare.',
tryit:'Click a lesson on the map to open it. Lessons with ✓ are the ones you have marked as understood.',
rem:['Round 1: 100 questions in 180 minutes ≈ 1.8 minutes per question','2025 paper: exactly one correct answer per question and no penalty for wrong answers, so never leave a blank','Underline NOT, FALSE and FIRST in the question before reading the options','Answer the sure questions first; flag long calculations to come back to','Bilingual paper: learn the English terms in the Glossary'],
traps:['"Which statement is FALSE?" questions make it easy to pick a true option by mistake: reread the question before marking.','The paper includes code: do not only learn theory; practise reading each line and predicting the result.','If this year\'s paper says "choose all correct answers", treat each option as a separate True/False question.'],
deep:`<h4>1. Managing time in Round 1</h4>
<p>180 minutes for 100 questions is 1.8 minutes per question on average. A three-pass plan:</p>
<ol><li><b>Pass 1 (about 90 minutes):</b> answer every concept question you are sure of. Flag long calculations and skip them.</li>
<li><b>Pass 2 (about 60 minutes):</b> return to the calculations and the code-reading questions.</li>
<li><b>Pass 3 (the last 30 minutes):</b> recheck questions containing NOT, FALSE or FIRST; mark an answer for any blank question (wrong answers cost nothing).</li></ol>
<h4>2. Three kinds of question in the 2025 paper</h4>
<ul><li><b>Concept questions (about 73):</b> meaning, comparisons, choosing the right method. For example: "Which algorithm is based on bagging?", "Your model overfits: what should you try first?". Study each lesson's Overview, Remember and Traps.</li>
<li><b>Calculations (about 15):</b> small numbers you can work out by hand. Practise in <b>Calculations</b>, with new numbers every time.</li>
<li><b>Code reading (about 12):</b> a short PyTorch, scikit-learn or pandas snippet; you are asked for an output shape, where the bug is, or what a line does. See the Python and PyTorch lessons.</li></ul>
<h4>3. Calculation types seen in the 2025 paper</h4>
<div class="scroll-x"><table class="mini"><tr><th>Type</th><th>Lesson</th></tr>
<tr><td>Output of one neuron; gradient of a two-variable function</td><td>Neurons, Gradient</td></tr>
<tr><td>MSE; entropy of a label column</td><td>Regression, Decision trees</td></tr>
<tr><td>k-NN with 3 features; SVM prediction from w and b</td><td>k-NN, SVM</td></tr>
<tr><td>k-means centroids; silhouette score</td><td>k-means</td></tr>
<tr><td>Cross-entropy for one image</td><td>Training networks</td></tr>
<tr><td>Conv output shape (from code), pooling, number of filter positions</td><td>CNN</td></tr>
<tr><td>Parameter count with a frozen backbone</td><td>Transfer learning</td></tr>
<tr><td>IoU and NMS</td><td>Object detection</td></tr>
<tr><td>Cosine similarity between word vectors</td><td>Word embeddings</td></tr></table></div>
<h4>4. A six-day plan (12–17 October)</h4>
<ul><li><b>Monday 12/10:</b> Parts 0 and A (getting started, vectors, gradient, Python).</li>
<li><b>Tuesday 13/10:</b> Part B (classic machine learning).</li>
<li><b>Wednesday 14/10:</b> Part C, then the Neurons and Training lessons in Part D.</li>
<li><b>Thursday 15/10:</b> PyTorch and Debugging (Part D), and Part E (computer vision).</li>
<li><b>Friday 16/10:</b> Parts F and G (language, LLMs, generative models); in the evening, 30 calculation questions.</li>
<li><b>Saturday 17/10:</b> in the morning a full 100-question mock exam in exactly 180 minutes; in the afternoon go through it and your wrong-answer notebook. Sleep early.</li></ul>
<p>Each day: read the Overview, try the experiment, do the Quick check, then 10 practice questions on the lessons you just studied. Open the Deep dive wherever something is unclear.</p>
<h4>5. The bilingual paper</h4>
<p>Questions come in both Vietnamese and English. When the Vietnamese wording is confusing, read the English: the English terms are often clearer (overfitting, recall, stride). Learn the terms with the Flashcards in the Glossary.</p>`}},

'vector':{
deep:`<h4>1. Tích vô hướng, từng bước</h4>
<p>Với <span class="fx">A = (a₁, a₂, …, aₙ)</span> và <span class="fx">B = (b₁, b₂, …, bₙ)</span>: <span class="fx">A·B = a₁b₁ + a₂b₂ + … + aₙbₙ</span>. Kết quả là <b>một số</b>.</p>
<div class="ex">Ví dụ: (2, −1, 3)·(4, 5, 1) = 2×4 + (−1)×5 + 3×1 = 8 − 5 + 3 = <b>6</b>.</div>
<p>Ý nghĩa hình học: <span class="fx">A·B = |A| × |B| × cos θ</span>, θ là góc giữa hai mũi tên. Dương: cùng hướng (góc nhọn). Bằng 0: vuông góc. Âm: ngược hướng (góc tù).</p>
<h4>2. Độ dài và cosine similarity</h4>
<p>Độ dài (chuẩn L2): <span class="fx">|A| = √(A·A)</span>. Ví dụ |(3, 4)| = √(9 + 16) = 5.</p>
<p><b>Cosine similarity</b> = <span class="fx">A·B / (|A|·|B|)</span>, từ −1 đến 1, chỉ quan tâm <b>hướng</b>, không quan tâm độ dài. Hai văn bản: một bài dài gấp đôi nhưng cùng chủ đề vẫn có cosine gần 1.</p>
<div class="ex">Ví dụ: A = (1, 2), B = (2, 4). A·B = 2 + 8 = 10; |A| = √5; |B| = √20 = 2√5; cos = 10/(√5 × 2√5) = 10/10 = <b>1</b>: cùng hướng.</div>
<h4>3. Hai kiểu khoảng cách</h4>
<div class="ex">Từ P = (1, 1) đến Q = (4, 5): Δx = 3, Δy = 4.<br>Euclid: √(3² + 4²) = √25 = <b>5</b> (đường chim bay).<br>Manhattan: |3| + |4| = <b>7</b> (đi theo ô bàn cờ).</div>
<p>Manhattan luôn ≥ Euclid. Hai khoảng cách bằng nhau khi hai điểm chỉ khác nhau ở một tọa độ.</p>
<h4>4. Nhân ma trận</h4>
<p>Ma trận A cỡ m×n nhân B cỡ n×p (số cột A phải bằng số hàng B) cho C cỡ m×p. Ô <span class="fx">C[i][j]</span> = tích vô hướng của hàng i của A với cột j của B.</p>
<div class="ex">[[1, 2], [3, 4]] × [[5], [6]] = [[1×5 + 2×6], [3×5 + 4×6]] = [[17], [39]].</div>
<p>Nhân ma trận <b>không giao hoán</b>: AB thường khác BA, thậm chí BA có thể không nhân được.</p>
<h4>5. Dùng ở đâu trong AI?</h4>
<ul><li>k-NN, k-means: khoảng cách giữa các điểm.</li><li>Nơ-ron: <span class="fx">z = w·x + b</span> là một tích vô hướng.</li><li>SVM: đường chia <span class="fx">w·x + b = 0</span>.</li><li>Attention: điểm liên quan = Query·Key.</li></ul>`,
en:{title:'Vectors and distance',
one:'Computers see everything as a list of numbers. That list is called a vector.',
why:'All data in AI becomes vectors. Distance and the dot product appear in k-NN, k-means, SVM and attention.',pre:'Coordinates in the plane, Pythagoras’ theorem.',
idea:`<p>A student 160 cm tall weighing 50 kg is the vector <span class="fx">(160, 50)</span>. A 28×28-pixel image is a vector of 784 numbers. Once everything is a vector, we can measure how <b>similar</b> or <b>different</b> two things are using distance.</p><p>The <b>dot product</b> is the most important operation: multiply pairs of numbers and add them up. It is large when two arrows point the same way and 0 when they are perpendicular. Attention in ChatGPT, k-NN and SVM all use it.</p>`,
life:'Finding a café near school: as the crow flies is Euclidean distance; walking along a grid of streets is Manhattan distance. Working out a shopping bill (quantity × price, then add) is a dot product.',
tryit:'Drag points A and B. Find a position where A·B = 0. What angle do the two arrows make then?',
rem:['Dot product: (1, 2)·(3, 4) = 1×3 + 2×4 = 11','Euclidean: √((x₁ − x₂)² + (y₁ − y₂)²)','Manhattan: |x₁ − x₂| + |y₁ − y₂|','Dot product = 0 ⇔ the vectors are perpendicular','Cosine = A·B / (|A| × |B|), between −1 and 1','An m×n matrix times an n×p matrix gives m×p'],
traps:['Manhattan is always ≥ Euclidean: a detour can never be shorter than a straight line.','Matrix multiplication is not commutative: AB usually differs from BA.','(1,2,3)·(4,5,6) is a NUMBER (32), not the vector (4, 10, 18).'],
deep:`<h4>1. The dot product, step by step</h4>
<p>For <span class="fx">A = (a₁, a₂, …, aₙ)</span> and <span class="fx">B = (b₁, b₂, …, bₙ)</span>: <span class="fx">A·B = a₁b₁ + a₂b₂ + … + aₙbₙ</span>. The result is <b>a single number</b>.</p>
<div class="ex">Example: (2, −1, 3)·(4, 5, 1) = 2×4 + (−1)×5 + 3×1 = 8 − 5 + 3 = <b>6</b>.</div>
<p>Geometric meaning: <span class="fx">A·B = |A| × |B| × cos θ</span>, where θ is the angle between the arrows. Positive: same general direction (acute angle). Zero: perpendicular. Negative: opposite directions (obtuse angle).</p>
<h4>2. Length and cosine similarity</h4>
<p>Length (L2 norm): <span class="fx">|A| = √(A·A)</span>. For example |(3, 4)| = √(9 + 16) = 5.</p>
<p><b>Cosine similarity</b> = <span class="fx">A·B / (|A|·|B|)</span>, from −1 to 1. It cares only about <b>direction</b>, not length: a document twice as long on the same topic still has cosine close to 1.</p>
<div class="ex">Example: A = (1, 2), B = (2, 4). A·B = 2 + 8 = 10; |A| = √5; |B| = √20 = 2√5; cos = 10/(√5 × 2√5) = 10/10 = <b>1</b>: same direction.</div>
<h4>3. Two kinds of distance</h4>
<div class="ex">From P = (1, 1) to Q = (4, 5): Δx = 3, Δy = 4.<br>Euclidean: √(3² + 4²) = √25 = <b>5</b> (straight line).<br>Manhattan: |3| + |4| = <b>7</b> (along a grid).</div>
<p>Manhattan is always ≥ Euclidean. They are equal when the points differ in only one coordinate.</p>
<h4>4. Matrix multiplication</h4>
<p>An m×n matrix A times an n×p matrix B (columns of A must equal rows of B) gives an m×p matrix C. Entry <span class="fx">C[i][j]</span> = dot product of row i of A with column j of B.</p>
<div class="ex">[[1, 2], [3, 4]] × [[5], [6]] = [[1×5 + 2×6], [3×5 + 4×6]] = [[17], [39]].</div>
<p>Matrix multiplication is <b>not commutative</b>: AB usually differs from BA, and BA may not even be defined.</p>
<h4>5. Where it is used in AI</h4>
<ul><li>k-NN, k-means: distances between points.</li><li>A neuron: <span class="fx">z = w·x + b</span> is a dot product.</li><li>SVM: the boundary <span class="fx">w·x + b = 0</span>.</li><li>Attention: relevance score = Query·Key.</li></ul>`}},

'gradient':{
deep:`<h4>1. Đạo hàm là độ dốc</h4>
<p>Đạo hàm <span class="fx">L′(w)</span> cho biết: tăng w thêm một chút thì L thay đổi bao nhiêu. L′ dương → đi sang phải là lên dốc. L′ âm → đi sang phải là xuống dốc. L′ = 0 → đang ở chỗ bằng phẳng (có thể là đáy).</p>
<h4>2. Công thức cập nhật</h4>
<p><span class="fx">w mới = w − η × L′(w)</span>. Dấu trừ làm ta luôn đi <b>ngược</b> độ dốc, tức là xuống dốc.</p>
<div class="ex"><b>Ví dụ tính tay.</b> L(w) = (w − 3)², L′(w) = 2(w − 3). Bắt đầu w = 0, η = 0,1.<br>Bước 1: L′(0) = −6 → w = 0 − 0,1 × (−6) = 0,6.<br>Bước 2: L′(0,6) = −4,8 → w = 0,6 + 0,48 = 1,08.<br>Bước 3: L′(1,08) = −3,84 → w = 1,08 + 0,384 = 1,464.<br>w tiến dần về 3; mỗi bước, khoảng cách tới 3 nhân với (1 − 2η) = 0,8.</div>
<h4>3. Chọn learning rate η</h4>
<ul><li><b>η quá nhỏ</b> (0,001): đi rất chậm, tốn nhiều bước.</li>
<li><b>η vừa</b>: hội tụ nhanh.</li>
<li><b>η quá lớn</b>: với L = (w − 3)², nếu η = 1 thì khoảng cách nhân với (1 − 2) = −1: nhảy qua lại mãi giữa 0 và 6. η > 1 thì càng nhảy càng xa (<b>phân kỳ</b>).</li></ul>
<h4>4. Nhiều tham số: gradient</h4>
<p>Khi có nhiều tham số w₁, w₂, …, ta tính đạo hàm riêng theo từng tham số và gom lại thành vector <b>gradient</b> ∇L. Gradient chỉ hướng L <b>tăng nhanh nhất</b>; đi ngược gradient là xuống dốc nhanh nhất. Mỗi tham số được cập nhật cùng lúc: <span class="fx">wᵢ ← wᵢ − η × ∂L/∂wᵢ</span>.</p>
<h4>5. Quy tắc chuỗi</h4>
<p>Khi hàm lồng nhau, đạo hàm nhân lại: nếu z = w·x và L = (z − y)² thì <span class="fx">∂L/∂w = 2(z − y) × x</span>. Mạng nơ-ron dùng đúng quy tắc này (backpropagation).</p>
<div class="ex">x = 2, w = 3, y = 5: z = 6, ∂L/∂z = 2(6 − 5) = 2, ∂z/∂w = 2 → ∂L/∂w = 4.</div>
<h4>6. Batch, SGD, mini-batch</h4>
<p><b>Batch GD</b>: mỗi bước dùng toàn bộ dữ liệu (chính xác nhưng chậm). <b>SGD</b>: mỗi bước dùng một mẫu (nhanh, lắc lư). <b>Mini-batch</b>: mỗi bước dùng một nhóm nhỏ, ví dụ 32 mẫu (cách hay dùng nhất). Hàm có nhiều thung lũng thì có thể kẹt ở <b>cực tiểu cục bộ</b>.</p>`,
en:{title:'Gradient descent: walking downhill',
one:'Machines learn by correcting their mistakes a little at a time, like someone walking down a mountain in fog.',
why:'This is how almost every AI model "learns": reducing its error in small steps.',pre:'Reading a function graph; knowing the slope of a line.',
idea:`<p>A model has "knobs" called parameters <span class="fx">w</span>. The loss function <span class="fx">L(w)</span> tells us how wrong the model is. We want the w that makes L smallest: the bottom of the valley.</p><p>The <b>slope</b> (derivative) tells us which way the loss goes up. We step the <b>opposite</b> way. The <b>learning rate η</b> decides how long each step is.</p>`,
