<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ôn thi VAIO 2026: bài học có thí nghiệm tương tác, luyện đề trắc nghiệm, từ điển thuật ngữ AI.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vở AI Olympic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600;700&family=Mali:wght@500;600&display=swap&subset=vietnamese">
<style>
/* Layout: vở ô li, giao diện sáng. Sidebar mục lục + vùng bài học; mỗi bài: ý tưởng → thí nghiệm → ghi nhớ → kiểm tra. */
:root{
  --bg:#F2F8FF; --surface:#FFFFFF; --surface-2:#EAF4FF; --grid:#E2EEFB; --grid-strong:#C5DBF4; --line:#D9E6F5;
  --ink:#16294A; --muted:#55657F;
  --accent:#1A6FE8; --accent-ink:#FFFFFF; --accent-soft:#E2EEFF; --accent-deep:#0E4FB0;
  --red:#DC3545; --red-soft:#FFE7E9; --green:#13924B; --green-soft:#DDF6E7; --amber:#B06500; --amber-soft:#FFF3D0;
  --c1:#7C4DEB; --c2:#F26B1D; --c3:#13924B; --c4:#C98A00; --c5:#1A6FE8; --viz-accent:#7C4DEB;
  --pink:#E8458B; --teal:#0A9E95; --sky:#2E9BF5; --sun:#FFC21F; --coral:#FF6247; --lime:#7ACC29;
  --p0:#E8503F; --pA:#1A6FE8; --pB:#7C4DEB; --pC:#0A8F87; --pD:#D86A00; --pE:#D63B7A; --pF:#23934A; --pG:#B5179E; --pX:#6B7A90;
  --shadow:0 1px 2px rgba(20,70,150,.06),0 6px 18px rgba(20,70,150,.08);
  --f-display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-hand:'Mali','Be Vietnam Pro',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --tb:60px;
  color-scheme:light;
}
/* Always the bright theme: young students get the same fresh look whatever their device setting. */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--tb);display:flex;align-items:center;gap:10px;padding-inline:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.menu-btn{display:none;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none}
.menu-btn svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);white-space:nowrap;min-width:0;flex:none}
.brand svg{width:34px;height:34px;flex:none}
.brand .bt{display:grid;line-height:1}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.brand small{font:400 .64rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.tabs{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* layout */
.layout{display:grid;grid-template-columns:276px minmax(0,1fr)}
.side{position:sticky;top:calc(var(--tb) + env(safe-area-inset-top,0px));height:calc(100vh - var(--tb));overflow:auto;padding:14px 12px 32px;background:var(--surface-2);border-right:1px solid var(--line)}
.side-home{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
.side-home[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-prog{margin:8px 10px 4px;font-size:.82rem;color:var(--muted)}
.side-prog .bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.side-prog .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.part-h{font:600 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.side ol{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:22px minmax(0,1fr) 18px;gap:2px 8px;align-items:center;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.3}
.tl:hover{background:var(--surface)}
.tl[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tl .n{font:600 .74rem var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tl .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.tl .mk.done{background:var(--green);border-color:var(--green);color:var(--surface)}
.tl .mk svg{width:11px;height:11px}
.tl .mast{grid-column:2/3;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.tl .mast i{display:block;height:100%;background:var(--accent)}
.side-foot{display:grid;gap:8px;padding:20px 10px 0}
main{min-width:0;padding-block:28px 96px;padding-inline:clamp(16px,4vw,44px)}
.wrap{max-width:980px;margin-inline:auto}
.scrim{display:none}
@media (max-width:920px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(86vw,320px);z-index:60;transform:translateX(-105%);transition:transform .22s ease;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.28)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,10,24,.4);z-index:55}
  .menu-btn{display:inline-grid}
}
@media (max-width:600px){.brand .bt{display:none}.tab{padding:6px 7px;font-size:.84rem}.topbar{gap:6px;padding-inline:12px}}

/* common */
.eyebrow{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.lead{font-size:1.1rem;color:var(--muted);max-width:64ch;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:.9rem;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.ghost{background:transparent}
.btn.big{font-size:1.02rem;padding:11px 18px;border-radius:11px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-left:1px solid var(--line);background:transparent;padding:7px 11px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.fx{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;white-space:nowrap}
.badge{display:inline-block;font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:.92rem}
.input{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--red);font-size:.9rem;margin:6px 0 0}
.hand{font-family:var(--f-hand)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.sw-red{background:var(--red)}.sw-ring{border:2px solid var(--red)}.sw-amber{background:var(--amber)}.sw-muted{background:var(--muted);opacity:.5}
.sw-c1{background:var(--c1)}.sw-c2{background:var(--c2);border-radius:2px}.sw-green{background:var(--green)}

/* lesson */
.lesson h1{font-size:clamp(2rem,4.6vw,2.9rem);font-weight:800;letter-spacing:-.01em}
.lesson-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.one{font-size:1.18rem;max-width:62ch;margin:10px 0 0}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;margin-top:26px;align-items:start}
.idea h2,.lab h2,.quick h2{font-size:1.45rem;margin-bottom:8px}
.prose p{margin:0 0 .8em;max-width:65ch}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--accent);font-weight:600}
.lang-btn{flex:none;display:inline-flex;align-items:center;padding:3px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:700 .74rem var(--f-mono);letter-spacing:.04em;color:var(--muted)}
.lang-btn span{padding:5px 8px;border-radius:999px;line-height:1}
.lang-btn[data-l="vi"] .lv,.lang-btn[data-l="en"] .le{background:var(--accent);color:var(--accent-ink)}
.lang-btn:hover{border-color:var(--accent)}
.lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.lang-btn span{padding:5px 6px}}
.deep{margin-top:22px;border:1.5px solid var(--accent);border-radius:14px;background:var(--surface);overflow:hidden}
.deep>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 18px;background:var(--accent-soft)}
.deep>summary::-webkit-details-marker{display:none}
.deep>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dz-i{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:800 1.25rem/1 var(--f-display);transition:transform .2s}
.deep[open] .dz-i{transform:rotate(45deg)}
.dz-t{display:grid;gap:2px;min-width:0}
.dz-t b{font:800 1.2rem var(--f-display);color:var(--accent)}
.dz-t small{color:var(--muted);font-size:.88rem}
.deep-body{padding:4px 20px 4px}
.deep-body h4{font:700 1.08rem var(--f-display);margin:20px 0 6px;color:var(--ink)}
.deep-body ul,.deep-body ol{margin:0 0 .8em;padding-left:1.3em;max-width:68ch;display:grid;gap:4px}
.ex{margin:10px 0 12px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--accent);font-variant-numeric:tabular-nums;overflow-x:auto;max-width:72ch;line-height:1.65}
.ex b{color:var(--ink)}
table.mini{border-collapse:collapse;margin:4px 0;font-size:.9rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:4px 10px;text-align:left;white-space:nowrap}
table.mini th{background:var(--surface)}
@media (max-width:520px){.fx{white-space:normal}.gl{grid-template-columns:minmax(0,1fr)}}
.gl>a{max-width:260px}
.qextra{margin:4px 0 12px;display:grid;gap:8px;min-width:0}
.qextra p{margin:0}.qextra ul,.qextra ol{margin:0;padding-left:1.3em}
pre.qcode{margin:0;font:500 .82rem/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;max-width:100%;color:var(--ink)}
.otext pre.qcode{background:var(--surface);font-size:.78rem}
.opt:has(pre.qcode){align-items:flex-start}
.otext{min-width:0;flex:1 1 auto}
.opts{grid-template-columns:minmax(0,1fr)}.opt{min-width:0;max-width:100%}
.qimg{display:block;width:min(100%,360px);height:auto;border-radius:8px;border:1px solid var(--line)}
.qtbl td,.qtbl th{text-align:center}
.cms{display:flex;flex-wrap:wrap;gap:12px}.cm{display:grid;gap:4px;min-width:0}
.de25{margin-top:18px;border-top:5px solid var(--pG)}
.prose table.mini th,.prose table.mini td{white-space:normal}
table.mini td.sp{background:var(--accent-soft);font-weight:700}
table.mini td.z{color:var(--muted)}
.nms-log{font:600 .88rem/1.6 var(--f-mono);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px;overflow-wrap:anywhere}
.txt-steps{display:grid;gap:10px;margin-top:12px}
.txt-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px;align-items:start}
.txt-row .toks{margin-top:0}
.txt-row .tok{cursor:default;font-weight:500;font-family:var(--f-mono);font-size:.88rem;padding:3px 8px}
@media (max-width:520px){.txt-row{grid-template-columns:minmax(0,1fr)}}
.prose code,.demo code{font-family:var(--f-mono);font-size:.9em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;overflow-wrap:anywhere}
.ex code{background:var(--surface)}
.deep-end{padding:6px 20px 16px}
.demo-lang{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.life{background:var(--surface);border:1px dashed var(--grid-strong);border-radius:12px;padding:14px 16px}
.life h3{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.life p{margin:0}
.lab{margin-top:36px}
.lab-head{display:grid;gap:2px;margin-bottom:12px}
.try{margin:0;color:var(--muted);max-width:72ch}.try b{color:var(--ink)}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stage{position:relative;display:grid;gap:10px}
.cv-wrap{width:100%;min-width:0}
.cv-wrap canvas{display:block;width:100%;border-radius:9px;border:1px solid var(--line)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.ctl{display:flex;align-items:center;gap:8px;font-size:.9rem;flex-wrap:wrap}
.ctl label{font-weight:500}
.ctl input[type=range]{width:150px;accent-color:var(--accent)}
.ctl output{font:600 .88rem var(--f-mono);min-width:3.6em;font-variant-numeric:tabular-nums;color:var(--accent)}
.ctl input[type=number]{width:70px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono)}
.readouts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ro{display:grid;gap:1px;padding:7px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.ro span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ro b{font:600 .95rem var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ro.big b{font-size:1.25rem;color:var(--accent)}
.ro[data-tone="good"] b{color:var(--green)}.ro[data-tone="bad"] b{color:var(--red)}.ro[data-tone="warn"] b{color:var(--amber)}
.demo-note{margin:12px 0 0;font-family:var(--f-hand);font-size:1.22rem;line-height:1.35;color:var(--red)}
.formula{margin:10px 0 0;font:.88rem/1.6 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.subdemo{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.sub-h{font-size:1.18rem;margin-bottom:10px}
.notes{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:36px;align-items:start}
.remember{position:relative;padding:16px 18px 18px 54px;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--line);border-radius:4px}
.remember::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
.remember h2{font-family:var(--f-hand);font-weight:400;color:var(--red);font-size:1.7rem;margin:0 0 4px}
.remember ul{margin:0;padding-left:1.1em}
.remember li{margin:.25em 0}
.traps{background:var(--amber-soft);border-radius:12px;padding:16px 18px}
.traps h2{font-size:1.22rem;color:var(--amber);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.traps h2 svg{width:20px;height:20px;flex:none}
.traps ul{margin:0;padding-left:1.1em}.traps li{margin:.3em 0}
.quick{margin-top:36px}
.quick-list{display:grid;gap:14px}
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{max-width:46%}
@media (max-width:760px){.lesson-grid,.notes{grid-template-columns:minmax(0,1fr)}.pager a{max-width:100%}}

/* confusion matrix */
.cm-wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin-top:12px}
.cm{border-collapse:separate;border-spacing:4px;font-size:.86rem}
.cm th{font-weight:600;color:var(--muted);padding:4px 8px;text-align:center}
.cm td{padding:8px 12px;border-radius:8px;text-align:center;min-width:92px}
.cm td small{display:block;color:var(--muted);font-size:.72rem;font-weight:600}
.cm td b{font:700 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.cm .tp{background:var(--green-soft)}.cm .fn{background:var(--amber-soft)}.cm .fp{background:var(--red-soft)}.cm .tn{background:var(--surface-2);border:1px solid var(--line)}

/* tree */
.mtree{display:grid;justify-items:center;gap:0;margin-top:12px;font-size:.88rem}
.mt-root,.mt-node{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 12px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mt-root{border-color:var(--red);font-weight:600}
.mt-root small,.mt-node small{display:block;font-family:var(--f-body);color:var(--muted);font-weight:400}
.mt-stem{width:2px;height:12px;background:var(--line)}
.mt-kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:2px solid var(--line);padding-top:12px;width:min(100%,460px)}
.mt-node em{font-style:normal;font-weight:600;font-family:var(--f-body)}

/* cnn */
.cnn{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.cnn-col{display:grid;gap:6px;justify-items:center}
.cnn-col h4{margin:0;font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gridx{display:grid;gap:2px}
.cell{width:var(--cs,30px);height:var(--cs,30px);display:grid;place-items:center;font:600 .74rem var(--f-mono);border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
button.cell{cursor:pointer}
.cell.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cell.pad{border-style:dashed;background:transparent;color:var(--muted)}
.cell.win{box-shadow:inset 0 0 0 2.5px var(--red)}
.cell.sel{box-shadow:inset 0 0 0 2.5px var(--red)}
.op{font:700 1.6rem var(--f-display);color:var(--muted)}
.calc{margin-top:12px;font:.86rem/1.7 var(--f-mono);overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.calc b{color:var(--accent)}
.calcbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.calcbox .field label{font-size:.82rem;font-weight:500;color:var(--muted)}
@media (max-width:520px){.cnn{--cs:23px}.cell{font-size:.62rem}}

/* bandit */
.arms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.arm{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2);display:grid;gap:6px;min-width:0}
.arm.hit{border-color:var(--accent)}
.arm h4{margin:0;font:700 1.05rem var(--f-display)}
.reel{font:800 1.9rem var(--f-display);text-align:center;height:46px;line-height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.reel.win{color:var(--green)}.reel.lose{color:var(--muted)}
.arm dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.82rem}
.arm dt{color:var(--muted)}.arm dd{margin:0;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.arm dd.truep{color:var(--red)}
@media (max-width:640px){.arms{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* attention */
.toks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tok{padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.tok[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini-table{border-collapse:collapse;font-size:.82rem;font-family:var(--f-mono)}
.mini-table th,.mini-table td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.mini-table th{color:var(--muted);font-family:var(--f-body);font-weight:600;text-align:left}
.scroll-x{overflow-x:auto;max-width:100%}

/* fairness */
.ftable{border-collapse:collapse;font-size:.88rem;width:100%;min-width:480px}
.ftable th,.ftable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.ftable th:first-child,.ftable td:first-child{text-align:left}
.ftable td{font-family:var(--f-mono)}
.ftable td:first-child{font-family:var(--f-body)}
.ftable thead th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.ok{color:var(--green);font-weight:600}.no{color:var(--red);font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font:600 .74rem var(--f-body)}
.pill.ok{background:var(--green-soft)}.pill.no{background:var(--red-soft)}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.qnum{font:700 .8rem var(--f-mono);color:var(--accent)}
.qtopic{font-size:.8rem;color:var(--muted)}
.qtext{font-size:1.08rem;font-weight:500;margin:0;max-width:70ch}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surface);transition:border-color .12s}
.opt:hover{border-color:var(--grid-strong)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .letter{flex:none;font:700 .85rem var(--f-mono);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted)}
.opt .otext{padding-top:2px;min-width:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .letter{background:var(--green);border-color:var(--green);color:var(--surface)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .letter{background:var(--red);border-color:var(--red);color:var(--surface)}
.opt.dim{opacity:.6}
.opt:has(input:disabled){cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--grid-strong)}
.explain p{margin:4px 0 0}
.verdict{font-family:var(--f-hand);font-size:1.4rem;line-height:1.1}
.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}
.qactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.qbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.9rem;color:var(--muted)}
.qmeta b{color:var(--ink);font-family:var(--f-mono)}
.qdots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.qdot{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font:600 .78rem var(--f-mono);cursor:pointer;padding:0;color:var(--muted)}
.qdot.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qdot.okd{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.qdot.nod{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qdot[aria-current="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.qdot.flag{border-color:var(--amber);box-shadow:inset 0 -4px 0 var(--amber)}
.qdot.flag[aria-current="true"]{box-shadow:inset 0 -4px 0 var(--amber),0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.qdots-wrap{margin-bottom:14px}
.qdots-wrap summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent);margin-bottom:8px}
.qdots-wrap .qdots{margin-bottom:0}
.qprog{margin:0 0 8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.vi-l{display:block}
.en-l{display:block;margin-top:3px;color:var(--muted);font-size:.92em;font-weight:400}
.badge.calc{background:var(--accent-soft);color:var(--accent)}
.card.promo{display:grid;gap:4px;text-decoration:none;color:inherit;border-color:var(--accent);background:var(--accent-soft)}
.card.promo b{color:var(--accent);font-size:1.1rem}
.feats{margin:0;padding-left:1.2em;display:grid;gap:6px}
.banners{display:grid;gap:10px;margin-top:20px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 16px;border-radius:12px;background:var(--amber-soft);border:1.5px solid var(--amber);color:var(--ink);text-decoration:none}
.banner b{color:var(--amber)}
.banner span{flex:1 1 220px;min-width:0}
.banner.live{background:var(--accent-soft);border-color:var(--accent)}
.banner.live b{color:var(--accent)}
.wlist{list-style:none;margin:0;padding:0;display:grid}
.wlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.wlist .qtopic{grid-column:1/-1}
.wlist .wq{min-width:0;overflow-wrap:anywhere}
.wlist small{color:var(--muted);white-space:nowrap}
.fc-ctl{margin-top:16px}
.fc-prog{display:grid;gap:6px;margin:14px 0;font-size:.9rem;color:var(--muted);max-width:620px;font-variant-numeric:tabular-nums}
.fc-prog .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fc-prog .bar i{display:block;height:100%;background:var(--green)}
.fc-stage{max-width:620px}
.fc-card{display:grid;gap:12px;justify-items:center;align-content:center;text-align:center;width:100%;min-height:230px;padding:28px 22px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 6px 0 var(--grid-strong)}
.fc-card:hover{border-color:var(--accent)}
.fc-card.flipped{border-color:var(--accent);background:var(--accent-soft)}
.fc-side{font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fc-term{font:800 clamp(1.5rem,4.5vw,2.2rem)/1.2 var(--f-display);overflow-wrap:anywhere;max-width:100%}
.fc-hint{color:var(--muted);font-size:.88rem}
.fc-back{display:grid;gap:6px;justify-items:center}
.fc-ans{font:700 1.3rem/1.3 var(--f-display);color:var(--accent);overflow-wrap:anywhere}
.fc-back p{margin:0;max-width:46ch}
.fc-acts{align-items:center}
.fc-keys{color:var(--muted)}
.fc-done{padding:22px;border-radius:14px;border:1.5px dashed var(--accent);background:var(--surface)}

.confirm{margin-top:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--amber);background:var(--amber-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{margin:0;flex:1 1 220px}
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;margin-top:22px;align-items:start}

.setup h2{font-size:1.25rem;margin-bottom:10px}
.stack{display:grid;gap:12px}
.picker{display:grid;gap:10px}
.pk-grp{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0}

.pk{display:flex;gap:8px;align-items:center;padding:4px 2px;font-size:.92rem;cursor:pointer}
.pk input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.pk small{margin-left:auto;color:var(--muted);font-family:var(--f-mono);font-size:.74rem;white-space:nowrap}
.pk-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.codebox{display:grid;gap:8px;padding:16px;border-radius:12px;background:var(--accent-soft);border:1.5px dashed var(--accent);justify-items:start}
.codebig{font:700 clamp(1.7rem,5vw,2.4rem) var(--f-mono);letter-spacing:.05em;color:var(--accent);user-select:all;overflow-wrap:anywhere}
.score{font:800 clamp(3.2rem,9vw,5rem)/1 var(--f-display);color:var(--accent)}
.result-top{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end}
.tbars{display:grid;gap:8px;margin-top:10px}
.tbar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.9rem}
.tbar .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.tbar .track i{display:block;height:100%;border-radius:6px}
.tbar b{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:520px){.tbar{grid-template-columns:minmax(0,1fr) 54px}.tbar .track{grid-column:1/-1;grid-row:2}}
.review{display:grid;gap:12px;margin-top:12px}

/* projector */
.proj-stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,40px);display:grid;gap:18px;margin-top:16px}
.proj-stage:fullscreen{border-radius:0;border:0;padding:4vw 5vw;overflow:auto;align-content:start}
.proj-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.qcard.big{border:0;padding:0;background:transparent}
.qcard.big .qtext{font-size:clamp(1.3rem,2.6vw,2.3rem);line-height:1.35;max-width:none;font-weight:600}
.qcard.big .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.qcard.big .opt{font-size:clamp(1.02rem,1.8vw,1.55rem);padding:16px 18px;border-radius:14px}
.qcard.big .letter{width:38px;height:38px;font-size:1rem}

.kbd{font:600 .74rem var(--f-mono);padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2)}

/* home */
.hero{position:relative;padding:26px 24px 26px 64px;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--line);border-radius:6px}
.hero::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}

.hero-title span{color:var(--accent)}
.hero-hand{font-family:var(--f-hand);color:var(--red);font-size:1.35rem;margin:10px 0 0}

.count{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}

.tcard{display:grid;gap:3px;align-content:start;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink)}
.tcard:hover{border-color:var(--accent)}

.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:st}

.hist{width:100%;border-collapse:collapse;font-size:.9rem;min-width:460px}

/* result code + gradebook */
textarea.input{min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:.84rem;line-height:1.5}

/* new lessons */

.part-intro{margin-top:16px;padding:11px 14px;border-radius:10px;border:1.5px dashed var(--accent);background:var(--surface)}

let UID=0, UPRE='v';
const nid=p=>`${UPRE}-${p}${++UID}`;
function resetView(prefix){ view.cleanups.forEach(f=>{try{f();}catch(e){}}); view={cleanups:[],redraws:[]}; UID=0; UPRE=prefix||'v'; }
function redrawAll(){ view.redraws.forEach(f=>{try{f();}catch(e){}}); }
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redrawAll); }catch(e){}
new MutationObserver(redrawAll).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(redrawAll);

/* theme + canvas helpers */
function theme(){ const cs=getComputedStyle(document.documentElement); const g=n=>cs.getPropertyValue('--'+n).trim();
  return {bg:g('bg'),surface:g('surface'),surface2:g('surface-2'),grid:g('grid'),gridS:g('grid-strong'),line:g('line'),ink:g('ink'),muted:g('muted'),accent:g('viz-accent')||g('accent'),accentInk:g('accent-ink'),red:g('red'),green:g('green'),amber:g('amber'),c:[g('c1'),g('c2'),g('c3'),g('c4'),g('c5')]}; }
function alpha(c,a){ c=(c||'').trim(); if(c[0]==='#'){ let x=c.slice(1); if(x.length===3) x=x.split('').map(q=>q+q).join(''); const n=parseInt(x,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; } return c; }
const FF={body:"'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif",mono:"'JetBrains Mono', ui-monospace, Consolas, monospace",hand:"'Mali', 'Be Vietnam Pro', sans-serif",disp:"'Baloo 2', 'Be Vietnam Pro', sans-serif"};
function font(sz,k){ switch(k){ case 'bold':return `600 ${sz}px ${FF.body}`; case 'mono':return `${sz}px ${FF.mono}`; case 'monob':return `600 ${sz}px ${FF.mono}`; case 'hand':return `${sz}px ${FF.hand}`; case 'disp':return `700 ${sz}px ${FF.disp}`; default:return `${sz}px ${FF.body}`; } }
function makeCanvas(parent,opt={}){
  const ratio=opt.ratio||0.6, maxH=opt.maxH||440, minH=opt.minH||170;
  const wrap=h('div',{class:'cv-wrap'}); const cv=h('canvas',{role:'img','aria-label':opt.label||'Hình minh họa tương tác'}); wrap.append(cv); parent.append(wrap);
  const o={cv,ctx:cv.getContext('2d'),w:0,h:0,draw:()=>{}};
  function size(){ const w=Math.floor(wrap.clientWidth); if(!w) return; const hh=Math.round(clamp(w*ratio,minH,maxH)); const d=window.devicePixelRatio||1; if(o.w===w&&o.h===hh) {o.draw();return;} cv.width=Math.round(w*d); cv.height=Math.round(hh*d); cv.style.height=hh+'px'; o.ctx.setTransform(d,0,0,d,0,0); o.w=w; o.h=hh; o.draw(); }
  const ro=new ResizeObserver(size); ro.observe(wrap);
  view.cleanups.push(()=>ro.disconnect()); view.redraws.push(()=>o.draw());
  o.size=size; return o;
}
function ptr(e,cv){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function paper(c,w,hh,T){ c.fillStyle=T.surface; c.fillRect(0,0,w,hh); const st=16; c.lineWidth=1; c.strokeStyle=T.grid; c.beginPath();
  for(let x=st;x<w;x+=st){ c.moveTo(Math.round(x)+0.5,0); c.lineTo(Math.round(x)+0.5,hh); }
  for(let y=st;y<hh;y+=st){ c.moveTo(0,Math.round(y)+0.5); c.lineTo(w,Math.round(y)+0.5); } c.stroke();
  c.strokeStyle=T.gridS; c.beginPath(); for(let y=st*4;y<hh;y+=st*4){ c.moveTo(0,Math.round(y)+0.5); c.lineTo(w,Math.round(y)+0.5); } c.stroke(); }
function seg2(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function arrow(c,x1,y1,x2,y2,col,lw=2){ const L=Math.hypot(x2-x1,y2-y1); if(L<2) return; const a=Math.atan2(y2-y1,x2-x1), hl=Math.min(12,L*0.45);
  c.strokeStyle=col; c.fillStyle=col; c.lineWidth=lw; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2-Math.cos(a)*hl*0.7,y2-Math.sin(a)*hl*0.7); c.stroke();
  c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-hl*Math.cos(a-0.42),y2-hl*Math.sin(a-0.42)); c.lineTo(x2-hl*Math.cos(a+0.42),y2-hl*Math.sin(a+0.42)); c.closePath(); c.fill(); }
function dot(c,x,y,r,fill,stroke,lw=2){ c.beginPath(); c.arc(x,y,r,0,Math.PI*2); if(fill){c.fillStyle=fill;c.fill();} if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke();} }
function mark(c,x,y,cls,T,r=6){ if(cls===0){ dot(c,x,y,r,T.c[0],T.surface,1.5); } else { c.fillStyle=T.c[1]; c.fillRect(x-r,y-r,2*r,2*r); c.strokeStyle=T.surface; c.lineWidth=1.5; c.strokeRect(x-r,y-r,2*r,2*r); } }
function world(o,xmin,xmax,ymin,ymax,pad=28){ const sx=(o.w-2*pad)/(xmax-xmin), sy=(o.h-2*pad)/(ymax-ymin); return {sx,sy,X:x=>pad+(x-xmin)*sx,Y:y=>o.h-pad-(y-ymin)*sy,ix:px=>xmin+(px-pad)/sx,iy:py=>ymin+(o.h-pad-py)/sy}; }
function worldEq(o,xmin,xmax,ymin,ymax,pad=20){ const s=Math.min((o.w-2*pad)/(xmax-xmin),(o.h-2*pad)/(ymax-ymin)); const ox=(o.w-(xmax-xmin)*s)/2, oy=(o.h+(ymax-ymin)*s)/2; return {s,sx:s,sy:s,X:x=>ox+(x-xmin)*s,Y:y=>oy-(y-ymin)*s,ix:px=>xmin+(px-ox)/s,iy:py=>ymin+(oy-py)/s}; }
function label(c,txt,x,y,T,opt={}){ c.font=opt.font||font(12,'bold'); const w=c.measureText(txt).width; const pad=4; let lx=opt.align==='right'?x-w-pad*2:opt.align==='center'?x-w/2-pad:x; lx=clamp(lx,2,(opt.maxW||1e9)-w-pad*2-2); c.fillStyle=alpha(T.surface,0.88); c.fillRect(lx,y-9,w+pad*2,18); c.fillStyle=opt.color||T.ink; c.textAlign='left'; c.textBaseline='middle'; c.fillText(txt,lx+pad,y); }

/* control helpers */
function slider(lbl,o,on){ const id=nid('s'); const inp=h('input',{type:'range',id,min:o.min,max:o.max,step:o.step??1,value:o.value}); const fmt=o.fmt||(v=>String(v)); const out=h('output',{for:id},fmt(+o.value));
  inp.addEventListener('input',()=>{ out.textContent=fmt(+inp.value); on(+inp.value); });
  const el=h('div',{class:'ctl'},h('label',{for:id},lbl),inp,out); el.setV=v=>{ inp.value=v; out.textContent=fmt(+inp.value); }; el.inp=inp; el.refresh=()=>{out.textContent=fmt(+inp.value);}; return el; }
function seg(options,val,on,aria){ const el=h('div',{class:'seg',role:'group','aria-label':aria||null});
  const bs=options.map(([v,l])=>{ const b=h('button',{type:'button',id:nid('g'),'aria-pressed':String(v===val)},l); b.addEventListener('click',()=>{ bs.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); on(v); }); return b; });
  el.append(...bs); el.setV=v=>options.forEach(([ov],i)=>bs[i].setAttribute('aria-pressed',String(ov===v))); return el; }
function btn(lbl,on,cls='btn'){ const b=h('button',{type:'button',class:cls,id:nid('b')},lbl); b.addEventListener('click',on); return b; }
function toggle(lbl,init,on){ const b=h('button',{type:'button',class:'btn tog',id:nid('t'),'aria-pressed':String(!!init)},lbl); b.addEventListener('click',()=>{ const v=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',String(v)); on(v); }); return b; }
function chip(lbl,opt={}){ const v=h('b',{},'—'); const el=h('div',{class:'ro'+(opt.big?' big':'')},h('span',{},opt.sw?h('i',{class:'sw sw-'+opt.sw,'aria-hidden':'true'}):null,lbl),v); el.set=x=>{v.textContent=x;}; el.tone=t=>{ if(t) el.dataset.tone=t; else delete el.dataset.tone; }; return el; }
function shell(root){ const stage=h('div',{class:'stage'}), controls=h('div',{class:'controls'}), reads=h('div',{class:'readouts','aria-live':'polite'}), note=h('p',{class:'demo-note'}); root.append(stage,controls,reads,note); return {stage,controls,reads,note}; }
function every(ms,fn){ const t=setInterval(fn,ms); view.cleanups.push(()=>clearInterval(t)); return t; }

 why:'Biết thi gì, chủ đề nào ra nhiều, và nên ôn theo thứ tự nào.',pre:'Không cần kiến thức trước.',
 idea:`<p><b>Vòng 1 (Chủ nhật 18/10/2026):</b> thi viết trên giấy 180 phút, 100 câu trắc nghiệm song ngữ Việt–Anh. 100 bạn điểm cao nhất vào Vòng 2.</p>
<p><b>Đề Vòng 1 năm 2025 trông thế nào?</b> Mỗi câu có 4 phương án và <b>chỉ một đáp án đúng</b>; chọn sai <b>không bị trừ điểm</b>, nên đừng bỏ trống câu nào. Số thập phân viết bằng <b>dấu chấm</b> (0.25 là "không phẩy hai lăm"). Khoảng <b>15 câu phải tính</b>, khoảng <b>12 câu đọc đoạn code</b> Python (PyTorch, scikit-learn, pandas), còn lại là câu hỏi hiểu khái niệm.</p>
<p><b>Chủ đề trong đề 2025 (đếm gần đúng):</b></p>
<div class="scroll-x"><table class="mini"><tr><th>Nhóm chủ đề</th><th>Số câu</th><th>Ở đâu trên trang</th></tr>
<tr><td>Mạng nơ-ron, huấn luyện, PyTorch</td><td>~23</td><td>Phần D</td></tr>
<tr><td>Học máy cổ điển (k-NN, cây, rừng, SVM, k-means, PCA)</td><td>~20</td><td>Phần B</td></tr>
<tr><td>Thị giác máy tính (CNN, phát hiện, phân đoạn)</td><td>~19</td><td>Phần E</td></tr>
<tr><td>Ngôn ngữ, BERT/GPT, LLM</td><td>~19</td><td>Phần F</td></tr>
<tr><td>Đánh giá mô hình, overfitting</td><td>~14</td><td>Phần C</td></tr>
<tr><td>Mô hình sinh, học tự giám sát</td><td>~7</td><td>Phần G</td></tr></table></div>
<p>Các bài được xếp <b>từ dễ đến khó</b>: Phần 0 (làm quen) → A (công cụ toán và code) → B → C → D → E → F → G. Mỗi phần dựa vào phần trước. Phần <b>Đọc thêm</b> gồm những chủ đề có trong đề cương nhưng <b>không xuất hiện trong đề 2025</b> (Bayes, logic, A*, bandit, riêng tư, công bằng, RNN): học khi còn thời gian.</p>
<p><b>Vòng 2 (10/01/2027, Hà Nội):</b> thực hành trên laptop. Sẽ ôn riêng sau khi có kết quả Vòng 1.</p>`,
 life:'Trước một chuyến đi xa, ai cũng xem bản đồ: biết điểm đến, các chặng, chặng nào khó để chuẩn bị trước.',
 rem:['Vòng 1: 100 câu / 180 phút ≈ 1.8 phút một câu','Đề 2025: mỗi câu đúng một đáp án, chọn sai không bị trừ điểm, nên không bỏ trống câu nào','Gạch chân các chữ KHÔNG, SAI, ĐẦU TIÊN trong câu hỏi trước khi đọc phương án','Làm câu chắc chắn trước, đánh dấu câu tính dài để quay lại','Đề song ngữ: học thuật ngữ tiếng Anh trong Từ điển'],
 traps:['Câu "phát biểu nào SAI" rất dễ chọn nhầm một phương án đúng: đọc lại câu hỏi trước khi tô.','Đề có đoạn code: đừng chỉ học lý thuyết, tập đọc từng dòng và đoán kết quả.','Nếu đề năm nay ghi "chọn tất cả đáp án đúng" thì xét từng phương án như một câu Đúng/Sai riêng.'],
 tryit:'Bấm vào một bài trên bản đồ để mở. Bài có dấu ✓ là bài em đã đánh dấu hiểu.',demo:demoRoadmap},
{id:'vector',part:'A',title:'Vector và khoảng cách',
 one:'Máy tính nhìn mọi thứ thành một dãy số. Dãy số đó gọi là vector.',
 idea:'<p>Một bạn cao 160 cm, nặng 50 kg là vector <span class="fx">(160, 50)</span>. Một bức ảnh 28×28 điểm ảnh là một vector 784 số. Khi mọi thứ là vector, ta đo được hai thứ <b>giống</b> hay <b>khác</b> nhau bằng khoảng cách.</p><p><b>Tích vô hướng</b> là phép tính quan trọng nhất: nhân từng cặp số rồi cộng lại. Kết quả lớn khi hai mũi tên cùng hướng, bằng 0 khi chúng vuông góc. Attention trong ChatGPT, k-NN, SVM đều dùng phép này.</p>',
 life:'Tìm quán gần trường: đi chim bay là khoảng cách Euclid. Đi theo các con phố vuông góc là khoảng cách Manhattan. Tính tiền đi chợ (số lượng × đơn giá rồi cộng lại) chính là tích vô hướng.',
 rem:['Tích vô hướng: (1, 2)·(3, 4) = 1×3 + 2×4 = 11','Euclid: √((x₁ − x₂)² + (y₁ − y₂)²)','Manhattan: |x₁ − x₂| + |y₁ − y₂|','Tích vô hướng = 0 ⇔ hai vector vuông góc','Cosine = A·B / (|A| × |B|), nằm từ −1 đến 1','Ma trận A (m×n) nhân B (n×p) cho ra m×p'],
 traps:['Manhattan luôn ≥ Euclid: đi đường vòng không thể ngắn hơn đường thẳng.','Nhân ma trận không giao hoán: AB thường khác BA.','(1,2,3)·(4,5,6) là một SỐ (32), không phải vector (4, 10, 18).'],
 tryit:'Kéo chấm A và B. Tìm vị trí để A·B = 0. Lúc đó hai mũi tên tạo góc bao nhiêu độ?',demo:demoVector},
{id:'gradient',part:'A',title:'Gradient descent: đi xuống dốc',
 one:'Máy học bằng cách sửa sai từng chút một, giống người đi xuống núi trong sương mù.',
 idea:'<p>Mô hình có các "núm vặn" gọi là tham số <span class="fx">w</span>. Hàm lỗi <span class="fx">L(w)</span> cho biết mô hình đang sai bao nhiêu. Ta muốn tìm w để L nhỏ nhất, tức là đáy thung lũng.</p><p><b>Độ dốc</b> (đạo hàm) cho biết đi về phía nào thì lỗi tăng. Ta bước <b>ngược</b> lại. Bước dài hay ngắn do <b>learning rate η</b> quyết định.</p>',
 life:'Chỉnh nước vòi sen: nóng quá thì vặn về phía lạnh một chút, rồi thử lại. Vặn mạnh quá thì lúc nóng lúc lạnh, mãi không vừa.',
 rem:['w mới = w − η × độ dốc','Độ dốc dương → giảm w. Độ dốc âm → tăng w','η quá lớn: nhảy qua lại, có thể văng ra xa (phân kỳ)','η quá nhỏ: đi rất chậm','Hàm nhiều thung lũng có thể kẹt ở cực tiểu cục bộ','Đạo hàm của (w − 3)² là 2(w − 3)','Quy tắc chuỗi: (f(g(x)))′ = f′(g(x)) × g′(x)'],
 traps:['Gradient chỉ hướng hàm TĂNG nhanh nhất, nên phải đi NGƯỢC gradient.','SGD dùng một mẫu hoặc một nhóm nhỏ (mini-batch) mỗi bước, không phải cả tập dữ liệu.'],
 tryit:'Chọn Thung lũng, đặt η = 1,90 rồi bấm Chạy 20 bước. Sau đó thử η = 2,10. Rồi chọn Đồi gồ ghề và bấm vào các chỗ khác nhau để đổi điểm xuất phát.',demo:demoGradient},
{id:'bayes',part:'A',title:'Xác suất và định lý Bayes',
 one:'Xét nghiệm dương tính chưa chắc đã bị bệnh, nhất là khi bệnh rất hiếm.',
 idea:'<p><b>Xác suất có điều kiện</b> <span class="fx">P(A | B)</span> là xác suất A xảy ra khi đã biết B xảy ra.</p><p>Mẹo không cần công thức: tưởng tượng <b>1000 người</b> rồi đếm từng nhóm. Bao nhiêu người bệnh? Trong đó bao nhiêu người dương tính? Trong số người khỏe, bao nhiêu người bị báo nhầm? Cuối cùng chia: số người bệnh và dương tính / tổng số người dương tính.</p>',
 life:'Chuông báo cháy kêu chưa chắc có cháy. Nếu cháy rất hiếm, phần lớn các lần chuông kêu là báo nhầm do khói bếp.',
 rem:['P(A | B) = P(A và B) / P(B)','P(bệnh | +) = số người bệnh và + / tổng số người +','P(+) = P(+ | bệnh)·P(bệnh) + P(+ | khỏe)·P(khỏe)','Kỳ vọng = Σ giá trị × xác suất. Xúc xắc 6 mặt: 3,5','A, B độc lập ⇔ P(A và B) = P(A) × P(B)'],
 traps:['P(+ | bệnh) khác P(bệnh | +). Đề hay cho cái này rồi hỏi cái kia.','Tỉ lệ nền (bệnh hiếm hay phổ biến) ảnh hưởng rất mạnh đến kết quả.'],
 tryit:'Giữ độ nhạy 99%, báo nhầm 5%. Kéo tỉ lệ bệnh từ 1% lên 20%. P(bệnh | dương tính) thay đổi thế nào?',demo:demoBayes},
{id:'logic',part:'A',title:'Logic và suy luận',
 one:'Đề Vòng 1 có phần toán logic. Bảng chân trị là công cụ kiểm tra mọi mệnh đề.',
 why:'Đề Vòng 1 có phần toán logic; logic cũng là cách AI cổ điển suy luận.',pre:'Không cần kiến thức trước, chỉ cần đọc kỹ.',
 idea:'<p><b>Mệnh đề</b> là câu hoặc đúng hoặc sai: "Trời mưa" (p), "Đường ướt" (q). Ta ghép chúng bằng các phép <b>và</b> (∧), <b>hoặc</b> (∨), <b>không</b> (¬), <b>kéo theo</b> (→).</p><p>Phép dễ nhầm nhất là <b>p → q</b> ("nếu p thì q"): nó chỉ <b>sai</b> khi p đúng mà q sai. Hai mệnh đề <b>tương đương</b> khi chúng có cùng giá trị ở mọi dòng của bảng chân trị.</p>',
 life:'"Nếu em được 10 điểm thì mẹ thưởng." Mẹ chỉ nói sai khi em được 10 mà không được thưởng. Em không được 10 mà mẹ vẫn thưởng thì mẹ không hề nói sai.',
 rem:['p → q chỉ sai khi p đúng, q sai','p → q ≡ ¬q → ¬p ≡ ¬p ∨ q','p → q KHÔNG tương đương q → p','De Morgan: ¬(p ∧ q) ≡ ¬p ∨ ¬q; ¬(p ∨ q) ≡ ¬p ∧ ¬q','Phủ định của "mọi x đều P" là "có x không P"','Modus ponens: có p và p → q thì suy ra q. Modus tollens: có ¬q và p → q thì suy ra ¬p'],
 traps:['Từ q và p → q KHÔNG suy ra được p (lỗi khẳng định hệ quả).','XOR (p ⊕ q) đúng khi đúng một trong hai, khác với hoặc (∨).'],
 tryit:'Chọn hai mệnh đề để so bảng chân trị. Tìm các mệnh đề tương đương với p → q.',demo:demoLogic},
{id:'hoi-quy',part:'B',title:'Hồi quy tuyến tính và MSE',
 one:'Vẽ một đường thẳng đi gần các điểm nhất để dự đoán một con số.',
 idea:'<p>Mô hình là <span class="fx">ŷ = a·x + b</span>. Sai số mỗi điểm là y thật trừ y dự đoán. <b>MSE</b> là trung bình bình phương các sai số.</p><p>Trong hình, mỗi sai số được vẽ thành <b>một hình vuông đỏ</b>: cạnh là sai số, diện tích là bình phương sai số. MSE là diện tích trung bình. Máy tìm a và b để tổng diện tích nhỏ nhất. Hồi quy đoán <b>số</b>, còn phân loại đoán <b>nhãn</b>.</p>',
 life:'Dự đoán điểm thi từ số giờ tự học, hay giá nhà từ diện tích.',
 rem:['MSE = (1/n) × Σ (y − ŷ)²','Bình phương → sai số lớn bị phạt rất nặng → MSE nhạy với điểm ngoại lai','MAE = trung bình |y − ŷ|, ít nhạy ngoại lai hơn','Hồi quy logistic: tên là hồi quy nhưng là thuật toán PHÂN LOẠI, dùng sigmoid ra xác suất','Loss của hồi quy logistic: cross-entropy'],
 traps:['Sai số 1 và 2 → MSE = (1 + 4)/2 = 2,5, không phải (1 + 2)/2.','RMSE = √MSE, cùng đơn vị với y.'],
 tryit:'Ở chế độ Máy tự khớp, bấm Thêm điểm ngoại lai. Đường thẳng bị kéo lệch bao nhiêu? Rồi thử tự chỉnh tay để MSE thấp nhất.',demo:demoRegression},
{id:'knn',part:'B',title:'k-NN: hỏi hàng xóm',
 one:'Muốn đoán một điểm mới thuộc nhóm nào, hỏi k điểm gần nó nhất rồi theo số đông.',
 idea:'<p>k-NN không cần "học" trước, chỉ cần nhớ dữ liệu. Khi có điểm mới, tính khoảng cách đến mọi điểm, lấy k điểm gần nhất và bỏ phiếu.</p><p><b>k nhỏ</b> (k = 1): tin vào một hàng xóm, dễ bị điểm nhiễu đánh lừa, ranh giới gồ ghề (overfit). <b>k lớn</b>: kết quả mượt nhưng bỏ qua chi tiết (underfit).</p>',
 life:'Mới chuyển trường, muốn biết quán ăn nào ngon: hỏi 5 bạn ngồi gần nhất rồi nghe theo số đông.',
 rem:['Có giám sát: dữ liệu có nhãn','Chọn k lẻ để tránh hòa phiếu (2 lớp)','PHẢI chuẩn hóa đặc trưng trước khi tính khoảng cách','Dự đoán chậm: phải tính khoảng cách tới mọi điểm','k = 1 → lỗi trên tập train bằng 0 (nếu không có hai điểm trùng nhau mà khác nhãn)','Số chiều lớn → mọi điểm xa nhau gần như nhau (lời nguyền số chiều)'],
 traps:['Thu nhập tính bằng triệu, tuổi tính bằng năm: thu nhập áp đảo khoảng cách nếu không chuẩn hóa.','k-NN (phân loại, có nhãn) khác k-means (phân cụm, không nhãn).'],
 tryit:'Bật Tô vùng quyết định, kéo k từ 1 lên 19. Ranh giới thay đổi thế nào? Kéo dấu ? tới chỗ hai nhóm giao nhau.',demo:demoKNN},
{id:'xu-ly',part:'B',title:'Tiền xử lý dữ liệu và đặc trưng',
 one:'Dữ liệu thật luôn bẩn: thiếu ô, lệch thang đo, có chữ thay vì số. Làm sạch đúng cách quan trọng không kém chọn mô hình.',
 idea:'<p>Trước khi huấn luyện, dữ liệu cần được xử lý: <b>điền giá trị thiếu</b> (bằng trung bình, trung vị hoặc giá trị hay gặp nhất), đổi cột chữ thành số bằng <b>one-hot</b> (mỗi giá trị một cột 0/1), và <b>chuẩn hóa</b> để các đặc trưng có thang đo giống nhau.</p><p>Chuẩn hóa z-score: <span class="fx">z = (x − trung bình) / độ lệch chuẩn</span>. Min-max: <span class="fx">(x − min) / (max − min)</span> đưa về [0, 1]. Mọi thống kê (trung bình, min, max) phải tính trên <b>tập train</b> rồi mới áp cho validation và test. <b>Kỹ thuật đặc trưng</b> là tạo thêm cột có ích, ví dụ chỉ số BMI từ chiều cao và cân nặng.</p>',
 life:'Nấu ăn: nhặt rau, rửa sạch, thái đều trước khi nấu. Nguyên liệu bẩn thì đầu bếp giỏi mấy cũng khó ra món ngon.',
 rem:['Thiếu dữ liệu: bỏ hàng (nếu rất ít), hoặc điền trung bình, trung vị, giá trị hay gặp nhất','One-hot: cột "màu" có 3 giá trị → 3 cột 0/1','Đừng mã hóa đỏ = 1, xanh = 2, vàng = 3 cho cột không có thứ tự: mô hình sẽ tưởng vàng > xanh > đỏ','z-score: trung bình 0, độ lệch chuẩn 1. Min-max: về khoảng [0, 1]','Cần chuẩn hóa: k-NN, SVM, k-means, PCA, mạng nơ-ron. Hầu như không cần: cây quyết định, random forest','Rò rỉ dữ liệu: lúc huấn luyện dùng thông tin của tập test hoặc thông tin chỉ có sau khi biết đáp án','Dữ liệu mất cân bằng: dùng trọng số lớp hoặc lấy mẫu lại, đo bằng F1, recall thay vì accuracy'],
 traps:['Tính trung bình để chuẩn hóa trên CẢ tập dữ liệu (gồm test) là rò rỉ dữ liệu.','Trung vị ít bị ngoại lai kéo lệch hơn trung bình.'],
 tryit:'Bấm vào khung để đặt điểm cần đoán. So 5 hàng xóm gần nhất khi CHƯA và ĐÃ chuẩn hóa. Sau đó làm phần xếp thẻ bên dưới.',demo:demoPrep},
{id:'cay',part:'B',title:'Cây quyết định và Gini',
 one:'Chơi trò 20 câu hỏi: mỗi câu hỏi chia dữ liệu thành hai nhóm thuần hơn.',
 idea:'<p>Một nhóm "thuần" là nhóm gần như chỉ có một màu. <b>Gini</b> đo độ lẫn lộn: 0 là thuần hoàn toàn, 0,5 là lẫn nhất (2 lớp, mỗi lớp một nửa).</p><p>Máy thử mọi câu hỏi có thể ("x &lt; 4?", "y &lt; 6?") và chọn câu làm Gini trung bình (tính theo số mẫu mỗi nhánh) giảm nhiều nhất. Rồi lặp lại cho từng nhánh. <b>Random forest</b> là nhiều cây, mỗi cây học trên một phần dữ liệu ngẫu nhiên, rồi bỏ phiếu.</p>',
 life:'Bác sĩ hỏi: "Có sốt không?" → "Có ho không?" → kết luận. Mỗi câu hỏi loại bớt khả năng.',
 rem:['Gini = 1 − Σ pᵢ². Nhóm 50/50: 0,5. Nhóm 100/0: 0','Entropy = −Σ pᵢ log₂ pᵢ. Nhóm 50/50: 1','Gini sau chia = trung bình có trọng số theo số mẫu mỗi nhánh','Information gain = độ lẫn trước − độ lẫn sau','Cây quá sâu → học thuộc → overfit. Giới hạn độ sâu, cắt tỉa','Random forest giảm phương sai; boosting giảm bias'],
 traps:['Gini 50/50 = 0,5 nhưng entropy 50/50 = 1. Đừng nhầm hai con số.','Cây quyết định không cần chuẩn hóa dữ liệu.'],
 tryit:'Bấm Tìm ngưỡng tốt nhất khi chia theo x, rồi đổi sang chia theo y. Cách nào làm Gini giảm nhiều hơn?',demo:demoTree},
{id:'svm',part:'B',title:'SVM: đường chia có lề rộng nhất',
 one:'Có nhiều đường chia được hai nhóm. SVM chọn đường cách xa điểm gần nhất của cả hai bên nhất.',
 idea:'<p>Khi hai nhóm tách được bằng một đường thẳng, có vô số đường chia đúng. SVM chọn đường có <b>lề</b> (khoảng trống hai bên) rộng nhất, vì đường như vậy ít bị ảnh hưởng khi điểm mới hơi lệch.</p><p>Chỉ vài điểm nằm sát mép lề quyết định đường chia: đó là các <b>vector hỗ trợ</b> (support vector). Xóa một điểm ở xa thì đường không đổi. Khi dữ liệu không tách thẳng được, SVM dùng <b>lề mềm</b> (cho phép vài điểm sai, phạt theo tham số C) và <b>kernel</b> để tạo ranh giới cong.</p>',
 life:'Kẻ vạch chia sân cho hai đội: kẻ ở giữa khoảng trống rộng nhất để không ai phải đứng sát vạch.',
 rem:['Ranh giới: w·x + b = 0','Khoảng cách từ điểm x tới đường w·x + b = 0 là |w·x + b| / ‖w‖','Khi chuẩn hóa để điểm gần nhất có |w·x + b| = 1: độ rộng lề cả hai bên = 2 / ‖w‖','Vector hỗ trợ: các điểm nằm trên mép lề; chỉ chúng quyết định đường chia','C lớn: phạt sai nặng, lề hẹp, dễ overfit. C nhỏ: lề rộng, chấp nhận vài điểm sai','Kernel (RBF, đa thức) cho ranh giới cong mà không cần tính đặc trưng mới','SVM cần chuẩn hóa dữ liệu'],
 traps:['Bỏ một điểm KHÔNG phải vector hỗ trợ thì ranh giới không đổi.','SVM cơ bản phân loại 2 lớp; nhiều lớp thì ghép nhiều SVM (một-chọi-một hoặc một-chọi-còn-lại).'],
 tryit:'Xoay và dịch đường đỏ để mọi điểm nằm đúng phía và lề rộng nhất. Rồi bấm Tìm lề rộng nhất: điểm nào được khoanh tròn? Thử Thêm điểm lạc.',demo:demoSVM},
{id:'kmeans',part:'B',title:'k-means: máy tự chia nhóm',
 one:'Không có đáp án sẵn. Máy tự gom các điểm gần nhau thành k nhóm.',
 idea:'<p>Đây là <b>học không giám sát</b>: dữ liệu không có nhãn. k-means lặp hai bước:</p><p><b>1. Gán:</b> mỗi điểm về tâm gần nó nhất. <b>2. Cập nhật:</b> dời mỗi tâm về trung bình các điểm trong nhóm. Lặp đến khi không điểm nào đổi nhóm.</p>',
 life:'Chia lớp thành 3 tổ theo chỗ ở: mỗi bạn về tổ có "điểm tập trung" gần nhà nhất, rồi dời điểm tập trung về giữa các nhà trong tổ.',
 rem:['Không giám sát: không có nhãn','Lặp: gán → cập nhật','Luôn dừng, nhưng kết quả phụ thuộc vị trí tâm ban đầu','Phải chọn trước k (phương pháp khuỷu tay, silhouette)','Inertia = tổng bình phương khoảng cách điểm tới tâm của nó','PCA cũng là không giám sát: giảm số chiều, giữ phương sai lớn nhất'],
 traps:['Tâm mới là TRUNG BÌNH các điểm trong nhóm, không phải điểm gần nhất.','k-means hợp với cụm tròn, kích thước gần nhau; nhạy với ngoại lai.'],
 tryit:'Kéo cả 3 tâm dồn vào một góc rồi bấm Tự chạy. So inertia với khi bấm Tâm ngẫu nhiên. Có lúc kết quả tệ hơn không?',demo:demoKMeans},
{id:'pca',part:'B',title:'PCA: giảm số chiều',
 one:'Nhìn đám điểm từ hướng thấy chúng trải rộng nhất, rồi bỏ bớt những hướng gần như không có thông tin.',
 idea:'<p>Dữ liệu nhiều cột thường có các cột đi cùng nhau (chiều cao và sải tay). <b>PCA</b> tìm các hướng mới gọi là <b>thành phần chính</b>: hướng thứ nhất là hướng dữ liệu trải rộng nhất (phương sai lớn nhất), hướng thứ hai vuông góc với hướng thứ nhất, cứ thế tiếp.</p><p>Chiếu dữ liệu lên vài thành phần đầu là giữ được phần lớn thông tin mà ít cột hơn. Phần phương sai giữ lại bằng tổng các <b>trị riêng</b> đã giữ chia cho tổng mọi trị riêng. PCA không dùng nhãn nên là học không giám sát.</p>',
 life:'Chụp ảnh một cái bàn: chụp từ trên xuống thấy rõ hình dáng, chụp ngang mặt bàn chỉ thấy một vạch mỏng. PCA chọn góc chụp thấy rõ nhất.',
 rem:['Bước đầu: trừ trung bình mỗi cột (thường chuẩn hóa luôn)','Thành phần chính = vector riêng của ma trận hiệp phương sai','Phương sai theo mỗi thành phần = trị riêng tương ứng','Tỉ lệ giữ = tổng trị riêng giữ lại / tổng mọi trị riêng','Các thành phần chính vuông góc với nhau','Dùng để: vẽ dữ liệu nhiều chiều, nén, bớt nhiễu, tăng tốc mô hình','Không giám sát: không dùng nhãn'],
 traps:['Không chuẩn hóa trước PCA thì cột có đơn vị lớn (đồng, mét) chiếm hết thành phần đầu.','Hướng phương sai lớn nhất chưa chắc là hướng tách các lớp tốt nhất, vì PCA không nhìn nhãn.'],
 tryit:'Xoay trục tím để phần trăm phương sai giữ lại lớn nhất. Rồi bấm Tìm trục tốt nhất. Trục thứ hai (vuông góc) giữ bao nhiêu phần trăm?',demo:demoPCA},
{id:'overfit',part:'B',title:'Overfitting: học thuộc lòng',
 one:'Mô hình giỏi là mô hình làm đúng đề MỚI, không phải thuộc lòng đề cũ.',
 idea:'<p>Chấm tím là dữ liệu <b>train</b> (để học). Vòng cam là dữ liệu <b>test</b> (đề mới, mô hình chưa thấy). Đường cong là đa thức bậc d.</p><p>Bậc thấp quá: không bắt được quy luật, sai cả hai (<b>underfit</b>). Bậc cao quá: đi qua đúng mọi điểm train, kể cả nhiễu, nhưng sai nhiều ở test (<b>overfit</b>). <b>Regularization λ</b> phạt đường cong ngoằn ngoèo, kéo mô hình về đơn giản hơn.</p>',
 life:'Học sinh học thuộc đáp án đề cũ: được 10 điểm đề cũ nhưng trượt đề mới.',
 rem:['Underfit: lỗi train cao, lỗi test cao','Overfit: lỗi train rất thấp, lỗi test cao hơn hẳn','Train: học trọng số. Validation: chọn siêu tham số. Test: dùng 1 lần cuối','k-fold: chia k phần, mỗi phần lần lượt làm validation, lấy trung bình','Chống overfit: thêm dữ liệu, regularization, dropout, early stopping, mô hình đơn giản hơn','L1 đẩy nhiều trọng số về đúng 0; L2 làm trọng số nhỏ đều','Muốn sai số tổng quát hóa giảm một nửa: cần gấp 4 lần dữ liệu (tỉ lệ 1/√n)','Bias cao ↔ underfit; variance cao ↔ overfit (đánh đổi bias–variance)'],
 traps:['Dùng tập test để chỉnh mô hình là gian lận: điểm test sẽ đẹp giả.','Chuẩn hóa phải tính trên train rồi mới áp cho test (tránh rò rỉ dữ liệu).'],
 tryit:'Kéo bậc lên 9: lỗi train gần 0 nhưng lỗi test thế nào? Giữ bậc 9 và tăng λ. Bấm Dữ liệu mới vài lần ở bậc 9.',demo:demoOverfit},
{id:'danh-gia',part:'B',title:'Đánh giá: precision, recall, F1',
 one:'Accuracy cao chưa chắc mô hình tốt. Phải xem nó sai kiểu gì.',
 idea:'<p>Mô hình chấm mỗi người một điểm từ 0 đến 1. Ta chọn một <b>ngưỡng</b>: điểm ≥ ngưỡng thì đoán Dương. Kết quả rơi vào 4 ô: <b>TP</b> bắt đúng, <b>FN</b> bỏ sót, <b>FP</b> báo nhầm, <b>TN</b> bỏ qua đúng.</p><p><b>Precision</b>: trong những ca máy bảo dương, bao nhiêu % đúng? <b>Recall</b>: trong những ca dương thật, máy bắt được bao nhiêu %? Nâng ngưỡng thì precision thường tăng, recall giảm.</p>',
 life:'Lọc thư rác: báo nhầm (xóa mất thư quan trọng) rất tệ → cần precision cao. Sàng lọc ung thư: bỏ sót rất tệ → cần recall cao.',
 rem:['Precision = TP / (TP + FP)','Recall = TP / (TP + FN)','F1 = 2·P·R / (P + R), bị kéo về số nhỏ hơn','Tăng ngưỡng: precision thường tăng, recall giảm','Với xác suất chuẩn: ngưỡng tối ưu = C_FP / (C_FP + C_FN)','Tỉ lệ ca dương giảm: recall và FPR giữ nguyên, precision giảm','Macro-average: trung bình cộng các lớp, mỗi lớp nặng như nhau','ROC: TPR theo FPR khi đổi ngưỡng. AUC = 1 hoàn hảo, 0,5 như đoán bừa'],
 traps:['Dữ liệu 99% âm: luôn đoán âm được accuracy 99% nhưng recall = 0.','Chữ thứ 2 (P/N) là máy đoán gì, chữ thứ 1 (T/F) là đoán đúng hay sai.'],
 tryit:'Kéo tỉ lệ ca dương từ 30% xuống 2%. Recall có đổi không? Precision thì sao? Rồi tăng chi phí bỏ sót và bấm Đặt ngưỡng ít tốn kém nhất.',demo:demoMetrics},
{id:'noron',part:'C',title:'Nơ-ron và hàm kích hoạt',
 one:'Một nơ-ron: nhân trọng số, cộng lại, rồi cho qua một hàm "bật hay tắt".',
 idea:'<p><span class="fx">z = w₁·x₁ + w₂·x₂ + b</span>. Perceptron ra 1 nếu z &gt; 0. Đường z = 0 là <b>một đường thẳng</b> chia mặt phẳng làm hai. Vì vậy một nơ-ron làm được AND, OR nhưng <b>không làm được XOR</b>.</p><p>Xếp nhiều nơ-ron thành nhiều lớp (mạng nơ-ron) thì giải được. <b>Backpropagation</b> dùng quy tắc chuỗi, tính từ lỗi ở cuối ngược về đầu, để biết sửa mỗi trọng số bao nhiêu.</p>',
 life:'Bạn quyết định đi đá bóng: (trời đẹp × 2) + (có bạn rủ × 3) − 4 &gt; 0 thì đi. Mỗi lý do có một "trọng số".',
 rem:['z = w·x + b, đầu ra = f(z)','Một perceptron không giải được XOR; cần ít nhất 1 lớp ẩn','Sigmoid ra (0, 1), đạo hàm lớn nhất 0,25 → mạng sâu bị vanishing gradient','ReLU = max(0, z): mặc định cho lớp ẩn','Không có hàm kích hoạt phi tuyến, nhiều lớp vẫn chỉ như 1 lớp tuyến tính','Số tham số lớp n_vào → n_ra: n_vào × n_ra + n_ra','Softmax biến điểm thành xác suất các lớp, tổng bằng 1'],
 traps:['Khởi tạo mọi trọng số bằng 0 → mọi nơ-ron học giống hệt nhau.','Epoch = một lượt qua toàn bộ tập train. 1000 mẫu, batch 100 → 10 bước mỗi epoch.'],
 tryit:'Chọn XOR rồi bấm Tự học đến khi đúng hết. Máy có tìm được đường thẳng không? Thử AND, OR, NAND.',demo:demoNeuron},
{id:'cnn',part:'C',title:'CNN: tích chập trên ảnh',
 one:'Cho một ô cửa sổ nhỏ (kernel) trượt trên ảnh; ở mỗi chỗ nhân từng cặp rồi cộng lại.',
 idea:'<p><b>Kernel</b> là bộ lọc nhỏ 3×3 dùng để tìm một mẫu (cạnh dọc, cạnh ngang). Kết quả là <b>feature map</b>: chỗ nào có mẫu đó thì số lớn. Cùng một kernel dùng ở mọi vị trí nên có rất ít tham số.</p><p><b>Stride</b> là bước nhảy của kernel. <b>Padding</b> là thêm viền số 0 quanh ảnh. <b>Max pooling</b> thu nhỏ ảnh bằng cách giữ số lớn nhất trong mỗi ô 2×2.</p>',
 life:'Soi tìm chữ trong vở bằng một tấm bìa đục lỗ nhỏ, dịch từng chút một từ trái sang phải, trên xuống dưới.',
 rem:['Kích thước ra = ⌊(W − K + 2P) / S⌋ + 1','Số kênh ra = số kernel','Tham số lớp conv = (K × K × C_vào + 1) × số kernel','Pooling không có tham số, không đổi số kênh','Giữ nguyên kích thước (S = 1): P = (K − 1)/2','Lớp đầu học cạnh, lớp sau học hình dạng, lớp cuối học vật thể'],
 traps:['Nhớ +1 trong công thức và làm tròn XUỐNG.','Đếm tham số đừng quên bias (+1 cho mỗi kernel).'],
 tryit:'Chọn ảnh Chữ T, kernel Cạnh dọc. Ô nào trong feature map lớn nhất? Đổi stride sang 2, padding sang 1: kích thước còn bao nhiêu? Kiểm tra bằng máy tính bên dưới.',demo:demoCNN},
{id:'rnn',part:'C',title:'RNN: mạng có trí nhớ',
 one:'Đọc câu từng từ một, mang theo một "trí nhớ" tóm tắt những gì đã đọc.',
 idea:'<p>Văn bản, âm thanh, giá cổ phiếu là <b>chuỗi</b>: thứ tự rất quan trọng. <b>RNN</b> đọc lần lượt từng phần tử và giữ một trạng thái ẩn h: <span class="fx">hₜ = tanh(W·hₜ₋₁ + U·xₜ + b)</span>. Cùng một bộ trọng số được dùng lại ở mọi bước.</p><p>Khi lan truyền ngược qua nhiều bước, gradient bị nhân với nhau nhiều lần: các thừa số nhỏ hơn 1 thì gradient <b>tiêu biến</b> (mô hình quên đầu câu), lớn hơn 1 thì <b>bùng nổ</b>. <b>LSTM</b> và <b>GRU</b> thêm các "cổng" để giữ trí nhớ lâu hơn. Transformer thay RNN bằng attention: nhìn cả câu cùng lúc và chạy song song được.</p>',
 life:'Nghe kể chuyện: em nhớ tóm tắt những gì đã nghe để hiểu câu tiếp theo. Truyện dài quá thì quên mất đoạn đầu.',
 rem:['hₜ = tanh(W·hₜ₋₁ + U·xₜ + b): trạng thái mới phụ thuộc trạng thái cũ và đầu vào mới','Dùng chung trọng số ở mọi bước → số tham số không phụ thuộc độ dài chuỗi','Huấn luyện bằng lan truyền ngược theo thời gian (BPTT)','Gradient qua T bước ≈ tích T thừa số: nhỏ hơn 1 thì tiêu biến, lớn hơn 1 thì bùng nổ','Chống bùng nổ gradient: cắt gradient (gradient clipping)','LSTM, GRU dùng các cổng (quên, vào, ra) để nhớ xa hơn','RNN phải chạy tuần tự từng bước; Transformer xử lý mọi vị trí song song'],
 traps:['RNN không có trọng số riêng cho từng vị trí: cùng W, U cho mọi bước.','Tiêu biến gradient làm RNN khó học quan hệ xa, chứ không làm nó chạy chậm hơn.'],
 tryit:'Chỉ từ đầu tiên mang tín hiệu. Kéo W từ 0,5 lên 1,2: ở cuối câu còn nhớ được bao nhiêu? Đổi sang LSTM rồi kéo cổng quên.',demo:demoRNN},
{id:'attention',part:'C',title:'Transformer: attention và vị trí',
 one:'Khi đọc một từ, mô hình nhìn lại cả câu xem từ nào liên quan nhất.',
 idea:'<p>Mỗi từ có một câu hỏi (<b>Query</b>), một nhãn (<b>Key</b>) và một nội dung (<b>Value</b>). Điểm liên quan giữa hai từ là Query · Key. <b>Softmax</b> biến các điểm thành phần trăm cộng lại 100%. Kết quả là trung bình các Value theo phần trăm đó.</p><p>Bản thân attention <b>không biết thứ tự</b>: "chó cắn người" và "người cắn chó" cho ra cùng các vector, chỉ bị đổi chỗ. Vì vậy cần <b>positional encoding</b>: cộng vào mỗi từ một "mã số ghế" làm từ các sóng sin, cos.</p>',
 life:'Đọc câu "Con mèo không ăn cá vì nó no", muốn hiểu "nó" là ai, bạn nhìn lại và thấy "mèo".',
 rem:['Attention = softmax(Q·Kᵀ / √dₖ) · V','Chia √dₖ để softmax không quá nhọn, gradient không quá nhỏ','Độ phức tạp O(n²) theo độ dài câu n','Positional encoding được CỘNG vào embedding, cùng số chiều','Sin/cos: giá trị trong [−1, 1]; chiều đầu đổi nhanh, chiều sau đổi chậm','PE(pos + k) là phép biến đổi tuyến tính (phép quay) của PE(pos)','PE(0) = (0, 1, 0, 1, …) vì sin 0 = 0, cos 0 = 1','GPT dùng masked attention: chỉ nhìn các từ phía trước'],
 traps:['Không có positional encoding, xáo trộn từ đầu vào chỉ làm xáo trộn đầu ra tương ứng.','Multi-head: nhiều đầu attention chạy song song, mỗi đầu học một kiểu quan hệ.'],
 tryit:'Bấm vào từ "nó" và "ăn". Mỗi từ chú ý nhiều nhất tới từ nào? Đổi sang Không chia √dₖ. Rê chuột trên bản đồ sin/cos.',demo:demoAttention},
{id:'tim-kiem',part:'D',title:'Tìm đường: BFS, DFS, A*',
 one:'Tìm đường từ S đến G. Các thuật toán khác nhau ở chỗ ô nào được xét trước.',
 idea:'<p><b>BFS</b> lan đều như vết dầu loang, luôn tìm đường ít bước nhất. <b>DFS</b> lao thẳng một hướng đến cùng, tốn ít bộ nhớ nhưng đường thường dài. <b>A*</b> xét ô có <span class="fx">f = g + h</span> nhỏ nhất: g là quãng đã đi, h là ước lượng quãng còn lại.</p><p>Nếu h <b>không bao giờ ước lượng quá</b> quãng thật (admissible), A* luôn tìm được đường ngắn nhất và thường xét ít ô hơn BFS. Nhân h lên 3 thì nhanh hơn nhưng có thể mất đường ngắn nhất.</p>',
 life:'Tìm lớp học trong trường mới: BFS là hỏi hết các phòng gần trước. A* là đi về phía có biển chỉ dẫn, vừa đi vừa ước lượng còn bao xa.',
 rem:['BFS: hàng đợi; tối ưu khi mọi bước cùng chi phí','DFS: ngăn xếp; tốn ít bộ nhớ; không tối ưu','A*: f(n) = g(n) + h(n)','Admissible: h(n) ≤ chi phí thật còn lại','Consistent: h(n) ≤ c(n, n′) + h(n′); consistent kéo theo admissible','Lưới đi 4 hướng: Manhattan là admissible','A* dừng khi LẤY đích ra để mở rộng, không phải khi mới thấy đích','Tìm kiếm đồ thị không mở lại ô đã xét: cần h consistent mới chắc chắn tối ưu'],
 traps:['Cạnh có chi phí khác nhau: BFS không còn tối ưu, dùng uniform cost hoặc A*.','max(h₁, h₂) của hai heuristic admissible vẫn admissible; h₁ + h₂ thường không.'],
 tryit:'Lần lượt bấm BFS, A*, A* (h × 3), DFS. So số ô đã xét và độ dài đường. Tự vẽ thêm tường rồi chạy lại.',demo:demoSearch},
{id:'bandit',part:'D',title:'Bandit: khám phá hay khai thác',
 one:'Có nhiều máy, chưa biết máy nào tốt. Thử thêm máy lạ, hay chơi tiếp máy đang tốt nhất?',
 idea:'<p>Mỗi máy cho thưởng 1 với một xác suất bí mật. <b>Khai thác</b>: chọn máy đang có trung bình Q cao nhất. <b>Khám phá</b>: thử máy khác, vì đánh giá hiện tại có thể sai do mới thử ít lần.</p><p><b>Regret</b> là phần thưởng bị mất so với nếu biết trước máy tốt nhất. <b>UCB</b> cộng thêm "điểm tò mò" cho máy ít được thử, nên vừa khám phá vừa khai thác thông minh.</p>',
 life:'Chọn quán ăn trưa: ăn mãi quán quen (khai thác) hay thử quán mới mở (khám phá)?',
 rem:['ε-greedy: xác suất ε chọn ngẫu nhiên, còn lại chọn máy Q cao nhất','P(chọn máy đang tốt nhất) = (1 − ε) + ε/K','UCB = Q + c·√(ln t / N)','UCB: regret tăng chậm theo log t; ε cố định: regret tăng tuyến tính','Cập nhật trung bình: Q ← Q + (r − Q)/N','Thompson sampling: rút thăm từ phân phối niềm tin của mỗi máy'],
 traps:['Chỉ khai thác (tham lam) dễ kẹt với máy kém do may mắn lúc đầu.','UCB chọn máy có chỉ số UCB lớn nhất, không phải Q lớn nhất.'],
 tryit:'Tự chơi tay 20 lượt. Rồi bấm So sánh 3 chiến lược: đường regret nào thấp nhất? Đường nào gần như thẳng?',demo:demoBandit},
{id:'bat-thuong',part:'E',title:'Kernel và phát hiện bất thường',
 one:'Điểm bất thường là điểm sống ở nơi thưa người.',
 idea:'<p><b>Kernel</b> đo độ giống nhau giữa hai điểm. Kernel RBF <span class="fx">k(x, z) = e^(−γ·‖x − z‖²)</span> bằng 1 khi trùng nhau và gần 0 khi xa nhau.</p><p>Đặt một "quả đồi" kernel lên mỗi điểm rồi cộng lại, ta được <b>bản đồ mật độ</b>. Điểm có mật độ thấp nhất là bất thường. <b>Kernel trick</b>: thay tích vô hướng bằng kernel giống như làm việc trong không gian nhiều chiều hơn mà không phải tính ra.</p>',
 life:'Ngân hàng phát hiện thẻ bị trộm: giao dịch 50 triệu lúc 3 giờ sáng ở nước ngoài nằm rất xa thói quen thường ngày của chủ thẻ.',
 rem:['RBF: k(x, z) = exp(−γ‖x − z‖²), nằm trong (0, 1], k(x, x) = 1','γ lớn: đồi hẹp, ranh giới ngoằn ngoèo, dễ overfit','γ nhỏ: đồi rộng, mượt, dễ underfit','Kernel hợp lệ: ma trận Gram nửa xác định dương','Tổng, tích, nhân hằng số dương của kernel hợp lệ vẫn hợp lệ','Phát hiện bất thường: z-score (|z| > 3), IQR, LOF, One-class SVM, Isolation Forest'],
 traps:['Bất thường rất hiếm → đừng dùng accuracy, dùng precision, recall.','Hiệu của hai kernel có thể không còn là kernel hợp lệ.'],
 tryit:'Kéo γ từ nhỏ đến lớn. Khi γ rất lớn, có phải điểm nào cũng trông cô đơn? Bấm vào chỗ trống để thêm điểm.',demo:demoAnomaly},
{id:'rieng-tu',part:'E',title:'Riêng tư vi phân',
 one:'Công bố thống kê mà không ai đoán được dữ liệu của riêng một bạn.',
 idea:'<p>Thêm một chút <b>nhiễu ngẫu nhiên</b> vào kết quả. Nhờ nhiễu, kết quả gần như không đổi dù có hay không có một bạn nào đó trong dữ liệu.</p><p><b>ε</b> là ngân sách riêng tư: ε nhỏ thì nhiễu lớn, riêng tư mạnh nhưng kém chính xác. Mỗi lần công bố tiêu tốn ε; hỏi nhiều lần thì ε <b>cộng dồn</b> và sự thật lộ dần.</p>',
 life:'Cô giáo muốn biết bao nhiêu bạn từng chép bài, nhưng không muốn ai bị lộ. Cô công bố con số đã cộng trừ ngẫu nhiên một chút.',
 rem:['Cơ chế Laplace: kết quả + nhiễu Lap(Δ/ε)','Đếm số người: độ nhạy Δ = 1','b = Δ/ε; phương sai Laplace = 2b²','ε nhỏ → nhiễu lớn → riêng tư mạnh, kém chính xác','Hỏi k lần trên cùng dữ liệu: các ε cộng lại','Xử lý thêm kết quả DP (làm tròn) không làm mất riêng tư','Dữ liệu càng lớn, nhiễu càng ít ảnh hưởng'],
 traps:['Xóa tên chưa đủ: vẫn nhận ra người qua ngày sinh, địa chỉ (tấn công liên kết).','ε LỚN là riêng tư YẾU, không phải mạnh.'],
 tryit:'Đặt ε = 0,1 rồi bấm Xem 1000 kết quả có thể. Rồi đặt ε = 2. Biểu đồ hẹp lại hay rộng ra? Bấm Công bố nhiều lần và xem ngân sách.',demo:demoPrivacy},
{id:'cong-bang',part:'E',title:'Công bằng và thiên lệch',
 one:'Một mô hình có thể chính xác mà vẫn bất công với một nhóm người.',
 idea:'<p>Dữ liệu lệch (bất công trong quá khứ, ít mẫu của một nhóm) tạo ra mô hình lệch. Có nhiều định nghĩa công bằng: <b>tỉ lệ được duyệt</b> bằng nhau, <b>người đủ chuẩn</b> được duyệt như nhau (TPR bằng nhau), <b>được duyệt thì khả năng đủ chuẩn</b> như nhau (precision bằng nhau).</p><p>Khi tỉ lệ người đủ chuẩn của hai nhóm khác nhau, <b>không thể</b> đạt mọi tiêu chí cùng lúc. Phải chọn tiêu chí theo hoàn cảnh.</p>',
 life:'Một hệ thống chấm hồ sơ học bổng học từ dữ liệu cũ, nơi trường A từng được ưu tiên, sẽ tiếp tục ưu tiên trường A.',
 rem:['Demographic parity: tỉ lệ duyệt bằng nhau','Equal opportunity: TPR bằng nhau','Equalized odds: TPR và FPR đều bằng nhau','Predictive parity: precision bằng nhau','Tỉ lệ nền khác nhau và mô hình không hoàn hảo → không thể thỏa tất cả (định lý bất khả thi)','Bỏ cột giới tính chưa đủ: địa chỉ, tên trường vẫn là biến đại diện','Quy tắc 4/5: tỉ lệ duyệt nhóm thấp / nhóm cao < 0,8 là dấu hiệu bất lợi'],
 traps:['Riêng tư vi phân thường làm giảm độ chính xác nhiều nhất ở nhóm thiểu số.','Ít dữ liệu của một nhóm là thiên lệch đại diện (lấy mẫu).'],
 tryit:'Bấm Ngưỡng chung 0,5: tiêu chí nào đạt, tiêu chí nào trượt? Rồi bấm Cân bằng tỉ lệ duyệt và Cân bằng precision.',demo:demoFair},
{id:'python',part:'F',title:'Python, pandas, scikit-learn cho Vòng 2',
 one:'Vòng 2 là bài thực hành: đọc dữ liệu, làm sạch, huấn luyện, tự chấm, nộp dự đoán, trên máy không có internet.',
 idea:'<p>Bốn thư viện chính: <b>NumPy</b> (mảng số, tính nhanh), <b>pandas</b> (bảng dữ liệu DataFrame), <b>matplotlib</b> (vẽ biểu đồ), <b>scikit-learn</b> (mô hình học máy). Một quy trình mẫu:</p><pre>import pandas as pd\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import f1_score\n\ndf = pd.read_csv("train.csv")\nX = df.drop(columns=["label"])\ny = df["label"]\nX_tr, X_va, y_tr, y_va = train_test_split(X, y, test_size=0.2, random_state=0)\n\nmodel = RandomForestClassifier(n_estimators=300, random_state=0)\nmodel.fit(X_tr, y_tr)\nprint(f1_score(y_va, model.predict(X_va), average="macro"))\n\ntest = pd.read_csv("test.csv")\npred = model.predict(test[X.columns])\npd.DataFrame({"id": test["id"], "label": pred}).to_csv("submission.csv", index=False)</pre><p>Luôn làm một <b>mô hình mốc</b> đơn giản trước (đoán lớp đa số, hồi quy logistic) và nộp sớm một bản, rồi mới thử mô hình mạnh hơn. Tự chấm bằng đúng chỉ số của đề trên tập validation tự chia.</p>',
 life:'Như thi nấu ăn 5 giờ với tủ lạnh có sẵn: không được gọi điện hỏi ai, nên phải thuộc công thức và luyện tay từ trước.',
 rem:['NumPy: a.shape cho kích thước; a.mean(axis=0) là trung bình theo từng cột','pandas: df.head(), df.info(), df.describe(), df.isnull().sum() để xem nhanh dữ liệu','scikit-learn: model.fit(X, y) để học, model.predict(X) để đoán','train_test_split để tách validation; cross_val_score để kiểm định chéo','Pipeline gom tiền xử lý và mô hình, tránh rò rỉ dữ liệu','Cố định random_state để kết quả lặp lại được','Chọn siêu tham số bằng kiểm định chéo (GridSearchCV hoặc thử tay vài giá trị), không chọn theo tập test','Dữ liệu dạng bảng: random forest, gradient boosting thường rất mạnh','Lưu file nộp đúng định dạng đề yêu cầu (tên cột, thứ tự id)'],
 traps:['fit chỉ trên train; với validation và test chỉ dùng transform hoặc predict.','Không có internet: cài sẵn thư viện, tải sẵn tài liệu về máy và luyện gõ code không cần tra mạng.'],
 tryit:'Xếp mỗi dòng code vào đúng thư viện. Đọc giải thích khi chọn sai.',demo:demoPython},
{id:'rung',part:'B',title:'Rừng ngẫu nhiên, bagging và boosting',
 one:'Nhiều cây quyết định cùng bỏ phiếu thường đoán đúng hơn một cây đơn lẻ.',
 why:'Đề 2025 hỏi thuật toán nào dựa trên bagging, và rừng hồi quy tính kết quả thế nào. Đây cũng là nhóm mô hình mạnh nhất cho dữ liệu dạng bảng ở Vòng 2.',
 pre:'Bài Cây quyết định và Gini.',
 idea:`<p>Một cây quyết định dễ học thuộc dữ liệu, đổi một chút dữ liệu là cây thay đổi hẳn. Cách chữa: trồng <b>nhiều cây</b> rồi gộp ý kiến. Đây gọi là <b>học kết hợp</b> (ensemble).</p><p><b>Bagging</b> (bootstrap aggregating): mỗi cây học trên một bộ dữ liệu <b>lấy mẫu có hoàn lại</b> từ dữ liệu gốc, các cây học <b>song song</b>, độc lập. Phân loại thì <b>bỏ phiếu đa số</b>, hồi quy thì lấy <b>trung bình</b>. <b>Rừng ngẫu nhiên</b> (random forest) là bagging với cây, thêm một chút ngẫu nhiên: mỗi lần chia nút chỉ xét một phần đặc trưng.</p><p><b>Boosting</b> thì khác: các cây học <b>nối tiếp</b>, cây sau tập trung sửa lỗi của các cây trước. XGBoost, LightGBM, CatBoost là các thư viện <b>gradient boosting</b>.</p>`,
 life:'Muốn biết quán ăn nào ngon, hỏi ý kiến 15 bạn rồi theo số đông sẽ đáng tin hơn chỉ hỏi một bạn.',
 tryit:'Kéo độ chính xác của mỗi cây và số cây. Khi mỗi cây chỉ đúng 60%, cần khoảng bao nhiêu cây để cả rừng đúng trên 80%? Bật "Các cây giống hệt nhau" để xem bỏ phiếu còn giúp được gì không.',
 rem:['Bagging: lấy mẫu có hoàn lại, các mô hình học song song, rồi gộp kết quả','Rừng ngẫu nhiên = bagging nhiều cây + mỗi lần chia chỉ xét ngẫu nhiên một phần đặc trưng','Rừng phân loại: bỏ phiếu đa số. Rừng hồi quy: y(x) = (1/K)·Σ Tᵢ(x), tức là trung bình K cây','Bagging chủ yếu giảm phương sai (variance), giúp bớt overfit','Boosting: các mô hình học nối tiếp, cái sau sửa lỗi cái trước, chủ yếu giảm bias','XGBoost, LightGBM, CatBoost, AdaBoost thuộc nhóm boosting','Mô hình dựa trên cây không cần chuẩn hóa dữ liệu'],
 traps:['XGBoost là boosting, không phải bagging. Thuật toán "dựa trên bagging" phổ biến nhất là rừng ngẫu nhiên.','Rừng hồi quy lấy TRUNG BÌNH dự đoán của các cây, không lấy tổng hay lấy giá trị lớn nhất.'],
 demo:demoForest,
 deep:`<h4>1. Ví dụ tính tay</h4>
<div class="ex"><b>Phân loại.</b> 5 cây đoán một con vật: Mèo, Chó, Mèo, Mèo, Chó → 3 phiếu Mèo, 2 phiếu Chó → rừng đoán <b>Mèo</b>.<br><b>Hồi quy.</b> 3 cây đoán giá nhà: 10, 12 và 17 tỉ → rừng đoán (10 + 12 + 17)/3 = <b>13</b> tỉ.</div>
<h4>2. Vì sao bỏ phiếu lại tốt hơn?</h4>
<p>Giả sử mỗi cây đúng 60% và các cây sai <b>độc lập</b> với nhau. Với 5 cây, rừng đúng khi có ít nhất 3 cây đúng:</p>
<div class="ex">P = C(5,3)·0.6³·0.4² + C(5,4)·0.6⁴·0.4 + 0.6⁵ = 0.3456 + 0.2592 + 0.0778 ≈ <b>0.68</b>. Năm cây yếu (60%) gộp lại thành một rừng đúng 68%. Càng nhiều cây, con số càng tăng.</div>
<p>Điều kiện quan trọng là các cây phải <b>khác nhau</b>. Nếu mọi cây giống hệt nhau thì chúng sai cùng lúc, bỏ phiếu không giúp gì. Vì vậy bagging cho mỗi cây một bộ dữ liệu khác, và rừng ngẫu nhiên còn cho mỗi lần chia một nhóm đặc trưng khác.</p>
<h4>3. Lấy mẫu có hoàn lại (bootstrap)</h4>
<p>Từ 1000 mẫu, rút ngẫu nhiên 1000 lần, mỗi lần rút xong <b>trả lại</b>. Có mẫu được rút nhiều lần, có mẫu không được rút (khoảng 37%). Những mẫu không được rút gọi là <b>out-of-bag</b>, dùng để tự kiểm tra cây đó.</p>
<h4>4. Boosting làm gì?</h4>
<p>Cây thứ nhất học bình thường. Cây thứ hai chú ý hơn tới những mẫu cây thứ nhất làm sai. Cây thứ ba sửa tiếp lỗi còn lại… Kết quả là tổng có trọng số của các cây. Boosting rất mạnh nhưng dễ overfit nếu quá nhiều cây hoặc learning rate quá lớn.</p>
<div class="ex"><table class="mini"><tr><th></th><th>Bagging / Rừng ngẫu nhiên</th><th>Boosting (XGBoost…)</th></tr><tr><td>Cách học</td><td>Song song, độc lập</td><td>Nối tiếp, sửa lỗi</td></tr><tr><td>Giảm chủ yếu</td><td>Phương sai (overfit)</td><td>Bias (underfit)</td></tr><tr><td>Gộp kết quả</td><td>Bỏ phiếu / trung bình</td><td>Tổng có trọng số</td></tr></table></div>`},

{id:'huan-luyen',part:'D',title:'Huấn luyện mạng: batch, learning rate, Adam, BatchNorm',
 one:'Mạng nơ-ron học qua hàng nghìn bước sửa nhỏ. Vài "núm chỉnh" quyết định nó học nhanh, ổn định hay hỏng.',
 why:'Khoảng 1/5 đề 2025 hỏi về cách huấn luyện: learning rate, kích thước batch, Adam, BatchNorm, khởi tạo trọng số, xáo trộn dữ liệu.',
 pre:'Bài Gradient descent; bài Nơ-ron và hàm kích hoạt.',
 idea:`<p>Mỗi bước huấn luyện: lấy một nhóm mẫu, tính loss, tính gradient, sửa trọng số. Có ba cách lấy mẫu: <b>batch GD</b> (cả tập dữ liệu mỗi bước), <b>SGD</b> (1 mẫu mỗi bước) và <b>mini-batch</b> (một nhóm nhỏ, ví dụ 32 mẫu). Một lượt đi hết dữ liệu là một <b>epoch</b>; đầu mỗi epoch nên <b>xáo trộn</b> dữ liệu.</p><p><b>Learning rate</b> quá lớn thì loss dao động, không hội tụ; quá nhỏ thì học rất chậm. Các bộ tối ưu như <b>Adam</b>, RMSProp, AdaGrad <b>tự điều chỉnh learning rate cho từng tham số</b>. <b>Batch Normalization</b> chuẩn hóa đầu ra của một lớp theo từng batch, thường đặt <b>sau lớp Linear/Conv và trước ReLU</b>, giúp học nhanh và ổn định. Trọng số phải được <b>khởi tạo ngẫu nhiên</b> với độ lớn vừa phải.</p>`,
 life:'Luyện đề: làm từng câu rồi chữa ngay (SGD) thì sửa liên tục nhưng lung tung; làm cả cuốn rồi mới chữa (batch) thì quá chậm; làm 10 câu rồi chữa (mini-batch) là vừa.',
 tryit:'Chọn batch 1, 8, 64 và cả tập. Batch nhỏ thì đường loss lắc ra sao? Đặt learning rate thật lớn với SGD, rồi chuyển sang Adam.',
 rem:['SGD: cập nhật sau mỗi mẫu. Mini-batch: sau mỗi nhóm mẫu. Batch GD: sau cả tập dữ liệu','Batch quá nhỏ → gradient nhiễu, loss dao động. Batch quá lớn → tốn bộ nhớ GPU','Số bước mỗi epoch = số mẫu ÷ kích thước batch (làm tròn lên)','Xáo trộn dữ liệu ở đầu mỗi epoch để mô hình không học theo thứ tự','Learning rate quá cao → dao động, không hội tụ. Quá thấp → học rất chậm','Adam, RMSProp, AdaGrad: tự điều chỉnh learning rate cho TỪNG tham số','Momentum: cộng dồn hướng đi cũ, giúp đi đều và nhanh hơn','BatchNorm: sau Linear/Conv, trước ReLU','Khởi tạo mọi trọng số bằng 0 → các nơ-ron học giống hệt nhau. Khởi tạo sai độ lớn → gradient biến mất hoặc nổ'],
 traps:['Adaptive learning rate không làm mô hình "ngẫu nhiên hơn" và không phải để chống overfitting: nó chỉnh tốc độ học cho từng tham số.','Batch size (số mẫu mỗi bước) khác với learning rate (độ dài mỗi bước).'],
 demo:demoTrain,
 deep:`<h4>1. Đếm số bước</h4>
