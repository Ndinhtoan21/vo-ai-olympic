  PARTS.forEach(p=>{ const grid=h('div',{class:'tcards'}); TOPICS.forEach((t,i)=>{ if(t.part!==p.id) return; grid.append(h('a',{class:'tcard',href:'#'+t.id},h('span',{class:'num'},`Bài ${i+1}`,DB.learned[t.id]?h('em',{},' · đã hiểu'):null),h('h4',{},t.title),h('p',{},t.one))); }); w.append(h('div',{class:'part-block',style:`--pc:var(--p${p.id})`},h('h3',{},`Phần ${p.id} · ${p.name}`),h('p',{class:'part-desc'},p.intro),grid)); });
  if(!isT()) w.append(h('h2',{class:'sec-h'},'Cách tự học hiệu quả'),h('ol',{class:'steps'},
    h('li',{},h('b',{},'Bắt đầu từ Phần 0'),'Năm bài làm quen giúp em hiểu AI là gì, dữ liệu và cách máy học, trước khi gặp thuật toán.'),
    h('li',{},h('b',{},'Mỗi ngày 1–2 bài'),'Đọc "Học bài này để làm gì", xem Từ mới, làm thí nghiệm theo gợi ý "Thử", rồi làm 2 câu kiểm tra nhanh.'),
    h('li',{},h('b',{},'Luyện đề'),'Nhập mã đề thầy cô đưa, hoặc tự chọn chủ đề để luyện. Nộp bài xong, điểm tự gửi cho thầy cô.'),
    h('li',{},h('b',{},'Xem lại chỗ yếu'),'Vào Kết quả của em, học lại các bài có thanh đỏ. Gặp từ lạ thì tra Từ điển.')));
  if(isT()) w.append(h('h2',{class:'sec-h'},'Cách dùng trên lớp'),h('ol',{class:'steps'},
    h('li',{},h('b',{},'Ở nhà: học sinh tự học'),'Mỗi bài khoảng 15 phút. Đọc ý tưởng, làm theo gợi ý "Thử" ở phần thí nghiệm, rồi làm 2 câu kiểm tra nhanh cuối bài.'),
    h('li',{},h('b',{},'Đầu giờ: kiểm tra'),'Vào Luyện đề, chọn chủ đề và chế độ Kiểm tra, bấm Tạo đề. Đọc mã cho cả lớp; các em nhập mã trên máy của mình.'),
    h('li',{},h('b',{},'Nộp bài: điểm tự về sổ'),'Học sinh mở link, chọn Học sinh, nhập tên và lớp. Nộp bài xong, điểm tự hiện trong Sổ điểm của thầy cô, xem được theo lớp, theo đề, theo từng em.'),
    h('li',{},h('b',{},'Cuối giờ: chữa bài, chốt lại'),'Sổ điểm chỉ ra câu cả lớp sai nhiều nhất. Bấm Chiếu câu này để chữa, rồi mở Chốt kiến thức để tổng kết bài.')),
    h('p',{class:'formula'},'Học sinh không cần tài khoản, chỉ cần nhập tên và lớp. Sổ điểm lưu trên máy chủ; thầy cô đăng nhập bằng PIN ở máy nào cũng xem được.'));
}

/* ================= lesson ================= */
function viewTopic(main,t){
  const idx=TOPICS.indexOf(t), part=PARTS.find(p=>p.id===t.part);
  const art=h('article',{class:'wrap lesson'});
  art.append(h('p',{class:'eyebrow'},`Phần ${part.id} · ${part.name} · Bài ${idx+1}/${TOPICS.length}`),
    h('div',{class:'lesson-top'},h('h1',{},t.title),isT()?btn('Chiếu phần chốt bài này',()=>{PJ.tab='chot';PJ.chot=idx;location.hash='trinh-chieu';},'btn ghost'):null),
    h('p',{class:'one'},t.one),
    TOPICS.findIndex(x=>x.part===t.part)===idx?h('div',{class:'part-intro'},h('b',{},`Bắt đầu Phần ${part.id}: ${part.name}. `),part.intro):'',
    (()=>{ const terms=GLOSS.filter(g=>g.t===t.id); return h('div',{class:'before'},h('div',{},h('h3',{},'Học bài này để làm gì?'),h('p',{},t.why||'')),h('div',{},h('h3',{},'Cần biết trước'),h('p',{},t.pre||'')),
      terms.length?h('div',{class:'terms'},h('h3',{},'Từ mới trong bài'),h('ul',{},terms.map(g=>h('li',{},h('b',{},g.vi),' ',h('span',{class:'en'},g.en),h('br'),g.m)))):null); })(),
    h('div',{class:'lesson-grid'},h('section',{class:'idea'},h('h2',{},'Ý tưởng'),h('div',{class:'prose',html:t.idea})),h('aside',{class:'life'},h('h3',{},'Ví dụ đời thường'),h('p',{},t.life))));
  const demo=h('div',{class:'demo'});
  art.append(h('section',{class:'lab'},h('div',{class:'lab-head'},h('h2',{},'Thí nghiệm'),h('p',{class:'try'},h('b',{},'Thử: '),t.tryit)),demo));
  art.append(h('div',{class:'notes'},h('section',{class:'remember'},h('h2',{},'Ghi nhớ'),h('ul',{},t.rem.map(x=>h('li',{},x)))),h('section',{class:'traps'},h('h2',{},warnIcon(),'Bẫy trắc nghiệm'),h('ul',{},t.traps.map(x=>h('li',{},x))))));
  const qs=QB.filter(q=>q.t===t.id).slice(0,2), st=qs.map(()=>({sel:[],chk:false})), ql=h('div',{class:'quick-list'});
  const drawQ=()=>{ ql.innerHTML=''; qs.forEach((q,i)=>{ const perm=q.o.map((_,j)=>j); const box=h('div'); const card=renderQuestion(q,perm,st[i].sel,{reveal:st[i].chk,idp:`qk-${t.id}-${i}`,number:i+1,onChange:ns=>{st[i].sel=ns; b.disabled=!ns.length;}});
    const b=btn(st[i].chk?'Làm lại':'Kiểm tra',()=>{ if(st[i].chk){st[i]={sel:[],chk:false};} else { st[i].chk=true; DB.ex=DB.ex||{}; (DB.ex[t.id]=DB.ex[t.id]||{})[q.i]=isCorrect(q,st[i].sel)?1:0; save(); } drawQ(); },'btn'+(st[i].chk?'':' primary')); b.disabled=!st[i].chk&&!st[i].sel.length; card.append(h('div',{class:'qactions'},b)); box.append(card); ql.append(box); }); };
  drawQ(); art.append(h('section',{class:'quick'},h('h2',{},'Kiểm tra nhanh'),ql));
  const learned=!!DB.learned[t.id]; const prev=TOPICS[idx-1], next=TOPICS[idx+1];
  const lb=btn(learned?'Đã hiểu bài này ✓':'Đánh dấu đã hiểu',()=>{ DB.learned[t.id]=!DB.learned[t.id]; save(); lb.textContent=DB.learned[t.id]?'Đã hiểu bài này ✓':'Đánh dấu đã hiểu'; lb.className=DB.learned[t.id]?'btn tog':'btn primary'; lb.setAttribute('aria-pressed',String(!!DB.learned[t.id])); buildSide(); updateNav(t.id); },learned?'btn tog':'btn primary'); lb.setAttribute('aria-pressed',String(learned));
  art.append(h('nav',{class:'pager','aria-label':'Chuyển bài'},prev?h('a',{class:'btn',href:'#'+prev.id},'← '+prev.title):h('span'),lb,next?h('a',{class:'btn',href:'#'+next.id},next.title+' →'):h('a',{class:'btn primary',href:'#luyen-de'},'Luyện đề →')));
  main.append(art);
  try{ t.demo(demo); }catch(e){ console.error(e); demo.append(h('p',{class:'err'},'Thí nghiệm gặp lỗi: '+e.message)); }
}

/* ================= shell ================= */
const side=$('#side'), scrim=$('#scrim'), menuBtn=$('#menu-btn');
function buildSide(){ side.innerHTML=''; const nl=TOPICS.filter(t=>DB.learned[t.id]).length;
  side.append(h('a',{class:'side-home',href:'#trang-chu',id:'side-home'},'Trang chủ'),h('div',{class:'role'},isT()?h('span',{},'Giao diện ',h('b',{},'giáo viên')):h('span',{style:'min-width:0'},h('b',{},DB.name||'Học sinh'),DB.cls?' · '+DB.cls:''),isT()?h('a',{href:'#giao-vien'},'Tài khoản'):h('a',{href:'#doi',onclick:e=>{e.preventDefault();switchUser();}},'Đổi')),h('div',{class:'side-prog'},`Đã hiểu ${nl}/${TOPICS.length} bài`,h('div',{class:'bar'},h('i',{style:`width:${nl/TOPICS.length*100}%`}))));
  PARTS.forEach(p=>{ const ol=h('ol'); TOPICS.forEach((t,i)=>{ if(t.part!==p.id) return; const s=DB.stats[t.id]; const mk=h('span',{class:'mk'+(DB.learned[t.id]?' done':''),'aria-hidden':'true',html:DB.learned[t.id]?ICON_CHECK:''});
    ol.append(h('li',{},h('a',{class:'tl',href:'#'+t.id,'data-id':t.id,title:s?`Đúng ${s.c}/${s.n} câu đã làm`:null},h('span',{class:'n'},String(i+1)),h('span',{},t.title),mk,s?h('span',{class:'mast','aria-hidden':'true'},h('i',{style:`width:${s.c/s.n*100}%`})):null))); });
    side.append(h('div',{class:'part-h',style:`--pc:var(--p${p.id})`},`Phần ${p.id} · ${p.name}`),ol); });
  side.append(isT()?h('div',{class:'side-foot'},h('a',{class:'btn primary',href:'#luyen-de'},'Tạo đề / luyện đề'),h('a',{class:'btn',href:'#trinh-chieu'},'Trình chiếu trên lớp'),h('a',{class:'btn',href:'#so-diem'},'Sổ điểm'),h('a',{class:'btn ghost',href:'#tu-dien'},'Từ điển thuật ngữ'))
    :h('div',{class:'side-foot'},h('a',{class:'btn primary',href:'#luyen-de'},'Luyện đề'),h('a',{class:'btn',href:'#ket-qua'},'Kết quả của em'),h('a',{class:'btn ghost',href:'#tu-dien'},'Từ điển thuật ngữ'),h('a',{class:'side-teacher',href:'#doi',onclick:e=>{e.preventDefault();switchUser();}},'Đổi người dùng / Giáo viên'))); }
function buildTabs(){ const nav=$('#tabs'); nav.innerHTML=''; (isT()?[['trang-chu','Bài học'],['luyen-de','Luyện đề'],['trinh-chieu','Trình chiếu'],['so-diem','Sổ điểm'],['tu-dien','Từ điển']]:[['trang-chu','Bài học'],['luyen-de','Luyện đề'],['ket-qua','Kết quả của em'],['tu-dien','Từ điển']]).forEach(([id,l])=>nav.append(h('a',{class:'tab',href:'#'+id,'data-r':id},l))); }
function updateNav(id){ $$('.tl',side).forEach(a=>{ if(a.dataset.id===id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const home=$('#side-home'); if(home){ if(id==='trang-chu') home.setAttribute('aria-current','page'); else home.removeAttribute('aria-current'); }
  const tabs=$$('.tab',$('#tabs')); const cur=tabs.some(a=>a.dataset.r===id)?id:'trang-chu'; tabs.forEach(a=>{ if(a.dataset.r===cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); }
function openSide(v){ side.classList.toggle('open',v); scrim.classList.toggle('show',v); menuBtn.setAttribute('aria-expanded',String(v)); }
menuBtn.addEventListener('click',()=>openSide(!side.classList.contains('open'))); scrim.addEventListener('click',()=>openSide(false));
function route(){ let id=(location.hash||'').slice(1)||'trang-chu'; const main=$('#main'); resetView(id.replace(/[^a-z0-9-]/g,'')||'v'); openSide(false); main.innerHTML='';
  if(id==='luyen-de') viewQuiz(main); else if((id==='trinh-chieu'||id==='so-diem')&&!isT()) viewTeacherOnly(main); else if(id==='trinh-chieu') viewProj(main); else if(id==='so-diem') viewGradebook(main);
  else if(id==='giao-vien') viewTeacher(main); else if(id==='ket-qua') viewMine(main); else if(id==='tu-dien') viewGlossary(main); else { const t=topicById(id); if(t) viewTopic(main,t); else { id='trang-chu'; viewHome(main); } }
  updateNav(id); window.scrollTo(0,0); }
window.addEventListener('hashchange',route);
buildTabs(); buildSide(); route();
if(!IN_CLAUDE){
  if(!DB.role) showGate();
  else if(ROLE==='teacher') api('auth').then(r=>{ if(r.status===200&&!r.teacher){ DB.role=''; DB.ttok=''; save(); ROLE='student'; refreshRole(); showGate('teacher','Phiên giáo viên đã hết hạn (PIN có thể đã đổi). Đăng nhập lại nhé.'); } });
  flushPending();
}
if(IN_CLAUDE) isOwnerP().then(ok=>{ if(ok){ OWNER=true; if(ROLE!=='teacher'){ ROLE='teacher'; refreshRole(); } else if(location.hash==='#giao-vien') route(); } });
})();
</script>
