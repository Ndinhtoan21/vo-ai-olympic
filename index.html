<p><b>LSTM</b> có thêm một "băng chuyền" trí nhớ cₜ và ba cổng (mỗi cổng là một sigmoid ra số 0–1):</p>
<ul><li><b>Cổng quên</b> f: giữ lại bao nhiêu trí nhớ cũ.</li><li><b>Cổng vào</b> i: ghi thêm bao nhiêu thông tin mới.</li><li><b>Cổng ra</b> o: đưa bao nhiêu trí nhớ ra trạng thái hₜ.</li></ul>
<p><span class="fx">cₜ = f·cₜ₋₁ + i·(thông tin mới)</span>. Khi f gần 1, trí nhớ đi qua nhiều bước gần như nguyên vẹn, gradient cũng vậy. <b>GRU</b> gọn hơn, chỉ có 2 cổng.</p>
<h4>5. Các kiểu bài toán chuỗi</h4>
<ul><li><b>Nhiều → một</b>: đọc cả câu, đoán cảm xúc tích cực hay tiêu cực.</li><li><b>Nhiều → nhiều</b>: dịch câu, gán nhãn từng từ.</li><li><b>Một → nhiều</b>: từ một ảnh, sinh câu mô tả.</li></ul>
<h4>6. So với Transformer</h4>
<p>RNN phải tính hₜ sau khi có hₜ₋₁ nên chạy <b>tuần tự</b>, khó tận dụng GPU, và thông tin từ xa phải đi qua nhiều bước. Transformer nhìn mọi vị trí cùng lúc bằng attention, đường đi giữa hai từ bất kỳ chỉ một bước, nên học quan hệ xa tốt hơn và huấn luyện song song được.</p>`,
en:{title:'RNN: networks with memory',
one:'Read a sentence one word at a time, carrying a "memory" that summarises what has been read.',
why:'The syllabus mentions RNNs alongside Transformers. Understanding RNNs explains why attention was invented.',pre:'The Neurons lesson (tanh, vanishing gradients).',
idea:`<p>Text, audio and share prices are <b>sequences</b>: order matters. An <b>RNN</b> reads one element at a time and keeps a hidden state h: <span class="fx">hₜ = tanh(W·hₜ₋₁ + U·xₜ + b)</span>. The same weights are reused at every step.</p><p>When backpropagating through many steps, the gradient is multiplied together many times: factors below 1 make it <b>vanish</b> (the model forgets the start of the sentence), factors above 1 make it <b>explode</b>. <b>LSTM</b> and <b>GRU</b> add "gates" to keep memories longer. Transformers replace RNNs with attention: they look at the whole sentence at once and can run in parallel.</p>`,
life:'Listening to a story: you keep a summary of what you have heard to understand the next sentence. If the story is too long, you forget the beginning.',
tryit:'Only the first word carries a signal. Drag W from 0.5 to 1.2: how much is remembered at the end of the sentence? Switch to LSTM and drag the forget gate.',
rem:['hₜ = tanh(W·hₜ₋₁ + U·xₜ + b): the new state depends on the old state and the new input','Weights are shared across all steps → the parameter count does not depend on sequence length','Trained with backpropagation through time (BPTT)','The gradient through T steps ≈ a product of T factors: below 1 it vanishes, above 1 it explodes','Fight exploding gradients with gradient clipping','LSTM and GRU use gates (forget, input, output) to remember further back','An RNN must run step by step; a Transformer processes all positions in parallel'],
traps:['An RNN has no separate weights for each position: the same W and U at every step.','Vanishing gradients make long-range relationships hard to learn; they do not make the RNN run slower.'],
deep:`<h4>1. Running a tiny RNN by hand</h4>
<div class="ex">One dimension: W = 0.5, U = 1, b = 0, h₀ = 0. A 3-word sentence where only the first word carries a signal: x = (1, 0, 0).<br>h₁ = tanh(0.5 × 0 + 1) = tanh(1) ≈ <b>0.76</b><br>h₂ = tanh(0.5 × 0.76 + 0) = tanh(0.38) ≈ <b>0.36</b><br>h₃ = tanh(0.5 × 0.36) = tanh(0.18) ≈ <b>0.18</b><br>The information from the first word fades at every step.</div>
<h4>2. Counting parameters</h4>
<p>Hidden state of size h, input of size d: W is h×h, U is h×d, b has h. Total <span class="fx">h² + h·d + h</span>.</p>
<div class="ex">h = 8, d = 5: 64 + 40 + 8 = <b>112</b>. A 5-word or a 500-word sentence uses exactly these 112 parameters.</div>
<h4>3. Why gradients vanish or explode</h4>
<p>Backpropagating through T steps multiplies the gradient by about T factors (each roughly W × the tanh derivative).</p>
<div class="ex">A factor of 0.5 over 10 steps: 0.5¹⁰ ≈ 0.001 → <b>vanishing</b>, the model cannot learn long-range links.<br>A factor of 1.5 over 10 steps: 1.5¹⁰ ≈ 58 → <b>exploding</b>, unstable training. Fixed with gradient clipping.</div>
<h4>4. LSTM and GRU</h4>
<p>An <b>LSTM</b> adds a memory "conveyor belt" cₜ and three gates (each a sigmoid giving a number from 0 to 1):</p>
<ul><li><b>Forget gate</b> f: how much old memory to keep.</li><li><b>Input gate</b> i: how much new information to write.</li><li><b>Output gate</b> o: how much memory to expose in the state hₜ.</li></ul>
<p><span class="fx">cₜ = f·cₜ₋₁ + i·(new information)</span>. When f is near 1, the memory passes through many steps almost intact, and so does the gradient. A <b>GRU</b> is simpler, with only 2 gates.</p>
<h4>5. Kinds of sequence tasks</h4>
<ul><li><b>Many → one</b>: read a whole sentence and predict positive or negative sentiment.</li><li><b>Many → many</b>: translate a sentence, tag each word.</li><li><b>One → many</b>: generate a caption from an image.</li></ul>
<h4>6. Compared with Transformers</h4>
<p>An RNN must compute hₜ after hₜ₋₁, so it runs <b>sequentially</b>, uses GPUs poorly, and information from far back must pass through many steps. A Transformer looks at every position at once with attention, the path between any two words is a single step, so it learns long-range relationships better and trains in parallel.</p>`}},

'attention':{
deep:`<h4>1. Attention tính tay</h4>
<div class="ex">dₖ = 2. Query của từ đang xét q = (1, 0). Ba từ có Key k₁ = (1, 0), k₂ = (0, 1), k₃ = (1, 1) và Value v₁ = (1, 0), v₂ = (0, 2), v₃ = (1, 1).<br><b>Điểm</b> q·k: 1, 0, 1. Chia √2 ≈ 1,41: 0,71; 0; 0,71.<br><b>Softmax</b>: e^0,71 ≈ 2,03; e⁰ = 1; 2,03; tổng 5,06 → trọng số ≈ <b>0,40; 0,20; 0,40</b>.<br><b>Kết quả</b> = 0,4 × (1, 0) + 0,2 × (0, 2) + 0,4 × (1, 1) = <b>(0,8; 0,8)</b>.</div>
<p>Từ đang xét "lấy thông tin" nhiều nhất từ từ 1 và từ 3, vì Key của chúng khớp với Query.</p>
<h4>2. Q, K, V từ đâu ra?</h4>
<p>Trong <b>self-attention</b>, mọi từ trong cùng một câu đều tạo ra Q, K, V bằng cách nhân vector của từ (embedding) với ba ma trận học được W_Q, W_K, W_V. Viết gọn cho cả câu: <span class="fx">Attention(Q, K, V) = softmax(Q·Kᵀ/√dₖ)·V</span>. Ma trận điểm Q·Kᵀ có cỡ n×n, nên chi phí tăng theo <b>n²</b> (n là độ dài câu).</p>
<h4>3. Vì sao chia √dₖ?</h4>
<p>Tích vô hướng của hai vector dₖ chiều có độ lớn tăng theo √dₖ. Không chia thì với dₖ lớn, các điểm rất chênh lệch, softmax gần như dồn hết 100% cho một từ (quá "nhọn") và gradient gần 0, khó học.</p>
<h4>4. Multi-head và mặt nạ</h4>
<ul><li><b>Multi-head</b>: chạy nhiều attention song song với các W_Q, W_K, W_V khác nhau, mỗi "đầu" bắt một kiểu quan hệ (ngữ pháp, đại từ chỉ ai…), rồi ghép kết quả.</li>
<li><b>Masked attention</b> (GPT): khi sinh văn bản, từ ở vị trí t chỉ được nhìn các từ ≤ t, không được nhìn trước tương lai.</li></ul>
<h4>5. Mã hóa vị trí</h4>
<p>Attention chỉ so sánh nội dung nên không biết thứ tự. Ta <b>cộng</b> vào embedding mỗi vị trí một vector cùng số chiều: <span class="fx">PE(pos, 2i) = sin(pos/10000^(2i/d))</span>, <span class="fx">PE(pos, 2i+1) = cos(pos/10000^(2i/d))</span>. Các chiều đầu dao động nhanh, chiều sau dao động chậm, giống kim giây, kim phút, kim giờ. Ở pos = 0: sin 0 = 0, cos 0 = 1 nên PE(0) = (0, 1, 0, 1, …).</p>
<h4>6. Một khối Transformer</h4>
<p>Multi-head attention → cộng tắt (residual) và chuẩn hóa → mạng feed-forward cho từng vị trí → cộng tắt và chuẩn hóa. Chồng nhiều khối. <b>Encoder</b> (như BERT) nhìn cả hai phía, hợp để hiểu văn bản; <b>decoder</b> (như GPT) dùng mặt nạ, hợp để sinh văn bản.</p>`,
en:{title:'Transformers: attention and position',
one:'When reading a word, the model looks back over the whole sentence to see which words matter most.',
why:'The mechanism behind ChatGPT and large language models.',pre:'The Vectors lesson (dot product); percentages.',
idea:`<p>Each word has a question (<b>Query</b>), a label (<b>Key</b>) and some content (<b>Value</b>). The relevance of one word to another is Query · Key. <b>Softmax</b> turns the scores into percentages adding up to 100%. The result is the average of the Values weighted by those percentages.</p><p>Attention by itself <b>does not know word order</b>: "dog bites man" and "man bites dog" give the same vectors, just reordered. That is why we need <b>positional encoding</b>: add to each word a "seat number" built from sine and cosine waves.</p>`,
life:'Reading "The cat did not eat the fish because it was full", to work out who "it" is, you look back and find "cat".',
tryit:'Click the words "nó" (it) and "ăn" (eat). Which word does each attend to most? Switch to Do not divide by √dₖ. Hover over the sin/cos map.',
rem:['Attention = softmax(Q·Kᵀ / √dₖ) · V','Divide by √dₖ so softmax is not too peaked and gradients are not too small','Cost grows as O(n²) in the sentence length n','Positional encoding is ADDED to the embedding, with the same number of dimensions','Sin/cos: values in [−1, 1]; early dimensions change fast, later ones slowly','PE(pos + k) is a linear transformation (a rotation) of PE(pos)','PE(0) = (0, 1, 0, 1, …) because sin 0 = 0, cos 0 = 1','GPT uses masked attention: it only looks at earlier words'],
traps:['Without positional encoding, shuffling the input words just shuffles the outputs in the same way.','Multi-head: several attention heads run in parallel, each learning a different kind of relationship.'],
deep:`<h4>1. Attention by hand</h4>
<div class="ex">dₖ = 2. The current word’s query is q = (1, 0). Three words have keys k₁ = (1, 0), k₂ = (0, 1), k₃ = (1, 1) and values v₁ = (1, 0), v₂ = (0, 2), v₃ = (1, 1).<br><b>Scores</b> q·k: 1, 0, 1. Divide by √2 ≈ 1.41: 0.71, 0, 0.71.<br><b>Softmax</b>: e^0.71 ≈ 2.03; e⁰ = 1; 2.03; sum 5.06 → weights ≈ <b>0.40, 0.20, 0.40</b>.<br><b>Output</b> = 0.4 × (1, 0) + 0.2 × (0, 2) + 0.4 × (1, 1) = <b>(0.8, 0.8)</b>.</div>
<p>The current word "takes information" mostly from words 1 and 3, because their keys match its query.</p>
<h4>2. Where Q, K, V come from</h4>
<p>In <b>self-attention</b>, every word in the same sentence produces Q, K and V by multiplying its vector (embedding) by three learned matrices W_Q, W_K, W_V. For the whole sentence at once: <span class="fx">Attention(Q, K, V) = softmax(Q·Kᵀ/√dₖ)·V</span>. The score matrix Q·Kᵀ is n×n, so the cost grows like <b>n²</b> (n is the sentence length).</p>
<h4>3. Why divide by √dₖ?</h4>
<p>The dot product of two dₖ-dimensional vectors grows in size like √dₖ. Without dividing, for large dₖ the scores differ wildly, softmax puts almost 100% on one word (too "peaked") and the gradients are near 0, making learning hard.</p>
<h4>4. Multi-head and masking</h4>
<ul><li><b>Multi-head</b>: run several attentions in parallel with different W_Q, W_K, W_V; each "head" captures a kind of relationship (grammar, what a pronoun refers to…), then the results are concatenated.</li>
<li><b>Masked attention</b> (GPT): when generating text, the word at position t may only look at words ≤ t, never at the future.</li></ul>
<h4>5. Positional encoding</h4>
<p>Attention compares only content, so it does not know the order. We <b>add</b> to each position’s embedding a vector of the same size: <span class="fx">PE(pos, 2i) = sin(pos/10000^(2i/d))</span>, <span class="fx">PE(pos, 2i+1) = cos(pos/10000^(2i/d))</span>. Early dimensions oscillate fast and later ones slowly, like the second, minute and hour hands of a clock. At pos = 0: sin 0 = 0 and cos 0 = 1, so PE(0) = (0, 1, 0, 1, …).</p>
<h4>6. One Transformer block</h4>
<p>Multi-head attention → residual connection and normalisation → a feed-forward network applied to each position → residual and normalisation. Many blocks are stacked. An <b>encoder</b> (like BERT) looks both ways and suits understanding text; a <b>decoder</b> (like GPT) uses masking and suits generating text.</p>`}},
'tim-kiem':{
deep:`<h4>1. Ba thuật toán, ba cấu trúc dữ liệu</h4>
<ul><li><b>BFS</b> dùng <b>hàng đợi</b> (vào trước ra trước): xét hết các ô cách 1 bước, rồi 2 bước…</li>
<li><b>DFS</b> dùng <b>ngăn xếp</b> (vào sau ra trước): đi sâu một nhánh đến cùng rồi mới quay lui.</li>
<li><b>Uniform cost</b> và <b>A*</b> dùng <b>hàng đợi ưu tiên</b>: luôn lấy ra nút có giá trị nhỏ nhất (g với uniform cost, f = g + h với A*).</li></ul>
<h4>2. Chạy A* tay trên một đồ thị có trọng số</h4>
<div class="ex">Cạnh: S–A = 1, S–B = 4, A–B = 2, A–G = 5, B–G = 1. Heuristic: h(S) = 3, h(A) = 3, h(B) = 1, h(G) = 0 (không vượt quá quãng thật, nên admissible).<br>• Mở S (f = 0 + 3). Thêm A (g = 1, f = 4), B (g = 4, f = 5).<br>• Lấy A (f = 4). Qua A tới B: g = 3 &lt; 4 nên cập nhật B (f = 4). Thêm G (g = 6, f = 6).<br>• Lấy B (f = 4). Qua B tới G: g = 4 &lt; 6, cập nhật G (f = 4).<br>• Lấy G → dừng. Đường <b>S → A → B → G</b>, chi phí <b>4</b>.<br>BFS chỉ đếm số cạnh nên chọn đường 2 cạnh S → B → G (chi phí 5) hoặc S → A → G (chi phí 6): <b>không tối ưu</b> khi cạnh có trọng số khác nhau.</div>
<h4>3. So sánh</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Tối ưu?</th><th>Bộ nhớ</th><th>Ghi chú</th></tr><tr><td>BFS</td><td>Có, nếu mọi cạnh bằng nhau</td><td>Lớn</td><td>Lan đều</td></tr><tr><td>DFS</td><td>Không</td><td>Nhỏ (chỉ nhớ đường đang đi)</td><td>Có thể lạc rất xa</td></tr><tr><td>Uniform cost</td><td>Có</td><td>Lớn</td><td>Như A* với h = 0</td></tr><tr><td>A*</td><td>Có, nếu h admissible</td><td>Lớn</td><td>Xét ít nút nhờ h</td></tr><tr><td>Tham lam (chỉ h)</td><td>Không</td><td>Vừa</td><td>Nhanh nhưng dễ sai</td></tr></table></div>
<h4>4. Heuristic tốt</h4>
<ul><li><b>Admissible</b>: h(n) ≤ chi phí thật từ n tới đích. h = 0 luôn admissible nhưng vô dụng.</li>
<li>Trên lưới đi 4 hướng, <b>Manhattan</b> là admissible (không thể tới đích bằng ít bước hơn). Euclid cũng admissible nhưng yếu hơn.</li>
<li>Hai heuristic admissible h₁ ≤ h₂ ở mọi nút: dùng h₂ (lớn hơn, sát thực tế hơn) thì A* xét ít nút hơn.</li>
<li>Nhân h với 3: không còn admissible, A* nhanh hơn nhưng có thể trả về đường dài hơn.</li></ul>
<h4>5. Khi nào dừng?</h4>
<p>A* chỉ chắc chắn tối ưu khi dừng lúc <b>lấy</b> đích ra khỏi hàng đợi, không phải lúc mới thêm đích vào. Ở ví dụ trên, G được thêm với chi phí 6 trước, nhưng đường tốt nhất (4) chỉ được tìm ra sau.</p>`,
en:{title:'Path finding: BFS, DFS, A*',
one:'Find a path from S to G. The algorithms differ in which cell they look at next.',
why:'Classical AI: route finding on maps, solving puzzles. The IAIO final had a proof question about A*.',pre:'Counting steps on a square grid.',
idea:`<p><b>BFS</b> spreads evenly like an oil stain and always finds the path with the fewest steps. <b>DFS</b> charges down one direction to the end; it uses little memory but the path is often long. <b>A*</b> expands the cell with the smallest <span class="fx">f = g + h</span>: g is the distance travelled, h is an estimate of the distance remaining.</p><p>If h <b>never overestimates</b> the true remaining distance (admissible), A* always finds the shortest path and usually examines fewer cells than BFS. Multiplying h by 3 is faster but can miss the shortest path.</p>`,
life:'Finding your classroom in a new school: BFS is checking every nearby room first. A* is heading towards the signs, estimating how far is left as you go.',
tryit:'Press BFS, A*, A* (h × 3) and DFS in turn. Compare the number of cells examined and the path length. Draw extra walls and run again.',
rem:['BFS: a queue; optimal when every step costs the same','DFS: a stack; little memory; not optimal','A*: f(n) = g(n) + h(n)','Admissible: h(n) ≤ the true remaining cost','Consistent: h(n) ≤ c(n, n′) + h(n′); consistent implies admissible','On a 4-direction grid, Manhattan distance is admissible','A* stops when it TAKES the goal out to expand it, not when it first sees the goal','Graph search that never reopens visited cells needs a consistent h to guarantee optimality'],
traps:['When edges have different costs, BFS is no longer optimal; use uniform cost search or A*.','max(h₁, h₂) of two admissible heuristics is still admissible; h₁ + h₂ usually is not.'],
deep:`<h4>1. Three algorithms, three data structures</h4>
<ul><li><b>BFS</b> uses a <b>queue</b> (first in, first out): all cells 1 step away, then 2 steps…</li>
<li><b>DFS</b> uses a <b>stack</b> (last in, first out): goes deep along one branch before backtracking.</li>
<li><b>Uniform cost</b> and <b>A*</b> use a <b>priority queue</b>: always take the node with the smallest value (g for uniform cost, f = g + h for A*).</li></ul>
<h4>2. Running A* by hand on a weighted graph</h4>
<div class="ex">Edges: S–A = 1, S–B = 4, A–B = 2, A–G = 5, B–G = 1. Heuristic: h(S) = 3, h(A) = 3, h(B) = 1, h(G) = 0 (never above the true remaining cost, so admissible).<br>• Open S (f = 0 + 3). Add A (g = 1, f = 4), B (g = 4, f = 5).<br>• Take A (f = 4). Via A to B: g = 3 &lt; 4, so update B (f = 4). Add G (g = 6, f = 6).<br>• Take B (f = 4). Via B to G: g = 4 &lt; 6, update G (f = 4).<br>• Take G → stop. Path <b>S → A → B → G</b>, cost <b>4</b>.<br>BFS only counts edges, so it picks a 2-edge path S → B → G (cost 5) or S → A → G (cost 6): <b>not optimal</b> when edge costs differ.</div>
<h4>3. Comparison</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Optimal?</th><th>Memory</th><th>Notes</th></tr><tr><td>BFS</td><td>Yes, if all edges are equal</td><td>Large</td><td>Spreads evenly</td></tr><tr><td>DFS</td><td>No</td><td>Small (only the current path)</td><td>Can wander far off</td></tr><tr><td>Uniform cost</td><td>Yes</td><td>Large</td><td>A* with h = 0</td></tr><tr><td>A*</td><td>Yes, if h is admissible</td><td>Large</td><td>Fewer nodes thanks to h</td></tr><tr><td>Greedy (h only)</td><td>No</td><td>Medium</td><td>Fast but often wrong</td></tr></table></div>
<h4>4. Good heuristics</h4>
<ul><li><b>Admissible</b>: h(n) ≤ the true cost from n to the goal. h = 0 is always admissible but useless.</li>
<li>On a 4-direction grid, <b>Manhattan</b> distance is admissible (you cannot reach the goal in fewer steps). Euclidean is admissible too but weaker.</li>
<li>Two admissible heuristics with h₁ ≤ h₂ everywhere: using h₂ (larger, closer to reality) makes A* expand fewer nodes.</li>
<li>Multiplying h by 3: no longer admissible; A* runs faster but may return a longer path.</li></ul>
<h4>5. When to stop</h4>
<p>A* is only guaranteed optimal if it stops when it <b>takes</b> the goal off the queue, not when the goal is first added. In the example above, G was added first with cost 6, but the best path (4) was only found later.</p>`}},

'bandit':{
deep:`<h4>1. ε-greedy</h4>
<div class="ex">ε = 0,1, có 5 máy. Mỗi lượt: với xác suất 0,9 chọn máy có Q cao nhất; với xác suất 0,1 chọn ngẫu nhiên một trong 5 máy (có thể trúng lại máy tốt nhất).<br>P(chọn máy đang tốt nhất) = 0,9 + 0,1/5 = <b>0,92</b>. P(chọn một máy cụ thể khác) = 0,1/5 = 0,02.</div>
<p>Nhược điểm: ε cố định thì mãi mãi phí 10% lượt cho khám phá, kể cả khi đã biết rõ máy nào tốt, nên regret tăng <b>tuyến tính</b> theo số lượt.</p>
<h4>2. Cập nhật trung bình từng bước</h4>
<div class="ex">Máy A đã chơi 4 lần, Q = 0,5. Lần 5 được thưởng 1.<br>Q mới = Q + (r − Q)/N = 0,5 + (1 − 0,5)/5 = <b>0,6</b>. Kiểm tra: (4 × 0,5 + 1)/5 = 3/5 = 0,6.</div>
<h4>3. UCB tính tay</h4>
<p><span class="fx">UCB = Q + c·√(ln t / N)</span>: trung bình cộng "điểm tò mò", điểm tò mò lớn khi N (số lần đã thử) nhỏ.</p>
<div class="ex">t = 10, c = √2, ln 10 ≈ 2,3.<br>Máy A: Q = 0,6, N = 8 → 0,6 + 1,41 × √(2,3/8) ≈ 0,6 + 1,41 × 0,54 ≈ <b>1,36</b>.<br>Máy B: Q = 0,4, N = 2 → 0,4 + 1,41 × √(2,3/2) ≈ 0,4 + 1,41 × 1,07 ≈ <b>1,92</b>.<br>UCB chọn <b>B</b>, dù Q của B thấp hơn: B mới thử 2 lần nên còn rất nhiều điều chưa biết.</div>
<p>Thử càng nhiều, điểm tò mò càng nhỏ, nên UCB tự chuyển dần sang khai thác. Regret của UCB chỉ tăng theo <b>log t</b>.</p>
<h4>4. Regret tính thế nào?</h4>
<div class="ex">Máy tốt nhất cho thưởng trung bình 0,7. Ta chơi máy 0,4 trong 100 lượt. Regret = 100 × (0,7 − 0,4) = <b>30</b>.</div>
<h4>5. Thompson sampling</h4>
<p>Giữ cho mỗi máy một "niềm tin" về xác suất thưởng (ví dụ phân phối Beta từ số lần thắng, thua). Mỗi lượt rút thăm một con số từ niềm tin của từng máy và chơi máy có số rút được lớn nhất. Máy ít thử có niềm tin rộng nên đôi khi rút được số lớn và được thử: tự cân bằng khám phá và khai thác.</p>
<h4>6. Ứng dụng</h4>
<p>Chọn quảng cáo, thử nghiệm A/B nhiều phương án, gợi ý bài viết, thử phác đồ điều trị: mọi nơi phải vừa học vừa ra quyết định.</p>`,
en:{title:'Bandits: explore or exploit?',
one:'Several slot machines, and you do not know which is best. Try an unfamiliar one, or keep playing the current best?',
why:'Making decisions without full information; the simplest form of reinforcement learning.',pre:'Averages; simple probability.',
idea:`<p>Each machine pays 1 with a secret probability. <b>Exploit</b>: choose the machine with the highest average Q so far. <b>Explore</b>: try another machine, because the current estimates may be wrong after only a few tries.</p><p><b>Regret</b> is the reward lost compared with knowing the best machine in advance. <b>UCB</b> adds a "curiosity bonus" to rarely tried machines, so it explores and exploits intelligently.</p>`,
life:'Choosing where to eat lunch: keep going to your usual place (exploit) or try the new one that just opened (explore)?',
tryit:'Play 20 rounds by hand. Then press Compare 3 strategies: which regret curve is lowest? Which is almost a straight line?',
rem:['ε-greedy: with probability ε pick at random, otherwise pick the highest Q','P(pick the current best machine) = (1 − ε) + ε/K','UCB = Q + c·√(ln t / N)','UCB: regret grows slowly, like log t; fixed ε: regret grows linearly','Update the average: Q ← Q + (r − Q)/N','Thompson sampling: draw from each machine’s belief distribution'],
traps:['Pure exploitation (greedy) easily gets stuck on a poor machine that was lucky early on.','UCB picks the machine with the largest UCB value, not the largest Q.'],
deep:`<h4>1. ε-greedy</h4>
<div class="ex">ε = 0.1 with 5 machines. Each round: with probability 0.9 pick the highest-Q machine; with probability 0.1 pick one of the 5 at random (which may be the best one again).<br>P(pick the current best) = 0.9 + 0.1/5 = <b>0.92</b>. P(pick one particular other machine) = 0.1/5 = 0.02.</div>
<p>Drawback: with a fixed ε, 10% of rounds are spent exploring forever, even once the best machine is obvious, so regret grows <b>linearly</b> with the number of rounds.</p>
<h4>2. Updating the average step by step</h4>
<div class="ex">Machine A has been played 4 times, Q = 0.5. Round 5 pays 1.<br>new Q = Q + (r − Q)/N = 0.5 + (1 − 0.5)/5 = <b>0.6</b>. Check: (4 × 0.5 + 1)/5 = 3/5 = 0.6.</div>
<h4>3. UCB by hand</h4>
<p><span class="fx">UCB = Q + c·√(ln t / N)</span>: the average plus a "curiosity bonus", which is large when N (times tried) is small.</p>
<div class="ex">t = 10, c = √2, ln 10 ≈ 2.3.<br>Machine A: Q = 0.6, N = 8 → 0.6 + 1.41 × √(2.3/8) ≈ 0.6 + 1.41 × 0.54 ≈ <b>1.36</b>.<br>Machine B: Q = 0.4, N = 2 → 0.4 + 1.41 × √(2.3/2) ≈ 0.4 + 1.41 × 1.07 ≈ <b>1.92</b>.<br>UCB picks <b>B</b> even though its Q is lower: B has only been tried twice, so much is still unknown.</div>
<p>The more a machine is tried, the smaller its bonus, so UCB gradually shifts to exploiting. UCB’s regret grows only like <b>log t</b>.</p>
<h4>4. Computing regret</h4>
<div class="ex">The best machine pays 0.7 on average. We play a 0.4 machine for 100 rounds. Regret = 100 × (0.7 − 0.4) = <b>30</b>.</div>
<h4>5. Thompson sampling</h4>
<p>Keep a "belief" about each machine’s pay-out probability (for example a Beta distribution from its wins and losses). Each round, draw one number from each machine’s belief and play the machine with the largest draw. Rarely tried machines have wide beliefs, so they sometimes draw large numbers and get tried: exploration and exploitation balance themselves.</p>
<h4>6. Applications</h4>
<p>Choosing ads, A/B tests with many variants, article recommendations, trying treatments: anywhere you must learn and decide at the same time.</p>`}},

'bat-thuong':{
deep:`<h4>1. Kernel RBF tính tay</h4>
<div class="ex">x = (0, 0), z = (1, 1): ‖x − z‖² = 1 + 1 = 2.<br>γ = 0,5: k = e^(−0,5 × 2) = e^(−1) ≈ <b>0,37</b>.<br>γ = 2: k = e^(−2 × 2) = e^(−4) ≈ <b>0,018</b>.</div>
<p>Cùng hai điểm, γ lớn làm chúng "gần như không liên quan". γ lớn → mỗi quả đồi hẹp → bản đồ mật độ lởm chởm, điểm nào cũng trông cô đơn (overfit). γ nhỏ → đồi rộng → bản đồ mượt, có thể bỏ sót điểm lạ (underfit).</p>
<h4>2. Kernel trick: một ví dụ</h4>
<div class="ex">Kernel đa thức k(x, z) = (x·z)². Với x = (1, 2), z = (3, 1): x·z = 5 → k = <b>25</b>.<br>Cách "thật": biến mỗi điểm thành 3 đặc trưng φ(x) = (x₁², √2·x₁x₂, x₂²). φ(x) = (1, 2√2, 4), φ(z) = (9, 3√2, 1). φ(x)·φ(z) = 9 + 12 + 4 = <b>25</b>.</div>
<p>Hai cách cho cùng kết quả, nhưng kernel không cần tính φ. Với kernel RBF, không gian tương ứng có vô số chiều, vậy mà vẫn tính được dễ dàng. SVM dùng kernel nhờ đúng điều này.</p>
<h4>3. Ba cách phát hiện bất thường đơn giản</h4>
<div class="ex"><b>z-score</b>: trung bình 50, độ lệch chuẩn 5, giá trị 68 → z = (68 − 50)/5 = 3,6 &gt; 3 → <b>bất thường</b>.<br><b>IQR</b>: Q1 = 10, Q3 = 20 → IQR = 10. Ngưỡng 10 − 15 = −5 và 20 + 15 = 35. Giá trị 40 nằm ngoài → <b>bất thường</b>.<br><b>Mật độ kernel</b>: cộng các quả đồi RBF; điểm ở vùng mật độ thấp nhất là bất thường. Làm được với dữ liệu nhiều chiều và đám điểm hình dạng bất kỳ.</div>
<h4>4. Các phương pháp khác</h4>
<ul><li><b>LOF</b>: so mật độ quanh điểm với mật độ quanh các hàng xóm của nó.</li>
<li><b>One-class SVM</b>: học một đường bao quanh dữ liệu bình thường.</li>
<li><b>Isolation Forest</b>: chia ngẫu nhiên; điểm bất thường bị cô lập sau rất ít lần chia.</li></ul>
<h4>5. Kernel hợp lệ và đánh giá</h4>
<p>Kernel hợp lệ khi ma trận Gram (k của mọi cặp điểm) luôn nửa xác định dương. Tổng, tích, nhân với hằng số dương của các kernel hợp lệ vẫn hợp lệ; hiệu thì có thể không. Vì bất thường rất hiếm, đánh giá bằng <b>precision, recall</b>, không dùng accuracy.</p>`,
en:{title:'Kernels and anomaly detection',
one:'An anomaly is a point living somewhere sparsely populated.',
why:'Real uses: detecting card fraud and failing machines. Kernels are also the key idea behind SVM.',pre:'The Vectors and distance lesson; the k-NN lesson.',
idea:`<p>A <b>kernel</b> measures how similar two points are. The RBF kernel <span class="fx">k(x, z) = e^(−γ·‖x − z‖²)</span> equals 1 when the points coincide and is near 0 when they are far apart.</p><p>Put a kernel "hill" on every point and add them up to get a <b>density map</b>. The points with the lowest density are anomalies. The <b>kernel trick</b>: replacing the dot product with a kernel is like working in a higher-dimensional space without ever computing it.</p>`,
life:'A bank spotting a stolen card: a 50-million-đồng transaction at 3 a.m. abroad lies far from the card owner’s usual habits.',
tryit:'Drag γ from small to large. When γ is very large, does every point look lonely? Click empty space to add points.',
rem:['RBF: k(x, z) = exp(−γ‖x − z‖²), in (0, 1], k(x, x) = 1','Large γ: narrow hills, wiggly boundary, prone to overfitting','Small γ: wide hills, smooth, prone to underfitting','A valid kernel has a positive semi-definite Gram matrix','Sums, products and positive multiples of valid kernels are valid','Anomaly detection: z-score (|z| > 3), IQR, LOF, One-class SVM, Isolation Forest'],
traps:['Anomalies are very rare → do not use accuracy; use precision and recall.','The difference of two kernels may not be a valid kernel.'],
deep:`<h4>1. The RBF kernel by hand</h4>
<div class="ex">x = (0, 0), z = (1, 1): ‖x − z‖² = 1 + 1 = 2.<br>γ = 0.5: k = e^(−0.5 × 2) = e^(−1) ≈ <b>0.37</b>.<br>γ = 2: k = e^(−2 × 2) = e^(−4) ≈ <b>0.018</b>.</div>
<p>For the same two points, a large γ makes them "almost unrelated". Large γ → each hill is narrow → a spiky density map where every point looks lonely (overfitting). Small γ → wide hills → a smooth map that may miss odd points (underfitting).</p>
<h4>2. The kernel trick: an example</h4>
<div class="ex">Polynomial kernel k(x, z) = (x·z)². With x = (1, 2), z = (3, 1): x·z = 5 → k = <b>25</b>.<br>The "real" way: turn each point into 3 features φ(x) = (x₁², √2·x₁x₂, x₂²). φ(x) = (1, 2√2, 4), φ(z) = (9, 3√2, 1). φ(x)·φ(z) = 9 + 12 + 4 = <b>25</b>.</div>
<p>Both give the same answer, but the kernel never computes φ. For the RBF kernel the matching space has infinitely many dimensions, yet it is still easy to compute. This is exactly why SVMs use kernels.</p>
<h4>3. Three simple anomaly detectors</h4>
<div class="ex"><b>z-score</b>: mean 50, standard deviation 5, value 68 → z = (68 − 50)/5 = 3.6 &gt; 3 → <b>anomaly</b>.<br><b>IQR</b>: Q1 = 10, Q3 = 20 → IQR = 10. Fences 10 − 15 = −5 and 20 + 15 = 35. The value 40 lies outside → <b>anomaly</b>.<br><b>Kernel density</b>: add up the RBF hills; points in the lowest-density areas are anomalies. Works in many dimensions and for clusters of any shape.</div>
<h4>4. Other methods</h4>
<ul><li><b>LOF</b>: compares the density around a point with the density around its neighbours.</li>
<li><b>One-class SVM</b>: learns a boundary around the normal data.</li>
<li><b>Isolation Forest</b>: random splits; anomalies get isolated after very few splits.</li></ul>
<h4>5. Valid kernels and evaluation</h4>
<p>A kernel is valid when its Gram matrix (k for every pair of points) is always positive semi-definite. Sums, products and positive multiples of valid kernels are valid; differences may not be. Since anomalies are very rare, evaluate with <b>precision and recall</b>, never accuracy.</p>`}},

'rieng-tu':{
deep:`<h4>1. Định nghĩa</h4>
<p>Hai bộ dữ liệu <b>kề nhau</b> nếu chỉ khác nhau đúng một người. Một cơ chế là <b>ε-riêng tư vi phân</b> nếu với mọi cặp bộ dữ liệu kề nhau và mọi kết quả có thể, xác suất ra kết quả đó chênh nhau không quá <span class="fx">e^ε</span> lần.</p>
<div class="ex">ε = 0,1 → e^0,1 ≈ 1,105: có hay không có em trong dữ liệu, kết quả chỉ thay đổi khả năng tối đa khoảng 10%. ε = 1 → e¹ ≈ 2,72 lần: bảo vệ yếu hơn nhiều.</div>
<h4>2. Cơ chế Laplace tính tay</h4>
<div class="ex">Câu hỏi: "Lớp có bao nhiêu bạn từng chép bài?" Thêm hay bớt một bạn làm kết quả đổi tối đa 1 → độ nhạy Δ = 1.<br>Chọn ε = 0,5 → b = Δ/ε = 2. Phương sai nhiễu = 2b² = 8, độ lệch chuẩn ≈ 2,8. Đáp án thật là 12 thì con số công bố thường nằm trong khoảng 12 ± vài đơn vị.</div>
<div class="ex">Câu hỏi trung bình: điểm từ 0 đến 100, có 1000 bạn. Một bạn thay đổi điểm làm trung bình đổi tối đa 100/1000 = 0,1 → Δ = 0,1. Dữ liệu càng lớn, độ nhạy càng nhỏ, nhiễu cần thêm càng ít.</div>
<h4>3. Hợp nhiều lần hỏi và hậu xử lý</h4>
<ul><li><b>Định lý hợp</b>: hỏi 3 lần với ε = 0,2; 0,3; 0,5 trên cùng dữ liệu → tổng ε = <b>1,0</b>. Vì vậy phải có "ngân sách" ε và dừng khi tiêu hết.</li>
<li><b>Hậu xử lý</b>: làm tròn, cắt về số không âm, vẽ biểu đồ từ kết quả đã có nhiễu không làm mất riêng tư.</li></ul>
<h4>4. Trả lời ngẫu nhiên (randomized response)</h4>
<div class="ex">Hỏi một câu nhạy cảm. Mỗi bạn tung đồng xu: ngửa thì trả lời thật; sấp thì tung lần nữa, ngửa nói "Có", sấp nói "Không".<br>Người thật sự "Có" nói "Có" với xác suất 0,75; người "Không" nói "Có" với xác suất 0,25. Tỉ số 3 → ε = ln 3 ≈ 1,1.<br>Nếu 40% nói "Có": 0,5·p + 0,25 = 0,4 → tỉ lệ thật p ≈ <b>30%</b>. Cả lớp ước lượng được, nhưng không ai biết câu trả lời thật của từng bạn.</div>
<h4>5. Vì sao xóa tên chưa đủ?</h4>
<p>Ghép nhiều bộ dữ liệu (tấn công liên kết): ngày sinh, giới tính và mã vùng thường đủ để nhận ra phần lớn mọi người. Riêng tư vi phân bảo vệ <b>bất kể</b> kẻ tấn công biết thêm gì.</p>
<h4>6. Cái giá phải trả</h4>
<p>Nhiễu làm kết quả kém chính xác, ảnh hưởng nặng nhất tới các nhóm nhỏ (vì số đếm nhỏ, nhiễu chiếm tỉ lệ lớn). Đây là chỗ riêng tư và công bằng va chạm nhau.</p>`,
en:{title:'Differential privacy',
one:'Publish statistics without anyone being able to work out one individual’s data.',
why:'AI uses people’s data, so privacy must be protected. The exam has calculation questions on ε.',pre:'Fractions; the idea of random noise.',
idea:`<p>Add a little <b>random noise</b> to the result. Thanks to the noise, the result is almost the same whether or not any particular person is in the data.</p><p><b>ε</b> is the privacy budget: a small ε means large noise, strong privacy but less accuracy. Every release spends some ε; ask many times and the ε values <b>add up</b>, so the truth gradually leaks out.</p>`,
life:'A teacher wants to know how many students have ever copied homework without exposing anyone. She publishes the count after randomly adding or subtracting a little.',
tryit:'Set ε = 0.1 and press Show 1000 possible results. Then set ε = 2. Does the histogram get narrower or wider? Press Publish several times and watch the budget.',
rem:['Laplace mechanism: result + noise Lap(Δ/ε)','Counting people: sensitivity Δ = 1','b = Δ/ε; Laplace variance = 2b²','Small ε → large noise → strong privacy, less accuracy','k queries on the same data: the ε values add up','Post-processing a DP result (e.g. rounding) does not weaken privacy','The bigger the dataset, the less the noise matters'],
traps:['Removing names is not enough: people can still be identified by birth date and address (linkage attacks).','LARGE ε means WEAK privacy, not strong.'],
deep:`<h4>1. The definition</h4>
<p>Two datasets are <b>neighbouring</b> if they differ in exactly one person. A mechanism is <b>ε-differentially private</b> if, for every pair of neighbouring datasets and every possible output, the probabilities of that output differ by at most a factor of <span class="fx">e^ε</span>.</p>
<div class="ex">ε = 0.1 → e^0.1 ≈ 1.105: whether or not you are in the data, the likelihood of any result changes by at most about 10%. ε = 1 → e¹ ≈ 2.72 times: much weaker protection.</div>
<h4>2. The Laplace mechanism by hand</h4>
<div class="ex">Query: "How many students have ever copied homework?" Adding or removing one student changes the answer by at most 1 → sensitivity Δ = 1.<br>Choose ε = 0.5 → b = Δ/ε = 2. Noise variance = 2b² = 8, standard deviation ≈ 2.8. If the true answer is 12, the published number is usually within a few units of 12.</div>
<div class="ex">An average query: scores from 0 to 100, 1000 students. One student changing their score moves the average by at most 100/1000 = 0.1 → Δ = 0.1. The larger the data, the smaller the sensitivity and the less noise is needed.</div>
<h4>3. Composition and post-processing</h4>
<ul><li><b>Composition</b>: 3 queries with ε = 0.2, 0.3, 0.5 on the same data → total ε = <b>1.0</b>. So there must be an ε "budget", and querying stops when it runs out.</li>
<li><b>Post-processing</b>: rounding, clipping to non-negative numbers, or plotting an already-noisy result does not weaken privacy.</li></ul>
<h4>4. Randomized response</h4>
<div class="ex">Ask a sensitive question. Each student flips a coin: heads, answer truthfully; tails, flip again and say "Yes" on heads, "No" on tails.<br>A true "Yes" says "Yes" with probability 0.75; a true "No" says "Yes" with probability 0.25. The ratio is 3 → ε = ln 3 ≈ 1.1.<br>If 40% say "Yes": 0.5·p + 0.25 = 0.4 → the true rate p ≈ <b>30%</b>. The class-wide rate can be estimated, but nobody learns any individual’s true answer.</div>
<h4>5. Why removing names is not enough</h4>
<p>Joining several datasets (a linkage attack): birth date, gender and postcode are often enough to identify most people. Differential privacy protects people <b>no matter</b> what extra information the attacker has.</p>
<h4>6. The price</h4>
<p>Noise makes results less accurate and hurts small groups most (their counts are small, so the noise is a large share). This is where privacy and fairness collide.</p>`}},

'cong-bang':{
deep:`<h4>1. Ví dụ đầy đủ với hai nhóm</h4>
<div class="ex">Mỗi nhóm 100 hồ sơ. Nhóm A có 60 người đủ chuẩn, nhóm B có 30 người đủ chuẩn.<br>Mô hình duyệt: nhóm A 50 người đủ chuẩn + 10 người chưa đủ chuẩn = 60 hồ sơ; nhóm B 25 người đủ chuẩn + 5 người chưa đủ chuẩn = 30 hồ sơ.<br><table class="mini"><tr><th></th><th>Nhóm A</th><th>Nhóm B</th><th>Tiêu chí</th></tr><tr><td>Tỉ lệ duyệt</td><td>60%</td><td>30%</td><td>Demographic parity: <b>trượt</b></td></tr><tr><td>TPR</td><td>50/60 ≈ 0,83</td><td>25/30 ≈ 0,83</td><td>Equal opportunity: <b>đạt</b></td></tr><tr><td>FPR</td><td>10/40 = 0,25</td><td>5/70 ≈ 0,07</td><td>Equalized odds: <b>trượt</b></td></tr><tr><td>Precision</td><td>50/60 ≈ 0,83</td><td>25/30 ≈ 0,83</td><td>Predictive parity: <b>đạt</b></td></tr></table>
Quy tắc 4/5: 30%/60% = 0,5 &lt; 0,8 → dấu hiệu bất lợi cho nhóm B.</div>
<p>Cùng một mô hình mà đạt tiêu chí này, trượt tiêu chí kia. Muốn tỉ lệ duyệt bằng nhau thì phải duyệt thêm người chưa đủ chuẩn ở B hoặc bớt người đủ chuẩn ở A, làm hỏng TPR hoặc precision.</p>
<h4>2. Định lý bất khả thi</h4>
<p>Khi tỉ lệ người đủ chuẩn (tỉ lệ nền) của hai nhóm khác nhau và mô hình không hoàn hảo, <b>không thể</b> cùng lúc có precision bằng nhau, TPR bằng nhau và FPR bằng nhau. Phải chọn tiêu chí theo hoàn cảnh: tuyển dụng có thể ưu tiên equal opportunity; khi bỏ sót hay báo nhầm đều gây hại thì xem equalized odds.</p>
<h4>3. Thiên lệch đến từ đâu?</h4>
<ul><li><b>Lịch sử</b>: dữ liệu ghi lại các quyết định bất công trong quá khứ.</li>
<li><b>Đại diện</b>: một nhóm có quá ít mẫu nên mô hình học kém về nhóm đó (nhận diện khuôn mặt kém với người da sẫm màu vì ít ảnh).</li>
<li><b>Đo lường</b>: nhãn là thứ đo được thay cho thứ thật cần đo (số lần bị kiểm tra thay cho số lần phạm lỗi).</li>
<li><b>Biến đại diện</b> (proxy): bỏ cột giới tính nhưng tên trường, sở thích, địa chỉ vẫn mang thông tin đó.</li></ul>
<h4>4. Giảm thiên lệch</h4>
<ul><li><b>Trước khi học</b>: thu thêm dữ liệu cho nhóm ít, đánh trọng số lại mẫu.</li>
<li><b>Trong khi học</b>: thêm ràng buộc công bằng vào hàm lỗi.</li>
<li><b>Sau khi học</b>: chọn ngưỡng riêng cho từng nhóm để đạt tiêu chí đã chọn.</li></ul>
<p>Ngoài con số, cần <b>minh bạch</b> (giải thích được vì sao bị từ chối), <b>trách nhiệm</b> (ai chịu trách nhiệm khi AI sai) và có <b>con người</b> xem lại các quyết định quan trọng.</p>`,
en:{title:'Fairness and bias',
one:'A model can be accurate and still be unfair to a group of people.',
why:'AI decides on loans, hiring and applications, so it must be fair to every group.',pre:'The Evaluation lesson (TPR, precision).',
idea:`<p>Skewed data (past injustice, few samples from one group) produces a skewed model. There are several definitions of fairness: equal <b>approval rates</b>; <b>qualified people</b> approved equally often (equal TPR); <b>approved people</b> equally likely to be qualified (equal precision).</p><p>When the share of qualified people differs between two groups, it is <b>impossible</b> to satisfy every criterion at once. The criterion must be chosen to fit the situation.</p>`,
life:'A scholarship-screening system trained on old data, in which school A used to be favoured, will keep favouring school A.',
tryit:'Press Common threshold 0.5: which criteria pass and which fail? Then press Equalise approval rates and Equalise precision.',
rem:['Demographic parity: equal approval rates','Equal opportunity: equal TPR','Equalized odds: equal TPR and equal FPR','Predictive parity: equal precision','Different base rates and an imperfect model → you cannot satisfy them all (impossibility theorem)','Dropping the gender column is not enough: address and school name remain proxies','Four-fifths rule: approval rate of the lower group / higher group < 0.8 signals adverse impact'],
traps:['Differential privacy usually costs the most accuracy for minority groups.','Too little data from one group is representation (sampling) bias.'],
deep:`<h4>1. A full two-group example</h4>
<div class="ex">Each group has 100 applicants. Group A has 60 qualified people, group B has 30.<br>The model approves: in group A, 50 qualified + 10 unqualified = 60 applications; in group B, 25 qualified + 5 unqualified = 30.<br><table class="mini"><tr><th></th><th>Group A</th><th>Group B</th><th>Criterion</th></tr><tr><td>Approval rate</td><td>60%</td><td>30%</td><td>Demographic parity: <b>fails</b></td></tr><tr><td>TPR</td><td>50/60 ≈ 0.83</td><td>25/30 ≈ 0.83</td><td>Equal opportunity: <b>passes</b></td></tr><tr><td>FPR</td><td>10/40 = 0.25</td><td>5/70 ≈ 0.07</td><td>Equalized odds: <b>fails</b></td></tr><tr><td>Precision</td><td>50/60 ≈ 0.83</td><td>25/30 ≈ 0.83</td><td>Predictive parity: <b>passes</b></td></tr></table>
Four-fifths rule: 30%/60% = 0.5 &lt; 0.8 → a sign of adverse impact on group B.</div>
<p>The same model passes some criteria and fails others. Equalising approval rates would mean approving more unqualified people in B or fewer qualified people in A, which breaks TPR or precision.</p>
<h4>2. The impossibility theorem</h4>
<p>When the share of qualified people (the base rate) differs between groups and the model is imperfect, it is <b>impossible</b> to have equal precision, equal TPR and equal FPR at the same time. The criterion must fit the situation: hiring might prioritise equal opportunity; when both misses and false alarms cause harm, look at equalized odds.</p>
<h4>3. Where bias comes from</h4>
<ul><li><b>Historical</b>: the data records unfair decisions from the past.</li>
<li><b>Representation</b>: a group has too few samples, so the model learns it poorly (face recognition failing on darker skin because of few photos).</li>
<li><b>Measurement</b>: the label is a stand-in for what we really want (times inspected instead of times at fault).</li>
<li><b>Proxies</b>: the gender column is dropped, but school name, hobbies or address still carry that information.</li></ul>
<h4>4. Reducing bias</h4>
<ul><li><b>Before training</b>: collect more data for small groups, reweight samples.</li>
<li><b>During training</b>: add fairness constraints to the loss.</li>
<li><b>After training</b>: choose a separate threshold for each group to meet the chosen criterion.</li></ul>
<p>Beyond the numbers we need <b>transparency</b> (being able to explain a rejection), <b>accountability</b> (who answers when AI is wrong) and a <b>human</b> reviewing important decisions.</p>`}},

deep:`<h4>1. Khung bài làm 5 giờ</h4>
<ol><li><b>30 phút</b>: đọc đề, chỉ số chấm (accuracy, F1, RMSE…), định dạng file nộp. Xem dữ liệu.</li>
<li><b>30 phút</b>: mô hình mốc đơn giản, tạo file nộp hợp lệ và nộp ngay.</li>
<li><b>2–3 giờ</b>: làm sạch, tạo đặc trưng, thử mô hình mạnh hơn, chấm bằng cross-validation.</li>
<li><b>Cuối cùng</b>: huấn luyện lại trên toàn bộ train, dự đoán test, kiểm tra file, nộp. Không thử điều mới trong 20 phút cuối.</li></ol>
<h4>2. Xem nhanh dữ liệu</h4>
<pre>import pandas as pd

<h4>3. Pipeline: tiền xử lý và mô hình trong một khối</h4>
<pre>from sklearn.compose import ColumnTransformer
from sklearn.pipeline import Pipeline
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import StandardScaler, OneHotEncoder
from sklearn.ensemble import RandomForestClassifier

X = df.drop(columns=["label"]); y = df["label"]
num = X.select_dtypes("number").columns

deep:`<h4>1. A 5-hour plan</h4>
<ol><li><b>30 minutes</b>: read the task, the scoring metric (accuracy, F1, RMSE…) and the submission format. Look at the data.</li>
<li><b>30 minutes</b>: a simple baseline; produce a valid submission file and submit it straight away.</li>
<li><b>2–3 hours</b>: cleaning, feature engineering, stronger models, scored with cross-validation.</li>
<li><b>At the end</b>: retrain on all the training data, predict the test set, check the file, submit. Do not try anything new in the last 20 minutes.</li></ol>
<h4>2. A quick look at the data</h4>
<pre>import pandas as pd
df = pd.read_csv("train.csv")
print(df.shape)                 # rows, columns
df.info()                       # column types, non-missing counts
print(df.isnull().sum())        # missing cells per column
print(df["label"].value_counts())  # is the data imbalanced?</pre>
<h4>3. Pipeline: preprocessing and model in one block</h4>
<pre>from sklearn.compose import ColumnTransformer
from sklearn.pipeline import Pipeline
from sklearn.impute import SimpleImputer
from sklearn.preprocessing import StandardScaler, OneHotEncoder
from sklearn.ensemble import RandomForestClassifier
from sklearn.model_selection import cross_val_score

X = df.drop(columns=["label"]); y = df["label"]
num = X.select_dtypes("number").columns
cat = X.select_dtypes("object").columns
pre = ColumnTransformer([
  ("num", Pipeline([("fill", SimpleImputer(strategy="median")),
                    ("scale", StandardScaler())]), num),
  ("cat", Pipeline([("fill", SimpleImputer(strategy="most_frequent")),
                    ("onehot", OneHotEncoder(handle_unknown="ignore"))]), cat)])
model = Pipeline([("pre", pre),
                  ("rf", RandomForestClassifier(n_estimators=300, random_state=0))])
print(cross_val_score(model, X, y, cv=5, scoring="f1_macro").mean())</pre>
<p>The Pipeline makes sure every statistic is learned only on the training part of each cross-validation round: no data leakage.</p>
<h4>4. Trying and choosing</h4>
<ul><li>Start with LogisticRegression (baseline), RandomForest, GradientBoosting / HistGradientBoosting.</li>
<li>Tune a few key hyperparameters (number of trees, depth, learning rate) with cross-validation and log the score of every attempt.</li>
<li>For regression use RandomForestRegressor and measure RMSE or MAE as the task requires.</li></ul>
<h4>5. Submitting</h4>
<pre>model.fit(X, y)
test = pd.read_csv("test.csv")
pred = model.predict(test[X.columns])
pd.DataFrame({"id": test["id"], "label": pred}).to_csv("submission.csv", index=False)</pre>
<h4>6. Common errors</h4>
<ul><li><b>ValueError: could not convert string to float</b>: a text column has not been encoded.</li>
<li><b>Input contains NaN</b>: missing cells have not been filled.</li>
<li>Test columns in a different order or missing compared with train: always select <span class="fx">test[X.columns]</span>.</li>
<li>Forgetting to fix random_state, so every run gives a different result.</li></ul>`}},

{t:"vector",q:"(1, 2, 3)·(4, 5, 6) bằng bao nhiêu?",o:["32","21","(4, 10, 18)","15"],a:[0],e:"1×4 + 2×5 + 3×6 = 4 + 10 + 18 = 32. (4, 10, 18) là nhân từng cặp nhưng chưa cộng lại.",en:{q:"(1, 2, 3)·(4, 5, 6) equals?",o:["32","21","(4, 10, 18)","15"],e:"1×4 + 2×5 + 3×6 = 4 + 10 + 18 = 32. (4, 10, 18) multiplies the pairs but does not add them up."}},
{t:"vector",q:"Khoảng cách Euclid giữa (1, 1) và (4, 5) là?",o:["5","7","25","3"],a:[0],e:"√(3² + 4²) = √25 = 5. Số 7 là khoảng cách Manhattan.",en:{q:"The Euclidean distance between (1, 1) and (4, 5) is?",o:["5","7","25","3"],e:"√(3² + 4²) = √25 = 5. 7 is the Manhattan distance."}},
{t:"vector",q:"Khoảng cách Manhattan giữa (2, 3) và (5, 1) là?",o:["5","√13","3","13"],a:[0],e:"|2 − 5| + |3 − 1| = 3 + 2 = 5.",en:{q:"The Manhattan distance between (2, 3) and (5, 1) is?",o:["5","√13","3","13"],e:"|2 − 5| + |3 − 1| = 3 + 2 = 5."}},
{t:"vector",q:"Những phát biểu nào đúng?",o:["Tích vô hướng bằng 0 thì hai vector vuông góc","Ma trận 2×3 nhân được với ma trận 4×3","Với mọi ma trận, AB = BA","Cosine similarity luôn ≥ 0"],a:[0],e:"Nhân ma trận không giao hoán. Cosine nằm từ −1 đến 1, âm khi hai vector ngược hướng. Ma trận 2×3 chỉ nhân được với ma trận có 3 hàng (ví dụ 3×4).",en:{q:"Which statements are true?",o:["If the dot product is 0, the two vectors are perpendicular","A 2×3 matrix can be multiplied by a 4×3 matrix","AB = BA for every pair of matrices","Cosine similarity is always ≥ 0"],e:"Matrix multiplication is not commutative. Cosine lies between −1 and 1 and is negative when the vectors point in opposite directions. A 2×3 matrix can only be multiplied by a matrix with 3 rows (e.g. 3×4)."}},
{t:"vector",q:"Độ dài (chuẩn L2) của vector (6, 8) là?",o:["10","14","100","48"],a:[0],e:"√(36 + 64) = √100 = 10.",en:{q:"The length (L2 norm) of the vector (6, 8) is?",o:["10","14","100","48"],e:"√(36 + 64) = √100 = 10."}},
{t:"gradient",q:"L(w) = (w − 3)², w = 0, learning rate 0.1. Sau một bước gradient descent, w bằng?",o:["0.6","−0.6","0.3","3"],a:[0],e:"L′(w) = 2(w − 3) = −6. w mới = 0 − 0.1 × (−6) = 0.6.",en:{q:"L(w) = (w − 3)², w = 0, learning rate 0.1. After one gradient descent step, w equals?",o:["0.6","−0.6","0.3","3"],e:"L′(w) = 2(w − 3) = −6. New w = 0 − 0.1 × (−6) = 0.6."}},
{t:"gradient",q:"Learning rate quá lớn thì điều gì có thể xảy ra?",o:["Nhảy qua lại quanh đáy, thậm chí phân kỳ","Luôn hội tụ nhanh hơn","Mô hình hết overfit","Gradient luôn bằng 0"],a:[0],e:"Bước quá dài sẽ vượt qua đáy, lỗi có thể tăng dần.",en:{q:"What can happen if the learning rate is too large?",o:["It bounces around the minimum or even diverges","It always converges faster","The model stops overfitting","The gradient is always 0"],e:"Steps that are too long overshoot the minimum, and the loss can keep growing."}},
{t:"gradient",q:"Độ dốc của hàm lỗi tại w hiện tại là −4. Để giảm lỗi nên làm gì?",o:["Tăng w","Giảm w","Giữ nguyên w","Đổi dấu w"],a:[0],e:"w mới = w − η × (−4) = w + 4η, tức là tăng w.",en:{q:"The slope of the loss at the current w is −4. What should we do to reduce the loss?",o:["Increase w","Decrease w","Keep w unchanged","Flip the sign of w"],e:"New w = w − η × (−4) = w + 4η, so w increases."}},
{t:"gradient",q:"Đạo hàm của sigmoid σ(x) là?",o:["σ(x)·(1 − σ(x))","σ(x)²","1 − σ(x)","e^(−x)"],a:[0],e:"Công thức quen thuộc, giá trị lớn nhất 0.25 tại x = 0.",en:{q:"The derivative of the sigmoid σ(x) is?",o:["σ(x)·(1 − σ(x))","σ(x)²","1 − σ(x)","e^(−x)"],e:"A standard formula; its maximum is 0.25 at x = 0."}},
{t:"gradient",q:"y = (3x + 1)². Đạo hàm dy/dx là?",o:["6(3x + 1)","2(3x + 1)","3(3x + 1)²","6x"],a:[0],e:"Quy tắc chuỗi: 2(3x + 1) × 3 = 6(3x + 1).",en:{q:"y = (3x + 1)². The derivative dy/dx is?",o:["6(3x + 1)","2(3x + 1)","3(3x + 1)²","6x"],e:"Chain rule: 2(3x + 1) × 3 = 6(3x + 1)."}},
{t:"bayes",q:"Bệnh có tỉ lệ 1%. Xét nghiệm đúng 90% với người bệnh, báo nhầm dương tính 10% với người khỏe. Người dương tính có xác suất bệnh khoảng?",o:["8%","90%","50%","10%"],a:[0],e:"Trong 1000 người: 10 bệnh, 9 dương tính. 990 khỏe, 99 dương tính nhầm. 9/(9 + 99) ≈ 8.3%.",en:{q:"A disease affects 1% of people. A test detects 90% of sick people and gives false positives for 10% of healthy people. The probability that a person who tests positive is sick is about?",o:["8%","90%","50%","10%"],e:"Out of 1000 people: 10 sick, 9 positive. 990 healthy, 99 false positives. 9/(9 + 99) ≈ 8.3%."}},
{t:"bayes",q:"Kỳ vọng số chấm khi tung một xúc xắc 6 mặt cân đối?",o:["3.5","3","6","21"],a:[0],e:"(1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 3.5.",en:{q:"The expected value of a fair six-sided die?",o:["3.5","3","6","21"],e:"(1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 3.5."}},
{t:"bayes",q:"P(A) = 0,5, P(B) = 0,4, P(A và B) = 0.2. Hai biến cố A và B?",o:["Độc lập","Xung khắc","Không độc lập","Không đủ dữ kiện"],a:[0],e:"0.5 × 0.4 = 0.2 = P(A và B), nên độc lập. Xung khắc thì P(A và B) = 0.",en:{q:"P(A) = 0.5, P(B) = 0.4, P(A and B) = 0.2. Events A and B are?",o:["Independent","Mutually exclusive","Not independent","Not enough information"],e:"0.5 × 0.4 = 0.2 = P(A and B), so they are independent. Mutually exclusive would mean P(A and B) = 0."}},
{t:"bayes",q:"P(mưa) = 0.3; P(mang ô | mưa) = 0.9; P(mang ô | không mưa) = 0.2. P(mang ô) = ?",o:["0.41","0.9","0.27","0.55"],a:[0],e:"0.9 × 0.3 + 0.2 × 0.7 = 0.27 + 0.14 = 0.41.",en:{q:"P(rain) = 0.3; P(umbrella | rain) = 0.9; P(umbrella | no rain) = 0.2. P(umbrella) = ?",o:["0.41","0.9","0.27","0.55"],e:"0.9 × 0.3 + 0.2 × 0.7 = 0.27 + 0.14 = 0.41."}},
{t:"bayes",q:"P(spam) = 0.2; P(có chữ \"khuyến mãi\" | spam) = 0.6; P(có chữ đó | không spam) = 0.1. P(spam | có chữ đó) = ?",o:["0.6","0.12","0.2","0.75"],a:[0],e:"P(chữ) = 0.12 + 0.08 = 0.2. P(spam | chữ) = 0.12/0.2 = 0.6.",en:{q:"P(spam) = 0.2; P(contains \"discount\" | spam) = 0.6; P(contains it | not spam) = 0.1. P(spam | contains it) = ?",o:["0.6","0.12","0.2","0.75"],e:"P(word) = 0.12 + 0.08 = 0.2. P(spam | word) = 0.12/0.2 = 0.6."}},
{t:"hoi-quy",q:"y thật = (3, 5, 4), dự đoán = (2, 5, 6). MSE bằng?",o:["5/3","1","3","5"],a:[0],e:"Sai số: 1, 0, −2. Bình phương: 1, 0, 4. Trung bình: 5/3 ≈ 1.67.",en:{q:"True y = (3, 5, 4), predictions = (2, 5, 6). The MSE is?",o:["5/3","1","3","5"],e:"Errors: 1, 0, −2. Squares: 1, 0, 4. Mean: 5/3 ≈ 1.67."}},
{t:"hoi-quy",q:"Bài toán nào là hồi quy?",o:["Dự đoán giá nhà theo diện tích","Phân biệt thư rác","Nhận diện chữ số 0–9","Chia khách hàng thành nhóm khi không có nhãn"],a:[0],e:"Hồi quy dự đoán một con số liên tục. Hai bài giữa là phân loại, bài cuối là phân cụm.",en:{q:"Which problem is regression?",o:["Predicting a house price from its area","Detecting spam email","Recognising handwritten digits 0–9","Grouping customers when there are no labels"],e:"Regression predicts a continuous number. The middle two are classification, the last is clustering."}},
{t:"hoi-quy",q:"Vì sao MSE nhạy với điểm ngoại lai?",o:["Bình phương làm sai số lớn càng lớn hơn","MSE bỏ qua sai số âm","MSE chỉ tính điểm ngoại lai","MSE dùng trị tuyệt đối"],a:[0],e:"Sai số 10 thành 100, trong khi sai số 1 vẫn là 1.",en:{q:"Why is MSE sensitive to outliers?",o:["Squaring makes large errors much larger","MSE ignores negative errors","MSE only counts outliers","MSE uses absolute values"],e:"An error of 10 becomes 100, while an error of 1 stays 1."}},
{t:"hoi-quy",q:"Phát biểu nào SAI về hồi quy logistic?",o:["Là thuật toán phân loại","Dùng hàm sigmoid để ra xác suất","Với đặc trưng gốc, ranh giới quyết định có thể là đường cong bất kỳ","Hàm loss thường dùng là cross-entropy"],a:[2],e:"Ranh giới w·x + b = 0 là tuyến tính (đường thẳng, mặt phẳng).",en:{q:"Which statement about logistic regression is FALSE?",o:["It is a classification algorithm","It uses the sigmoid to output a probability","With the original features, its decision boundary can be any curve","Its usual loss is cross-entropy"],e:"The boundary w·x + b = 0 is linear (a line or a plane)."}},
{t:"knn",q:"Dùng k-NN với k = 1 để dự đoán lại chính tập train (không có điểm trùng). Lỗi train bằng?",o:["0","50%","100%","Không xác định"],a:[0],e:"Điểm gần mỗi điểm train nhất là chính nó, nên luôn đoán đúng.",en:{q:"Use k-NN with k = 1 to predict the training set itself (no duplicate points). The training error is?",o:["0","50%","100%","Undefined"],e:"Each training point's nearest neighbour is itself, so it is always correct."}},
{t:"knn",q:"Vì sao phải chuẩn hóa dữ liệu trước khi dùng k-NN?",o:["Đặc trưng có thang đo lớn sẽ áp đảo khoảng cách","Để bước huấn luyện nhanh hơn","Vì k-NN dùng gradient descent","Để giảm số lớp"],a:[0],e:"Khoảng cách cộng các chênh lệch; chênh lệch hàng triệu sẽ nuốt chênh lệch vài năm tuổi.",en:{q:"Why must data be normalised before using k-NN?",o:["Features with a large scale dominate the distance","To make training faster","Because k-NN uses gradient descent","To reduce the number of classes"],e:"Distance adds up differences; differences in millions swamp differences of a few years of age."}},
{t:"knn",q:"Tăng k của k-NN từ 1 lên rất lớn. Điều nào KHÔNG đúng?",o:["Ranh giới quyết định mượt hơn","Nguy cơ underfit tăng","Lỗi train luôn bằng 0","Khi k bằng số mẫu, luôn đoán lớp chiếm đa số"],a:[2],e:"Lỗi train bằng 0 chỉ chắc chắn khi k = 1.",en:{q:"k in k-NN goes from 1 to a very large value. Which statement is NOT true?",o:["The decision boundary becomes smoother","The risk of underfitting increases","The training error is always 0","When k equals the number of samples, it always predicts the majority class"],e:"Zero training error is only guaranteed when k = 1."}},
{t:"knn",q:"k-NN thuộc loại học nào?",o:["Học có giám sát","Học không giám sát","Học tăng cường","Tìm kiếm heuristic"],a:[0],e:"k-NN cần dữ liệu có nhãn để bỏ phiếu.",en:{q:"k-NN is which type of learning?",o:["Supervised learning","Unsupervised learning","Reinforcement learning","Heuristic search"],e:"k-NN needs labelled data to vote."}},
{t:"cay",q:"Nút có 6 mẫu lớp A và 2 mẫu lớp B. Chỉ số Gini?",o:["0.375","0.25","0.5","0.811"],a:[0],e:"1 − (0.75² + 0.25²) = 1 − 0.625 = 0.375. Số 0.811 là entropy.",en:{q:"A node has 6 samples of class A and 2 of class B. Its Gini index?",o:["0.375","0.25","0.5","0.811"],e:"1 − (0.75² + 0.25²) = 1 − 0.625 = 0.375. 0.811 is the entropy."}},
{t:"cay",q:"Nút có 4 mẫu A và 4 mẫu B. Entropy bằng?",o:["1","0.5","0","2"],a:[0],e:"−(0.5·log₂0.5 + 0.5·log₂0.5) = 1. Gini của nút này là 0.5.",en:{q:"A node has 4 samples of A and 4 of B. Its entropy is?",o:["1","0.5","0","2"],e:"−(0.5·log₂0.5 + 0.5·log₂0.5) = 1. The Gini of this node is 0.5."}},
{t:"cay",q:"Random forest (bagging nhiều cây) chủ yếu giảm điều gì?",o:["Phương sai (variance)","Bias","Số đặc trưng","Kích thước dữ liệu"],a:[0],e:"Trung bình nhiều mô hình dao động giúp kết quả ổn định. Boosting thì chủ yếu giảm bias.",en:{q:"Random forest (bagging many trees) mainly reduces what?",o:["Variance","Bias","The number of features","The data size"],e:"Averaging many fluctuating models makes the result stable. Boosting mainly reduces bias."}},
{t:"cay",q:"Cách nào KHÔNG giúp cây quyết định bớt overfit?",o:["Giới hạn độ sâu","Yêu cầu số mẫu tối thiểu ở mỗi lá","Cắt tỉa (pruning)","Cho cây mọc đến khi mỗi lá chỉ còn 1 mẫu"],a:[3],e:"Mỗi lá 1 mẫu là học thuộc lòng hoàn toàn.",en:{q:"Which of these does NOT help a decision tree overfit less?",o:["Limiting the depth","Requiring a minimum number of samples per leaf","Pruning","Growing the tree until every leaf has 1 sample"],e:"One sample per leaf is pure memorisation."}},
{t:"cay",q:"Nút cha 4 có / 4 không (entropy 1). Chia thành 3 có/1 không và 1 có/3 không (entropy mỗi nhánh ≈ 0.811). Information gain?",o:["≈ 0.189","≈ 0.811","1","0"],a:[0],e:"1 − (4/8 × 0.811 + 4/8 × 0.811) = 1 − 0.811 = 0.189.",en:{q:"A parent node has 4 yes / 4 no (entropy 1). It is split into 3 yes/1 no and 1 yes/3 no (each branch entropy ≈ 0.811). The information gain?",o:["≈ 0.189","≈ 0.811","1","0"],e:"1 − (4/8 × 0.811 + 4/8 × 0.811) = 1 − 0.811 = 0.189."}},
{t:"kmeans",q:"Điểm 1, 2, 9, 10; tâm ban đầu 1 và 2. Sau một vòng gán và cập nhật, hai tâm mới là?",o:["1 và 7","1.5 và 9.5","1 và 2","5 và 6"],a:[0],e:"9 và 10 gần tâm 2 hơn tâm 1, nên nhóm là {1} và {2, 9, 10}. Tâm mới: 1 và 21/3 = 7.",en:{q:"Points 1, 2, 9, 10; initial centres 1 and 2. After one assignment and update step, the new centres are?",o:["1 and 7","1.5 and 9.5","1 and 2","5 and 6"],e:"9 and 10 are closer to centre 2 than to centre 1, so the groups are {1} and {2, 9, 10}. New centres: 1 and 21/3 = 7."}},
{t:"kmeans",q:"k-means thuộc loại học nào?",o:["Không giám sát","Có giám sát","Học tăng cường","Học bán giám sát bắt buộc có nhãn"],a:[0],e:"k-means không dùng nhãn, tự tìm nhóm.",en:{q:"k-means is which type of learning?",o:["Unsupervised","Supervised","Reinforcement learning","Semi-supervised, labels required"],e:"k-means uses no labels and finds groups by itself."}},
{t:"kmeans",q:"Tăng số cụm k thì inertia tốt nhất có thể đạt được sẽ?",o:["Giảm hoặc giữ nguyên","Tăng lên","Luôn bằng 0","Không liên quan đến k"],a:[0],e:"Thêm tâm thì điểm có thể ở gần tâm hơn; k bằng số điểm thì inertia = 0. Vì vậy không chọn k bằng cách làm inertia nhỏ nhất, mà nhìn chỗ gấp khúc (phương pháp khuỷu tay).",en:{q:"As the number of clusters k increases, the best achievable inertia will?",o:["Decrease or stay the same","Increase","Always be 0","Not depend on k"],e:"More centres let points sit closer to a centre; with k equal to the number of points the inertia is 0. So k is not chosen by minimising inertia but by looking for the bend (the elbow method)."}},
{t:"kmeans",q:"Phát biểu nào SAI về k-means?",o:["Kết quả phụ thuộc vị trí tâm ban đầu","Phải chọn trước k","Luôn tìm được nghiệm tốt nhất toàn cục","Hợp nhất với cụm tròn, kích thước tương đương"],a:[2],e:"k-means có thể dừng ở cực tiểu cục bộ; vì thế người ta chạy nhiều lần hoặc dùng k-means++.",en:{q:"Which statement about k-means is FALSE?",o:["The result depends on the initial centres","k must be chosen in advance","It always finds the global optimum","It works best with round clusters of similar size"],e:"k-means can stop at a local minimum, so people run it several times or use k-means++."}},
{t:"pca",q:"PCA có các trị riêng 4, 3, 2, 1. Giữ 2 thành phần chính thì giữ bao nhiêu % phương sai?",o:["70%","50%","80%","90%"],a:[0],e:"(4 + 3)/(4 + 3 + 2 + 1) = 7/10 = 70%.",en:{q:"PCA has eigenvalues 4, 3, 2, 1. Keeping 2 principal components keeps what % of the variance?",o:["70%","50%","80%","90%"],e:"(4 + 3)/(4 + 3 + 2 + 1) = 7/10 = 70%."}},
{t:"overfit",q:"Lỗi train 1%, lỗi validation 25%. Mô hình đang?",o:["Overfit","Underfit","Vừa khéo","Không kết luận được gì"],a:[0],e:"Train rất tốt nhưng dữ liệu mới rất kém: học thuộc lòng.",en:{q:"Training error 1%, validation error 25%. The model is?",o:["Overfitting","Underfitting","Just right","Nothing can be concluded"],e:"Very good on training data but very poor on new data: memorisation."}},
{t:"overfit",q:"Tập test dùng để làm gì?",o:["Báo cáo kết quả cuối cùng, chỉ dùng một lần","Chọn siêu tham số","Huấn luyện trọng số","Tăng thêm dữ liệu train"],a:[0],e:"Chọn siêu tham số là việc của tập validation.",en:{q:"What is the test set used for?",o:["Reporting the final result, used only once","Choosing hyperparameters","Training the weights","Adding more training data"],e:"Choosing hyperparameters is the job of the validation set."}},
{t:"overfit",q:"Cách nào KHÔNG giúp giảm overfitting?",o:["Thêm dữ liệu train","Regularization","Dropout","Tăng số lớp và số tham số"],a:[3],e:"Tăng độ phức tạp thường làm overfit nặng hơn.",en:{q:"Which of these does NOT help reduce overfitting?",o:["More training data","Regularisation","Dropout","More layers and parameters"],e:"More complexity usually makes overfitting worse."}},
{t:"overfit",q:"Regularization L1 khác L2 ở điểm nào?",o:["L1 đẩy nhiều trọng số về đúng 0","L1 làm mọi trọng số bằng nhau","L2 luôn xóa hẳn đặc trưng","Không khác gì nhau"],a:[0],e:"L1 tạo mô hình thưa, tự chọn đặc trưng. L2 làm các trọng số nhỏ đều.",en:{q:"How does L1 regularisation differ from L2?",o:["L1 pushes many weights to exactly 0","L1 makes all weights equal","L2 always removes features completely","They are the same"],e:"L1 gives sparse models and selects features. L2 shrinks all weights evenly."}},
{t:"overfit",q:"5-fold cross-validation trên 1000 mẫu: mỗi lần huấn luyện dùng bao nhiêu mẫu?",o:["800","200","1000","500"],a:[0],e:"Chia 5 phần, mỗi phần 200. Mỗi lần 1 phần làm validation, 4 phần (800) để train.",en:{q:"5-fold cross-validation on 1000 samples: how many samples does each training run use?",o:["800","200","1000","500"],e:"Split into 5 parts of 200. Each time 1 part is validation and 4 parts (800) are for training."}},
{t:"overfit",q:"Sai số tổng quát hóa tỉ lệ với 1/√n. Muốn nó giảm một nửa cần dữ liệu gấp bao nhiêu lần?",o:["4","2","√2","8"],a:[0],e:"1/√(4n) = (1/2)·(1/√n).",en:{q:"The generalisation error scales like 1/√n. To halve it you need how many times more data?",o:["4","2","√2","8"],e:"1/√(4n) = (1/2)·(1/√n)."}},
{t:"danh-gia",q:"TP = 40, FP = 10, FN = 20, TN = 30. Precision bằng?",o:["0.8","0.667","0.7","0.4"],a:[0],e:"40/(40 + 10) = 0.8.",en:{q:"TP = 40, FP = 10, FN = 20, TN = 30. Precision is?",o:["0.8","0.667","0.7","0.4"],e:"40/(40 + 10) = 0.8."}},
{t:"danh-gia",q:"TP = 40, FP = 10, FN = 20, TN = 30. Recall bằng?",o:["≈ 0.667","0.8","0.7","0.75"],a:[0],e:"40/(40 + 20) ≈ 0.667.",en:{q:"TP = 40, FP = 10, FN = 20, TN = 30. Recall is?",o:["≈ 0.667","0.8","0.7","0.75"],e:"40/(40 + 20) ≈ 0.667."}},
{t:"danh-gia",q:"Chi phí báo nhầm C_FP = 1, bỏ sót C_FN = 9. Với mô hình cho xác suất chuẩn, ngưỡng tối ưu là?",o:["0.1","0.5","0.9","0.25"],a:[0],e:"C_FP/(C_FP + C_FN) = 1/10. Bỏ sót đắt nên hạ ngưỡng.",en:{q:"False alarm cost C_FP = 1, miss cost C_FN = 9. For a calibrated model, the optimal threshold is?",o:["0.1","0.5","0.9","0.25"],e:"C_FP/(C_FP + C_FN) = 1/10. Misses are expensive, so lower the threshold."}},
{t:"danh-gia",q:"Tỉ lệ ca dương giảm từ 50% xuống 5%, mô hình giữ nguyên. Điều nào SAI?",o:["Recall không đổi","FPR không đổi","Precision giảm","Accuracy chắc chắn không đổi"],a:[3],e:"Recall và FPR tính riêng trong từng lớp thật nên không đổi. Precision trộn hai lớp nên giảm. Accuracy thường thay đổi.",en:{q:"The share of positive cases drops from 50% to 5% and the model stays the same. Which statement is FALSE?",o:["Recall does not change","FPR does not change","Precision decreases","Accuracy certainly does not change"],e:"Recall and FPR are computed within each true class, so they stay the same. Precision mixes both classes, so it drops. Accuracy usually changes."}},
{t:"danh-gia",q:"Sàng lọc ung thư sớm: chỉ số nào quan trọng nhất?",o:["Recall","Precision","Accuracy","Specificity"],a:[0],e:"Bỏ sót người bệnh nguy hiểm hơn nhiều so với cho người khỏe đi xét nghiệm lại.",en:{q:"Early cancer screening: which metric matters most?",o:["Recall","Precision","Accuracy","Specificity"],e:"Missing a sick person is far more dangerous than sending a healthy person for another test."}},
{t:"danh-gia",q:"F1 của ba lớp là 0.9; 0.6; 0.3. Macro-F1 bằng?",o:["0.6","0.9","0.3","1.8"],a:[0],e:"(0.9 + 0.6 + 0.3)/3 = 0.6.",en:{q:"The F1 scores of three classes are 0.9, 0.6, 0.3. The macro-F1 is?",o:["0.6","0.9","0.3","1.8"],e:"(0.9 + 0.6 + 0.3)/3 = 0.6."}},
{t:"danh-gia",q:"Precision = 1.0 và recall = 0.1. F1 xấp xỉ?",o:["0.18","0.55","0.1","1.0"],a:[0],e:"2 × 1 × 0.1/(1 + 0.1) ≈ 0.18. F1 bị kéo về số nhỏ hơn.",en:{q:"Precision = 1.0 and recall = 0.1. F1 is about?",o:["0.18","0.55","0.1","1.0"],e:"2 × 1 × 0.1/(1 + 0.1) ≈ 0.18. F1 is pulled towards the smaller value."}},
{t:"noron",q:"Một perceptron đơn (một nơ-ron) KHÔNG học được hàm nào?",o:["XOR","AND","OR","NOT"],a:[0],e:"XOR không tách được bằng một đường thẳng.",en:{q:"Which function can a single perceptron (one neuron) NOT learn?",o:["XOR","AND","OR","NOT"],e:"XOR cannot be separated by a single straight line."}},
{t:"noron",q:"Lớp fully connected 784 → 128 có bao nhiêu tham số?",o:["100 480","100 352","912","128"],a:[0],e:"784 × 128 + 128 (bias) = 100 352 + 128 = 100 480.",en:{q:"How many parameters does a fully connected layer 784 → 128 have?",o:["100 480","100 352","912","128"],e:"784 × 128 + 128 (bias) = 100 352 + 128 = 100 480."}},
{t:"noron",q:"ReLU(−3) bằng?",o:["0","−3","3","1"],a:[0],e:"ReLU(z) = max(0, z).",en:{q:"ReLU(−3) equals?",o:["0","−3","3","1"],e:"ReLU(z) = max(0, z)."}},
{t:"noron",q:"Về vanishing gradient, phát biểu nào SAI?",o:["Hay gặp khi dùng sigmoid ở mạng sâu","Dùng ReLU giúp giảm","Kết nối tắt (ResNet) giúp giảm","Tăng learning rate là cách sửa chuẩn"],a:[3],e:"Tăng learning rate không sửa được việc gradient bị nhân với nhiều số nhỏ.",en:{q:"About vanishing gradients, which statement is FALSE?",o:["Common with sigmoid in deep networks","Using ReLU helps","Skip connections (ResNet) help","Increasing the learning rate is the standard fix"],e:"A larger learning rate does not fix a gradient that is multiplied by many small numbers."}},
{t:"noron",q:"Vì sao mạng nơ-ron cần hàm kích hoạt phi tuyến?",o:["Không có nó, nhiều lớp chồng nhau vẫn chỉ là một phép tuyến tính","Để mạng chạy nhanh hơn","Để giảm số tham số","Để dữ liệu luôn dương"],a:[0],e:"W₂(W₁x) = (W₂W₁)x, vẫn tuyến tính.",en:{q:"Why do neural networks need non-linear activation functions?",o:["Without them, stacked layers are still just one linear map","To make the network run faster","To reduce the number of parameters","To keep the data positive"],e:"W₂(W₁x) = (W₂W₁)x, which is still linear."}},
{t:"cnn",q:"Ảnh 32×32, kernel 5×5, stride 1, padding 0. Kích thước feature map?",o:["28×28","27×27","32×32","30×30"],a:[0],e:"(32 − 5 + 0)/1 + 1 = 28.",en:{q:"Image 32×32, kernel 5×5, stride 1, padding 0. The feature map size?",o:["28×28","27×27","32×32","30×30"],e:"(32 − 5 + 0)/1 + 1 = 28."}},
{t:"cnn",q:"Ảnh 64×64×3, 32 kernel 3×3, stride 2, padding 1. Kích thước đầu ra?",o:["32×32×32","31×31×32","62×62×32","32×32×3"],a:[0],e:"⌊(64 − 3 + 2)/2⌋ + 1 = ⌊31.5⌋ + 1 = 32. Số kênh = số kernel = 32.",en:{q:"Image 64×64×3, 32 kernels of 3×3, stride 2, padding 1. The output size?",o:["32×32×32","31×31×32","62×62×32","32×32×3"],e:"⌊(64 − 3 + 2)/2⌋ + 1 = ⌊31.5⌋ + 1 = 32. Channels = number of kernels = 32."}},
{t:"cnn",q:"16 kernel 5×5 trên đầu vào 3 kênh. Lớp conv có bao nhiêu tham số?",o:["1216","1200","400","75"],a:[0],e:"(5 × 5 × 3 + 1) × 16 = 76 × 16 = 1216.",en:{q:"16 kernels of 5×5 on a 3-channel input. How many parameters does the conv layer have?",o:["1216","1200","400","75"],e:"(5 × 5 × 3 + 1) × 16 = 76 × 16 = 1216."}},
{t:"cnn",q:"Về max pooling 2×2, stride 2, phát biểu nào SAI?",o:["Không có tham số học","Giảm chiều rộng, chiều cao một nửa","Không đổi số kênh","Tăng số kênh gấp đôi"],a:[3],e:"Pooling chỉ lấy số lớn nhất mỗi ô, làm riêng trên từng kênh.",en:{q:"About 2×2 max pooling with stride 2, which statement is FALSE?",o:["It has no learnable parameters","It halves the width and height","It keeps the number of channels","It doubles the number of channels"],e:"Pooling just takes the largest value in each window, separately for each channel."}},
{t:"cnn",q:"Kernel 3×3, stride 1. Muốn giữ nguyên kích thước ảnh thì padding bằng?",o:["1","0","2","3"],a:[0],e:"P = (K − 1)/2 = 1.",en:{q:"Kernel 3×3, stride 1. What padding keeps the image size unchanged?",o:["1","0","2","3"],e:"P = (K − 1)/2 = 1."}},
{t:"attention",q:"Vì sao chia √dₖ trong công thức attention?",o:["Để softmax không quá nhọn khi dₖ lớn","Để giảm số tham số","Để mã hóa vị trí","Để câu ngắn lại"],a:[0],e:"dₖ lớn làm tích vô hướng lớn, softmax gần như chọn một từ duy nhất và gradient rất nhỏ.",en:{q:"Why divide by √dₖ in the attention formula?",o:["So that softmax is not too peaked when dₖ is large","To reduce the number of parameters","To encode positions","To shorten the sentence"],e:"A large dₖ makes dot products large, so softmax picks almost a single word and gradients become tiny."}},
{t:"attention",q:"Self-attention không có positional encoding thì?",o:["Không phân biệt được thứ tự từ","Không chạy được","Chỉ nhìn được từ đứng trước","Luôn cho kết quả 0"],a:[0],e:"Xáo trộn đầu vào chỉ làm đầu ra bị xáo trộn tương ứng.",en:{q:"What happens to self-attention without positional encoding?",o:["It cannot tell the word order","It cannot run","It can only see earlier words","It always outputs 0"],e:"Shuffling the input only shuffles the output in the same way."}},
{t:"attention",q:"Về positional encoding dạng sin/cos, phát biểu nào SAI?",o:["Giá trị nằm trong [−1, 1]","Được cộng vào embedding của từ","PE(pos + k) là biến đổi tuyến tính của PE(pos)","Vị trí càng xa, giá trị càng lớn"],a:[3],e:"Sin, cos luôn bị chặn trong [−1, 1], dù vị trí xa đến đâu.",en:{q:"About sine/cosine positional encoding, which statement is FALSE?",o:["Values lie in [−1, 1]","It is added to the word embedding","PE(pos + k) is a linear transformation of PE(pos)","The farther the position, the larger the values"],e:"Sin and cos are always bounded in [−1, 1], however far the position."}},
{t:"attention",q:"Độ phức tạp của self-attention theo độ dài chuỗi n?",o:["O(n²)","O(n)","O(log n)","O(1)"],a:[0],e:"Mọi cặp từ đều được so sánh với nhau.",en:{q:"The complexity of self-attention in the sequence length n?",o:["O(n²)","O(n)","O(log n)","O(1)"],e:"Every pair of words is compared."}},
{t:"attention",q:"PE(0) của positional encoding sin/cos có dạng?",o:["(0, 1, 0, 1, …)","(1, 0, 1, 0, …)","(0, 0, 0, …)","(1, 1, 1, …)"],a:[0],e:"Chiều chẵn dùng sin 0 = 0, chiều lẻ dùng cos 0 = 1.",en:{q:"PE(0) of the sin/cos positional encoding looks like?",o:["(0, 1, 0, 1, …)","(1, 0, 1, 0, …)","(0, 0, 0, …)","(1, 1, 1, …)"],e:"Even dimensions use sin 0 = 0, odd dimensions use cos 0 = 1."}},
{t:"tim-kiem",q:"Đồ thị có cạnh với chi phí khác nhau. Thuật toán nào đảm bảo tìm đường chi phí nhỏ nhất?",o:["Uniform cost search","BFS","DFS","Greedy best-first"],a:[0],e:"BFS chỉ tối ưu khi mọi cạnh cùng chi phí. A* với heuristic admissible cũng đảm bảo.",en:{q:"A graph has edges with different costs. Which algorithm is guaranteed to find the cheapest path?",o:["Uniform cost search","BFS","DFS","Greedy best-first"],e:"BFS is only optimal when all edges cost the same. A* with an admissible heuristic is also guaranteed."}},
{t:"tim-kiem",q:"Với trò 8-puzzle, heuristic nào KHÔNG admissible?",o:["Số ô đặt sai chỗ","Tổng khoảng cách Manhattan","2 × tổng khoảng cách Manhattan","max(số ô sai chỗ, tổng Manhattan)"],a:[2],e:"Hai cái đầu là chi phí của bài toán nới lỏng. Max của hai heuristic admissible vẫn admissible. Nhân 2 có thể vượt chi phí thật.",en:{q:"For the 8-puzzle, which heuristic is NOT admissible?",o:["Number of misplaced tiles","Total Manhattan distance","2 × total Manhattan distance","max(misplaced tiles, total Manhattan)"],e:"The first two are costs of relaxed problems. The max of two admissible heuristics is admissible. Doubling can exceed the true cost."}},
{t:"tim-kiem",q:"Heuristic h admissible nghĩa là?",o:["h(n) không lớn hơn chi phí thật từ n đến đích","h(n) luôn bằng 0","h(n) luôn lớn hơn chi phí thật","h giảm dần dọc đường đi"],a:[0],e:"Admissible = lạc quan, không bao giờ ước lượng quá.",en:{q:"A heuristic h is admissible when?",o:["h(n) is never larger than the true cost from n to the goal","h(n) is always 0","h(n) is always larger than the true cost","h decreases along the path"],e:"Admissible = optimistic, never overestimates."}},
{t:"tim-kiem",q:"Thuật toán nào tốn ít bộ nhớ nhất?",o:["DFS","BFS","A*","Uniform cost search"],a:[0],e:"DFS chỉ cần nhớ đường đang đi, O(b·m).",en:{q:"Which algorithm uses the least memory?",o:["DFS","BFS","A*","Uniform cost search"],e:"DFS only remembers the current path, O(b·m)."}},
{t:"tim-kiem",q:"A* dừng lại khi nào?",o:["Khi lấy đích ra khỏi frontier để mở rộng","Khi lần đầu sinh ra đích","Khi frontier có 10 nút","Khi h = 0 ở mọi nút"],a:[0],e:"Lần đầu thấy đích, đường đó có thể chưa ngắn nhất.",en:{q:"When does A* stop?",o:["When the goal is taken off the frontier to be expanded","When the goal is first generated","When the frontier has 10 nodes","When h = 0 at every node"],e:"The first time the goal is seen, that path may not yet be the shortest."}},
{t:"tim-kiem",q:"Quan hệ giữa consistent và admissible?",o:["Consistent kéo theo admissible","Admissible kéo theo consistent","Hai khái niệm giống hệt nhau","Không liên quan"],a:[0],e:"Chứng minh bằng quy nạp. Có heuristic admissible mà không consistent.",en:{q:"How are consistent and admissible related?",o:["Consistent implies admissible","Admissible implies consistent","They are identical","They are unrelated"],e:"Proved by induction. Some admissible heuristics are not consistent."}},
{t:"bandit",q:"ε-greedy với ε = 0.2 trên 4 máy. Xác suất chọn máy đang có Q cao nhất?",o:["0.85","0.8","0.95","0.2"],a:[0],e:"0.8 + 0.2/4 = 0.85: lúc khám phá ngẫu nhiên vẫn có thể chọn trúng máy đó.",en:{q:"ε-greedy with ε = 0.2 on 4 machines. The probability of choosing the machine with the highest current Q?",o:["0.85","0.8","0.95","0.2"],e:"0.8 + 0.2/4 = 0.85: random exploration can still pick that machine."}},
{t:"bandit",q:"UCB1, c = √2, t = 10 (ln 10 ≈ 2.3). Máy A: Q = 0,6, N = 8. Máy B: Q = 0,4, N = 2. Chọn máy nào?",o:["B","A","Bằng nhau","Không xác định"],a:[0],e:"A: 0.6 + √(2×2.3/8) ≈ 1.36. B: 0.4 + √(2×2.3/2) ≈ 1.92. B mới thử 2 lần nên được cộng nhiều.",en:{q:"UCB1, c = √2, t = 10 (ln 10 ≈ 2.3). Machine A: Q = 0.6, N = 8. Machine B: Q = 0.4, N = 2. Which is chosen?",o:["B","A","They tie","Cannot tell"],e:"A: 0.6 + √(2×2.3/8) ≈ 1.36. B: 0.4 + √(2×2.3/2) ≈ 1.92. B has only been tried twice, so it gets a big bonus."}},
{t:"bandit",q:"Máy có Q = 0.5 sau 4 lần chơi. Lần thứ 5 được thưởng 1. Q mới?",o:["0.6","0.75","1","0.55"],a:[0],e:"Q ← 0.5 + (1 − 0.5)/5 = 0.6. Hoặc (2 + 1)/5 = 0.6.",en:{q:"A machine has Q = 0.5 after 4 plays. The 5th play gives reward 1. The new Q?",o:["0.6","0.75","1","0.55"],e:"Q ← 0.5 + (1 − 0.5)/5 = 0.6. Or (2 + 1)/5 = 0.6."}},
{t:"bandit",q:"Phát biểu nào SAI về bài toán bandit?",o:["Chỉ khai thác dễ kẹt ở máy kém","UCB ưu tiên máy ít được thử","ε-greedy với ε cố định có regret tăng tuyến tính","Khám phá càng nhiều càng tốt, mãi mãi"],a:[3],e:"Khám phá mãi thì phí lượt cho máy kém.",en:{q:"Which statement about bandits is FALSE?",o:["Pure exploitation can get stuck on a bad machine","UCB favours machines tried less often","ε-greedy with a fixed ε has regret growing linearly","The more exploration the better, forever"],e:"Exploring forever wastes plays on bad machines."}},
{t:"bat-thuong",q:"Kernel RBF với γ = 0.5 và ‖x − z‖² = 2. k(x, z) bằng?",o:["e^(−1) ≈ 0.368","1","e^(−2) ≈ 0.135","0.5"],a:[0],e:"exp(−0.5 × 2) = e^(−1).",en:{q:"RBF kernel with γ = 0.5 and ‖x − z‖² = 2. k(x, z) equals?",o:["e^(−1) ≈ 0.368","1","e^(−2) ≈ 0.135","0.5"],e:"exp(−0.5 × 2) = e^(−1)."}},
{t:"bat-thuong",q:"Tăng γ trong SVM dùng kernel RBF thì?",o:["Ranh giới uốn lượn hơn, dễ overfit","Mô hình gần tuyến tính hơn","Không còn vector hỗ trợ","Không ảnh hưởng gì"],a:[0],e:"γ lớn làm mỗi điểm chỉ ảnh hưởng vùng rất hẹp quanh nó.",en:{q:"What happens when γ increases in an SVM with an RBF kernel?",o:["The boundary gets wigglier and overfits more easily","The model gets closer to linear","There are no more support vectors","Nothing changes"],e:"A large γ makes each point influence only a very small region around it."}},
{t:"bat-thuong",q:"Từ hai kernel hợp lệ k₁, k₂, phép nào KHÔNG chắc cho kernel hợp lệ?",o:["k₁ + k₂","k₁ · k₂","3 · k₁","k₁ − k₂"],a:[3],e:"Hiệu có thể làm ma trận Gram mất tính nửa xác định dương.",en:{q:"Given valid kernels k₁ and k₂, which one is NOT guaranteed to be a valid kernel?",o:["k₁ + k₂","k₁ · k₂","3 · k₁","k₁ − k₂"],e:"A difference can make the Gram matrix lose positive semi-definiteness."}},
{t:"bat-thuong",q:"Dữ liệu có 0.1% giao dịch gian lận. Chỉ số nào KHÔNG nên dùng để đánh giá?",o:["Accuracy","Recall","Precision","AUC-PR"],a:[0],e:"Luôn đoán \"bình thường\" đã được 99.9% accuracy.",en:{q:"0.1% of transactions are fraudulent. Which metric should NOT be used for evaluation?",o:["Accuracy","Recall","Precision","AUC-PR"],e:"Always predicting \"normal\" already gives 99.9% accuracy."}},
{t:"bat-thuong",q:"Quy tắc IQR: Q1 = 10, Q3 = 20. Giá trị nào là ngoại lai?",o:["40","30","25","−4"],a:[0],e:"IQR = 10. Ngưỡng: 10 − 15 = −5 và 20 + 15 = 35. Chỉ 40 nằm ngoài.",en:{q:"IQR rule: Q1 = 10, Q3 = 20. Which value is an outlier?",o:["40","30","25","−4"],e:"IQR = 10. Fences: 10 − 15 = −5 and 20 + 15 = 35. Only 40 lies outside."}},
{t:"rieng-tu",q:"Truy vấn đếm số người, ε = 0.5. Tham số nhiễu Laplace b = ?",o:["2","0.5","1","4"],a:[0],e:"Độ nhạy Δ = 1, b = Δ/ε = 2.",en:{q:"A counting query with ε = 0.5. The Laplace noise parameter b = ?",o:["2","0.5","1","4"],e:"Sensitivity Δ = 1, b = Δ/ε = 2."}},
{t:"rieng-tu",q:"Chạy 3 truy vấn trên cùng dữ liệu, mỗi truy vấn 0.3-DP. Tổng bảo đảm?",o:["0.9-DP","0.3-DP","0.027-DP","0.6-DP"],a:[0],e:"Hợp thành tuần tự: cộng các ε.",en:{q:"Three queries on the same data, each 0.3-DP. The total guarantee?",o:["0.9-DP","0.3-DP","0.027-DP","0.6-DP"],e:"Sequential composition: the ε values add up."}},
{t:"rieng-tu",q:"ε nhỏ nghĩa là gì?",o:["Nhiễu lớn, riêng tư mạnh, kém chính xác","Nhiễu nhỏ, riêng tư mạnh","Nhiễu lớn, riêng tư yếu","Không có nhiễu"],a:[0],e:"b = Δ/ε: ε càng nhỏ, nhiễu càng lớn.",en:{q:"What does a small ε mean?",o:["Large noise, strong privacy, less accuracy","Small noise, strong privacy","Large noise, weak privacy","No noise"],e:"b = Δ/ε: the smaller ε, the larger the noise."}},
