life:'Adjusting a shower: too hot, so turn a little towards cold and try again. Turn too hard and it swings between hot and cold, never settling.',
tryit:'Pick Valley, set η = 1.90 and press Run 20 steps. Then try η = 2.10. Then pick Bumpy hills and click different places to change the starting point.',
rem:['new w = w − η × slope','Positive slope → decrease w. Negative slope → increase w','η too large: bounces around and can fly off (diverge)','η too small: very slow','A function with several valleys can get stuck in a local minimum','The derivative of (w − 3)² is 2(w − 3)','Chain rule: (f(g(x)))′ = f′(g(x)) × g′(x)'],
traps:['The gradient points where the function INCREASES fastest, so we move AGAINST the gradient.','SGD uses one sample or a small group (mini-batch) per step, not the whole dataset.'],
deep:`<h4>1. The derivative is the slope</h4>
<p>The derivative <span class="fx">L′(w)</span> says how much L changes when w increases a little. L′ positive → moving right goes uphill. L′ negative → moving right goes downhill. L′ = 0 → flat ground (possibly the bottom).</p>
<h4>2. The update rule</h4>
<p><span class="fx">new w = w − η × L′(w)</span>. The minus sign makes us always move <b>against</b> the slope, i.e. downhill.</p>
<div class="ex"><b>Worked example.</b> L(w) = (w − 3)², L′(w) = 2(w − 3). Start at w = 0, η = 0.1.<br>Step 1: L′(0) = −6 → w = 0 − 0.1 × (−6) = 0.6.<br>Step 2: L′(0.6) = −4.8 → w = 0.6 + 0.48 = 1.08.<br>Step 3: L′(1.08) = −3.84 → w = 1.08 + 0.384 = 1.464.<br>w creeps towards 3; each step multiplies the distance to 3 by (1 − 2η) = 0.8.</div>
<h4>3. Choosing the learning rate η</h4>
<ul><li><b>η too small</b> (0.001): very slow, many steps.</li>
<li><b>η moderate</b>: fast convergence.</li>
<li><b>η too large</b>: for L = (w − 3)² with η = 1 the distance is multiplied by (1 − 2) = −1, so w bounces between 0 and 6 forever. With η > 1 each bounce goes further out (<b>divergence</b>).</li></ul>
<h4>4. Many parameters: the gradient</h4>
<p>With many parameters w₁, w₂, …, we take the partial derivative for each and collect them into the <b>gradient</b> vector ∇L. The gradient points where L <b>increases fastest</b>; moving against it is the steepest way down. All parameters update together: <span class="fx">wᵢ ← wᵢ − η × ∂L/∂wᵢ</span>.</p>
<h4>5. The chain rule</h4>
<p>For nested functions, derivatives multiply: if z = w·x and L = (z − y)², then <span class="fx">∂L/∂w = 2(z − y) × x</span>. Neural networks use exactly this rule (backpropagation).</p>
<div class="ex">x = 2, w = 3, y = 5: z = 6, ∂L/∂z = 2(6 − 5) = 2, ∂z/∂w = 2 → ∂L/∂w = 4.</div>
<h4>6. Batch, SGD, mini-batch</h4>
<p><b>Batch GD</b>: each step uses all the data (accurate but slow). <b>SGD</b>: each step uses one sample (fast, noisy). <b>Mini-batch</b>: each step uses a small group, e.g. 32 samples (the most common choice). A function with several valleys can trap us in a <b>local minimum</b>.</p>`}},

'bayes':{
deep:`<h4>1. Xác suất có điều kiện</h4>
<p><span class="fx">P(A | B) = P(A và B) / P(B)</span>: trong những lần B xảy ra, tỉ lệ A cũng xảy ra. Ví dụ tung một xúc xắc: P(được 6 | được số chẵn) = (1/6)/(3/6) = 1/3.</p>
<h4>2. Định lý Bayes</h4>
<p><span class="fx">P(A | B) = P(B | A) × P(A) / P(B)</span>, với <span class="fx">P(B) = P(B | A)·P(A) + P(B | không A)·P(không A)</span>.</p>
<h4>3. Ví dụ tính tay bằng cách đếm 1000 người</h4>
<div class="ex">Bệnh có ở 1% dân số. Xét nghiệm phát hiện đúng 99% người bệnh, báo nhầm 5% người khỏe.<br>• Người bệnh: 1000 × 1% = <b>10</b>. Trong đó dương tính: 10 × 99% ≈ <b>9,9</b>.<br>• Người khỏe: 990. Trong đó bị báo nhầm: 990 × 5% = <b>49,5</b>.<br>• Tổng số dương tính: 9,9 + 49,5 = 59,4.<br>• P(bệnh | dương tính) = 9,9 / 59,4 ≈ <b>16,7%</b>.</div>
<p>Dù xét nghiệm "chính xác 99%", người có kết quả dương tính chỉ có khoảng 1/6 khả năng bị bệnh. Lý do: bệnh quá hiếm, số người khỏe bị báo nhầm (49,5) nhiều hơn hẳn số người bệnh thật (9,9). Đây gọi là <b>bỏ qua tỉ lệ nền</b> (base rate fallacy).</p>
<h4>4. Độc lập</h4>
<p>A và B độc lập khi biết B không làm thay đổi xác suất A: <span class="fx">P(A | B) = P(A)</span>, tương đương <span class="fx">P(A và B) = P(A) × P(B)</span>. Hai lần tung đồng xu là độc lập: P(ngửa, ngửa) = 1/2 × 1/2 = 1/4.</p>
<p>Mẹo "ít nhất một": P(ít nhất một ngửa trong 2 lần) = 1 − P(không lần nào ngửa) = 1 − 1/4 = 3/4.</p>
<h4>5. Kỳ vọng</h4>
<p><span class="fx">E[X] = Σ giá trị × xác suất</span>. Xúc xắc: (1 + 2 + 3 + 4 + 5 + 6)/6 = 3,5. Trò chơi: 30% thắng 10 điểm, 70% thua 2 điểm → E = 0,3×10 − 0,7×2 = 1,6 điểm mỗi lần.</p>
<h4>6. Naive Bayes</h4>
<p>Bộ phân loại Naive Bayes chọn lớp có <span class="fx">P(lớp) × P(x₁ | lớp) × P(x₂ | lớp) × …</span> lớn nhất. "Naive" (ngây thơ) vì nó giả sử các đặc trưng <b>độc lập khi đã biết lớp</b>, điều thường không đúng hẳn nhưng vẫn cho kết quả tốt, ví dụ lọc thư rác.</p>`,
en:{title:'Probability and Bayes’ theorem',
one:'A positive test does not necessarily mean you are ill, especially when the disease is rare.',
why:'Explains why a "positive" result may be wrong. It is the basis of Naive Bayes and precision.',pre:'Fractions, percentages, simple probability (coins, dice).',
idea:`<p><b>Conditional probability</b> <span class="fx">P(A | B)</span> is the probability of A given that B has happened.</p><p>A trick that needs no formula: imagine <b>1000 people</b> and count each group. How many are ill? Of those, how many test positive? Of the healthy ones, how many are wrongly flagged? Finally divide: ill and positive / all positives.</p>`,
life:'A fire alarm going off does not mean there is a fire. If fires are very rare, most alarms are false ones caused by kitchen smoke.',
tryit:'Keep sensitivity at 99% and false positives at 5%. Drag the disease rate from 1% up to 20%. How does P(ill | positive) change?',
rem:['P(A | B) = P(A and B) / P(B)','P(ill | +) = number ill and + / total number +','P(+) = P(+ | ill)·P(ill) + P(+ | healthy)·P(healthy)','Expected value = Σ value × probability. A six-sided die: 3.5','A, B independent ⇔ P(A and B) = P(A) × P(B)'],
traps:['P(+ | ill) differs from P(ill | +). Exams often give one and ask for the other.','The base rate (how rare or common the disease is) has a huge effect on the result.'],
deep:`<h4>1. Conditional probability</h4>
<p><span class="fx">P(A | B) = P(A and B) / P(B)</span>: among the times B happens, the fraction in which A also happens. Rolling a die: P(6 | even) = (1/6)/(3/6) = 1/3.</p>
<h4>2. Bayes’ theorem</h4>
<p><span class="fx">P(A | B) = P(B | A) × P(A) / P(B)</span>, with <span class="fx">P(B) = P(B | A)·P(A) + P(B | not A)·P(not A)</span>.</p>
<h4>3. Worked example by counting 1000 people</h4>
<div class="ex">A disease affects 1% of people. A test detects 99% of sick people and wrongly flags 5% of healthy people.<br>• Sick: 1000 × 1% = <b>10</b>. Of those, positive: 10 × 99% ≈ <b>9.9</b>.<br>• Healthy: 990. Wrongly flagged: 990 × 5% = <b>49.5</b>.<br>• Total positives: 9.9 + 49.5 = 59.4.<br>• P(sick | positive) = 9.9 / 59.4 ≈ <b>16.7%</b>.</div>
<p>Even though the test is "99% accurate", a person who tests positive has only about a 1 in 6 chance of being sick. The reason: the disease is so rare that wrongly flagged healthy people (49.5) far outnumber truly sick ones (9.9). This is the <b>base rate fallacy</b>.</p>
<h4>4. Independence</h4>
<p>A and B are independent when knowing B does not change the probability of A: <span class="fx">P(A | B) = P(A)</span>, equivalently <span class="fx">P(A and B) = P(A) × P(B)</span>. Two coin tosses are independent: P(heads, heads) = 1/2 × 1/2 = 1/4.</p>
<p>The "at least one" trick: P(at least one head in 2 tosses) = 1 − P(no heads) = 1 − 1/4 = 3/4.</p>
<h4>5. Expected value</h4>
<p><span class="fx">E[X] = Σ value × probability</span>. A die: (1 + 2 + 3 + 4 + 5 + 6)/6 = 3.5. A game: 30% chance to win 10 points, 70% chance to lose 2 → E = 0.3×10 − 0.7×2 = 1.6 points per play.</p>
<h4>6. Naive Bayes</h4>
<p>The Naive Bayes classifier picks the class with the largest <span class="fx">P(class) × P(x₁ | class) × P(x₂ | class) × …</span>. It is "naive" because it assumes the features are <b>independent given the class</b>, which is rarely exactly true but still works well, for example in spam filtering.</p>`}},

'logic':{
deep:`<h4>1. Bảng chân trị đầy đủ</h4>
<div class="ex"><table class="mini"><tr><th>p</th><th>q</th><th>¬p</th><th>p ∧ q</th><th>p ∨ q</th><th>p → q</th><th>p ⊕ q</th><th>p ↔ q</th></tr>
<tr><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td></tr>
<tr><td>Đ</td><td>S</td><td>S</td><td>S</td><td>Đ</td><td><b>S</b></td><td>Đ</td><td>S</td></tr>
<tr><td>S</td><td>Đ</td><td>Đ</td><td>S</td><td>Đ</td><td>Đ</td><td>Đ</td><td>S</td></tr>
<tr><td>S</td><td>S</td><td>Đ</td><td>S</td><td>S</td><td>Đ</td><td>S</td><td>Đ</td></tr></table></div>
<p>Hai mệnh đề <b>tương đương</b> khi cột của chúng giống hệt nhau ở mọi dòng. Với n biến, bảng có 2ⁿ dòng.</p>
<h4>2. Kéo theo và các biến thể</h4>
<ul><li>Mệnh đề gốc: p → q.</li>
<li><b>Phản đảo</b> ¬q → ¬p: <b>tương đương</b> với gốc.</li>
<li><b>Đảo</b> q → p: <b>không</b> tương đương.</li>
<li><b>Phản</b> ¬p → ¬q: <b>không</b> tương đương (nhưng tương đương với đảo).</li></ul>
<p>Ngoài ra <span class="fx">p → q ≡ ¬p ∨ q</span>: kiểm tra bằng bảng, chỉ dòng p = Đ, q = S làm cả hai sai.</p>
<h4>3. Suy luận đúng và sai</h4>
<div class="ex">Biết: "Nếu trời mưa (p) thì đường ướt (q)".<br>• Trời mưa → đường ướt: <b>đúng</b> (modus ponens).<br>• Đường không ướt → trời không mưa: <b>đúng</b> (modus tollens).<br>• Đường ướt → trời mưa: <b>sai</b>, có thể do xe tưới nước (khẳng định hệ quả).<br>• Trời không mưa → đường không ướt: <b>sai</b> (phủ định tiền đề).</div>
<h4>4. Luật De Morgan và phủ định lượng từ</h4>
<p><span class="fx">¬(p ∧ q) ≡ ¬p ∨ ¬q</span>, <span class="fx">¬(p ∨ q) ≡ ¬p ∧ ¬q</span>: phủ định đổi "và" thành "hoặc" và ngược lại.</p>
<p>Phủ định của "Mọi học sinh đều thích toán" là "<b>Có ít nhất một</b> học sinh không thích toán", không phải "Mọi học sinh đều không thích toán". Phủ định của "Có một bạn đạt 10" là "Không bạn nào đạt 10".</p>
<h4>5. Mẹo giải câu đố logic</h4>
<p>Với bài "ai nói thật, ai nói dối": giả sử từng trường hợp, suy ra hệ quả, loại trường hợp mâu thuẫn. Với bài có nhiều điều kiện "nếu… thì…": viết thành ký hiệu rồi lập bảng chân trị cho các dòng còn khả năng.</p>`,
en:{title:'Logic and reasoning',
one:'Round 1 includes logic questions. A truth table is the tool for checking any statement.',
why:'Round 1 has a logic section; logic is also how classical AI reasons.',pre:'No prior knowledge, just careful reading.',
idea:`<p>A <b>proposition</b> is a statement that is either true or false: "It is raining" (p), "The road is wet" (q). We combine them with <b>and</b> (∧), <b>or</b> (∨), <b>not</b> (¬) and <b>implies</b> (→).</p><p>The easiest one to get wrong is <b>p → q</b> ("if p then q"): it is <b>false</b> only when p is true and q is false. Two statements are <b>equivalent</b> when they have the same value on every row of the truth table.</p>`,
life:'"If you score 10, I will give you a reward." Mum only broke her word if you scored 10 and got no reward. If you did not score 10 and she rewarded you anyway, she did not break her word.',
tryit:'Choose two statements to compare their truth tables. Find the statements equivalent to p → q.',
rem:['p → q is false only when p is true and q is false','p → q ≡ ¬q → ¬p ≡ ¬p ∨ q','p → q is NOT equivalent to q → p','De Morgan: ¬(p ∧ q) ≡ ¬p ∨ ¬q; ¬(p ∨ q) ≡ ¬p ∧ ¬q','The negation of "every x is P" is "some x is not P"','Modus ponens: from p and p → q, conclude q. Modus tollens: from ¬q and p → q, conclude ¬p'],
traps:['From q and p → q you CANNOT conclude p (affirming the consequent).','XOR (p ⊕ q) is true when exactly one is true, unlike or (∨).'],
deep:`<h4>1. The full truth table</h4>
<div class="ex"><table class="mini"><tr><th>p</th><th>q</th><th>¬p</th><th>p ∧ q</th><th>p ∨ q</th><th>p → q</th><th>p ⊕ q</th><th>p ↔ q</th></tr>
<tr><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td><td>T</td><td>F</td><td>T</td></tr>
<tr><td>T</td><td>F</td><td>F</td><td>F</td><td>T</td><td><b>F</b></td><td>T</td><td>F</td></tr>
<tr><td>F</td><td>T</td><td>T</td><td>F</td><td>T</td><td>T</td><td>T</td><td>F</td></tr>
<tr><td>F</td><td>F</td><td>T</td><td>F</td><td>F</td><td>T</td><td>F</td><td>T</td></tr></table></div>
<p>Two statements are <b>equivalent</b> when their columns match on every row. With n variables the table has 2ⁿ rows.</p>
<h4>2. Implication and its variants</h4>
<ul><li>Original: p → q.</li>
<li><b>Contrapositive</b> ¬q → ¬p: <b>equivalent</b> to the original.</li>
<li><b>Converse</b> q → p: <b>not</b> equivalent.</li>
<li><b>Inverse</b> ¬p → ¬q: <b>not</b> equivalent (but equivalent to the converse).</li></ul>
<p>Also <span class="fx">p → q ≡ ¬p ∨ q</span>: check with the table; only the row p = T, q = F makes both false.</p>
<h4>3. Valid and invalid reasoning</h4>
<div class="ex">Given: "If it rains (p), the road is wet (q)".<br>• It rains → the road is wet: <b>valid</b> (modus ponens).<br>• The road is not wet → it is not raining: <b>valid</b> (modus tollens).<br>• The road is wet → it is raining: <b>invalid</b>, a street sprinkler could have done it (affirming the consequent).<br>• It is not raining → the road is not wet: <b>invalid</b> (denying the antecedent).</div>
<h4>4. De Morgan’s laws and negating quantifiers</h4>
<p><span class="fx">¬(p ∧ q) ≡ ¬p ∨ ¬q</span>, <span class="fx">¬(p ∨ q) ≡ ¬p ∧ ¬q</span>: negation swaps "and" with "or".</p>
<p>The negation of "Every student likes maths" is "<b>At least one</b> student does not like maths", not "Every student dislikes maths". The negation of "Someone scored 10" is "Nobody scored 10".</p>
<h4>5. Tips for logic puzzles</h4>
<p>For "who tells the truth, who lies" puzzles: assume each case in turn, derive the consequences, and discard cases that contradict. For puzzles with many "if… then…" conditions: write them in symbols and build a truth table for the rows still possible.</p>`}},
'hoi-quy':{
deep:`<h4>1. Đường thẳng tốt nhất được tính thế nào?</h4>
<p>Với dữ liệu một đặc trưng, đường <span class="fx">ŷ = a·x + b</span> có MSE nhỏ nhất có công thức:</p>
<p><span class="fx">a = Σ(x − x̄)(y − ȳ) / Σ(x − x̄)²</span>, <span class="fx">b = ȳ − a·x̄</span> (x̄, ȳ là trung bình).</p>
<div class="ex"><b>Ví dụ.</b> Ba điểm (1, 2), (2, 4), (3, 5). x̄ = 2, ȳ = 11/3 ≈ 3,67.<br>Σ(x − x̄)(y − ȳ) = (−1)(−1,67) + 0 + (1)(1,33) = 3; Σ(x − x̄)² = 1 + 0 + 1 = 2.<br>a = 3/2 = 1,5; b = 3,67 − 1,5 × 2 ≈ 0,67. Đường: ŷ = 1,5x + 0,67.<br>Dự đoán: 2,17; 3,67; 5,17 → sai số −0,17; 0,33; −0,17 → MSE ≈ (0,028 + 0,111 + 0,028)/3 ≈ <b>0,056</b>.<br>So với đường ŷ = 2x: dự đoán 2, 4, 6, sai số 0, 0, −1, MSE = 1/3 ≈ 0,33, tệ hơn.</div>
<p>Với nhiều đặc trưng, máy thường dùng gradient descent để tìm các hệ số.</p>
<h4>2. MSE, MAE, RMSE và điểm ngoại lai</h4>
<div class="ex">Sai số 1, 1, 1, 10:<br>MSE = (1 + 1 + 1 + 100)/4 = <b>25,75</b>. MAE = (1 + 1 + 1 + 10)/4 = <b>3,25</b>. RMSE = √25,75 ≈ 5,07.</div>
<p>Một điểm sai 10 đóng góp 100 vào MSE: bình phương phạt sai số lớn rất nặng, nên MSE (và đường hồi quy) bị điểm ngoại lai kéo lệch. MAE ít nhạy hơn. RMSE cùng đơn vị với y nên dễ đọc hơn MSE.</p>
<h4>3. Hồi quy logistic: phân loại bằng xác suất</h4>
<p>Tính <span class="fx">z = w·x + b</span>, rồi đưa qua <b>sigmoid</b> <span class="fx">σ(z) = 1/(1 + e^(−z))</span> để được xác suất p từ 0 đến 1. σ(0) = 0,5; z rất lớn → p gần 1; z rất âm → p gần 0. Thường đoán lớp 1 khi p ≥ 0,5, tức z ≥ 0: ranh giới là một đường thẳng.</p>
<p>Hàm lỗi là <b>cross-entropy</b> (log loss): với nhãn thật 1, loss = −ln(p). p = 0,8 → 0,22; p = 0,1 → 2,3. Đoán sai mà tự tin thì bị phạt rất nặng.</p>
<h4>4. Đọc hệ số</h4>
<p>Trong ŷ = 1,5x + 0,67: mỗi giờ học thêm, điểm dự đoán tăng 1,5. Hệ số b là giá trị dự đoán khi x = 0. Hệ số âm nghĩa là x tăng thì y giảm.</p>`,
en:{title:'Linear regression and MSE',
one:'Draw the straight line that passes closest to the points to predict a number.',
why:'The simplest number-prediction problem, and where you first meet the MSE loss.',pre:'The line equation y = ax + b.',
idea:`<p>The model is <span class="fx">ŷ = a·x + b</span>. The error at each point is the true y minus the predicted y. <b>MSE</b> is the mean of the squared errors.</p><p>In the figure each error is drawn as <b>a red square</b>: its side is the error, its area is the squared error. MSE is the average area. The machine finds a and b that make the total area smallest. Regression predicts <b>numbers</b>; classification predicts <b>labels</b>.</p>`,
life:'Predicting an exam score from hours of study, or a house price from its floor area.',
tryit:'In Auto-fit mode, press Add an outlier. How far is the line pulled? Then fit the line by hand to get the lowest MSE.',
rem:['MSE = (1/n) × Σ (y − ŷ)²','Squaring → large errors are punished heavily → MSE is sensitive to outliers','MAE = mean of |y − ŷ|, less sensitive to outliers','Logistic regression: called regression but it is a CLASSIFICATION algorithm, using sigmoid to output a probability','Loss for logistic regression: cross-entropy'],
traps:['Errors 1 and 2 → MSE = (1 + 4)/2 = 2.5, not (1 + 2)/2.','RMSE = √MSE, in the same units as y.'],
deep:`<h4>1. How the best line is computed</h4>
<p>With one feature, the line <span class="fx">ŷ = a·x + b</span> with the smallest MSE is given by:</p>
<p><span class="fx">a = Σ(x − x̄)(y − ȳ) / Σ(x − x̄)²</span>, <span class="fx">b = ȳ − a·x̄</span> (x̄, ȳ are the means).</p>
<div class="ex"><b>Example.</b> Three points (1, 2), (2, 4), (3, 5). x̄ = 2, ȳ = 11/3 ≈ 3.67.<br>Σ(x − x̄)(y − ȳ) = (−1)(−1.67) + 0 + (1)(1.33) = 3; Σ(x − x̄)² = 1 + 0 + 1 = 2.<br>a = 3/2 = 1.5; b = 3.67 − 1.5 × 2 ≈ 0.67. Line: ŷ = 1.5x + 0.67.<br>Predictions: 2.17, 3.67, 5.17 → errors −0.17, 0.33, −0.17 → MSE ≈ (0.028 + 0.111 + 0.028)/3 ≈ <b>0.056</b>.<br>Compare ŷ = 2x: predictions 2, 4, 6, errors 0, 0, −1, MSE = 1/3 ≈ 0.33, which is worse.</div>
<p>With many features, the coefficients are usually found with gradient descent.</p>
<h4>2. MSE, MAE, RMSE and outliers</h4>
<div class="ex">Errors 1, 1, 1, 10:<br>MSE = (1 + 1 + 1 + 100)/4 = <b>25.75</b>. MAE = (1 + 1 + 1 + 10)/4 = <b>3.25</b>. RMSE = √25.75 ≈ 5.07.</div>
<p>One error of 10 contributes 100 to the MSE: squaring punishes big errors hard, so MSE (and the regression line) is pulled by outliers. MAE is less sensitive. RMSE is in the same units as y, so it is easier to read than MSE.</p>
<h4>3. Logistic regression: classification with probabilities</h4>
<p>Compute <span class="fx">z = w·x + b</span>, then pass it through the <b>sigmoid</b> <span class="fx">σ(z) = 1/(1 + e^(−z))</span> to get a probability p between 0 and 1. σ(0) = 0.5; large z → p near 1; very negative z → p near 0. We usually predict class 1 when p ≥ 0.5, i.e. z ≥ 0: the boundary is a straight line.</p>
<p>The loss is <b>cross-entropy</b> (log loss): for true label 1, loss = −ln(p). p = 0.8 → 0.22; p = 0.1 → 2.3. Being confidently wrong is punished very heavily.</p>
<h4>4. Reading the coefficients</h4>
<p>In ŷ = 1.5x + 0.67: each extra hour of study raises the predicted score by 1.5. The intercept b is the prediction when x = 0. A negative coefficient means y falls as x rises.</p>`}},

'knn':{
deep:`<h4>1. Thuật toán từng bước</h4>
<ol><li>Tính khoảng cách từ điểm cần đoán tới <b>mọi</b> điểm trong dữ liệu.</li><li>Sắp xếp, lấy k điểm gần nhất.</li><li>Phân loại: bỏ phiếu theo số đông. Hồi quy: lấy trung bình nhãn của k điểm.</li></ol>
<h4>2. Ví dụ tính tay</h4>
<div class="ex">Dữ liệu: A(1, 1) Đỏ, B(2, 1) Đỏ, C(4, 4) Xanh, D(5, 4) Xanh, E(4, 2) Xanh. Điểm cần đoán Q(2, 2).<br>Khoảng cách Euclid: B = 1; A = √2 ≈ 1,41; E = 2; C = √8 ≈ 2,83; D = √13 ≈ 3,61.<br>• k = 1: chỉ B → <b>Đỏ</b>.<br>• k = 3: B, A, E → 2 Đỏ, 1 Xanh → <b>Đỏ</b>.<br>• k = 5: 2 Đỏ, 3 Xanh → <b>Xanh</b>.</div>
<p>Cùng một điểm nhưng k khác nhau cho đáp án khác nhau. Vì vậy k được chọn bằng tập validation hoặc cross-validation.</p>
<h4>3. k ảnh hưởng thế nào?</h4>
<ul><li><b>k = 1</b>: ranh giới bám sát từng điểm, một điểm nhiễu cũng tạo ra "đảo" sai → overfit. Lỗi trên tập train bằng 0 (mỗi điểm là hàng xóm gần nhất của chính nó).</li>
<li><b>k bằng cả tập dữ liệu</b>: luôn đoán lớp đông nhất → underfit.</li>
<li>Với 2 lớp nên chọn <b>k lẻ</b> để không hòa phiếu.</li></ul>
<h4>4. Vì sao phải chuẩn hóa?</h4>
<div class="ex">Hai người: (tuổi 30, thu nhập 10 triệu) và (tuổi 60, thu nhập 11 triệu), nếu thu nhập ghi bằng đồng: chênh tuổi 30, chênh thu nhập 1 000 000. Khoảng cách gần như chỉ do thu nhập, tuổi bị bỏ qua. Chuẩn hóa (z-score hoặc min-max) đưa các cột về cùng thang đo.</div>
<h4>5. Điểm mạnh, điểm yếu</h4>
<ul><li>Mạnh: đơn giản, không cần huấn luyện, ranh giới có thể rất phức tạp.</li>
<li>Yếu: dự đoán chậm khi dữ liệu lớn (phải tính khoảng cách tới mọi điểm); kém khi có quá nhiều chiều (<b>lời nguyền số chiều</b>: trong không gian rất nhiều chiều, mọi điểm đều xa nhau gần như bằng nhau nên "hàng xóm gần" mất ý nghĩa); nhạy với đặc trưng vô ích.</li>
<li>Biến thể: bỏ phiếu có trọng số theo 1/khoảng cách, để hàng xóm gần có tiếng nói lớn hơn.</li></ul>`,
en:{title:'k-NN: ask the neighbours',
one:'To classify a new point, ask its k nearest points and go with the majority.',
why:'The easiest classification algorithm to understand, using distance directly.',pre:'The lesson Vectors and distance.',
idea:`<p>k-NN needs no training in advance; it just remembers the data. For a new point it computes the distance to every point, takes the k nearest and lets them vote.</p><p><b>Small k</b> (k = 1): trusts one neighbour, easily fooled by noisy points, jagged boundary (overfitting). <b>Large k</b>: smooth result but ignores detail (underfitting).</p>`,
life:'You have just moved to a new school and want to know which canteen stall is good: ask the 5 classmates sitting nearest and follow the majority.',
tryit:'Turn on Colour decision regions and drag k from 1 to 19. How does the boundary change? Drag the ? marker to where the two groups meet.',
rem:['Supervised: the data is labelled','Pick an odd k to avoid ties (2 classes)','You MUST scale features before computing distances','Prediction is slow: distance to every point','k = 1 → zero training error (unless two identical points have different labels)','Many dimensions → all points are almost equally far apart (curse of dimensionality)'],
traps:['Income in millions and age in years: income dominates the distance unless you scale.','k-NN (classification, labelled) is different from k-means (clustering, unlabelled).'],
deep:`<h4>1. The algorithm step by step</h4>
<ol><li>Compute the distance from the query point to <b>every</b> point in the data.</li><li>Sort and take the k nearest.</li><li>Classification: majority vote. Regression: average the k labels.</li></ol>
<h4>2. Worked example</h4>
<div class="ex">Data: A(1, 1) Red, B(2, 1) Red, C(4, 4) Blue, D(5, 4) Blue, E(4, 2) Blue. Query Q(2, 2).<br>Euclidean distances: B = 1; A = √2 ≈ 1.41; E = 2; C = √8 ≈ 2.83; D = √13 ≈ 3.61.<br>• k = 1: only B → <b>Red</b>.<br>• k = 3: B, A, E → 2 Red, 1 Blue → <b>Red</b>.<br>• k = 5: 2 Red, 3 Blue → <b>Blue</b>.</div>
<p>The same point gets different answers for different k. That is why k is chosen with a validation set or cross-validation.</p>
<h4>3. The effect of k</h4>
<ul><li><b>k = 1</b>: the boundary hugs every point; a single noisy point creates a wrong "island" → overfitting. Training error is 0 (each point is its own nearest neighbour).</li>
<li><b>k = the whole dataset</b>: always predicts the largest class → underfitting.</li>
<li>With 2 classes, choose an <b>odd k</b> to avoid ties.</li></ul>
<h4>4. Why scaling is needed</h4>
<div class="ex">Two people: (age 30, income 10 million) and (age 60, income 11 million), with income recorded in đồng: the age gap is 30, the income gap is 1,000,000. The distance is almost entirely income and age is ignored. Scaling (z-score or min-max) puts the columns on the same scale.</div>
<h4>5. Strengths and weaknesses</h4>
<ul><li>Strengths: simple, no training, can form very complex boundaries.</li>
<li>Weaknesses: slow prediction on large data (distance to every point); poor with very many dimensions (<b>curse of dimensionality</b>: in high-dimensional space all points are roughly equally far apart, so "near neighbour" loses meaning); sensitive to useless features.</li>
<li>Variant: weight each vote by 1/distance so closer neighbours count more.</li></ul>`}},

'xu-ly':{
deep:`<h4>1. Quy trình chuẩn</h4>
<ol><li>Xem nhanh dữ liệu: số hàng, kiểu cột, ô thiếu, giá trị lạ.</li><li>Chia train / validation / test <b>trước</b>.</li><li>Học các thống kê (trung bình, min, max, danh sách giá trị) <b>chỉ trên train</b>.</li><li>Áp cùng phép biến đổi đó cho validation và test.</li></ol>
<h4>2. Giá trị thiếu</h4>
<div class="ex">Cột tuổi: 12, 13, 13, 14, 90 (một ô nhập nhầm) và một ô trống.<br>Trung bình = 142/5 = 28,4; trung vị = 13.<br>Điền trung vị (13) hợp lý hơn: trung bình bị giá trị 90 kéo lệch.</div>
<p>Cột chữ thiếu: điền giá trị hay gặp nhất (mode) hoặc thêm nhóm "Không rõ". Thiếu rất ít hàng thì có thể bỏ hàng. Có khi việc "bị thiếu" cũng là thông tin: thêm cột 0/1 "có thiếu không".</p>
<h4>3. Mã hóa cột chữ</h4>
<div class="ex">Cột Màu: đỏ, xanh, vàng → one-hot:<br><table class="mini"><tr><th>Màu</th><th>đỏ</th><th>xanh</th><th>vàng</th></tr><tr><td>đỏ</td><td>1</td><td>0</td><td>0</td></tr><tr><td>vàng</td><td>0</td><td>0</td><td>1</td></tr></table></div>
<p>Cột có thứ tự tự nhiên (nhỏ &lt; vừa &lt; lớn) thì có thể đánh số 0, 1, 2. Cột không có thứ tự mà đánh số thì mô hình tưởng "vàng = 3 &gt; xanh = 2", sai ý nghĩa.</p>
<h4>4. Chuẩn hóa</h4>
<div class="ex">Chiều cao 150, 160, 170 (cm).<br>Min-max: 160 → (160 − 150)/(170 − 150) = <b>0,5</b>.<br>z-score: trung bình 160, độ lệch chuẩn √((100 + 0 + 100)/3) ≈ 8,16 → 170 thành (170 − 160)/8,16 ≈ <b>1,22</b>.</div>
<p>Min-max nhạy với ngoại lai (một giá trị rất lớn ép mọi giá trị khác về gần 0). z-score cho trung bình 0, độ lệch chuẩn 1. Mô hình dùng khoảng cách hoặc gradient (k-NN, SVM, k-means, PCA, mạng nơ-ron) cần chuẩn hóa; cây quyết định thì không.</p>
<h4>5. Rò rỉ dữ liệu (data leakage)</h4>
<ul><li>Tính trung bình trên cả train lẫn test rồi chuẩn hóa: mô hình "nhìn trộm" test.</li><li>Dùng cột chỉ có sau khi biết kết quả (ví dụ "số ngày nằm viện" để đoán "có nhập viện không").</li><li>Cùng một người xuất hiện ở cả train và test.</li></ul>
<p>Hậu quả: điểm khi thử rất cao nhưng điểm thật thấp. Trong scikit-learn, dùng <b>Pipeline</b> để tránh.</p>
<h4>6. Dữ liệu mất cân bằng và tạo đặc trưng</h4>
<p>Lớp hiếm (1% gian lận): dùng trọng số lớp (class_weight), lấy mẫu lại, và đo bằng recall, F1 thay vì accuracy. <b>Tạo đặc trưng</b>: BMI = cân nặng/chiều cao², giờ trong ngày từ thời gian, tỉ lệ giữa hai cột. Một đặc trưng tốt thường giúp hơn đổi thuật toán.</p>`,
en:{title:'Data preprocessing and features',
one:'Real data is always messy: missing cells, mismatched scales, text instead of numbers. Cleaning it properly matters as much as choosing the model.',
why:'Round 2 is hands-on with real data: proper cleaning and scaling often raise the score more than switching algorithms.',pre:'The lessons Data, features and labels; k-NN.',
idea:`<p>Before training, data needs processing: <b>fill missing values</b> (with the mean, the median or the most frequent value), turn text columns into numbers with <b>one-hot encoding</b> (one 0/1 column per value), and <b>scale</b> the features so they share a similar range.</p><p>z-score standardisation: <span class="fx">z = (x − mean) / standard deviation</span>. Min-max: <span class="fx">(x − min) / (max − min)</span> maps to [0, 1]. Every statistic (mean, min, max) must be computed on the <b>training set</b> and then applied to validation and test. <b>Feature engineering</b> means creating useful new columns, e.g. BMI from height and weight.</p>`,
life:'Cooking: pick, wash and chop the vegetables evenly first. With dirty ingredients even a great chef struggles.',
tryit:'Click in the box to place a query point. Compare the 5 nearest neighbours BEFORE and AFTER scaling. Then do the card-sorting task below.',
rem:['Missing data: drop rows (if very few), or fill with mean, median or most frequent value','One-hot: a "colour" column with 3 values → 3 columns of 0/1','Do not encode red = 1, green = 2, yellow = 3 for an unordered column: the model will think yellow > green > red','z-score: mean 0, standard deviation 1. Min-max: into [0, 1]','Needs scaling: k-NN, SVM, k-means, PCA, neural networks. Hardly needs it: decision trees, random forests','Data leakage: using test-set information, or information only known after the answer, during training','Imbalanced data: use class weights or resampling, measure with F1 or recall instead of accuracy'],
traps:['Computing the mean for scaling over the WHOLE dataset (including test) is data leakage.','The median is pulled by outliers far less than the mean.'],
deep:`<h4>1. The standard procedure</h4>
<ol><li>Take a quick look: number of rows, column types, missing cells, strange values.</li><li>Split into train / validation / test <b>first</b>.</li><li>Learn the statistics (mean, min, max, list of categories) <b>on train only</b>.</li><li>Apply the same transformation to validation and test.</li></ol>
<h4>2. Missing values</h4>
<div class="ex">Age column: 12, 13, 13, 14, 90 (a typo) and one empty cell.<br>Mean = 142/5 = 28.4; median = 13.<br>Filling with the median (13) makes more sense: the mean is dragged up by the 90.</div>
<p>Missing text values: fill with the most frequent value (mode) or add an "Unknown" category. If very few rows are missing, drop them. Sometimes "being missing" is itself informative: add a 0/1 "was missing" column.</p>
<h4>3. Encoding text columns</h4>
<div class="ex">Colour column: red, green, yellow → one-hot:<br><table class="mini"><tr><th>Colour</th><th>red</th><th>green</th><th>yellow</th></tr><tr><td>red</td><td>1</td><td>0</td><td>0</td></tr><tr><td>yellow</td><td>0</td><td>0</td><td>1</td></tr></table></div>
<p>A column with a natural order (small &lt; medium &lt; large) can be numbered 0, 1, 2. Numbering an unordered column makes the model think "yellow = 3 &gt; green = 2", which is meaningless.</p>
<h4>4. Scaling</h4>
<div class="ex">Heights 150, 160, 170 (cm).<br>Min-max: 160 → (160 − 150)/(170 − 150) = <b>0.5</b>.<br>z-score: mean 160, standard deviation √((100 + 0 + 100)/3) ≈ 8.16 → 170 becomes (170 − 160)/8.16 ≈ <b>1.22</b>.</div>
<p>Min-max is sensitive to outliers (one huge value squeezes everything else near 0). z-score gives mean 0 and standard deviation 1. Models based on distances or gradients (k-NN, SVM, k-means, PCA, neural networks) need scaling; decision trees do not.</p>
<h4>5. Data leakage</h4>
<ul><li>Computing the mean over train and test together, then scaling: the model "peeks" at the test set.</li><li>Using a column only known after the outcome (e.g. "days in hospital" to predict "will be admitted").</li><li>The same person appearing in both train and test.</li></ul>
<p>Result: a great score in testing but a poor real score. In scikit-learn, use a <b>Pipeline</b> to avoid it.</p>
<h4>6. Imbalanced data and feature engineering</h4>
<p>A rare class (1% fraud): use class weights (class_weight), resampling, and measure with recall or F1 instead of accuracy. <b>Feature engineering</b>: BMI = weight/height², hour of day from a timestamp, ratios between columns. One good feature often helps more than changing the algorithm.</p>`}},

'cay':{
deep:`<h4>1. Tính Gini cho một nút</h4>
<p><span class="fx">Gini = 1 − Σ pᵢ²</span>, pᵢ là tỉ lệ lớp i trong nút.</p>
<div class="ex">Nút có 10 mẫu: 6 lớp A, 4 lớp B. Gini = 1 − 0,6² − 0,4² = 1 − 0,36 − 0,16 = <b>0,48</b>.</div>
<p>Gini nhỏ nhất là 0 (thuần một lớp). Lớn nhất với k lớn đều nhau là 1 − 1/k: 2 lớp → 0,5; 3 lớp → 0,667.</p>
<h4>2. Chọn câu hỏi chia tốt nhất</h4>
<div class="ex">Chia nút trên bằng câu "x &lt; 4?":<br>• Nhánh trái 5 mẫu: 5 A, 0 B → Gini = 0.<br>• Nhánh phải 5 mẫu: 1 A, 4 B → Gini = 1 − 0,04 − 0,64 = 0,32.<br>• Gini sau chia (trung bình theo số mẫu) = 5/10 × 0 + 5/10 × 0,32 = <b>0,16</b>.<br>• Mức giảm = 0,48 − 0,16 = <b>0,32</b>.</div>
<p>Máy thử mọi đặc trưng và mọi ngưỡng, chọn câu hỏi có mức giảm lớn nhất, rồi lặp lại trong từng nhánh cho đến khi nút thuần hoặc chạm giới hạn (độ sâu tối đa, số mẫu tối thiểu ở lá).</p>
<h4>3. Entropy và information gain</h4>
<p><span class="fx">Entropy = −Σ pᵢ log₂ pᵢ</span>. Nút 6 A, 4 B: −0,6·log₂0,6 − 0,4·log₂0,4 ≈ 0,6 × 0,737 + 0,4 × 1,322 ≈ <b>0,971</b>. 50/50 cho entropy = 1 (còn Gini = 0,5). <b>Information gain</b> = entropy trước − entropy sau (trung bình theo số mẫu). Gini và entropy thường chọn ra câu hỏi giống nhau.</p>
<h4>4. Dự đoán và overfit</h4>
<p>Mẫu mới đi theo các câu hỏi xuống một lá. Cây phân loại trả về lớp đa số ở lá; cây hồi quy trả về trung bình. Cây để mọc hết cỡ sẽ có lá chỉ 1 mẫu: học thuộc cả nhiễu → overfit. Cách chữa: giới hạn độ sâu, yêu cầu số mẫu tối thiểu ở lá, cắt tỉa.</p>
<h4>5. Rừng và boosting</h4>
<ul><li><b>Random forest</b>: nhiều cây, mỗi cây học trên một mẫu lấy lại ngẫu nhiên (bootstrap) và ở mỗi lần chia chỉ xét một tập con đặc trưng ngẫu nhiên; rồi bỏ phiếu. Các cây sai theo kiểu khác nhau nên bỏ phiếu làm giảm <b>phương sai</b>.</li>
<li><b>Gradient boosting</b> (XGBoost, LightGBM): xây cây lần lượt, cây sau sửa lỗi của các cây trước; giảm <b>bias</b>. Thường mạnh nhất với dữ liệu dạng bảng.</li></ul>
<p>Cây không cần chuẩn hóa, vì câu hỏi "x &lt; 4?" không phụ thuộc đơn vị đo.</p>`,
en:{title:'Decision trees and Gini',
one:'Play 20 questions: each question splits the data into two purer groups.',
why:'The easiest model to explain, and the basis of random forests and XGBoost (very strong in Round 2).',pre:'Fractions; squaring.',
idea:`<p>A "pure" group contains almost only one colour. <b>Gini</b> measures how mixed a group is: 0 is completely pure, 0.5 is the most mixed (2 classes, half each).</p><p>The machine tries every possible question ("x &lt; 4?", "y &lt; 6?") and chooses the one that lowers the average Gini (weighted by the number of samples in each branch) the most. Then it repeats in each branch. A <b>random forest</b> is many trees, each trained on a random part of the data, voting together.</p>`,
life:'A doctor asks: "Do you have a fever?" → "Do you have a cough?" → diagnosis. Each question rules out possibilities.',
tryit:'Press Find the best threshold when splitting on x, then switch to splitting on y. Which lowers Gini more?',
rem:['Gini = 1 − Σ pᵢ². A 50/50 group: 0.5. A 100/0 group: 0','Entropy = −Σ pᵢ log₂ pᵢ. A 50/50 group: 1','Gini after a split = average weighted by the number of samples in each branch','Information gain = impurity before − impurity after','Trees too deep → memorising → overfitting. Limit the depth, prune','Random forests reduce variance; boosting reduces bias'],
traps:['Gini for 50/50 is 0.5 but entropy for 50/50 is 1. Do not mix the two numbers up.','Decision trees do not need feature scaling.'],
deep:`<h4>1. Gini for one node</h4>
<p><span class="fx">Gini = 1 − Σ pᵢ²</span>, where pᵢ is the fraction of class i in the node.</p>
<div class="ex">A node with 10 samples: 6 of class A, 4 of class B. Gini = 1 − 0.6² − 0.4² = 1 − 0.36 − 0.16 = <b>0.48</b>.</div>
<p>The minimum Gini is 0 (one pure class). The maximum with k equal classes is 1 − 1/k: 2 classes → 0.5; 3 classes → 0.667.</p>
<h4>2. Choosing the best split</h4>
<div class="ex">Split that node with the question "x &lt; 4?":<br>• Left branch, 5 samples: 5 A, 0 B → Gini = 0.<br>• Right branch, 5 samples: 1 A, 4 B → Gini = 1 − 0.04 − 0.64 = 0.32.<br>• Gini after the split (weighted by sample count) = 5/10 × 0 + 5/10 × 0.32 = <b>0.16</b>.<br>• Decrease = 0.48 − 0.16 = <b>0.32</b>.</div>
<p>The machine tries every feature and every threshold, picks the question with the biggest decrease, then repeats in each branch until the nodes are pure or a limit is hit (maximum depth, minimum samples per leaf).</p>
<h4>3. Entropy and information gain</h4>
<p><span class="fx">Entropy = −Σ pᵢ log₂ pᵢ</span>. The 6 A, 4 B node: −0.6·log₂0.6 − 0.4·log₂0.4 ≈ 0.6 × 0.737 + 0.4 × 1.322 ≈ <b>0.971</b>. A 50/50 node has entropy 1 (while Gini is 0.5). <b>Information gain</b> = entropy before − entropy after (weighted by sample count). Gini and entropy usually pick the same questions.</p>
<h4>4. Prediction and overfitting</h4>
<p>A new sample follows the questions down to a leaf. A classification tree returns the leaf’s majority class; a regression tree returns the leaf’s average. A tree grown to full size has leaves with a single sample: it memorises the noise → overfitting. Fixes: limit the depth, require a minimum number of samples per leaf, prune.</p>
<h4>5. Forests and boosting</h4>
<ul><li><b>Random forest</b>: many trees, each trained on a random resample (bootstrap) and considering only a random subset of features at each split; then they vote. The trees make different mistakes, so voting lowers <b>variance</b>.</li>
<li><b>Gradient boosting</b> (XGBoost, LightGBM): trees are built one after another, each correcting the errors of the previous ones; this lowers <b>bias</b>. Often the strongest choice for tabular data.</li></ul>
<p>Trees need no scaling, because a question like "x &lt; 4?" does not depend on the unit of measurement.</p>`}},

'svm':{
deep:`<h4>1. Đường chia và cách phân loại</h4>
<p>Ranh giới là <span class="fx">w·x + b = 0</span>. Điểm mới được xếp vào lớp +1 nếu <span class="fx">w·x + b &gt; 0</span>, lớp −1 nếu âm. Vector w vuông góc với đường chia.</p>
<h4>2. Khoảng cách và độ rộng lề</h4>
<div class="ex">Đường 3x + 4y − 2 = 0, tức w = (3, 4), b = −2, ‖w‖ = √(9 + 16) = 5.<br>Khoảng cách từ điểm (1, 1): |3 + 4 − 2| / 5 = 5/5 = <b>1</b>.<br>Nếu đã chuẩn hóa để các vector hỗ trợ có |w·x + b| = 1, thì độ rộng lề cả hai bên = 2/‖w‖ = 2/5 = <b>0,4</b>.</div>
<p>Muốn lề <b>rộng</b> thì phải làm ‖w‖ <b>nhỏ</b>. SVM giải bài toán: làm ‖w‖ nhỏ nhất sao cho mọi điểm nằm đúng phía và cách đường ít nhất một lề.</p>
<h4>3. Vector hỗ trợ</h4>
<p>Chỉ những điểm nằm trên mép lề (hoặc bên trong lề, với lề mềm) ảnh hưởng tới đường chia. Xóa hay dời một điểm ở xa (không phải vector hỗ trợ) thì đường không đổi. Đây là điểm khác với hồi quy logistic, nơi mọi điểm đều góp phần.</p>
<h4>4. Lề mềm và tham số C</h4>
<p>Dữ liệu thật thường có vài điểm lẫn sang phía bên kia. Lề mềm cho phép vi phạm nhưng phạt theo C:</p>
<ul><li><b>C lớn</b>: phạt sai rất nặng → cố phân loại đúng mọi điểm, lề hẹp, dễ overfit.</li><li><b>C nhỏ</b>: chấp nhận vài điểm sai để có lề rộng, mượt hơn, có thể underfit.</li></ul>
<h4>5. Kernel: ranh giới cong</h4>
<div class="ex">Dữ liệu 1 chiều: lớp A ở −1, 0, 1; lớp B ở −3, 3. Không có một ngưỡng nào tách được. Thêm đặc trưng x²: A có x² = 1, 0, 1; B có x² = 9, 9. Giờ ngưỡng x² = 5 tách hoàn toàn.</div>
<p>Kernel làm việc tương tự nhưng không cần tính đặc trưng mới ra: chỉ thay tích vô hướng bằng hàm kernel (RBF, đa thức). Với kernel RBF, <b>γ lớn</b> cho ranh giới uốn lượn sát từng điểm (dễ overfit), γ nhỏ cho ranh giới mượt.</p>
<h4>6. Lưu ý thực hành</h4>
<p>SVM dùng khoảng cách nên <b>phải chuẩn hóa</b>. SVM cơ bản chia 2 lớp; nhiều lớp thì ghép nhiều SVM (một-chọi-một hoặc một-chọi-còn-lại). SVM thường tốt với dữ liệu vừa và nhỏ.</p>`,
en:{title:'SVM: the widest-margin boundary',
one:'Many lines can separate two groups. SVM picks the one farthest from the nearest points of both sides.',
why:'A classic classifier in the syllabus that ties together the dot product, distance and kernels.',pre:'The Vectors lesson (dot product, distance); the logistic regression section.',
idea:`<p>When two groups can be separated by a straight line, infinitely many lines work. SVM picks the line with the widest <b>margin</b> (empty strip on both sides), because such a line is least affected when new points are slightly off.</p><p>Only a few points sitting on the edge of the margin decide the line: these are the <b>support vectors</b>. Deleting a faraway point does not move the line. When the data cannot be separated by a straight line, SVM uses a <b>soft margin</b> (allowing some mistakes, penalised by the parameter C) and <b>kernels</b> to create curved boundaries.</p>`,
life:'Painting a line to divide a playground between two teams: paint it down the middle of the widest gap so nobody has to stand right on the line.',
tryit:'Rotate and shift the red line so every point is on the correct side with the widest margin. Then press Find the widest margin: which points get circled? Try Add a stray point.',
rem:['Boundary: w·x + b = 0','Distance from point x to the line w·x + b = 0 is |w·x + b| / ‖w‖','When scaled so the nearest points have |w·x + b| = 1: the full margin width = 2 / ‖w‖','Support vectors: points on the margin edge; only they decide the boundary','Large C: heavy penalty for mistakes, narrow margin, prone to overfitting. Small C: wide margin, accepts some mistakes','Kernels (RBF, polynomial) give curved boundaries without computing new features','SVM needs feature scaling'],
traps:['Removing a point that is NOT a support vector leaves the boundary unchanged.','Basic SVM handles 2 classes; for more classes several SVMs are combined (one-vs-one or one-vs-rest).'],
deep:`<h4>1. The boundary and classification</h4>
<p>The boundary is <span class="fx">w·x + b = 0</span>. A new point is assigned class +1 if <span class="fx">w·x + b &gt; 0</span> and −1 if negative. The vector w is perpendicular to the boundary.</p>
<h4>2. Distance and margin width</h4>
<div class="ex">The line 3x + 4y − 2 = 0, i.e. w = (3, 4), b = −2, ‖w‖ = √(9 + 16) = 5.<br>Distance from the point (1, 1): |3 + 4 − 2| / 5 = 5/5 = <b>1</b>.<br>If scaled so the support vectors have |w·x + b| = 1, the full margin width = 2/‖w‖ = 2/5 = <b>0.4</b>.</div>
<p>A <b>wide</b> margin means a <b>small</b> ‖w‖. SVM solves: make ‖w‖ as small as possible while every point is on the correct side and at least one margin away from the line.</p>
<h4>3. Support vectors</h4>
<p>Only points on the margin edge (or inside it, with a soft margin) affect the boundary. Deleting or moving a faraway point (not a support vector) leaves the line unchanged. This differs from logistic regression, where every point contributes.</p>
<h4>4. Soft margin and the parameter C</h4>
<p>Real data usually has a few points on the wrong side. A soft margin allows violations but penalises them by C:</p>
<ul><li><b>Large C</b>: mistakes are punished hard → tries to classify every point correctly, narrow margin, prone to overfitting.</li><li><b>Small C</b>: accepts a few mistakes for a wider, smoother margin, may underfit.</li></ul>
<h4>5. Kernels: curved boundaries</h4>
<div class="ex">1-D data: class A at −1, 0, 1; class B at −3, 3. No single threshold separates them. Add the feature x²: A has x² = 1, 0, 1; B has x² = 9, 9. Now the threshold x² = 5 separates them perfectly.</div>
<p>A kernel does the same without computing the new features: it just replaces the dot product with a kernel function (RBF, polynomial). With the RBF kernel, a <b>large γ</b> gives a wiggly boundary hugging each point (prone to overfitting); a small γ gives a smooth boundary.</p>
<h4>6. Practical notes</h4>
<p>SVM uses distances, so it <b>must be scaled</b>. Basic SVM separates 2 classes; for more classes, several SVMs are combined (one-vs-one or one-vs-rest). SVMs often work well on small and medium datasets.</p>`}},

'kmeans':{
deep:`<h4>1. Ví dụ chạy tay (1 chiều)</h4>
<div class="ex">Dữ liệu: 1, 2, 3, 10, 11, 12. k = 2, tâm ban đầu c₁ = 1, c₂ = 2.<br><b>Vòng 1 – gán:</b> 1 → c₁; 2, 3, 10, 11, 12 → c₂ (gần 2 hơn 1).<br><b>Vòng 1 – cập nhật:</b> c₁ = 1; c₂ = (2 + 3 + 10 + 11 + 12)/5 = 7,6.<br><b>Vòng 2 – gán:</b> 1, 2, 3 → c₁ (ví dụ 3: cách 1 là 2, cách 7,6 là 4,6); 10, 11, 12 → c₂.<br><b>Vòng 2 – cập nhật:</b> c₁ = 2; c₂ = 11.<br><b>Vòng 3:</b> không điểm nào đổi nhóm → dừng.<br>Inertia = (1² + 0² + 1²) + (1² + 0² + 1²) = <b>4</b>.</div>
<h4>2. Vì sao luôn dừng?</h4>
<p>Mỗi bước gán và mỗi bước cập nhật đều làm inertia (tổng bình phương khoảng cách tới tâm) giảm hoặc giữ nguyên. Số cách chia nhóm là hữu hạn, nên thuật toán chắc chắn dừng. Nhưng nó có thể dừng ở một cách chia <b>chưa tốt nhất</b> (cực tiểu cục bộ).</p>
<h4>3. Tâm ban đầu quan trọng</h4>
<p>Đặt cả hai tâm vào cùng một đám có thể làm một đám thật bị chia đôi, còn hai đám khác bị gộp. Cách chữa: chạy nhiều lần với tâm ngẫu nhiên khác nhau rồi giữ kết quả inertia thấp nhất; hoặc dùng <b>k-means++</b> (chọn tâm ban đầu cách xa nhau).</p>
<h4>4. Chọn k</h4>
<p>Tăng k thì inertia tốt nhất luôn giảm (k bằng số điểm thì inertia = 0), nên không chọn k theo inertia nhỏ nhất. <b>Phương pháp khuỷu tay</b>: vẽ inertia theo k, chọn chỗ đường cong gập lại. Hoặc dùng <b>silhouette</b> (điểm gần cụm mình và xa cụm khác cỡ nào).</p>
<h4>5. Giới hạn</h4>
<ul><li>Hợp với cụm tròn, kích thước gần nhau. Cụm dài, cong (hình trăng khuyết) thì làm sai.</li><li>Nhạy ngoại lai: một điểm rất xa kéo tâm lệch hẳn, vì tâm là trung bình.</li><li>Dùng khoảng cách nên cần chuẩn hóa.</li></ul>
<p>Tâm mới là <b>trung bình</b> các điểm trong nhóm, có thể không trùng điểm dữ liệu nào.</p>`,
en:{title:'k-means: the machine groups things itself',
one:'There are no answers given. The machine gathers nearby points into k groups by itself.',
why:'The classic example of unsupervised learning: the machine forms groups without any answers.',pre:'The Vectors and distance lesson; averages.',
idea:`<p>This is <b>unsupervised learning</b>: the data has no labels. k-means repeats two steps:</p><p><b>1. Assign:</b> each point goes to its nearest centre. <b>2. Update:</b> move each centre to the average of the points in its group. Repeat until no point changes group.</p>`,
life:'Splitting a class into 3 groups by where they live: each student joins the group whose meeting point is nearest home, then the meeting point moves to the middle of those homes.',
tryit:'Drag all 3 centres into one corner and press Auto-run. Compare the inertia with pressing Random centres. Is the result sometimes worse?',
rem:['Unsupervised: no labels','Repeat: assign → update','Always stops, but the result depends on the starting centres','k must be chosen in advance (elbow method, silhouette)','Inertia = sum of squared distances from points to their centre','PCA is also unsupervised: reduces dimensions while keeping the most variance'],
traps:['The new centre is the AVERAGE of the points in the group, not the nearest point.','k-means suits round clusters of similar size; it is sensitive to outliers.'],
deep:`<h4>1. A hand-run example (1-D)</h4>
<div class="ex">Data: 1, 2, 3, 10, 11, 12. k = 2, starting centres c₁ = 1, c₂ = 2.<br><b>Round 1 – assign:</b> 1 → c₁; 2, 3, 10, 11, 12 → c₂ (closer to 2 than to 1).<br><b>Round 1 – update:</b> c₁ = 1; c₂ = (2 + 3 + 10 + 11 + 12)/5 = 7.6.<br><b>Round 2 – assign:</b> 1, 2, 3 → c₁ (e.g. 3 is 2 from 1 but 4.6 from 7.6); 10, 11, 12 → c₂.<br><b>Round 2 – update:</b> c₁ = 2; c₂ = 11.<br><b>Round 3:</b> no point changes group → stop.<br>Inertia = (1² + 0² + 1²) + (1² + 0² + 1²) = <b>4</b>.</div>
<h4>2. Why it always stops</h4>
<p>Every assign step and every update step lowers the inertia (sum of squared distances to the centres) or leaves it unchanged. There are finitely many ways to group the points, so the algorithm must stop. But it may stop at a grouping that is <b>not the best</b> (a local minimum).</p>
<h4>3. Starting centres matter</h4>
<p>Putting both centres in the same cluster can split one real cluster in two while merging two others. Fixes: run several times with different random centres and keep the lowest inertia, or use <b>k-means++</b> (start with centres far apart).</p>
<h4>4. Choosing k</h4>
<p>The best inertia always falls as k grows (with k equal to the number of points, inertia = 0), so k is not chosen by the smallest inertia. <b>Elbow method</b>: plot inertia against k and pick where the curve bends. Or use the <b>silhouette</b> score (how close each point is to its own cluster versus others).</p>
<h4>5. Limitations</h4>
<ul><li>Suits round clusters of similar size. Long or curved clusters (crescent shapes) go wrong.</li><li>Sensitive to outliers: one far point drags its centre, because the centre is an average.</li><li>Uses distances, so features need scaling.</li></ul>
<p>The new centre is the <b>average</b> of the group’s points and may not coincide with any data point.</p>`}},

'pca':{
deep:`<h4>1. Các bước của PCA</h4>
<ol><li><b>Trừ trung bình</b> mỗi cột (đưa tâm đám điểm về gốc). Thường chuẩn hóa luôn để các cột cùng thang đo.</li>
<li>Tính <b>ma trận hiệp phương sai</b> (mỗi ô cho biết hai cột cùng tăng giảm với nhau mạnh cỡ nào).</li>
<li>Tìm <b>vector riêng</b> và <b>trị riêng</b> của ma trận đó. Vector riêng là các hướng (thành phần chính); trị riêng là phương sai theo hướng đó.</li>
<li>Sắp xếp theo trị riêng giảm dần, giữ m hướng đầu, <b>chiếu</b> dữ liệu lên chúng.</li></ol>
<h4>2. Ví dụ tính tỉ lệ phương sai</h4>
<div class="ex">Ma trận hiệp phương sai [[3, 0], [0, 1]]: hai cột không liên quan nhau, trị riêng 3 và 1. PC1 là trục x, giữ 3/(3 + 1) = <b>75%</b> phương sai.<br>Dữ liệu 4 chiều có trị riêng 4, 3, 2, 1: giữ 2 thành phần đầu → (4 + 3)/(4 + 3 + 2 + 1) = <b>70%</b>.</div>
<h4>3. Sau PCA còn bao nhiêu số?</h4>
<p>Dữ liệu 50 cột, giữ 5 thành phần chính → mỗi mẫu còn <b>5 số</b> (tọa độ trên 5 hướng mới). Các cột mới là tổ hợp của mọi cột cũ, nên khó giải thích bằng lời hơn. Thường chọn m sao cho giữ khoảng 90–95% phương sai.</p>
<h4>4. Tính chất cần nhớ</h4>
<ul><li>Các thành phần chính <b>vuông góc</b> với nhau và không tương quan với nhau.</li>
<li>Tổng các trị riêng = tổng phương sai của dữ liệu.</li>
<li>Không chuẩn hóa thì cột có thang đo lớn (đo bằng đồng, bằng mét) chiếm hết PC1, dù chưa chắc quan trọng.</li>
<li>PCA <b>không nhìn nhãn</b>: hướng trải rộng nhất chưa chắc là hướng tách các lớp tốt nhất.</li></ul>
<h4>5. Dùng PCA để làm gì?</h4>
<ul><li>Vẽ dữ liệu nhiều chiều lên mặt phẳng 2 chiều để nhìn.</li><li>Nén dữ liệu, giảm thời gian huấn luyện.</li><li>Bớt nhiễu: các hướng có trị riêng rất nhỏ thường chủ yếu là nhiễu.</li><li>Giảm lời nguyền số chiều trước khi dùng k-NN.</li></ul>`,
en:{title:'PCA: reducing dimensions',
one:'View the cloud of points from the direction where it spreads the most, and drop the directions that carry almost no information.',
why:'PCA is in the syllabus. Round 2 data may have many columns; PCA helps visualise and compress them.',pre:'The Vectors lesson; the Probability lesson (variance).',
idea:`<p>Data with many columns often has columns that move together (height and arm span). <b>PCA</b> finds new directions called <b>principal components</b>: the first is the direction in which the data spreads most (largest variance), the second is perpendicular to the first, and so on.</p><p>Projecting the data onto the first few components keeps most of the information with fewer columns. The fraction of variance kept is the sum of the kept <b>eigenvalues</b> divided by the sum of all eigenvalues. PCA does not use labels, so it is unsupervised learning.</p>`,
life:'Photographing a table: from above you see its shape clearly; from the side, level with the top, you see only a thin line. PCA picks the clearest camera angle.',
tryit:'Rotate the purple axis to maximise the percentage of variance kept. Then press Find the best axis. What percentage does the second (perpendicular) axis keep?',
rem:['First step: subtract each column’s mean (usually scale too)','Principal components = eigenvectors of the covariance matrix','Variance along each component = its eigenvalue','Fraction kept = sum of kept eigenvalues / sum of all eigenvalues','Principal components are perpendicular to each other','Uses: plotting high-dimensional data, compression, denoising, speeding up models','Unsupervised: does not use labels'],
traps:['Without scaling, columns with large units (đồng, metres) take over the first components.','The direction of largest variance is not necessarily the best direction for separating classes, because PCA ignores labels.'],
deep:`<h4>1. The steps of PCA</h4>
<ol><li><b>Subtract the mean</b> of each column (centre the cloud at the origin). Usually also scale so columns share a scale.</li>
<li>Compute the <b>covariance matrix</b> (each entry says how strongly two columns rise and fall together).</li>
<li>Find its <b>eigenvectors</b> and <b>eigenvalues</b>. Eigenvectors are the directions (principal components); eigenvalues are the variance along each direction.</li>
<li>Sort by decreasing eigenvalue, keep the first m directions and <b>project</b> the data onto them.</li></ol>
<h4>2. Worked example of variance kept</h4>
<div class="ex">Covariance matrix [[3, 0], [0, 1]]: the two columns are unrelated, eigenvalues 3 and 1. PC1 is the x-axis and keeps 3/(3 + 1) = <b>75%</b> of the variance.<br>4-D data with eigenvalues 4, 3, 2, 1: keeping the first 2 components → (4 + 3)/(4 + 3 + 2 + 1) = <b>70%</b>.</div>
<h4>3. How many numbers remain after PCA?</h4>
<p>Data with 50 columns, keeping 5 principal components → each sample becomes <b>5 numbers</b> (its coordinates along the 5 new directions). The new columns mix all the old ones, so they are harder to explain in words. m is usually chosen to keep about 90–95% of the variance.</p>
<h4>4. Properties to remember</h4>
<ul><li>Principal components are <b>perpendicular</b> and uncorrelated with each other.</li>
<li>The sum of the eigenvalues = the total variance of the data.</li>
<li>Without scaling, a column with large units (đồng, metres) takes over PC1 even if it is not important.</li>
<li>PCA <b>ignores labels</b>: the widest-spread direction is not necessarily the best for separating classes.</li></ul>
<h4>5. What PCA is used for</h4>
<ul><li>Plotting high-dimensional data on a 2-D plane.</li><li>Compressing data and speeding up training.</li><li>Denoising: directions with tiny eigenvalues are often mostly noise.</li><li>Easing the curse of dimensionality before k-NN.</li></ul>`}},

'overfit':{
deep:`<h4>1. Ba trạng thái của mô hình</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Lỗi train</th><th>Lỗi test</th><th>Chẩn đoán</th></tr><tr><td>Đường thẳng (bậc 1)</td><td>Cao</td><td>Cao</td><td>Underfit (bias cao)</td></tr><tr><td>Bậc 3</td><td>Thấp</td><td>Thấp</td><td>Vừa khéo</td></tr><tr><td>Bậc 9</td><td>Gần 0</td><td>Rất cao</td><td>Overfit (variance cao)</td></tr></table></div>
<p>Dấu hiệu quan trọng nhất của overfit: <b>khoảng cách lớn</b> giữa lỗi train và lỗi validation/test. Ví dụ lỗi train 1%, lỗi validation 25% → overfit.</p>
<h4>2. Bias và variance</h4>
<ul><li><b>Bias</b> (độ lệch): mô hình quá đơn giản nên sai một cách hệ thống, dù cho bao nhiêu dữ liệu. Ví dụ dùng đường thẳng cho dữ liệu cong.</li>
<li><b>Variance</b> (phương sai): mô hình quá nhạy, đổi một ít dữ liệu train là đường cong thay đổi hẳn.</li></ul>
<p>Mô hình phức tạp hơn thì bias giảm nhưng variance tăng. Cần chọn độ phức tạp vừa phải: đó là <b>đánh đổi bias–variance</b>.</p>
<h4>3. Regularization</h4>
<p>Thêm một khoản phạt vào hàm lỗi để giữ trọng số nhỏ:</p>
<ul><li><b>L2</b> (Ridge): <span class="fx">Loss = MSE + λ·Σw²</span>. Làm mọi trọng số nhỏ lại đều đều.</li>
<li><b>L1</b> (Lasso): <span class="fx">Loss = MSE + λ·Σ|w|</span>. Đẩy nhiều trọng số về đúng 0, tức tự chọn đặc trưng.</li></ul>
<p>λ = 0: không phạt. λ quá lớn: mô hình bị ép quá đơn giản → underfit.</p>
<h4>4. Chia dữ liệu và k-fold</h4>
<div class="ex">1000 mẫu, 5-fold cross-validation: chia 5 phần, mỗi phần 200 mẫu. Lần lượt mỗi phần làm validation, 4 phần còn lại (800 mẫu) để huấn luyện. Được 5 điểm số, lấy trung bình. Mô hình được huấn luyện 5 lần.</div>
<p>k-fold cho ước lượng ổn định hơn một lần chia, nhất là khi dữ liệu ít. Tập test vẫn phải để riêng và chỉ dùng một lần cuối.</p>
<h4>5. Các cách chống overfit khác</h4>
<ul><li><b>Thêm dữ liệu</b>: sai số tổng quát hóa thường giảm theo 1/√n, nên muốn giảm một nửa cần gấp 4 lần dữ liệu.</li>
<li><b>Early stopping</b>: dừng huấn luyện khi lỗi validation bắt đầu tăng lại.</li>
<li><b>Dropout</b> (mạng nơ-ron): mỗi bước tắt ngẫu nhiên một phần nơ-ron, mạng không dựa dẫm vào vài nơ-ron.</li>
<li><b>Tăng cường dữ liệu</b> (ảnh): lật, xoay, cắt ảnh để có thêm ví dụ.</li>
<li>Dùng mô hình đơn giản hơn, ít đặc trưng hơn.</li></ul>
<p>Chống underfit thì làm ngược lại: mô hình mạnh hơn, thêm đặc trưng, giảm λ, huấn luyện lâu hơn.</p>`,
en:{title:'Overfitting: learning by rote',
one:'A good model gets NEW questions right; it does not just memorise old ones.',
why:'The most common mistake in real AI work. Understanding it helps a lot in Round 2.',pre:'The Linear regression lesson; the Learning from examples lesson.',
idea:`<p>Purple dots are the <b>training</b> data (for learning). Orange circles are the <b>test</b> data (new questions the model has not seen). The curve is a polynomial of degree d.</p><p>Degree too low: misses the pattern and is wrong on both (<b>underfitting</b>). Degree too high: passes through every training point, noise included, but is badly wrong on the test (<b>overfitting</b>). <b>Regularization λ</b> penalises wiggly curves and pulls the model towards something simpler.</p>`,
life:'A student who memorises the answers to old papers: scores 10 on the old paper but fails a new one.',
tryit:'Raise the degree to 9: the training error is near 0, but what about the test error? Keep degree 9 and increase λ. Press New data a few times at degree 9.',
rem:['Underfitting: high training error, high test error','Overfitting: very low training error, much higher test error','Train: learn the weights. Validation: choose hyperparameters. Test: use once at the end','k-fold: split into k parts, each part takes a turn as validation, then average','Fight overfitting: more data, regularization, dropout, early stopping, simpler models','L1 pushes many weights to exactly 0; L2 makes all weights smaller','To halve the generalisation error you need about 4 times the data (scales like 1/√n)','High bias ↔ underfitting; high variance ↔ overfitting (the bias–variance trade-off)'],
traps:['Tuning the model on the test set is cheating: the test score becomes falsely good.','Scaling must be fitted on train and then applied to test (to avoid data leakage).'],
deep:`<h4>1. Three states of a model</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Train error</th><th>Test error</th><th>Diagnosis</th></tr><tr><td>Straight line (degree 1)</td><td>High</td><td>High</td><td>Underfit (high bias)</td></tr><tr><td>Degree 3</td><td>Low</td><td>Low</td><td>Just right</td></tr><tr><td>Degree 9</td><td>Near 0</td><td>Very high</td><td>Overfit (high variance)</td></tr></table></div>
<p>The key sign of overfitting is a <b>large gap</b> between training error and validation/test error. For example 1% training error and 25% validation error → overfitting.</p>
<h4>2. Bias and variance</h4>
<ul><li><b>Bias</b>: the model is too simple, so it is systematically wrong no matter how much data it gets. Example: a straight line for curved data.</li>
<li><b>Variance</b>: the model is too sensitive; change a little training data and the curve changes completely.</li></ul>
<p>A more complex model has lower bias but higher variance. We need a moderate complexity: the <b>bias–variance trade-off</b>.</p>
<h4>3. Regularization</h4>
<p>Add a penalty to the loss to keep weights small:</p>
<ul><li><b>L2</b> (Ridge): <span class="fx">Loss = MSE + λ·Σw²</span>. Shrinks all weights evenly.</li>
<li><b>L1</b> (Lasso): <span class="fx">Loss = MSE + λ·Σ|w|</span>. Pushes many weights to exactly 0, i.e. selects features automatically.</li></ul>
<p>λ = 0: no penalty. λ too large: the model is forced to be too simple → underfitting.</p>
<h4>4. Splitting data and k-fold</h4>
<div class="ex">1000 samples, 5-fold cross-validation: split into 5 parts of 200. Each part takes a turn as validation while the other 4 parts (800 samples) are used for training. You get 5 scores and average them. The model is trained 5 times.</div>
<p>k-fold gives a steadier estimate than a single split, especially with little data. The test set must still be kept aside and used only once at the end.</p>
<h4>5. Other ways to fight overfitting</h4>
<ul><li><b>More data</b>: generalisation error usually falls like 1/√n, so halving it needs about 4 times the data.</li>
<li><b>Early stopping</b>: stop training when the validation error starts rising again.</li>
<li><b>Dropout</b> (neural networks): randomly switch off some neurons at each step, so the network cannot rely on just a few.</li>
<li><b>Data augmentation</b> (images): flip, rotate and crop images to create more examples.</li>
<li>Use a simpler model or fewer features.</li></ul>
<p>To fight underfitting, do the opposite: a stronger model, more features, smaller λ, longer training.</p>`}},

'danh-gia':{
deep:`<h4>1. Ma trận nhầm lẫn: một ví dụ đầy đủ</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Máy đoán Dương</th><th>Máy đoán Âm</th></tr><tr><td><b>Thật là Dương</b></td><td>TP = 40</td><td>FN = 20</td></tr><tr><td><b>Thật là Âm</b></td><td>FP = 10</td><td>TN = 30</td></tr></table>
Accuracy = (40 + 30)/100 = <b>0,70</b><br>Precision = 40/(40 + 10) = <b>0,80</b><br>Recall (TPR) = 40/(40 + 20) ≈ <b>0,667</b><br>F1 = 2 × 0,8 × 0,667/(0,8 + 0,667) ≈ <b>0,727</b><br>Specificity = 30/(30 + 10) = 0,75; FPR = 10/40 = 0,25</div>
<p>Mẹo đọc tên ô: chữ thứ hai (P/N) là <b>máy đoán gì</b>, chữ thứ nhất (T/F) là đoán <b>đúng hay sai</b>. FN = máy đoán Âm và đoán sai, tức thật ra là Dương (bỏ sót).</p>
<h4>2. Vì sao accuracy đánh lừa?</h4>
<div class="ex">1000 giao dịch, chỉ 10 gian lận. Mô hình "luôn đoán bình thường": accuracy = 990/1000 = <b>99%</b>, nhưng recall = 0/10 = <b>0</b>. Không bắt được vụ gian lận nào.</div>
<h4>3. Chọn chỉ số theo hậu quả</h4>
<ul><li>Bỏ sót rất nguy hiểm (sàng lọc ung thư, phát hiện cháy) → ưu tiên <b>recall</b>.</li>
<li>Báo nhầm rất tốn kém (lọc thư rác xóa nhầm thư quan trọng, bắt nhầm người vô tội) → ưu tiên <b>precision</b>.</li>
<li>Cần cân bằng cả hai → <b>F1</b>. F1 bị kéo về phía số nhỏ hơn: P = 1, R = 0,1 thì F1 ≈ 0,18, không phải 0,55.</li></ul>
<h4>4. Ngưỡng và đánh đổi</h4>
<p>Nâng ngưỡng (khó đoán Dương hơn): FP giảm → precision thường tăng; FN tăng → recall giảm. Hạ ngưỡng thì ngược lại. Nếu biết chi phí báo nhầm C_FP và chi phí bỏ sót C_FN, với xác suất đã hiệu chỉnh tốt, ngưỡng tối ưu là <span class="fx">C_FP/(C_FP + C_FN)</span>. Bỏ sót đắt gấp 9 lần báo nhầm → ngưỡng 1/10 = 0,1.</p>
<h4>5. Khi tỉ lệ dương thay đổi</h4>
<p>Recall = TP/(số Dương thật) và FPR = FP/(số Âm thật) chỉ phụ thuộc mô hình, nên <b>không đổi</b> khi tỉ lệ Dương trong dân số đổi. Precision thì <b>giảm</b> khi Dương hiếm đi (giống bài Bayes).</p>
<h4>6. ROC, AUC và nhiều lớp</h4>
<p><b>Đường ROC</b>: vẽ TPR theo FPR khi đổi ngưỡng từ cao xuống thấp. <b>AUC</b> = diện tích dưới đường: 1 là hoàn hảo, 0,5 là như đoán bừa. Nhiều lớp: tính precision/recall cho từng lớp rồi lấy trung bình; <b>macro</b> cho mỗi lớp nặng như nhau, <b>micro</b> cộng tất cả TP, FP, FN rồi mới chia.</p>`,
en:{title:'Evaluation: precision, recall, F1',
one:'High accuracy does not necessarily mean a good model. You must look at what kind of mistakes it makes.',
why:'The exam asks a lot about precision, recall and F1. Without the right metric you cannot tell a good model from a bad one.',pre:'Fractions and percentages; the Probability and Bayes lesson.',
idea:`<p>The model gives each person a score from 0 to 1. We choose a <b>threshold</b>: a score ≥ threshold means predict Positive. Results fall into 4 cells: <b>TP</b> correctly caught, <b>FN</b> missed, <b>FP</b> false alarm, <b>TN</b> correctly ignored.</p><p><b>Precision</b>: of the cases the machine called positive, what percentage were right? <b>Recall</b>: of the truly positive cases, what percentage did the machine catch? Raising the threshold usually increases precision and lowers recall.</p>`,
life:'Spam filtering: a false alarm (deleting an important email) is very bad → you need high precision. Cancer screening: missing a case is very bad → you need high recall.',
tryit:'Drag the positive rate from 30% down to 2%. Does recall change? What about precision? Then raise the cost of a miss and press Set the cheapest threshold.',
rem:['Precision = TP / (TP + FP)','Recall = TP / (TP + FN)','F1 = 2·P·R / (P + R), pulled towards the smaller number','Raising the threshold: precision usually rises, recall falls','With calibrated probabilities: optimal threshold = C_FP / (C_FP + C_FN)','When the positive rate falls: recall and FPR stay the same, precision falls','Macro-average: the plain mean over classes, every class weighs the same','ROC: TPR against FPR as the threshold changes. AUC = 1 is perfect, 0.5 is random guessing'],
traps:['Data that is 99% negative: always predicting negative gives 99% accuracy but recall = 0.','The second letter (P/N) is what the machine predicted; the first letter (T/F) is whether it was right.'],
deep:`<h4>1. The confusion matrix: a full example</h4>
<div class="ex"><table class="mini"><tr><th></th><th>Predicted Positive</th><th>Predicted Negative</th></tr><tr><td><b>Actually Positive</b></td><td>TP = 40</td><td>FN = 20</td></tr><tr><td><b>Actually Negative</b></td><td>FP = 10</td><td>TN = 30</td></tr></table>
Accuracy = (40 + 30)/100 = <b>0.70</b><br>Precision = 40/(40 + 10) = <b>0.80</b><br>Recall (TPR) = 40/(40 + 20) ≈ <b>0.667</b><br>F1 = 2 × 0.8 × 0.667/(0.8 + 0.667) ≈ <b>0.727</b><br>Specificity = 30/(30 + 10) = 0.75; FPR = 10/40 = 0.25</div>
<p>Reading the cell names: the second letter (P/N) is <b>what the machine predicted</b>, the first letter (T/F) is whether it was <b>right</b>. FN = predicted Negative and wrong, i.e. actually Positive (a miss).</p>
<h4>2. Why accuracy can mislead</h4>
<div class="ex">1000 transactions, only 10 fraudulent. A model that "always predicts normal": accuracy = 990/1000 = <b>99%</b>, but recall = 0/10 = <b>0</b>. It catches no fraud at all.</div>
<h4>3. Choose the metric by the consequences</h4>
<ul><li>Missing a case is dangerous (cancer screening, fire detection) → prioritise <b>recall</b>.</li>
<li>False alarms are costly (a spam filter deleting important email, accusing an innocent person) → prioritise <b>precision</b>.</li>
<li>Need a balance → <b>F1</b>. F1 is pulled towards the smaller number: P = 1, R = 0.1 gives F1 ≈ 0.18, not 0.55.</li></ul>
<h4>4. Threshold and trade-off</h4>
<p>Raising the threshold (harder to predict Positive): FP falls → precision usually rises; FN rises → recall falls. Lowering it does the opposite. If a false alarm costs C_FP and a miss costs C_FN, with well-calibrated probabilities the optimal threshold is <span class="fx">C_FP/(C_FP + C_FN)</span>. A miss 9 times as costly as a false alarm → threshold 1/10 = 0.1.</p>
<h4>5. When the positive rate changes</h4>
<p>Recall = TP/(actual positives) and FPR = FP/(actual negatives) depend only on the model, so they <b>stay the same</b> when the share of positives in the population changes. Precision <b>falls</b> as positives become rarer (just like the Bayes lesson).</p>
<h4>6. ROC, AUC and many classes</h4>
<p>The <b>ROC curve</b> plots TPR against FPR as the threshold moves from high to low. <b>AUC</b> = the area under it: 1 is perfect, 0.5 is random guessing. With many classes, compute precision/recall per class and average: <b>macro</b> weighs every class equally; <b>micro</b> adds up all TP, FP, FN first and then divides.</p>`}},
'noron':{
deep:`<h4>1. Perceptron làm AND và OR</h4>
<div class="ex">Đầu ra = 1 nếu z = w₁x₁ + w₂x₂ + b &gt; 0.<br><b>AND</b>: w₁ = w₂ = 1, b = −1,5. (1, 1): z = 0,5 → 1. (1, 0): z = −0,5 → 0. (0, 0): z = −1,5 → 0. Đúng bảng AND.<br><b>OR</b>: w₁ = w₂ = 1, b = −0,5. (1, 0): z = 0,5 → 1. (0, 0): z = −0,5 → 0.</div>
<h4>2. Vì sao một nơ-ron không làm được XOR?</h4>
<p>XOR = 1 tại (0, 1) và (1, 0); = 0 tại (0, 0) và (1, 1). Vẽ bốn điểm lên mặt phẳng: hai điểm lớp 1 nằm chéo nhau, không thể vẽ <b>một đường thẳng</b> để tách chúng khỏi hai điểm còn lại. Dữ liệu như vậy gọi là <b>không tách được tuyến tính</b>.</p>
<p>Hai lớp thì giải được: lớp ẩn có h₁ = OR(x₁, x₂) và h₂ = NAND(x₁, x₂); đầu ra = AND(h₁, h₂). Kiểm tra (1, 1): OR = 1, NAND = 0 → AND = 0. Đúng.</p>
<h4>3. Các hàm kích hoạt</h4>
<div class="ex"><table class="mini"><tr><th>Hàm</th><th>Công thức</th><th>Khoảng ra</th><th>Dùng ở</th></tr><tr><td>Sigmoid</td><td>1/(1 + e^(−z))</td><td>(0, 1)</td><td>Đầu ra 2 lớp</td></tr><tr><td>tanh</td><td>(eᶻ − e^(−z))/(eᶻ + e^(−z))</td><td>(−1, 1)</td><td>RNN</td></tr><tr><td>ReLU</td><td>max(0, z)</td><td>[0, ∞)</td><td>Lớp ẩn</td></tr><tr><td>Softmax</td><td>eᶻⁱ/Σeᶻʲ</td><td>tổng = 1</td><td>Đầu ra nhiều lớp</td></tr></table></div>
<div class="ex"><b>Softmax</b> của điểm (2, 1, 0): e² ≈ 7,39; e¹ ≈ 2,72; e⁰ = 1; tổng ≈ 11,11 → xác suất ≈ (0,665; 0,245; 0,090).</div>
<h4>4. Đếm tham số</h4>
<div class="ex">Mạng 4 đầu vào → lớp ẩn 3 nơ-ron → 2 đầu ra.<br>Lớp 1: 4 × 3 + 3 = 15. Lớp 2: 3 × 2 + 2 = 8. Tổng <b>23</b> tham số.</div>
<h4>5. Huấn luyện: lan truyền xuôi, lan truyền ngược</h4>
<ol><li><b>Xuôi</b>: tính đầu ra từ đầu vào qua từng lớp.</li><li>Tính <b>loss</b> so với nhãn.</li><li><b>Ngược</b> (backpropagation): dùng quy tắc chuỗi tính ∂loss/∂w cho mọi trọng số, đi từ lớp cuối về lớp đầu.</li><li>Cập nhật trọng số bằng gradient descent.</li></ol>
<h4>6. Gradient tiêu biến</h4>
<p>Đạo hàm sigmoid lớn nhất là 0,25. Qua 10 lớp sigmoid, gradient có thể bị nhân với 0,25¹⁰ ≈ 0,000001: các lớp đầu gần như không học. ReLU có đạo hàm 1 khi z &gt; 0 nên đỡ hơn nhiều, vì vậy là lựa chọn mặc định cho lớp ẩn.</p>`,
en:{title:'Neurons and activation functions',
one:'One neuron: multiply by weights, add up, then pass through an "on or off" function.',
why:'The building block of every deep network, from image recognition to ChatGPT.',pre:'The Gradient descent lesson; the Vectors lesson (dot product).',
idea:`<p><span class="fx">z = w₁·x₁ + w₂·x₂ + b</span>. A perceptron outputs 1 if z &gt; 0. The line z = 0 is <b>a straight line</b> splitting the plane in two. So one neuron can do AND and OR but <b>cannot do XOR</b>.</p><p>Stacking neurons into layers (a neural network) solves it. <b>Backpropagation</b> uses the chain rule, working from the error at the end back to the start, to find how much to adjust each weight.</p>`,
life:'Deciding whether to play football: (nice weather × 2) + (a friend invites you × 3) − 4 &gt; 0 means go. Each reason has a "weight".',
tryit:'Pick XOR and press Learn until all are correct. Can the machine find a straight line? Try AND, OR, NAND.',
rem:['z = w·x + b, output = f(z)','One perceptron cannot solve XOR; it needs at least 1 hidden layer','Sigmoid outputs (0, 1), maximum derivative 0.25 → deep networks suffer vanishing gradients','ReLU = max(0, z): the default for hidden layers','Without a non-linear activation, many layers act like a single linear layer','Parameters of a layer n_in → n_out: n_in × n_out + n_out','Softmax turns scores into class probabilities that sum to 1'],
traps:['Initialising every weight to 0 → every neuron learns exactly the same thing.','Epoch = one pass through the whole training set. 1000 samples, batch 100 → 10 steps per epoch.'],
deep:`<h4>1. A perceptron doing AND and OR</h4>
<div class="ex">Output = 1 if z = w₁x₁ + w₂x₂ + b &gt; 0.<br><b>AND</b>: w₁ = w₂ = 1, b = −1.5. (1, 1): z = 0.5 → 1. (1, 0): z = −0.5 → 0. (0, 0): z = −1.5 → 0. Matches the AND table.<br><b>OR</b>: w₁ = w₂ = 1, b = −0.5. (1, 0): z = 0.5 → 1. (0, 0): z = −0.5 → 0.</div>
<h4>2. Why one neuron cannot do XOR</h4>
<p>XOR = 1 at (0, 1) and (1, 0); = 0 at (0, 0) and (1, 1). Plot the four points: the two class-1 points sit diagonally, and no <b>single straight line</b> separates them from the other two. Such data is <b>not linearly separable</b>.</p>
<p>Two layers solve it: the hidden layer computes h₁ = OR(x₁, x₂) and h₂ = NAND(x₁, x₂); the output is AND(h₁, h₂). Check (1, 1): OR = 1, NAND = 0 → AND = 0. Correct.</p>
<h4>3. Activation functions</h4>
<div class="ex"><table class="mini"><tr><th>Function</th><th>Formula</th><th>Output range</th><th>Used in</th></tr><tr><td>Sigmoid</td><td>1/(1 + e^(−z))</td><td>(0, 1)</td><td>2-class output</td></tr><tr><td>tanh</td><td>(eᶻ − e^(−z))/(eᶻ + e^(−z))</td><td>(−1, 1)</td><td>RNNs</td></tr><tr><td>ReLU</td><td>max(0, z)</td><td>[0, ∞)</td><td>Hidden layers</td></tr><tr><td>Softmax</td><td>eᶻⁱ/Σeᶻʲ</td><td>sums to 1</td><td>Multi-class output</td></tr></table></div>
<div class="ex"><b>Softmax</b> of the scores (2, 1, 0): e² ≈ 7.39; e¹ ≈ 2.72; e⁰ = 1; sum ≈ 11.11 → probabilities ≈ (0.665, 0.245, 0.090).</div>
<h4>4. Counting parameters</h4>
<div class="ex">A network with 4 inputs → a hidden layer of 3 neurons → 2 outputs.<br>Layer 1: 4 × 3 + 3 = 15. Layer 2: 3 × 2 + 2 = 8. Total <b>23</b> parameters.</div>
<h4>5. Training: forward pass, backward pass</h4>
<ol><li><b>Forward</b>: compute the output from the input, layer by layer.</li><li>Compute the <b>loss</b> against the label.</li><li><b>Backward</b> (backpropagation): use the chain rule to get ∂loss/∂w for every weight, from the last layer back to the first.</li><li>Update the weights with gradient descent.</li></ol>
<h4>6. Vanishing gradients</h4>
<p>The largest derivative of the sigmoid is 0.25. Through 10 sigmoid layers the gradient can be multiplied by 0.25¹⁰ ≈ 0.000001: the early layers barely learn. ReLU has derivative 1 when z &gt; 0, which helps a lot, so it is the default for hidden layers.</p>`}},

'cnn':{
deep:`<h4>1. Một phép tích chập tính tay</h4>
<div class="ex">Vùng ảnh 3×3: [[1, 0, 2], [3, 1, 0], [0, 2, 1]]. Kernel cạnh dọc: [[1, 0, −1], [1, 0, −1], [1, 0, −1]].<br>Nhân từng ô rồi cộng: (1 − 2) + (3 − 0) + (0 − 1) = −1 + 3 − 1 = <b>1</b>. Đó là một ô của feature map. Kernel trượt sang vị trí tiếp theo và tính lại.</div>
<h4>2. Công thức kích thước</h4>
<p><span class="fx">Ra = ⌊(W − K + 2P)/S⌋ + 1</span> (W: cỡ vào, K: cỡ kernel, P: padding, S: stride).</p>
<div class="ex">• 32×32, K = 5, P = 0, S = 1 → (32 − 5)/1 + 1 = <b>28</b>.<br>• 32×32, K = 5, P = 2, S = 1 → (32 − 5 + 4) + 1 = <b>32</b> (giữ nguyên cỡ: P = (K − 1)/2).<br>• 28×28, K = 3, P = 1, S = 2 → ⌊27/2⌋ + 1 = 13 + 1 = <b>14</b>.</div>
<h4>3. Số kênh và số tham số</h4>
<p>Ảnh màu có 3 kênh (R, G, B). Mỗi kernel phủ <b>hết các kênh vào</b>: cỡ K × K × C_vào, cộng 1 bias. Mỗi kernel tạo ra một kênh ra.</p>
<div class="ex">Ảnh 3 kênh, 16 kernel 3×3: (3 × 3 × 3 + 1) × 16 = 28 × 16 = <b>448</b> tham số.<br>So với lớp kết nối đầy đủ từ ảnh 32×32×3 (3072 số) tới 16 nơ-ron: 3072 × 16 + 16 = <b>49 168</b> tham số.</div>
<p>CNN ít tham số vì <b>chia sẻ trọng số</b> (cùng một kernel ở mọi vị trí) và <b>kết nối cục bộ</b> (mỗi ô ra chỉ nhìn một vùng nhỏ).</p>
<h4>4. Pooling</h4>
<div class="ex">Max pooling 2×2, stride 2 trên vùng [[1, 3], [2, 0]] → <b>3</b>. Average pooling → (1 + 3 + 2 + 0)/4 = 1,5.</div>
<p>Pooling 2×2 stride 2 giảm chiều rộng và chiều cao một nửa, giữ nguyên số kênh, <b>không có tham số</b>, và giúp mô hình ít nhạy với dịch chuyển nhỏ.</p>
<h4>5. Một CNN đầy đủ</h4>
<p>Ảnh → [Conv → ReLU → Pool] lặp vài lần → làm phẳng (flatten) → lớp kết nối đầy đủ → softmax ra xác suất các lớp. Càng vào sâu, ảnh càng nhỏ nhưng càng nhiều kênh; lớp đầu học cạnh, lớp giữa học hoa văn, lớp cuối học bộ phận và vật thể.</p>`,
en:{title:'CNN: convolution on images',
one:'Slide a small window (kernel) across the image; at each place multiply pairs and add them up.',
why:'The standard architecture for images. Exams often ask for output sizes and parameter counts.',pre:'The Neurons lesson; multiplying and adding many numbers.',
idea:`<p>A <b>kernel</b> is a small 3×3 filter used to find a pattern (a vertical edge, a horizontal edge). The result is a <b>feature map</b>: where the pattern appears, the number is large. The same kernel is used at every position, so there are very few parameters.</p><p><b>Stride</b> is how far the kernel jumps. <b>Padding</b> adds a border of zeros around the image. <b>Max pooling</b> shrinks the image by keeping the largest number in each 2×2 block.</p>`,
life:'Searching for a word in your notebook through a small hole cut in a card, sliding it bit by bit from left to right, top to bottom.',
tryit:'Choose the T image and the Vertical edge kernel. Which cell of the feature map is largest? Change stride to 2 and padding to 1: what size is left? Check with the calculator below.',
rem:['Output size = ⌊(W − K + 2P) / S⌋ + 1','Number of output channels = number of kernels','Conv layer parameters = (K × K × C_in + 1) × number of kernels','Pooling has no parameters and keeps the number of channels','Keep the size (S = 1): P = (K − 1)/2','Early layers learn edges, middle layers shapes, last layers objects'],
traps:['Remember the +1 in the formula and round DOWN.','When counting parameters, do not forget the bias (+1 per kernel).'],
deep:`<h4>1. One convolution by hand</h4>
<div class="ex">A 3×3 image patch: [[1, 0, 2], [3, 1, 0], [0, 2, 1]]. Vertical-edge kernel: [[1, 0, −1], [1, 0, −1], [1, 0, −1]].<br>Multiply cell by cell and add: (1 − 2) + (3 − 0) + (0 − 1) = −1 + 3 − 1 = <b>1</b>. That is one cell of the feature map. The kernel slides to the next position and computes again.</div>
<h4>2. The size formula</h4>
<p><span class="fx">Out = ⌊(W − K + 2P)/S⌋ + 1</span> (W: input size, K: kernel size, P: padding, S: stride).</p>
<div class="ex">• 32×32, K = 5, P = 0, S = 1 → (32 − 5)/1 + 1 = <b>28</b>.<br>• 32×32, K = 5, P = 2, S = 1 → (32 − 5 + 4) + 1 = <b>32</b> (same size: P = (K − 1)/2).<br>• 28×28, K = 3, P = 1, S = 2 → ⌊27/2⌋ + 1 = 13 + 1 = <b>14</b>.</div>
<h4>3. Channels and parameters</h4>
<p>A colour image has 3 channels (R, G, B). Each kernel covers <b>all input channels</b>: size K × K × C_in, plus 1 bias. Each kernel produces one output channel.</p>
<div class="ex">A 3-channel image, 16 kernels of 3×3: (3 × 3 × 3 + 1) × 16 = 28 × 16 = <b>448</b> parameters.<br>Compare a fully connected layer from a 32×32×3 image (3072 numbers) to 16 neurons: 3072 × 16 + 16 = <b>49,168</b> parameters.</div>
<p>CNNs have few parameters thanks to <b>weight sharing</b> (the same kernel everywhere) and <b>local connections</b> (each output cell sees only a small region).</p>
<h4>4. Pooling</h4>
<div class="ex">2×2 max pooling, stride 2, on the block [[1, 3], [2, 0]] → <b>3</b>. Average pooling → (1 + 3 + 2 + 0)/4 = 1.5.</div>
<p>2×2 pooling with stride 2 halves the width and height, keeps the number of channels, has <b>no parameters</b>, and makes the model less sensitive to small shifts.</p>
<h4>5. A complete CNN</h4>
<p>Image → [Conv → ReLU → Pool] repeated a few times → flatten → fully connected layer → softmax over the classes. Deeper in, the image gets smaller but has more channels; early layers learn edges, middle layers textures, late layers parts and objects.</p>`}},

'rnn':{
deep:`<h4>1. Chạy tay một RNN rất nhỏ</h4>
<div class="ex">Một chiều: W = 0,5, U = 1, b = 0, h₀ = 0. Câu có 3 từ, chỉ từ đầu mang tín hiệu: x = (1, 0, 0).<br>h₁ = tanh(0,5 × 0 + 1) = tanh(1) ≈ <b>0,76</b><br>h₂ = tanh(0,5 × 0,76 + 0) = tanh(0,38) ≈ <b>0,36</b><br>h₃ = tanh(0,5 × 0,36) = tanh(0,18) ≈ <b>0,18</b><br>Thông tin từ đầu tiên mờ dần sau mỗi bước.</div>
<h4>2. Đếm tham số</h4>
<p>Trạng thái ẩn h chiều, đầu vào d chiều: W có h×h, U có h×d, b có h. Tổng <span class="fx">h² + h·d + h</span>.</p>
<div class="ex">h = 8, d = 5: 64 + 40 + 8 = <b>112</b>. Câu 5 từ hay 500 từ đều dùng đúng 112 tham số này.</div>
<h4>3. Vì sao gradient tiêu biến hoặc bùng nổ?</h4>
<p>Lan truyền ngược qua T bước, gradient bị nhân với khoảng T thừa số (mỗi thừa số cỡ W × đạo hàm tanh).</p>
<div class="ex">Thừa số 0,5 qua 10 bước: 0,5¹⁰ ≈ 0,001 → <b>tiêu biến</b>, mô hình không học được quan hệ xa.<br>Thừa số 1,5 qua 10 bước: 1,5¹⁰ ≈ 58 → <b>bùng nổ</b>, huấn luyện mất ổn định. Chữa bằng cắt gradient (clipping).</div>
<h4>4. LSTM và GRU</h4>
